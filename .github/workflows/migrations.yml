name: Migration safety

on:
  pull_request:
    paths:
      - "internal/store/sql/**"
      - "internal/store/migrationlint/**"
      - "cmd/migrationcheck/**"
      - ".github/workflows/migrations.yml"
  push:
    branches:
      - master
      - beta
    paths:
      - "internal/store/sql/**"
      - "internal/store/migrationlint/**"
      - "cmd/migrationcheck/**"
      - ".github/workflows/migrations.yml"

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration-ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=migration-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out PR or push base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
          fetch-depth: 1

      - name: Check out head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: head/go.mod
          cache-dependency-path: head/go.sum

      - name: Build isolated migration checker
        working-directory: head
        run: go build -o "$RUNNER_TEMP/migrationcheck" ./cmd/migrationcheck

      - name: Unit-test migration safety lint
        working-directory: head
        run: go test ./internal/store/migrationlint/safety ./cmd/migrationcheck

      # These flags mirror config/cfg.go's managed-MySQL DSN except for TLS,
      # which is intentionally absent for the local service. Explicit false is
      # the driver's production default and catches statements that only work
      # when multiStatements=true. CREATE DATABASE uses MySQL 8.0 defaults; do
      # not force utf8mb4_unicode_ci here.
      - name: Apply base migration chain
        working-directory: head
        env:
          MYSQL_DSN: root:migration-ci@tcp(127.0.0.1:3306)/migration_base?charset=utf8&parseTime=true&multiStatements=false&timeout=10s&readTimeout=30s&writeTimeout=30s
        run: >-
          "$RUNNER_TEMP/migrationcheck" migrate
          --create-database
          --dsn "$MYSQL_DSN"
          --dir ../base/internal/store/sql

      - name: Apply full head migration chain on a fresh database
        working-directory: head
        env:
          MYSQL_DSN: root:migration-ci@tcp(127.0.0.1:3306)/migration_head?charset=utf8&parseTime=true&multiStatements=false&timeout=10s&readTimeout=30s&writeTimeout=30s
        run: >-
          "$RUNNER_TEMP/migrationcheck" migrate
          --create-database
          --dsn "$MYSQL_DSN"
          --dir internal/store/sql

      - name: Lint new migrations against the base
        working-directory: head
        run: >-
          "$RUNNER_TEMP/migrationcheck" lint
          --base-dir ../base/internal/store/sql
          --head-dir internal/store/sql

      # Prod applies only the new migrations on top of the existing schema;
      # replay that path on the base database too.
      - name: Apply head migrations incrementally on the base database
        working-directory: head
        env:
          MYSQL_DSN: root:migration-ci@tcp(127.0.0.1:3306)/migration_base?charset=utf8&parseTime=true&multiStatements=false&timeout=10s&readTimeout=30s&writeTimeout=30s
        run: >-
          "$RUNNER_TEMP/migrationcheck" migrate
          --dsn "$MYSQL_DSN"
          --dir internal/store/sql
