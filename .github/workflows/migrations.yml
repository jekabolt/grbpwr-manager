name: Migration safety

on:
  pull_request:
    paths:
      - "internal/store/sql/**"
      - "internal/store/migrationlint/**"
      - "internal/store/migreplay/**"
      - "internal/testdbguard/**"
      - "cmd/migreplay/**"
      - ".github/workflows/migrations.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - beta
      - master

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: replay
          MYSQL_DATABASE: migration_replay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=replay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out backend with migration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.28.0

      - name: Generate protobuf Go packages
        run: make proto

      - name: Run database-free migration lint
        run: go test ./internal/store/migrationlint/

      - name: Resolve replay base
        id: base
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            echo "ref=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Replay new migrations over boundary data
        env:
          MIGREPLAY_DSN: root:replay@tcp(127.0.0.1:3306)/migration_replay_test?parseTime=true&charset=utf8mb4
          MIGREPLAY_BASE_REF: ${{ steps.base.outputs.ref }}
        run: make migration-replay
