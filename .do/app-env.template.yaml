features:
- buildpack-stack=ubuntu-22

ingress:
  rules:
  - component:
      name: grbpwr-manager-${ENV}
    cors:
      allow_headers:
      - Content-Type
      - Authorization
      - X-Requested-With
      - Accept
      - Origin
      - Grpc-Metadata-Authorization
      allow_methods:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      allow_origins:
      - exact: https://${ENV_HOST}
      - exact: https://${STOREFRONT_HOST}
      - exact: https://${ADMIN_HOST}
      expose_headers:
      - Content-Length
      - X-Request-Id
      max_age: 86400s
    match:
      path:
        prefix: /

name: grbpwr-backend-${ENV}
region: fra

services:
- dockerfile_path: /Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${env-db.DATABASE_URL}
  github:
    branch: ${ENV}
    deploy_on_push: false
    repo: jekabolt/grbpwr-manager
  health_check:
    failure_threshold: 9
    http_path: /readyz
    period_seconds: 10
    success_threshold: 1
    timeout_seconds: 1
  http_port: 8081
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  liveness_health_check:
    failure_threshold: 9
    http_path: /livez
    period_seconds: 10
    success_threshold: 1
    timeout_seconds: 1
  name: grbpwr-manager-${ENV}
