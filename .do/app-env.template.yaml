# DigitalOcean non-production environment template.
# Renderer identity placeholders:
#   ${ENV} ${ENV_DB} ${ENV_HOST} ${STOREFRONT_HOST} ${ADMIN_HOST}
#   ${BUCKET_FOLDER} ${DB_CLUSTER} ${DB_USER}
# Secret placeholder syntax and complete non-empty secret list:
#   ${SECRET:AUTH_JWT_SECRET}
#   ${SECRET:AUTH_MASTER_PASSWORD}
#   ${SECRET:PATTERN_TOKEN_PEPPER}
#   ${SECRET:STOREFRONT_AUTH_ACCESS_JWT_SECRET}
#   ${SECRET:STOREFRONT_AUTH_LOGIN_PEPPER}
#   ${SECRET:STOREFRONT_AUTH_REFRESH_PEPPER}
#   ${SECRET:BUCKET_S3_ACCESS_KEY}
#   ${SECRET:BUCKET_S3_SECRET_ACCESS_KEY}
#   ${SECRET:BUCKET_S3_ENDPOINT}
#   ${SECRET:MAILER_SENDGRID_API_KEY}
#   ${SECRET:MAILER_UNSUBSCRIBE_PEPPER}
#   ${SECRET:MAILER_WEBHOOK_SECRET}
#   ${SECRET:AI_KEYS_MASTER_KEY}
#   ${SECRET:STRIPE_PAYMENT_TEST_SECRET_KEY}
#   ${SECRET:STRIPE_PAYMENT_TEST_PUB_KEY}
#   ${SECRET:STRIPE_PAYMENT_TEST_WEBHOOK_SECRET}
#   ${SECRET:REVALIDATION_REVALIDATE_SECRET}
#   ${SECRET:MYSQL_DSN}
# Empty SECRET values below are deliberate kill switches. The renderer must preserve
# DigitalOcean component references such as ${env-db.DATABASE_URL} verbatim.

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

databases:
- cluster_name: ${DB_CLUSTER}
  db_name: ${ENV_DB}
  db_user: ${DB_USER}
  engine: MYSQL
  name: env-db
  production: true
  version: "8"

domains:
- domain: ${ENV_HOST}
  type: PRIMARY
  zone: grbpwr.com

