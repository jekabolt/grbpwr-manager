syntax = "proto3";

package common;

import "common/media.proto";
import "common/product.proto";
import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// TechCardStage is the development stage of a tech pack: prototype, fit sample,
// salesman sample, pre-production, production.
enum TechCardStage {
  TECH_CARD_STAGE_UNKNOWN = 0;
  TECH_CARD_STAGE_PROTO = 1;
  TECH_CARD_STAGE_FIT = 2;
  TECH_CARD_STAGE_SMS = 3;
  TECH_CARD_STAGE_PP = 4;
  TECH_CARD_STAGE_PROD = 5;
  TECH_CARD_STAGE_IDEA = 6; // draft: moodboard/concept before a style number (new-flow NF-03)
}

// TechCardApprovalState is the gating release state of a tech card, orthogonal to
// TechCardStage (which tracks development progress). A factory must only receive a
// card in the RELEASED state.
enum TechCardApprovalState {
  TECH_CARD_APPROVAL_STATE_UNKNOWN = 0; // defaults to DRAFT on write
  TECH_CARD_APPROVAL_STATE_DRAFT = 1;
  TECH_CARD_APPROVAL_STATE_IN_REVIEW = 2;
  TECH_CARD_APPROVAL_STATE_APPROVED = 3;
  TECH_CARD_APPROVAL_STATE_RELEASED = 4;
  TECH_CARD_APPROVAL_STATE_OBSOLETE = 5;
}

// TechCardMeasurementUnit is the unit for the card's geometry (callout dimensions).
// Metric only — the brand works in cm and mm, never inches.
enum TechCardMeasurementUnit {
  TECH_CARD_MEASUREMENT_UNIT_UNKNOWN = 0; // defaults to MM on write (the brand works in mm)
  TECH_CARD_MEASUREMENT_UNIT_CM = 1; // back-compat; clients should stop sending CM
  TECH_CARD_MEASUREMENT_UNIT_MM = 2;
}

// TechCardMediaKind classifies a tech-card sketch image.
enum TechCardMediaKind {
  TECH_CARD_MEDIA_KIND_UNKNOWN = 0;
  TECH_CARD_MEDIA_KIND_FRONT = 1; // front flat sketch
  TECH_CARD_MEDIA_KIND_BACK = 2; // back flat sketch
  TECH_CARD_MEDIA_KIND_DETAIL = 3; // detail / construction node
  TECH_CARD_MEDIA_KIND_LINING = 4; // internal structure / lining
  TECH_CARD_MEDIA_KIND_PREVIEW = 5; // cover preview
  TECH_CARD_MEDIA_KIND_MOODBOARD = 6; // mood / inspiration board
  TECH_CARD_MEDIA_KIND_REFERENCE = 7; // reference / fabric photo
  TECH_CARD_MEDIA_KIND_SWATCH = 8; // colour / fabric swatch
}

// TechCardMediaItem is a writable sketch-media reference (id + kind).
message TechCardMediaItem {
  int32 media_id = 1; // FK media(id)
  TechCardMediaKind kind = 2;
  string caption = 3; // image caption / view name
}

// TechCardMediaFull is a resolved sketch-media reference for display.
message TechCardMediaFull {
  MediaFull media = 1;
  TechCardMediaKind kind = 2;
  string caption = 3; // image caption / view name
}

// TechCardCallout is a numbered detail note pointing at the technical sketch.
//
// ГЕОМЕТРИЯ (kind/points/color) ДОПИСАНА, А НЕ ЗАВЕДЕНА РЯДОМ. Указания на карточном эскизе и
// указания на снимке шага — одно и то же ремесло: мерка между двумя точками, скобка над участком,
// дуга по окату. Второй список выносок на той же картинке заставил бы человека выбирать, в какой из
// двух систем он сейчас рисует, а читателя — смотреть в обе.
//
// Расширение чисто аддитивное: `pos_x/pos_y` СОХРАНЯЮТ смысл «где стоит нумерованный маркер», а
// `points` держит якоря геометрии. У выноски-пина (всё, что заведено до этой правки) points пуст, и
// она читается ровно как читалась.
message TechCardCallout {
  int32 number = 1; // callout number on the sketch
  string part = 2; // деталь / узел
  string description = 3; // описание, уточнение
  string dimensions = 4; // размеры / привязка
  int32 media_id = 5; // FK media(id); sketch this callout is pinned to (0 = unanchored)
  google.type.Decimal pos_x = 6; // normalised x (0..1) of the marker on its sketch
  google.type.Decimal pos_y = 7; // normalised y (0..1) of the marker on its sketch
  // Вид указания. UNKNOWN и PIN — одно и то же («просто нумерованная точка»).
  //
  // ЯВНОЕ ПРИСУТСТВИЕ, как у cut_symmetry/ungraded/fusing_mode детали, и ровно по той же причине:
  // вкладка со старым бандлом поля не шлёт вовсе, голый proto3-энум приехал бы как UNKNOWN и СТЁР
  // бы геометрию КАЖДОГО указания на карточке — сохранением, которое эскиз даже не открывало.
  // ОТСУТСТВИЕ ⇒ сервер несёт хранимое значение дальше (перенос по НОМЕРУ выноски, перед
  // дайджестом — иначе подпись DESIGN из такой вкладки рождается устаревшей). ЯВНЫЙ PIN ⇒ человек
  // сам превратил указание обратно в точку, это осознанное действие. Новый клиент шлёт поле
  // ВСЕГДА, круглым рейсом того, что прочитал.
  //
  // ГРУППА АТОМАРНА: присутствие ЭТОГО поля управляет всем, что описывает фигуру, — якорями,
  // цветом, пунктиром и заливкой. Клиент, приславший вид, обязан прислать их все; иначе дуга без
  // якорей досталась бы точками от прошлой правки, то есть чужими, и молча.
  //
  // `parts` в группу НЕ входит: старое поле `part` есть у любого клиента, и правило «пустой
  // список читается как [part]» обходится без флага присутствия.
  optional TechCardAnnotationKind kind = 8;
  // Якоря геометрии — БЕЗ маркера: маркер живёт в pos_x/pos_y и служит подписи. Пусто у PIN;
  // LABEL — 1, DIM/BRACKET — 2, ARC — 3, MULTI — 2..8, POLYGON — 3..40, INK — 2..200. Правило и
  // слова отказа те же, что у TechCardAnnotation, потому что вид один и тот же.
  repeated TechCardAnnotationPoint points = 9;
  TechCardAnnotationColor color = 10;
  // Пунктир и штриховка — те же, что у выноски на снимке шага, и по тем же правилам: пунктир
  // входит в подпись, штриховка живёт только у полигона. См. TechCardAnnotation.
  bool dashed = 11;
  bool filled = 12;
  // ДЕТАЛИ, О КОТОРЫХ УКАЗАНИЕ. Список имён — тех же, что несёт `part`, и по тем же правилам
  // связи «деталь ↔ выноска» (деталь ссылается на выноску НОМЕРОМ, и на один номер законно
  // ссылаются несколько деталей).
  //
  // СОВМЕСТИМОСТЬ БЕЗ ФЛАГА: пустой список читается как [part], непустой вытесняет `part`
  // целиком, и сервер отдаёт `part` = первым элементом.
  repeated string parts = 13;
}

// TechCardRevision is one entry in the spec-document changelog (what changed in
// which section, by whom). This is NOT fit history — fitting verdicts and
// measurements live in the separate fitting feature.
message TechCardRevision {
  reserved 1, 2;
  reserved "version", "revision_date";
  string author = 3; // server-stamped acting admin username (GetAdminUsername)
  string section = 4; // раздел (header|sketch|bom|colorway|pieces|construction|labels|packaging|costing|signoff|other)
  string change_note = 5; // human summary of what changed
  string action = 6; // created|updated|approved|released|reverted|role_assigned|other
  google.protobuf.Timestamp created_at = 7; // when the server stamped this journal entry
}

// TechCardRole is a responsible-account role on a tech card (PLM-rework Q5). Replaces the free-text
// designer/constructor/technologist/approved_by strings; approval is the APPROVER role plus a
// server-stamped journal event, not a free-text name.
enum TechCardRole {
  TECH_CARD_ROLE_UNKNOWN = 0;
  TECH_CARD_ROLE_DESIGNER = 1;
  TECH_CARD_ROLE_CONSTRUCTOR = 2;
  TECH_CARD_ROLE_TECHNOLOGIST = 3;
  TECH_CARD_ROLE_PATTERN_MAKER = 4;
  TECH_CARD_ROLE_GRADER = 5;
  TECH_CARD_ROLE_APPROVER = 6;
  TECH_CARD_ROLE_OTHER = 7;
}

// TechCardRoleAssignment is one "this admin account is <role> of this card" record (Q5), multi per
// role. Managed via the AssignTechCardRole / RemoveTechCardRoleAssignment / ListTechCardRoleAssignments
// RPCs, NOT through the tech-card full-replace. admin_username is resolved on read (never written).
message TechCardRoleAssignment {
  int32 id = 1;
  int32 tech_card_id = 2;
  TechCardRole role = 3;
  int32 admin_id = 4; // FK admins(id)
  string admin_username = 5; // resolved on read, read-only
  string assigned_by = 6; // audit: who created the assignment
  google.protobuf.Timestamp assigned_at = 7;
}

// TechCardBomSection groups a BOM line by material family (Sheet «Спецификация»).
enum TechCardBomSection {
  TECH_CARD_BOM_SECTION_UNKNOWN = 0;
  TECH_CARD_BOM_SECTION_FABRIC = 1; // основные ткани
  TECH_CARD_BOM_SECTION_LINING = 2; // подклад
  TECH_CARD_BOM_SECTION_INTERLINING = 3; // приклад / дублерин
  TECH_CARD_BOM_SECTION_INSULATION = 4; // утеплитель / объём
  TECH_CARD_BOM_SECTION_HARDWARE = 5; // фурнитура
  TECH_CARD_BOM_SECTION_THREAD = 6; // нитки
  TECH_CARD_BOM_SECTION_LABEL = 7; // этикетки и маркировка
  TECH_CARD_BOM_SECTION_PACKAGING = 8; // упаковка
  TECH_CARD_BOM_SECTION_TRIM = 9; // soft trims: бейка / тесьма / резинка / кант / шнур / лента (not hardware fittings)
  TECH_CARD_BOM_SECTION_DECORATION = 10; // принт / вышивка / аппликация / патч / стразы
  TECH_CARD_BOM_SECTION_OTHER = 11; // прочее (catch-all)
}

// TechCardBomPurpose is НАЗНАЧЕНИЕ — what the garment uses a roll-goods line FOR, on its own axis
// beside `section` (0265). Several lines legitimately share one purpose; that IS the point, the
// field exists to name a SUBSET of fabrics ("the lining ones", "the contrast ones").
//
// It is not a section value. `section` drives the wastage gross-up, the composition derive and what
// a раскладка may bind to, and a pocket-bag / contrast / mesh fabric is genuinely fabric on all
// three counts — it differs only in role. It is not free text either: the field exists to GROUP, and
// a free-text role stops grouping the moment two operators spell it differently. Hence a closed
// eight-value list, with `other` carrying its meaning in the SEPARATE purpose_note field so a note
// can never become a shadow purpose on one of the seven real values.
//
// UNSET (0) is a first-class state meaning "not sorted yet", not a default. Every line that existed
// before 0265 is UNSET on purpose: section='fabric' is exactly where pocket-bag, contrast and mesh
// hide today, so a backfill would have labelled them MAIN confidently and wrongly.
enum TechCardBomPurpose {
  TECH_CARD_BOM_PURPOSE_UNSET = 0; // не задано — not sorted yet (also the value of every pre-0265 line)
  TECH_CARD_BOM_PURPOSE_MAIN = 1; // основной материал
  TECH_CARD_BOM_PURPOSE_LINING = 2; // подкладка
  TECH_CARD_BOM_PURPOSE_POCKETING = 3; // карманка
  TECH_CARD_BOM_PURPOSE_INTERFACING = 4; // бортовка / прокладка
  TECH_CARD_BOM_PURPOSE_INSULATION = 5; // утеплитель
  TECH_CARD_BOM_PURPOSE_CONTRAST = 6; // контраст / отделочная
  TECH_CARD_BOM_PURPOSE_MESH = 7; // сетка / второй слой
  TECH_CARD_BOM_PURPOSE_OTHER = 8; // другое — the free-text explanation goes in purpose_note
}

// TechCardBomKind is ЧТО ЭТО ЗА ПОЗИЦИЯ — the mirror image of TechCardBomPurpose (0265). Purpose
// says what the garment uses a ROLL-GOODS line FOR; kind says what a NON-roll-goods line IS. The
// two never meet on the same row: purpose is legal only on fabric/lining/interlining/insulation,
// kind only on the sections that are neither roll goods nor label.
//
// NOT CALLED "role". TechCardRole (designer/constructor/technologist/…) already exists in this file
// and names WHO is responsible for a card. A second "role" meaning "what this button is" would be
// misread permanently, by people and by grep alike.
//
// ONE FLAT ENUM, NOT ONE PER FAMILY. The value already implies its family — a `zipper` is hardware
// and nothing else — so a per-family enum would encode the section twice and let the two copies
// disagree, which is the drift class 0265's own header argues against. The pairing (each kind is
// legal only in its HOME section) is therefore data, not type: entity.bomKindHomeSection is the
// single table, and the store checks the pair on write. The DB CHECK closes the VOCABULARY only —
// it never sees the section, deliberately, because a two-column CHECK would fire as a raw MySQL
// 3819 on an UPDATE that touched only `section` and name a column the operator never edited.
//
// WHY `label` IS NOT ELIGIBLE. tech_card_label.label_type already owns that vocabulary
// (main/size/care/origin/flag/hangtag/barcode/special), several label SPEC rows may point at ONE
// bom_item_id (the material they print on), and labelsProjection already hashes label_type into the
// signed LABELS digest. A `kind` on section=label would be a second, unsigned answer to a question
// that is already answered and already signed.
//
// UNSET (0) is a first-class state meaning "not classified yet", not a default. Nothing is
// backfilled: every line that predates 0276 is genuinely unclassified, and a guess ("this thread is
// sewing_thread") would read as a fact and be believed.
//
// СПОРНЫЕ СЛУЧАИ, решённые здесь и больше нигде — граница проходит по ФУНКЦИИ, не по материалу:
//   * велкро/липучка → HOOK_LOOP, это TRIM (мягкая лента, метраж), а не фурнитура;
//   * заклёпка, которая ДЕРЖИТ (карман, шлёвку) → RIVET, hardware;
//   * такая же по виду декоративная клёпка, которая ничего не держит → STUD, decoration;
//   * шнур → DRAWCORD, trim (продаётся метражом); его фиксатор → CORD_STOPPER, hardware (штучный).
enum TechCardBomKind {
  TECH_CARD_BOM_KIND_UNSET = 0; // не задано — not classified yet (also every pre-0276 line)

  // ФУРНИТУРА — section=hardware. Countable fittings; the garment stops working without them.
  TECH_CARD_BOM_KIND_ZIPPER = 1; // молния (в сборе)
  TECH_CARD_BOM_KIND_ZIPPER_SLIDER = 2; // бегунок/слайдер, когда он закупается отдельно от ленты
  TECH_CARD_BOM_KIND_BUTTON = 3; // пуговица
  TECH_CARD_BOM_KIND_SNAP = 4; // кнопка (нажимная)
  TECH_CARD_BOM_KIND_RIVET = 5; // заклёпка НЕСУЩАЯ (карман, шлёвка). Декоративная — это STUD
  TECH_CARD_BOM_KIND_EYELET = 6; // люверс / блочка
  TECH_CARD_BOM_KIND_HOOK_AND_BAR = 7; // крючок-петля (брючный)
  TECH_CARD_BOM_KIND_SNAP_HOOK = 8; // карабин
  TECH_CARD_BOM_KIND_BUCKLE = 9; // пряжка
  TECH_CARD_BOM_KIND_STRAP_ADJUSTER = 10; // регулятор лямки / рамка-регулятор
  TECH_CARD_BOM_KIND_RING = 11; // кольцо / полукольцо
  TECH_CARD_BOM_KIND_TOGGLE = 12; // толстовочный фиксатор-«клык», пуговица-палочка
  TECH_CARD_BOM_KIND_CORD_STOPPER = 13; // фиксатор шнура. Сам шнур — DRAWCORD (trim)
  TECH_CARD_BOM_KIND_CORD_END = 14; // наконечник шнура
  TECH_CARD_BOM_KIND_MAGNET = 15; // магнитная застёжка
  TECH_CARD_BOM_KIND_CHAIN = 16; // цепь

  // ОТДЕЛОЧНЫЕ МАТЕРИАЛЫ — section=trim. Soft goods sold by length; they keep their wastage gross-up.
  TECH_CARD_BOM_KIND_ELASTIC = 17; // резинка
  TECH_CARD_BOM_KIND_DRAWCORD = 18; // шнур. Его фиксатор — CORD_STOPPER (hardware)
  TECH_CARD_BOM_KIND_BINDING = 19; // бейка / окантовочная лента
  TECH_CARD_BOM_KIND_TAPE = 20; // тесьма / киперная лента
  TECH_CARD_BOM_KIND_PIPING = 21; // кант
  TECH_CARD_BOM_KIND_WEBBING = 22; // стропа
  TECH_CARD_BOM_KIND_HOOK_LOOP = 23; // велкро / контактная лента — TRIM, не фурнитура: это метражная лента
  TECH_CARD_BOM_KIND_BONING = 24; // регилин / корсетный ус
  TECH_CARD_BOM_KIND_LACE = 25; // кружево
  TECH_CARD_BOM_KIND_RIBBING = 26; // трикотажная резинка (манжет/воротник/пояс)

  // ДЕКОР — section=decoration. Applied ONTO the garment; nothing here holds anything together.
  TECH_CARD_BOM_KIND_PRINT = 27; // принт
  TECH_CARD_BOM_KIND_EMBROIDERY = 28; // вышивка
  TECH_CARD_BOM_KIND_APPLIQUE = 29; // аппликация
  TECH_CARD_BOM_KIND_PATCH = 30; // патч / нашивка
  TECH_CARD_BOM_KIND_HEAT_TRANSFER = 31; // термотрансфер
  TECH_CARD_BOM_KIND_RHINESTONE = 32; // стразы
  TECH_CARD_BOM_KIND_SEQUIN = 33; // пайетки
  TECH_CARD_BOM_KIND_STUD = 34; // декоративная клёпка/шип. Несущая заклёпка — RIVET (hardware)
  TECH_CARD_BOM_KIND_FOIL = 35; // фольгирование
  TECH_CARD_BOM_KIND_LASER = 36; // лазерная резка / гравировка

  // НИТКИ — section=thread. Split by the JOB the thread does, which is what picks the machine.
  TECH_CARD_BOM_KIND_SEWING_THREAD = 37; // швейная (стачивающая)
  TECH_CARD_BOM_KIND_TOPSTITCH_THREAD = 38; // отделочная (отстрочка)
  TECH_CARD_BOM_KIND_OVERLOCK_THREAD = 39; // оверлочная
  TECH_CARD_BOM_KIND_BUTTONHOLE_THREAD = 40; // петельная
  TECH_CARD_BOM_KIND_EMBROIDERY_THREAD = 41; // вышивальная
  TECH_CARD_BOM_KIND_ELASTIC_THREAD = 42; // эластичная (шпульная резинка)

  // УПАКОВКА — section=packaging. Spellings deliberately match TechCardAuxSubtype wherever the two
  // name the SAME object (sticker / dust_bag / garment_case / hanger), so an auxiliary card that
  // MAKES the item and the BOM line that CONSUMES it read as one word. The three that differ do so
  // because the object differs: HANGTAG_STRING is the string, not the aux HANGTAG it hangs;
  // INSERT_CARD is a printed card, narrower than the aux INSERT; CARTON is the outer shipping box
  // (TechCardPackaging.units_per_box / box_marking), not the aux BOX the customer receives.
  TECH_CARD_BOM_KIND_POLYBAG = 43; // полибэг
  TECH_CARD_BOM_KIND_CARTON = 44; // короб (транспортный)
  TECH_CARD_BOM_KIND_HANGER = 45; // вешалка
  TECH_CARD_BOM_KIND_HANGTAG_STRING = 46; // шнурок/петля для навесного ярлыка
  TECH_CARD_BOM_KIND_STICKER = 47; // стикер
  TECH_CARD_BOM_KIND_TISSUE = 48; // папиросная бумага
  TECH_CARD_BOM_KIND_DUST_BAG = 49; // пыльник
  TECH_CARD_BOM_KIND_GARMENT_CASE = 50; // кофр
  TECH_CARD_BOM_KIND_INSERT_CARD = 51; // вкладыш-карточка

  // ДРУГОЕ — the ONLY value legal in EVERY eligible section (including section=other, which has no
  // kinds of its own). Its meaning lives in the separate kind_note, never in a shadow value on one
  // of the 53 real kinds — the same containment chk_bom_item_purpose_note gives назначению.
  TECH_CARD_BOM_KIND_OTHER = 52;

  // ДОБАВЛЕНО ВОЛНОЙ ВИДОВ ОПЕРАЦИЙ, строго append'ом — ПОСЛЕ OTHER. Порядок членов enum'а секции
  // не задаёт: домашнюю секцию вида держит bomKindHomeSection в entity, и вид без записи там для
  // валидации не существует вовсе.
  TECH_CARD_BOM_KIND_SEAM_SEALING_TAPE = 53; // лента проклейки шва (машина seam_taping) — section=trim
  // 54 — ДЫРА: номер обещан отложенному `wet_chemical` фазы расширяемых свойств. НЕ занимать.
  // Стабилизатор под вышивку живёт в section=DECORATION, а НЕ в interlining: interlining — рулонная
  // секция, а рулонные секции видов не принимают вовсе. Клиентский пикер обязан предлагать этот вид
  // только в декоре; на паре «вид ↔ секция» стор откажет.
  TECH_CARD_BOM_KIND_EMBROIDERY_STABILIZER = 55; // стабилизатор под вышивку — section=decoration
}

// TechCardLabDipStatus is the lab-dip approval lifecycle of a colourway.
enum TechCardLabDipStatus {
  TECH_CARD_LAB_DIP_STATUS_UNKNOWN = 0; // defaults to PENDING on write
  TECH_CARD_LAB_DIP_STATUS_PENDING = 1;
  TECH_CARD_LAB_DIP_STATUS_SUBMITTED = 2;
  TECH_CARD_LAB_DIP_STATUS_APPROVED = 3;
  TECH_CARD_LAB_DIP_STATUS_REJECTED = 4;
}

// TechCardPurpose is the numeric enum form of a style's purpose (R6). Replaces the free-text
// `purpose` field; UNKNOWN is rejected on write.
enum TechCardPurpose {
  TECH_CARD_PURPOSE_UNKNOWN = 0;
  TECH_CARD_PURPOSE_SELLABLE = 1;
  TECH_CARD_PURPOSE_AUXILIARY = 2;
}

// TechCardAuxSubtype sub-classifies an AUXILIARY card (purpose=auxiliary) into the concrete kind of
// non-sold item it produces (WS7). UNKNOWN=0 means unset — a sellable card, or an auxiliary card not yet
// classified (stored NULL). Only meaningful with purpose=auxiliary.
enum TechCardAuxSubtype {
  TECH_CARD_AUX_SUBTYPE_UNKNOWN = 0;
  TECH_CARD_AUX_SUBTYPE_BRAND_LABEL = 1;
  TECH_CARD_AUX_SUBTYPE_CARE_LABEL = 2;
  TECH_CARD_AUX_SUBTYPE_SIZE_LABEL = 3;
  TECH_CARD_AUX_SUBTYPE_HANGTAG = 4;
  TECH_CARD_AUX_SUBTYPE_STICKER = 5;
  TECH_CARD_AUX_SUBTYPE_DUST_BAG = 6;
  TECH_CARD_AUX_SUBTYPE_BOX = 7;
  TECH_CARD_AUX_SUBTYPE_INSERT = 8;
  TECH_CARD_AUX_SUBTYPE_HANGER = 9;
  TECH_CARD_AUX_SUBTYPE_OTHER = 10;
  // кофр — the carrier a garment travels/hangs in. Its own sub-type rather than a dust bag: it is
  // cut, sewn and costed as its own item, and an assembly bill names which of the two ships.
  TECH_CARD_AUX_SUBTYPE_GARMENT_CASE = 11;
  // шоппер — the carrier the customer takes the purchase away in and keeps using. Its own sub-type
  // rather than a dust bag: it is cut, sewn and costed as its own item, and an assembly bill names
  // which carrier ships.
  TECH_CARD_AUX_SUBTYPE_TOTE_BAG = 12;
}

// ColorwayDevelopmentInsert carries the PLM / lab-dip development fields that moved onto the colourway
// (product) in the R1 merge: ex tech_card_colorway.code/name/hex/comment become dev_code/name/dev_hex/
// comment. Lives in techcard.proto to reach TechCardLabDipStatus and the usage recipe without a circular
// import (product.proto cannot import techcard.proto). NOTE: `usages` (the material recipe) is keyed by
// an explicit colorway_id = product.id (R1/§14.3); the positional colorway_index model is gone.
message ColorwayDevelopmentInsert {
  string dev_code = 1; // ex TechCardColorway.code (internal article code)
  string name = 2; // internal colourway label
  TechCardLabDipStatus lab_dip_status = 3;
  string comment = 4;
  string pantone = 5;
  string pantone_system = 6;
  string dev_hex = 7; // ex hex; screen approximation #RRGGBB
  int32 swatch_media_id = 8;
  int32 lab_dip_round = 9;
  google.protobuf.Timestamp lab_dip_submitted_at = 10; // READ-ONLY: server-stamped on submission
  google.protobuf.Timestamp lab_dip_decided_at = 11; // READ-ONLY: server-stamped on approval/rejection
  string lab_dip_decided_by = 12; // READ-ONLY: authenticated deciding admin
  string lab_dip_reject_reason = 13;
  repeated TechCardColorwayUsage usages = 14; // material recipe (bom_item_index into the owning style's BOM)
  int32 display_order = 15;
}

// ColorwayLabDipRound is ONE round of the lab-dip approval loop, as it actually happens: a dyehouse
// submits a swatch, the studio approves or rejects it, and a rejection starts the next round. The flat
// lab_dip_* scalars on ColorwayDevelopmentInsert describe only the CURRENT round; this is the history
// behind them, so a timeline can show R1 rejected → R2 rejected → R3 approved instead of one row.
//
// OUTPUT-ONLY. Rounds are not written directly: the server derives them from the lab-dip write path
// (UpdateColorway's development.*), keyed by round_number — writing round 2 leaves round 1 intact.
// That keeps one source of truth (the current round is still the scalars) and cannot drift from it.
message ColorwayLabDipRound {
  int32 round_number = 1; // 1-based; the round the scalars describe is the highest
  TechCardLabDipStatus status = 2;
  google.protobuf.Timestamp submitted_at = 3;
  google.protobuf.Timestamp decided_at = 4;
  string decided_by = 5;
  string reject_reason = 6;
  string comment = 7;
  int32 swatch_media_id = 8; // the swatch this round was judged on; 0 = none
  google.protobuf.Timestamp created_at = 9; // when the server first recorded the round
}

message ColorwayDevelopment {
  ColorwayDevelopmentInsert development = 1;
  Color dictionary_color = 2; // output-only resolved dictionary colour
  repeated ColorwayLabDipRound lab_dip_rounds = 3; // OUTPUT-ONLY history, oldest first
}

// StyleSizeChart is the style-owned size chart (R5). Written full-replace under the shared
// tech_card.lock_version; there is no separate chart version.
message StyleSizeChartCell {
  int32 size_id = 1;
  int32 measurement_name_id = 2;
  google.type.Decimal value = 3;
}

// StyleSizeChartGradeStep is one measurement's grade increment — the per-size-position step the
// expanded chart was authored from (PLM gap 4). See StyleSizeChart.grade_steps.
message StyleSizeChartGradeStep {
  int32 measurement_name_id = 1; // FK measurement_name(id)
  google.type.Decimal step = 2; // increment per size position; may be negative
}

message StyleSizeChart {
  int32 style_id = 1;
  int32 lock_version = 2;
  repeated StyleSizeChartCell cells = 3;
  // The GRADE RULE the expanded `cells` grid was authored from:
  //
  //     value(size) = base + step × (position(size) − position(base))
  //
  // `cells` stays the source of truth — the factory reads the expanded grid, and a cell the grader
  // overtyped keeps its typed value. The rule is stored so reopening a card can show WHICH cells
  // still follow it (recompute and compare: a cell that differs was overtyped) instead of
  // presenting 40 numbers with no structure. Both fields are optional: an unset rule (base 0 /
  // empty steps) means the chart was typed cell by cell, which is what every pre-existing chart is.
  int32 grade_base_size_id = 4; // FK size(id); 0 = no rule authored
  repeated StyleSizeChartGradeStep grade_steps = 5; // one per graded measurement; absent = ungraded
}

// AdminColorwayRef is a derived, output-only reference to a colourway from its style (R1: GetStyle may
// return its colourways, but they are not writable through the style).
message AdminColorwayRef {
  int32 colorway_id = 1;
  string base_sku = 2;
  string color_code = 3;
  ColorwayLifecycleStatus status = 4;
  // usages is this colourway's material recipe (H1 fix, WS3/S2-S3): the constructor view of a
  // style now shows each colourway's recipe alongside its identity, instead of the recipe being
  // write-only (UpdateColorwayRecipe persisted usages that no read path ever surfaced). Money
  // fields (line_total/size_run_total) are stripped for an account without costing:read, same as
  // the rest of the tech-card read (stripTechCardCosting).
  repeated TechCardColorwayUsage usages = 5;
  // Lab-dip lifecycle mirrored from the colourway's development submessage (ColorwayDevelopmentInsert),
  // so the tech-card colourways tab can READ the current lab-dip state inline instead of a second
  // GetColorwayByID round-trip. These are written through the Colorway write path (UpdateColorway's
  // development.*), never through the style; here they are output-only.
  TechCardLabDipStatus lab_dip_status = 6;
  int32 lab_dip_round = 7;
  google.protobuf.Timestamp lab_dip_submitted_at = 8;
  google.protobuf.Timestamp lab_dip_decided_at = 9;
  string lab_dip_decided_by = 10;
  string lab_dip_reject_reason = 11;
  // lock_version is the colourway's optimistic-lock token — its style's shared tech_card.lock_version
  // (R2/R4). Echo it into UpdateColorwayRequest.expected_colorway_version; a stale value is rejected
  // (ABORTED). Surfaced on the ref so a per-colourway lab-dip edit is optimistically locked straight
  // from here, without the caller reaching up to the tech-card's top-level lock_version.
  int32 lock_version = 12;
  // lab_dip_rounds is the full round history behind the scalars above (oldest first), so the
  // colourways tab can draw the real timeline instead of the single current round. OUTPUT-ONLY.
  repeated ColorwayLabDipRound lab_dip_rounds = 13;
  // Per-colourway COGS (product.cost_price) and its provenance. Costing is otherwise style-level, so
  // without this the tab could not say that the black colourway costs more than the ecru one. Money:
  // stripped for an account without costing:read, like the rest of the tech-card read.
  google.type.Decimal cost_price = 14;
  string cost_price_source = 15; // manual | production_run | tech_card; empty = never set
  google.protobuf.Timestamp cost_price_updated_at = 16;
  // prices is this colourway's retail price list (product_price), one entry per currency. Pricing
  // lives on the published product, so the costing tab used to reconstruct a retail figure by fanning
  // out GetColorwayByID over every linked colourway and only trusting it when all of them agreed.
  // Surfaced here so a margin can be drawn from one read, per colourway, without that guesswork.
  //
  // These are the catalogue prices AS ENTERED, and the whole system already treats those as
  // VAT-INCLUSIVE: the order snapshot extracts vat_amount = total × rate/(100+rate) (migration 0094),
  // accounting derives output VAT the same way, and the realised sales margin divides revenue by
  // (1 + rate) before comparing it to cost. A margin drawn against `prices` therefore overstates
  // itself by roughly the VAT rate — which is exactly what the costing tab was doing while the
  // margin-by-style report next to it did not. Use net_prices below.
  repeated ColorwayPrice prices = 17;
  // net_prices is `prices` with VAT removed at the rate of the read's VAT country (see
  // TechCardCosting.vat_country_code / vat_rate_pct), paired by currency. This is the figure a margin
  // must be drawn against, because unit_cost carries no VAT.
  //
  // It is a SCENARIO, not a fact: one gross price is sold into as many rates as there are
  // destinations, so "the" net retail does not exist until someone names a market. The server nets at
  // the company's domestic rate by default and honours GetTechCardRequest.vat_country_code to model
  // another. Empty when no rate is known for that country (an export destination nets to itself, and
  // silently returning the gross price under a "net" name would be the same lie in a new place).
  repeated ColorwayPrice net_prices = 18;

  // The rest of the development block (ColorwayDevelopmentInsert), flattened onto the ref exactly as
  // the lab_dip_* scalars above already are. These describe the COLOUR ITSELF — the internal code and
  // label it is developed under, the pantone reference the dyehouse matches, the screen approximation
  // and the physical swatch — and they were write-only until now: UpdateColorway persisted them and no
  // read path returned them, so the tab could show which round a lab dip was on but not which pantone
  // that round was chasing. Written through the Colorway write path (UpdateColorway's development.*),
  // never through the style; here they are OUTPUT-ONLY.
  string dev_code = 19; // internal article code for the colour (ex TechCardColorway.code)
  string dev_name = 20; // internal colourway label (ex TechCardColorway.name)
  string dev_comment = 21; // development notes
  string pantone = 22; // pantone reference the dyehouse matches
  string pantone_system = 23; // which pantone book that reference is in (TCX/TPG/…)
  string dev_hex = 24; // screen approximation #RRGGBB (ex hex)
  int32 swatch_media_id = 25; // the approved physical swatch; 0 = none
  // OUTPUT-ONLY оценки расхода по площади (Ф1) для рулонных слотов ЭТОГО колорвея, у которых НЕТ
  // строки рецепта — по одной на слот, включая те, где оценки не вышло (тогда refusal называет
  // недостающий факт). См. TechCardSlotAreaEstimate.
  //
  // ВИСИТ НА КОЛОРВЕЕ, А НЕ НА КАРТОЧКЕ, потому что оценка — свойство ПАРЫ (колорвей, слот): детали
  // на ткань назначает рецепт колорвея, а ширину и цену задаёт пришпиленный им артикул, поэтому два
  // цвета одного стиля законно съедают разное. На карточке этот список пришлось бы носить с
  // colorway_id в каждой строке и он приглашал бы нарисовать один стилевой расход на ткань.
  //
  // И РЯДОМ С usages, А НЕ ВНУТРИ НИХ: оценка существует ровно там, где строки рецепта на слот НЕТ
  // (строку, вписанную человеком, оценка не трогает), так что ехать ей на строке физически не на
  // чем. Клиент склеивает два списка по bom_line_key в один список по тканям — ровно тот, который
  // рисует экран.
  //
  // ВСПОМОГАТЕЛЬНАЯ КАРТОЧКА (aux) ОЦЕНКУ НЕ ПОЛУЧАЕТ, и это не забытый случай. Её цвета живут не в
  // колорвеях, а в output_variants — отдельной коллекции без рецепта, — поэтому пары (колорвей,
  // слот) у неё нет. Ровно по той же причине её не считает и ДЕНЕЖНЫЙ путь: костинг раскладывается
  // по colorway_costs, то есть по тем же колорвеям. Публикация здесь покрывает РОВНО те колорвеи,
  // по которым посчитана стоимость, — не меньше и не больше; замеренный чехол сегодня не стоит
  // ничего ни на одном экране, и это отдельная стройка (расход на вариант выпуска), а не поле.
  repeated TechCardSlotAreaEstimate area_estimates = 26;
  // OUTPUT-ONLY ТЕНЕВЫЕ оценки: та же самая оценка по площади, посчитанная для рулонного слота, у
  // которого норма ЗАЯВЛЕНА человеком. Справочная цифра рядом с авторской нормой — НИКОГДА не сама
  // норма.
  //
  // ЗАЧЕМ ОТДЕЛЬНОЕ ПОЛЕ, А НЕ ФЛАЖОК В area_estimates. Правило «введённое сильнее выведенного»
  // означает, что в area_estimates слот с авторской нормой не попадает НИКОГДА, и на этом стоит
  // склейка клиента: он сшивает usages и area_estimates в один список по тканям, полагаясь на то,
  // что у одной ткани найдётся ровно одно из двух. Дослав теневую строку в тот же список, сервер
  // сломал бы КАЖДОГО сегодняшнего клиента: у слота с нормой появилась бы вторая строка, и какая из
  // двух цифр окажется на экране, зависело бы от порядка склейки. Отдельное поле снимает вопрос
  // насовсем: клиент, который про него не знает, теней не получает вовсе, а его пустое (нулевое)
  // значение — пустой список — читается как «теней нет», что и есть правда для любого ответа,
  // снятого до этого поля, включая замороженные слепки релизов.
  //
  // ПО ТОЙ ЖЕ ПРИЧИНЕ ТЕНЬ НЕ ПОМЕЧЕНА СКАЛЯРОМ ВНУТРИ СТРОКИ. Булев (или enum) «это тень» был бы
  // ВТОРЫМ утверждением о том же факте, и его нулевое значение пришлось бы толковать: у строки из
  // слепка, снятого до этого поля, он прочитался бы как «активная», то есть ровно как умолчание
  // «считай нормой». Список, в котором строка приехала, И ЕСТЬ её ступень; разойтись с самим собой
  // он не может.
  //
  // ЧТО ЭТА ЦИФРА ЗНАЧИТ. То же, что и активная оценка: NETTO, нижняя граница расхода по измеренным
  // площадям деталей — межлекальных выпадов и концов настила в ней нет и быть не может. Смысл
  // публикации ровно один: показать, НАСКОЛЬКО нижняя граница ниже нормы, которую вписал человек
  // («оценка занижала на 27%»), — чтобы было видно, стоит ли ей доверять там, где нормы ещё нет.
  //
  // С ЧЕМ ЕЁ СРАВНИВАТЬ МОЖНО И С ЧЕМ НЕЛЬЗЯ. Можно — с АВТОРСКОЙ НОРМОЙ ТОГО ЖЕ слота того же
  // колорвея (она в usages, ключ склейки тот же bom_line_key). НЕЛЬЗЯ — с другой оценкой: ни с
  // оценкой соседнего слота, ни с оценкой того же слота в другом колорвее, ни с активной оценкой из
  // area_estimates. Каждая оценка прячет СВОЙ объём межлекальных выпадов, и знак разности двух
  // оценок бывает противоположен знаку правды.
  //
  // ОТКАЗЫВАЕТ ТЕМ ЖЕ СЛОВАРЁМ И В ТОМ ЖЕ ПОРЯДКЕ, что активная оценка, — включая no_price. Второй
  // ступени отказов нет: оценка это ОДИН ответ (геометрия и цена одного и того же артикула), и слот,
  // про который она отказалась говорить, одинаково нем на обеих ступенях. На карточке, где слот с
  // авторской нормой не имеет цены, костинг и без того не считается по этой же причине — тень
  // повторяет то, что уже сказано рядом, а не выдаёт новую загадку.
  //
  // НА ДЕНЬГИ НЕ ВЛИЯЕТ НИЧЕМ. Тень не входит ни в один итог: TechCardCosting считается по авторской
  // норме этого слота ровно как считался, has_estimate от тени не поднимается, product.cost_price
  // ею не засевается, чек-лист релиза её не называет, план материалов её не видит. Публикация
  // ШИРЕ множества, которое СЧИТАЕТСЯ, — и это разделение намеренное.
  repeated TechCardSlotAreaEstimate shadow_area_estimates = 27;
}

// TechCardColorway was the development-colourway child of a style. Removed in the R1 merge
// (tech_card_colorway → product): the colourway is now a product, and its PLM/lab-dip fields live in
// ColorwayDevelopment{,Insert} (above) reached through the Colorway read/write path. Its material
// recipe (usages) is carried by ColorwayDevelopmentInsert.usages, keyed by an explicit colorway_id.
// Listed in the removed-registry (breaking fixture); the name is not reused.

// TechCardColorwayUsage is one material use inside a colourway: which catalog article
// (bom_item_index) goes on which garment part (placement), the colour it takes HERE, and
// how much is consumed (per-garment and/or per-size). The BOM is a pure article catalog;
// per-colourway divergence lives here.
message TechCardColorwayUsage {
  // explicit presence: index 0 is a real BOM line, distinct from "unset"
  // (mirrors TechCardOperation.bom_item_index).
  optional int32 bom_item_index = 1; // FK → TechCardInsert.bom_items
  string placement = 2; // garment part: outer / inner collar / lining / sleeve …
  // matched (trim+lower) against TechCardOperation.placement
  string color = 3; // material colour in THIS colourway — material-specific,
  // independent of the colourway swatch pantone (ColorwayDevelopmentInsert.pantone)
  string pantone = 4; // material Pantone / code in this colourway
  google.type.Decimal consumption = 5; // per-garment rate (measured materials); fallback when size_consumptions empty
  google.type.Decimal quantity = 6; // count (countable trims)
  repeated TechCardBomSizeConsumption size_consumptions = 7; // per-size rate; size_id ∈ TechCardInsert.size_ids
  google.type.Decimal line_total = 8; // OUTPUT-ONLY (per-garment)
  google.type.Decimal size_run_total = 9; // OUTPUT-ONLY (whole run)
  // explicit presence: 0-based index into TechCardInsert.pieces saying which cut-piece this row
  // ASSIGNS the slot's material to («деталь X кроится из артикула Y» — T8: a piece-bound row is a
  // MATERIAL ASSIGNMENT, never a norm; the consumption norm lives ONLY on the garment-level row,
  // piece unset). Unset = garment-level row — the slot's norm carrier. Legacy positional form.
  optional int32 piece_index = 10;
  // bom_line_key references the owning style's BOM line by its stable line_key (S2/S3) — the durable
  // reference the recipe write-path resolves to a real bom_item_id. Preferred over bom_item_index
  // (which stays for the transition / legacy read). bom_item_id is the resolved FK on read.
  string bom_line_key = 11;
  int64 bom_item_id = 12; // OUTPUT: resolved FK to the BOM line
  // piece_line_key references the cut-piece this row ASSIGNS the slot's material to, by its stable
  // TechCardPiece.line_key (WS4). T8: this binding is «из чего кроится деталь» — a material
  // assignment, NOT a norm; a piece-bound row carries no consumption of its own, and the server
  // refuses to read one as «нормы нет» for the slot. The recipe write-path resolves it to the real
  // piece_id FK (usage.piece_id RESTRICT). Preferred over the positional piece_index (kept for the
  // transition). piece_id is the resolved FK.
  string piece_line_key = 13;
  int64 piece_id = 14; // OUTPUT: resolved FK to the cut-piece
  // material_id pins the CONCRETE catalog article this colourway takes for the slot (the BOM line
  // is the role — «основная молния»; the pin is the article — YKK 5VS silver). Unset/0 = inherit
  // the slot's default article (TechCardBomItem.material_id). `optional` is load-bearing: a client
  // that predates this field OMITS it on the full-replace recipe write, and the store must then
  // PRESERVE the existing pin (absent ≠ explicit clear; an explicit 0 clears).
  optional int64 material_id = 15;
  // consumption_source is the provenance of the norm. "manual" (or "") — typed by the operator;
  // the slot's wastage_percent grosses cost up, exactly as before. "marker" — applied from a
  // saved раскладка whose measured length already CONTAINS the cutting waste (selvedge rides the
  // per-running-metre price), so costing must NOT gross such rows up by the PERCENT again.
  //
  // THIS FIELD GOVERNS THE PERCENT ONLY. The second multiplier of a norm's money — the article's
  // material.cutting_coefficient — applies to EVERY measured norm whatever the provenance, "marker"
  // included: it pays for усадка, обход пороков, сращивание и оттеночные полосы, which a marker
  // cannot contain because it is measured on a clean lay of nominal width. `optional` is
  // load-bearing like material_id: a stale client omits the field on the full-replace recipe
  // write and the store PRESERVES the stored provenance triple; a present value is written as
  // sent ("" normalises to manual and clears the pcts).
  optional string consumption_source = 16;
  // Display decomposition of a marker-sourced norm's waste (кромка / межлекальные выпады), in
  // percent of the piece area. NEVER multiplied into any cost — the marker length already pays
  // for both. NULL/unset on manual rows; carried/cleared together with consumption_source.
  google.type.Decimal waste_selvedge_pct = 17;
  google.type.Decimal waste_cut_pct = 18;
  // Ф6.8а. ШТАМП НОРМЫ: из какой раскладки этот расход применён. Пусто/0 = применён не из
  // раскладки (руками, оценкой) или до Ф6.
  //
  // `optional` load-bearing РОВНО как у material_id (:15), и по той же причине с той же ценой:
  // рецепт пишется ПОЛНОЙ ЗАМЕНОЙ строк, поэтому колонка, которую клиент не эхонул, стирается
  // молча. ОТСУТСТВИЕ = «сохрани что было» — независимо от того, прислан ли consumption_source
  // (клиент, знающий про marker, но не знающий про штамп, — это ровно сегодняшний клиент, и он
  // не должен обнулять аудит). ЯВНЫЙ 0 = снять штамп.
  //
  // FK на tech_card_marker сознательно НЕТ (0291): раскладки удаляют, и RESTRICT уронил бы удаление,
  // а SET NULL стёр бы штамп, ради которого он и заведён. Висящий id читается как «раскладка
  // удалена» — это и есть правда.
  optional int64 norm_marker_id = 19;
  // Ф6.8б. OUTPUT-ONLY, СЕРВЕРНЫЙ ШТАМП: когда норма применена из раскладки. Клиент шлёт что
  // угодно — сервер игнорирует.
  //
  // Ставится ТОЛЬКО когда пара (источник, раскладка) МЕНЯЕТСЯ, а не на каждой записи рецепта.
  // Иначе правка любого соседнего поля обновляла бы отметку и ГАСИЛА бы индикатор расхождения —
  // то есть сама починка расхождения выглядела бы как его отсутствие. Сохранение рецепта без
  // смены раскладки переносит прежнюю отметку как есть.
  //
  // Клиент показывает расхождение, когда TechCardMarkerSummary.updated_at той же раскладки ПОЗЖЕ
  // этой отметки: «норма применена <norm_applied_at> из раскладки #N; раскладка изменена <...>».
  google.protobuf.Timestamp norm_applied_at = 20;
}

// TechCardDetail is one aspect of the construction description (Sheet «Титул», lower block)
// with optional reference images. key is freeform (silhouette/collar/fastening/pockets/
// sleeve_cuff/topstitching/extra_details … or a custom aspect).
message TechCardDetail {
  string key = 1;
  string text = 2;
  repeated int32 media_ids = 3; // FK media(id)
}

// TechCardBomItem is one bill-of-materials line — a catalog article (Sheet «Спецификация»).
// The per-colourway colour, placement and consumption live on TechCardColorwayUsage; the
// BOM line is now a pure material-article catalog entry.
message TechCardBomItem {
  TechCardBomSection section = 1; // required
  string name = 2; // required
  string supplier = 4;
  string supplier_ref = 5; // артикул поставщика
  string color = 6; // base/default reference colour (the per-colourway colour is on the usage)
  string composition = 7; // состав (the frontend may store structured-JSON here, like product style)
  string spec = 8; // ширина / плотность
  string unit = 10; // ед. (м/см/г for measured materials; pcs for countable trims)
  google.type.Decimal unit_price = 12; // цена/ед.
  string currency = 13; // ISO 4217 for unit_price
  string comment = 14;
  // fabric data for the cutter / marker (Phase 3.5c)
  // FULL roll width in cm, кромка INCLUDED — same correction as Material.fabric_width: this is what
  // effective_fabric_width_cm below resolves to, and that field's own text already derives the
  // usable cutting width as effective − 2 × selvedge.
  google.type.Decimal fabric_width = 17;
  google.type.Decimal fabric_weight_gsm = 18; // weight, g/m²
  // Nap / layout. OPTIONAL for presence, on the same reasoning as purpose/is_sample above: the
  // card is saved WHOLE, the admin is an SPA, and a tab holding an older bundle does not send this
  // field at all — a proto3 enum's zero value is UNKNOWN, so «absent» and «clear it» were the same
  // bytes and a stale tab would have wiped the направление off every line of the card. Silently:
  // the field is not in the signature digest, and NULL is indistinguishable from «ещё не задали».
  // Since Ф1 that erasure also un-saves every раскладка on the card, so absence now means «do not
  // touch» and only an explicitly-sent UNKNOWN clears the column.
  optional TechCardFabricDirection fabric_direction = 19;
  // wastage_percent — ПРОЦЕНТ РАСКРОЯ СЛОТА, and since W3 it means ONE thing: THE GEOMETRY OF THE
  // LAY — inter-piece waste + lay ends, over a netto base (typically 15–30%). Кромка is NOT in it:
  // it is already subtracted by dividing the piece area by the CUTTING width. Усадка, обход пороков,
  // сращивание и оттеночные полосы are NOT in it either — those are the roll's reality and are paid
  // for exactly once, by material.cutting_coefficient, which multiplies the same money independently
  // of this percent and of the norm's provenance. Before W3 this field was documented as covering
  // усадка/пороки too; that overlap billed them twice wherever both dials were set.
  //
  // Folded into the usage line totals (line_total / size_run_total) and every costing rollup —
  // EXCEPT on a marker-sourced norm, whose measured length already contains this geometry.
  google.type.Decimal wastage_percent = 20;
  // material_id optionally links this line to a catalog Material (task 10). The line keeps its
  // own snapshot fields regardless; 0 means unlinked (free-text / legacy).
  int64 material_id = 23;
  // id is the stable server-assigned PK (read-only). line_key is the client-generated ULID assigned
  // when the line is first created in the UI, round-tripped on every save so the server keyed-
  // reconciles by it (S2/S3) and keeps id stable — which is what lets operations/pieces/recipes hold
  // a real FK instead of a fragile positional index.
  int64 id = 24;
  string line_key = 25;
  // material_snapshot was REMOVED (production-costing Phase 2): the JSON snapshot was written on
  // every save but never read back by any consumer — the line's own columns carry the identity and
  // the admin client stripped the field from payloads. The column is dropped by a follow-up
  // contract migration once no serving binary references it (expand/contract).
  reserved 26;
  reserved "material_snapshot";
  // Stored price provenance (production-costing Phase 3, plan 11). READ-ONLY — the server stamps
  // both on write and ignores anything a client sends here. price_source is 'manual' (the operator
  // typed/edited unit_price through a card save), 'catalog' (the reprice action pulled it from the
  // material catalog), or '' for a pre-provenance row whose origin is honestly unknown.
  string price_source = 27;
  google.protobuf.Timestamp price_snapshot_at = 28; // when price_source stamped unit_price
  // READ-ONLY width enrichment (0259, Ф9.1) — ignored on write, filled by the single-card read.
  // effective_fabric_width_cm = COALESCE(this line's fabric_width, linked article's width): the
  // width the раскладка should prefill instead of a hardcoded default. selvedge_cm is the linked
  // article's кромка per edge; usable cutting width = effective − 2×selvedge. Both unset when the
  // line is unlinked and carries no width of its own.
  google.type.Decimal effective_fabric_width_cm = 29;
  google.type.Decimal selvedge_cm = 30;
  // НАЗНАЧЕНИЕ (0265) — see TechCardBomPurpose. Accepted only on a ROLL-GOODS line (fabric, lining,
  // interlining, insulation): those are the four families cloth is measured and laid out by, and a
  // purpose on a thread or a button would be data no screen ever shows and the later pattern-binding
  // work would have to un-pick. UNSET is legal everywhere and is what an unsorted line carries.
  //
  // OPTIONAL, и это несущее. Админка — SPA на Vercel, вкладки живут через деплои, а карточка
  // сохраняется целиком. Без явного присутствия старый бандл, который про эти поля не знает,
  // прислал бы proto3-дефолты — UNSET и false, — и сохранение стёрло бы назначение у ВСЕХ строк
  // карточки. Стирание было бы вдобавок бесследным: этих полей нет в дайджесте подписи, а NULL
  // неотличим от «ещё не разложили». Отсутствие поля означает «не трогай», а не «очисти».
  optional TechCardBomPurpose purpose = 31;
  // Free-text explanation, accepted ONLY when purpose is OTHER (rejected otherwise, and the DB
  // agrees via chk_bom_item_purpose_note). Optional even then: "другое" without an explanation is a
  // real answer, and demanding one just farms junk text.
  // Optional по той же причине, что и purpose — отсутствие означает «не трогай».
  optional string purpose_note = 32;
  // Семпловая: this line is the yardage the SAMPLE is sewn from. A flag, not a ninth purpose — a
  // sample is assembled from a sample MAIN plus a sample LINING, and as a purpose value both would
  // collapse into one bucket and lose the role that makes them useful.
  // Optional по той же причине: голый bool от старого бандла приходит как false и снял бы признак
  // со всех строк карточки разом.
  optional bool is_sample = 33;
  // READ-ONLY (Ф5а.3): the vocabulary normalisation of this line's `unit`. Ignored on write — the
  // stored value stays the free-text `unit`, deliberately: that column is inside the SIGNED MATERIALS
  // digest, so respelling «м» → "m" in storage would stale the MATERIALS sign-off of every card that
  // spells a unit non-canonically, for a change that alters nothing the card BUYS. Comparison against
  // the article's unit is normalised in the server instead, which costs no sign-off.
  // UNKNOWN = the free text does not map to a known unit; it is NOT "no unit".
  MaterialUnit unit_code = 34;
  // ЧТО ЭТО ЗА ПОЗИЦИЯ (0276) — see TechCardBomKind. The mirror of `purpose` above: accepted only on
  // a line that is NEITHER roll goods NOR a label (hardware, thread, packaging, trim, decoration,
  // other), and only in the kind's own home section — `zipper` on a thread line is refused with a
  // field-tagged error, not stored. UNSET is legal everywhere and is what an unclassified line
  // carries.
  //
  // OPTIONAL for the same load-bearing reason as `purpose`: the admin is an SPA, tabs survive
  // deploys, and the card is saved WHOLE. A bare proto3 enum from a bundle that predates this field
  // arrives as UNSET and would wipe the classification off EVERY line of the card — silently, since
  // `kind` is deliberately outside the signed MATERIALS digest and NULL is indistinguishable from
  // "not classified yet". Absence means «не трогай»; an explicitly sent UNSET still clears.
  optional TechCardBomKind kind = 35;
  // Free-text explanation, accepted ONLY when kind is OTHER (rejected otherwise, and the DB agrees
  // via chk_bom_item_kind_note). Optional even then — «другое» with no note is a real answer.
  //
  // It travels as ONE UNIT with `kind`: the DB couples the two columns, so a save that rewrote one
  // and left the other alone could hand MySQL a row it must refuse. Sending either field means both
  // are being written; sending neither means «не трогай» both.
  optional string kind_note = 36;
  // ПРОВЕНАНС ПРОЦЕНТА РАСКРОЯ (0296, T7 волна 2): откуда взялось число в wastage_percent.
  // "manual" (или "") — введено руками; "lays" — применено из предложения «медиана факта настилов
  // над netto» (GetBomWastageSuggestion). Тот же приём, что consumption_source на юзедже.
  //
  // `optional` — несущее, тот же verbatim-протокол, что у purpose/kind выше: карточка сохраняется
  // ПОЛНОЙ ЗАМЕНОЙ строк, и вкладка со старым бандлом этих полей не шлёт вовсе — отсутствие пары
  // означает «сохрани что было», иначе первый же сейв старого клиента стёр бы аудит у всех строк.
  // ВАЖНО: сервер сам сбрасывает провенанс в 'manual', когда ЗНАЧЕНИЕ wastage_percent изменилось,
  // а провенанс при этом не прислан, — правка числа руками через старый бандл не должна донашивать
  // бейдж «по фактам» (та же логика, что у price_source при смене цены).
  optional string wastage_source = 37;
  // Штамп применения: по скольким настилам стояла медиана в момент применения. Шлётся ВМЕСТЕ с
  // wastage_source='lays' (клиент эхонит lay_count из ответа предложения); на 'manual' обязан
  // отсутствовать/обнуляться. Пара живёт как одно целое — см. kind/kind_note.
  optional int32 wastage_lay_count = 38;
  // OUTPUT-ONLY, СЕРВЕРНЫЙ ШТАМП: когда предложение применено. Клиент шлёт что угодно — сервер
  // игнорирует; ставится когда тройка (source='lays', lay_count, wastage_percent) МЕНЯЕТСЯ, и
  // гасится вместе со сбросом в 'manual' — дисциплина norm_applied_at (:20 юзеджа).
  google.protobuf.Timestamp wastage_applied_at = 39;
  // ЗАМОРОЖЕННЫЙ КОЭФФИЦИЕНТ РАСКРОЯ ЭТОЙ СТРОКИ (W3) — OUTPUT-ONLY, на записи игнорируется.
  //
  // Коэффициент — свойство АРТИКУЛА (material.cutting_coefficient), а не строки BOM, и в обычном
  // чтении карточки он и читается с артикула. Здесь он едет вместе со строкой ровно ради ОДНОГО
  // читателя: РЕЛИЗНОГО СНАПШОТА. Блоб релиза замораживает спецификацию и нормы, но каталог
  // материалов в него не входит — а с W3 коэффициент ВХОДИТ В ДЕНЬГИ нормы. Без этого поля
  // пер-размерный пересчёт из блоба считал бы БЕЗ коэффициента, получал бы полное на вид число
  // ниже замороженного скаляра и молча предпочитался ему.
  //
  // ТРИ СОСТОЯНИЯ, А НЕ ДВА, И РАЗНИЦА НЕСУЩАЯ:
  //   * поле ОТСУТСТВУЕТ (null) — снапшот снят ДО этой заморозки: коэффициент НЕИЗВЕСТЕН. Читатель
  //     обязан ОТКАЗАТЬСЯ считать такую рулонную строку и увести расчёт в фолбэк на замороженный
  //     скаляр — ровно так же, как он уже поступает с непроставленной ценой пина. Молчаливое
  //     занижение недопустимо, честный отказ допустим;
  //   * поле ЗАДАНО и равно 1 — известно, что надбавки НЕТ. Это УТВЕРЖДЕНИЕ, а не пустота;
  //   * поле ЗАДАНО и больше 1 — величина, которой строка грossилась в момент релиза.
  //
  // «Нет коэффициента» и «не знаем коэффициента» поэтому НИКОГДА не одно и то же значение: на этой
  // разнице и стоит отказ выше, и свести их к одному null значило бы вернуть тихое занижение.
  google.type.Decimal cutting_coefficient = 40;
  // → TechCardColorwayUsage: placement, consumption, quantity, colorway_colors, line_total,
  //   size_consumptions, size_run_total all moved onto the per-colourway usage.
  reserved 3, 9, 11, 15, 16, 21, 22;
}

// Material is a catalog material — shared nomenclature a tech-card BOM line can optionally link
// to. Descriptive fields only; price lives in the append-only MaterialPrice history.
// MaterialClass is the class-table-inheritance discriminant (S15): it selects which typed
// attribute set a material carries. Mirrors entity.MaterialClass and the DB CHECK chk_material_class.
enum MaterialClass {
  MATERIAL_CLASS_UNKNOWN = 0; // defaults to OTHER on write
  MATERIAL_CLASS_FABRIC = 1;
  MATERIAL_CLASS_HARDWARE = 2;
  MATERIAL_CLASS_THREAD = 3;
  MATERIAL_CLASS_PACKAGING = 4;
  MATERIAL_CLASS_OTHER = 5;
}

// MaterialPurpose (#40) marks whether a catalog material is used for samples, production, or both,
// so the admin can mark and filter materials. Mirrors entity.ValidMaterialPurposes and the DB CHECK
// chk_material_purpose. UNKNOWN defaults to BOTH on write.
enum MaterialPurpose {
  MATERIAL_PURPOSE_UNKNOWN = 0; // defaults to BOTH on write
  MATERIAL_PURPOSE_SAMPLE = 1;
  MATERIAL_PURPOSE_PRODUCTION = 2;
  MATERIAL_PURPOSE_BOTH = 3;
}

// MaterialFabricAttrs are the typed attributes of a fabric-class material (material_fabric_attr).
message MaterialFabricAttrs {
  google.type.Decimal width_cm = 1; // FULL roll width, cm (usable = width − 2×selvedge)
  google.type.Decimal weight_gsm = 2;
  string fabric_direction = 3; // lengthwise|crosswise|any (fixture-validated)
  google.type.Decimal shrinkage_pct = 4;
  google.type.Decimal roll_length_m = 5;
  // Кромка per EDGE, cm — the unusable strip of the roll (0259). Unset/0 = none; the nesting
  // width and the selvedge wastage component both derive from it.
  google.type.Decimal selvedge_cm = 6;
}

// MaterialHardwareAttrs are the typed attributes of a hardware-class material (material_hardware_attr).
message MaterialHardwareAttrs {
  google.type.Decimal diameter_mm = 1;
  string dimensions = 2;
  string finish = 3;
  string base_material = 4;
  google.type.Decimal weight_g = 5;
}

// MaterialThreadAttrs are the typed attributes of a thread-class material (material_thread_attr).
// Fibre composition is not here — it lives in the structural material_composition (S17).
message MaterialThreadAttrs {
  string ticket_tex = 1;
  google.type.Decimal length_per_cone_m = 2;
  string needle_reco = 3;
}

// MaterialPackagingAttrs are the typed attributes of a packaging-class material (material_packaging_attr).
message MaterialPackagingAttrs {
  string substrate = 1;
  string dimensions = 2;
  google.type.Decimal gsm = 3;
  string print_method = 4;
}

// MaterialUnit is the closed vocabulary a material quantity is measured in (Ф5а.3), mirroring
// entity.MaterialUnit. Before it, every unit was free text and every consumer compared raw strings:
// the production material plan carried a private metre synonym set (m/м/meter/meters/metre/metres)
// and degraded into a caveat on any other mismatch, so a slot spelled «м» against an article spelled
// "m" counted as two different units — the quantity kept the slot's meaning while being compared
// against the article's stock, and the pinned-article costing path refused to price the line.
//
// READ-ONLY on the wire. The stored value stays the free-text `unit` string (which is what a write
// sets); unit_code is the server's normalisation of it, so a value the vocabulary does not know is
// never guessed — it arrives as MATERIAL_UNIT_UNKNOWN with the raw string intact beside it, and the
// set of rows reporting UNKNOWN is precisely the list of units that still need a human. A client
// must therefore never treat UNKNOWN as "no unit" or as "clear the unit".
enum MaterialUnit {
  MATERIAL_UNIT_UNKNOWN = 0; // free-text value the vocabulary does not know (see `unit`)
  MATERIAL_UNIT_M = 1; // running metre — how roll goods are bought and cut
  MATERIAL_UNIT_CM = 2;
  MATERIAL_UNIT_MM = 3;
  MATERIAL_UNIT_M2 = 4; // square metre (sheet goods)
  MATERIAL_UNIT_G = 5;
  MATERIAL_UNIT_KG = 6; // fabric bought by weight — the material plan converts metres to kg
  MATERIAL_UNIT_PCS = 7; // countable trim
  MATERIAL_UNIT_PAIR = 8;
  MATERIAL_UNIT_SET = 9;
  MATERIAL_UNIT_CONE = 10; // thread cone (MaterialThreadAttrs.length_per_cone_m metres each)
  MATERIAL_UNIT_ROLL = 11;
}

message Material {
  int64 id = 1;
  string name = 2; // required
  TechCardBomSection section = 3; // required; same enum as a BOM line
  string supplier = 4;
  string supplier_ref = 5;
  string composition = 6;
  string spec = 7; // ширина / плотность
  // Free text, stored EXACTLY as sent — the server never respells it, so a client that writes "pc"
  // reads back "pc". unit_code below is the server's read-only normalisation of this string, and it
  // is what comparisons run on; migration 0271 collapsed the legacy catalogue spellings once, but
  // that was a cleanup, not a standing write rule.
  string unit = 8;
  // FULL roll width in cm, кромка INCLUDED — despite what this comment said until Ф5а.4. Nothing has
  // ever subtracted the selvedge from it (0259 says so explicitly: the flat copy was labelled
  // "usable" in 0095 but no consumer ever treated it as such), and both EffectiveFabricWidthCm and
  // the metres→kg conversion depend on it being the full width: the selvedge is bought, it weighs,
  // and billing by the cutting width understates the invoiced weight by 2–4% every time. The USABLE
  // cutting width is this minus 2 × MaterialFabricAttrs.selvedge_cm.
  google.type.Decimal fabric_width = 9;
  google.type.Decimal fabric_weight_gsm = 10; // weight, g/m²
  bool archived = 11;
  // latest_price is the current (latest-effective) price, if any (read-only; set via
  // AddMaterialPrice). Absent when the material has no price history yet.
  MaterialPrice latest_price = 12;
  // Warehouse catalog fields (new-flow NF-02).
  string code = 13; // internal article code (ours), unique among non-archived materials
  string color = 14; // colour of the purchased article
  string pantone = 15;
  google.type.Decimal min_stock = 16; // low-stock alert threshold, in `unit`
  string notes = 17;
  // lock_version is the optimistic-lock counter (S25, read-only). Echo it back in
  // UpdateMaterialRequest.expected_lock_version; a stale value is rejected (Aborted).
  int32 lock_version = 18;
  // CTI typing (S15): material_class selects which typed attribute set applies. Exactly one of the
  // `attributes` oneof is populated for the four typed classes; other_attrs (a JSON object) is the
  // escape-hatch used only when material_class = MATERIAL_CLASS_OTHER.
  MaterialClass material_class = 19;
  oneof attributes {
    MaterialFabricAttrs fabric_attrs = 20;
    MaterialHardwareAttrs hardware_attrs = 21;
    MaterialThreadAttrs thread_attrs = 22;
    MaterialPackagingAttrs packaging_attrs = 23;
  }
  string other_attrs = 24; // JSON object; set only when material_class = MATERIAL_CLASS_OTHER
  // Structural fibre composition (S17): fiber_code + percent, summing to 100 when present. Replaces
  // the free-text `composition` string (which stays legacy plain text). On write, only fiber_code +
  // percent are read (name is resolved server-side from the fibre dictionary). Empty = unset. A
  // shell-fabric material's composition is what a style's derived composition_entries is built from.
  repeated CompositionEntry composition_entries = 25;
  // Catalog image (#39): image_id is the write-side media reference (FK media(id); 0 = unset); image
  // is the resolved MediaFull on read (null when unset). Mirrors Model.thumbnail_id / Model.thumbnail.
  int32 image_id = 26;
  MediaFull image = 27;
  // purpose (#40) marks whether the material is used for samples, production, or both. Defaults to
  // BOTH on write when UNKNOWN, so the admin can mark and filter materials.
  MaterialPurpose purpose = 28;
  // Procurement quick wins (Phase 9, plan 13 §1 — the PO entity was cut): supplier_id links to the
  // supplier CATALOG (the free-text `supplier` field stays legacy), lead_time_days is the typical
  // order-to-door time. 0 = unset for both.
  int32 supplier_id = 29;
  int32 lead_time_days = 30;
  // cutting_coefficient (Ф5а.2) is THE one visible, editable dial per article, replacing eight named
  // losses nobody can measure separately. It covers, together: усадка, обход пороков, сращивание,
  // оттеночные полосы — the roll-level reality a marker cannot contain, because a marker is measured
  // on a clean lay of a nominal width. A MULTIPLIER, not a percent (1.03 = +3%); accepted range
  // [1, 3].
  //
  // Unset means nobody has set one and the requirement path multiplies by nothing — an article
  // without a coefficient plans exactly as it did before this field existed. There is deliberately
  // ONE default and no per-«класс ткани» taxonomy to pick it from; the value ranges (полотно ~3%,
  // трикотаж ~6%, клетка/полоска +10–20%) and what the coefficient covers belong in the field's hint
  // text, so nobody starts adding a column per loss again a year from now.
  //
  // WRITE SEMANTICS — three states, not two, because "the client did not send the field" and "the
  // operator cleared it" must not be the same request (same rule as TechCardBomItem.purpose /
  // is_sample):
  //   * field ABSENT (null)        → LEAVE AS IS. A stale admin tab, or any bundle from before this
  //                                  field shipped, sends nothing and must not erase a coefficient an
  //                                  operator set — silently, with no digest and no audit trail.
  //   * field PRESENT, value ""    → CLEAR it (store NULL). This is how the UI unsets the dial.
  //   * field PRESENT with a value → set it.
  //
  // SCOPE (W3) — THIS DIAL IS IN THE COSTING CHAIN. It grosses up the money of a recipe norm
  // (TechCardColorwayUsage.line_total / size_run_total, the colourway unit cost, the run's planned
  // unit cost, the style cost estimate) as well as the material PLAN's requirement. Planned COGS
  // and product.cost_price therefore CONTAIN the coefficient wherever one is set. It used to be a
  // demand-side dial only, and the understatement that followed was the reason for the change.
  //
  // TWO MULTIPLIERS, TWO BASES, AND THEY ARE NOT INTERCHANGEABLE:
  //
  //     расход = ГЕОМЕТРИЯ(набор деталей, ширина, настил) × РЕАЛЬНОСТЬ_РУЛОНА(артикул)
  //
  //   * ГЕОМЕТРИЯ = tech_card_bom_item.wastage_percent. Pays for the LAY and nothing else:
  //     inter-piece waste + lay ends. Its base is netto, where none of that exists yet, so the
  //     number is large (15–30%). A marker-sourced norm never takes it — the measured length
  //     already contains it.
  //   * РЕАЛЬНОСТЬ РУЛОНА = this coefficient. Pays for what NO marker can contain, because a
  //     marker is measured on a clean lay of nominal width: усадка, обход пороков, сращивание,
  //     оттеночные полосы. Its base is the marker length, where the waste already is, so the
  //     number is small (2–6%). It applies to EVERY measured norm regardless of provenance —
  //     marker, manual and dxf alike.
  //
  // Substituting one for the other is a silent defect, not a typo: the coefficient in the percent's
  // place understates by every inter-piece drop, linearly; the percent in the coefficient's place
  // pays for those drops twice.
  //
  // WHERE IT DELIBERATELY DOES NOT APPLY: countable trims (4 buttons stay 4 buttons) and
  // non-roll-goods sections (a coefficient on thread is meaningless).
  //
  // A LAY-BASED REQUIREMENT DOES TAKE IT — after the geometry, never inside it. A настил is a PLAN
  // of what will be spread; shrinkage, flaw avoidance and splicing happen to the CLOTH whatever the
  // requirement was computed from. What must stay untouched is the lay GEOMETRY itself
  // (dto.LayPlannedGeometryOf) and both calibrations: факт ÷ план-геометрия is an honest measurement
  // of this coefficient exactly because the coefficient is not in that denominator — put it there
  // and the calibration starts confirming itself.
  google.type.Decimal cutting_coefficient = 31;
  // READ-ONLY (Ф5а.3): the vocabulary normalisation of `unit`. Ignored on write — set `unit`.
  // UNKNOWN = the free text does not map to any known unit, and must not be read as "no unit".
  MaterialUnit unit_code = 32;
  // fabric_thickness_mm (Ф4.8) — толщина полотна В ОДИН СЛОЙ, in MILLIMETRES. The article-side half
  // of the предел стопки: stack_height_cm = Σ plies × fabric_thickness_mm / 10, checked against the
  // workshop's WorkshopSettings.max_stack_height_cm. Ranges are a hint, not a taxonomy: шифон
  // 0.1-0.2, поплин ~0.3, драп 1.5-2.5. Accepted band (0, 50].
  //
  // ABSENT MEANS «НЕ ЗАМЕРЕНО», AND THAT IS NOT ZERO. A нулевая толщина would make every lay
  // 0 cm tall and therefore "fits" — a confident verdict built on nothing, which is precisely the
  // failure «нет толщины — нет проверки, не догадка» forbids. A consumer with no thickness must
  // report UNKNOWN and withhold the height entirely, prompting «толщина ткани не задана на артикуле
  // — замерьте, и высота стопки начнёт проверяться». There is deliberately no default «по классу
  // ткани»: that taxonomy does not exist and inventing one to feed a guess is the disease this
  // avoids (same argument as cutting_coefficient above).
  //
  // WRITE SEMANTICS — three states, verbatim the same as cutting_coefficient, its neighbour on the
  // article, and for the same reason (a stale admin tab, or any bundle from the window between the
  // backend and client deploys, sends nothing and must not erase a measurement somebody took with
  // calipers — silently, on a catalogue with neither a signed digest nor an edit journal):
  //   * field ABSENT (null)        → LEAVE AS IS.
  //   * field PRESENT, value ""    → CLEAR it (store NULL).
  //   * field PRESENT with a value → set it.
  google.type.Decimal fabric_thickness_mm = 33;
}

// MaterialPrice is one point in a material's append-only price history. Prices are in the
// purchase currency (fold to base via costing FX rates).
message MaterialPrice {
  int64 material_id = 1;
  google.type.Decimal price = 2;
  string currency = 3; // ISO 4217
  google.protobuf.Timestamp valid_from = 4; // the price applies from this date
  string source = 5; // manual | production_run
  string note = 6;
}

// TechCardReleaseMeta is the header of an immutable release snapshot (task 11) without the
// JSON blob — the frozen spec + planned unit cost captured when a card entered `released`.
// The full snapshot (a proto-JSON contract TechCard) is fetched via GetTechCardRelease.
message TechCardReleaseMeta {
  int32 id = 1;
  int32 tech_card_id = 2;
  reserved 3;
  reserved "version";
  int32 release_number = 8; // user-facing "Rev.N" the factory reads (Q1): auto MAX+1 per card
  string released_by = 4; // acting admin username at release time
  google.type.Decimal unit_cost = 5; // base-currency planned unit cost, if foldable
  string currency = 6; // currency of unit_cost
  google.protobuf.Timestamp created_at = 7;
}

// TechCardDevExpenseInsert is the writable payload for one development (R&D) cost row (task 14):
// a one-off "spent Amount on Kind" record. amount_base is computed server-side (via costing FX);
// clients do not send it.
message TechCardDevExpenseInsert {
  int32 tech_card_id = 1;
  string kind = 2; // sample|materials|labour|outsourcing|other
  string description = 3;
  google.type.Decimal amount = 4;
  string currency = 5; // ISO 4217
  int32 fitting_id = 6; // 0 = not tied to a fitting round
  google.protobuf.Timestamp incurred_at = 7; // date the cost was incurred (optional)
  int32 sample_id = 8; // 0 = not tied to a sample (new-flow NF-04)
}

// TechCardDevExpense is one stored development-cost journal row. amount_base folds amount to base
// (EUR) via costing FX (unset when the currency has no rate).
message TechCardDevExpense {
  int32 id = 1;
  int32 tech_card_id = 2;
  string kind = 3;
  string description = 4;
  google.type.Decimal amount = 5;
  string currency = 6;
  google.type.Decimal amount_base = 7; // base currency (EUR); unset if not foldable
  int32 fitting_id = 8; // 0 = none
  google.protobuf.Timestamp incurred_at = 9;
  google.protobuf.Timestamp created_at = 10;
  int32 sample_id = 11; // 0 = none (new-flow NF-04)
}

// TechCardDevCostByKind is the base-currency development spend for one kind.
message TechCardDevCostByKind {
  string kind = 1;
  google.type.Decimal amount_base = 2;
}

// TechCardDevCostByRound is a style's development spend attributed to one fitting round (Q8 — the
// attribution S20 asked to fix). round_number 0 collects expenses tied to no fitting round.
message TechCardDevCostByRound {
  int32 round_number = 1; // fitting round; 0 = not attributed to a round
  google.type.Decimal amount_base = 2; // Σ amount_base for the round (EUR)
  int32 expense_count = 3;
}

// TechCardDevCostSummary is the computed roll-up of a style's development spend (output-only).
message TechCardDevCostSummary {
  google.type.Decimal total_base = 1; // Σ amount_base over foldable rows (EUR)
  bool has_unconverted = 2; // some row lacked amount_base (missing FX rate) → total is partial
  repeated TechCardDevCostByKind by_kind = 3; // Σ per kind
  // Amortized informational figure: production unit_cost + total_base / order_qty — how much
  // development adds to each unit over the quantity this style is actually planned to produce.
  // Unset when order_qty is 0 or the production unit cost is unavailable. NOT part of cost_price
  // (development is a period cost).
  google.type.Decimal unit_cost_with_dev = 4;
  // order_qty is Σ planned_qty over the style's NON-CANCELLED PRODUCTION RUNS — the batches somebody
  // committed to make. It is NOT the tech card's size_quantities: that field is the «типовой тираж
  // для калькуляции», an illustrative mix nobody produces, and while it was the denominator here the
  // R&D-per-unit of a style moved whenever someone edited a quantity that was never going to exist.
  // The field name is kept for wire compatibility; read it as «запланировано по прогонам».
  // 0 = no production run planned yet, and then unit_cost_with_dev is unset — R&D spent before the
  // first batch is planned has nothing to be spread over, and no substitute batch is invented for it.
  int32 order_qty = 5;
  // Q8 rollup (read projection, built alongside — never seeded into cost_price):
  repeated TechCardDevCostByRound by_round = 6; // spend attributed to each fitting round
  int32 rounds_to_approval = 7; // highest fitting round reached at approval; 0 = not approved yet
  google.protobuf.Timestamp first_expense_at = 8; // earliest incurred/created dev expense; unset if none
  google.protobuf.Timestamp approved_at = 9; // date of the approving fitting; unset if not approved
  int32 days_to_approval = 10; // approved_at − first_expense_at in days; 0 when either is unknown
}

// TechCardBomSizeConsumption is the per-size consumption (норма расхода) of one BOM
// material — different sizes consume different amounts of fabric.
message TechCardBomSizeConsumption {
  int32 size_id = 1; // FK size(id); must be one of TechCardInsert.size_ids
  google.type.Decimal consumption = 2; // per-garment rate at this size, in the line's `unit`
}

// TechCardFabricDirection is the cutting layout a fabric requires.
enum TechCardFabricDirection {
  TECH_CARD_FABRIC_DIRECTION_UNKNOWN = 0;
  TECH_CARD_FABRIC_DIRECTION_ANY = 1; // all-way (no nap)
  TECH_CARD_FABRIC_DIRECTION_ONE_WAY = 2; // napped / directional, one-way marker
  TECH_CARD_FABRIC_DIRECTION_TWO_WAY = 3; // two-way
}

// TechCardPieceCutSymmetry — КАК деталь кроится (миграция 0275). Не количество: количество целиком
// живёт в pieces_per_garment (0266 свернула туда зеркальное удвоение), и ни одно значение отсюда
// ничего не умножает. Вернуть множитель нельзя: тех-пак печатает pieces_per_garment и НИКОГДА total,
// поэтому удвоение «где-то ещё» снова напечатает фабрике «1» у детали, которую кроят парой.
//
// UNKNOWN — это ОТВЕТ «никто не спрашивал», а не «обычная деталь». Различать обязательно:
// неразмеченная парная деталь при полукомплекте лекал даёт 44 левых полочки и ноль правых, и
// единственное, что от этого спасает, — видимое «не размечено».
//
// FOLD не бывает MIRRORED: крой по сгибу — это объединение половины лекала с её отражением, значит
// контур симметричен сам себе, а отражение симметричного контура конгруэнтно ему. «Со сгибом и нужна
// дважды» (манжеты) = FOLD + pieces_per_garment = 2.
enum TechCardPieceCutSymmetry {
  TECH_CARD_PIECE_CUT_SYMMETRY_UNKNOWN = 0; // не размечено (см. выше — это не «обычная»)
  TECH_CARD_PIECE_CUT_SYMMETRY_IDENTICAL = 1; // n конгруэнтных копий
  TECH_CARD_PIECE_CUT_SYMMETRY_MIRRORED = 2; // n делится на две зеркальные половины; n обязано быть чётным
  TECH_CARD_PIECE_CUT_SYMMETRY_FOLD = 3; // крой по сгибу
}

// TechCardPieceFusingMode — КАК ИМЕННО дублируется деталь (миграция 0304). Осмысленно только у
// детали с поднятой галкой `fused`: галка отвечает «дублируется ли», это поле — «где именно лежит
// клеевая».
//
// ЗАЧЕМ РАЗЛИЧАТЬ. До 0304 ответ был один на всех, и весь код читал его единственным возможным
// способом — «клеевая выкроена по той же лекале»: кат-лист ставит деталь в пару к interlining-слоту
// целиком, тех-пак печатает «fused: yes», оценка расхода приписала бы клеевому слоту ПОЛНУЮ площадь
// контура. В цеху чаще дублируется только край. Разница денежная и в разы: у полочки площадью
// 4200 см² периметр ~260 см, полоса 25 мм — это 650 см², в 6.5 раза меньше.
//
// UNKNOWN — «НЕ РАЗМЕЧЕНО», а не «целиком», ровно как у TechCardPieceCutSymmetry рядом. Читатель,
// которому нужно число сейчас, разворачивает его в FULL сам (entity.PieceFusingModeOrFull) — это
// сохраняет поведение всего, что было до 0304, — но на ЭКРАНЕ неразмеченная деталь обязана
// оставаться видимо неразмеченной. Иначе вопрос «а как здесь на самом деле» перестанет быть
// заметен ровно в тот момент, когда на него впервые ответили за технолога.
//
// SEAM_ALLOWANCE И STRIP обе кладут полосу вдоль среза и различаются ТОЛЬКО источником её ширины:
// первая берёт эталон припуска карточки (иначе цеха, 0277), вторая — fusing_width_mm. Свести их в
// одно значение с обязательным числом значило бы вписывать припуск руками на каждой детали и ловить
// расхождение с эталоном, ради которого 0277 и заводилась.
enum TechCardPieceFusingMode {
  TECH_CARD_PIECE_FUSING_MODE_UNKNOWN = 0; // не размечено (см. выше — это не «целиком»)
  TECH_CARD_PIECE_FUSING_MODE_FULL = 1; // дублируется вся деталь: клеевая = тот же контур
  TECH_CARD_PIECE_FUSING_MODE_SEAM_ALLOWANCE = 2; // полоса по припуску; ширина = эталон припуска (0277)
  TECH_CARD_PIECE_FUSING_MODE_STRIP = 3; // полоса заданной ширины; fusing_width_mm обязателен
}

// TechCardSizeQuantity is the TYPICAL calculation batch for a size — «типовой тираж для
// калькуляции» (plan 13 §2). It amortises development cost and prefills a new run's grid; it is
// NOT a real production batch — the run's own plan lines are the batch (a run may be bigger,
// smaller, or split differently, and the UI must warn instead of silently multiplying).
message TechCardSizeQuantity {
  int32 size_id = 1; // FK size(id); must be one of size_ids
  int32 order_qty = 2; // typical calculation quantity, not an order
}

// TechCardSizePattern is a downloadable выкройка (cut pattern) file for one size of a
// tech card — the FINAL pattern for that size. A size can carry many patterns (pieces
// split across sheets). The file is a PDF or a DXF, uploaded via Admin.UploadPattern,
// which returns the url stored here; the binary lives in object storage, not the media
// library. The file type is carried by the url's extension (.pdf / .dxf), which the
// server derives from the uploaded bytes — there is no separate content-type field.
message TechCardSizePattern {
  // size_id is the size the sheet is FILED UNDER, and 0 means it is filed under none — the sheet is
  // graded and its sizes live in the DXF's block names, which only the client reads. A non-zero
  // value must be one of TechCardInsert.size_ids; 0 is accepted whatever the size range is,
  // INCLUDING an empty one, which is what lets a pattern reach a card before its grade is decided.
  // Nothing on the server reads this field to decide anything: coverage («есть ли выкройка на этот
  // размер») is answered by the pattern size index, not by this column.
  int32 size_id = 1;
  string url = 2; // CDN url of the uploaded PDF/DXF (required)
  string filename = 3; // original filename, for display / download
  int64 size_bytes = 4; // file size in bytes (0 = unknown)
  // version is the sheet's revision within its (style, size) — the "v3" the admin used to scrape out
  // of the filename. Send 0 and the server assigns MAX+1 for a url it has not seen on this card
  // before, and preserves the number for one it has; send a number to pin the factory's own.
  // On a keyed replacement (url change or size move) an echoed number EQUAL to the replaced row's
  // is treated as a round-trip echo and renumbered MAX+1 — a deliberate pin must differ from the
  // replaced row's number.
  int32 version = 5;
  // uploaded_at is when this PDF was first attached to the card. SERVER-OWNED (ignored on write):
  // patterns are a full-replace child, so the row is deleted and reinserted on every card save — the
  // server carries the original timestamp forward by matching the url rather than resetting it.
  google.protobuf.Timestamp uploaded_at = 6;
  // name is an optional operator-entered display name for the sheet ("перед", "рукав x2").
  // Explicit presence matters across the full-replace save. ABSENT — the server preserves the
  // previously stored name for the same (size_id, url) row, so a stale client that does not know
  // this field cannot wipe names it never saw. PRESENT — stored as sent, and an empty string
  // clears the name. NOTE for JSON clients — protojson cannot tell `"name": null` from an absent
  // field, so null also reads as "preserve"; to clear a name, send the empty string.
  optional string name = 7;

  // view_url / download_url are OUTPUT-ONLY (like uploaded_at): stable tokenized urls on
  // the backend's own origin (/api/p/{token}) that resolve to the file — the canonical
  // way to open a pattern once objects go private. Ignored on write; empty when the
  // stored url does not parse to a managed pattern object key.
  string view_url = 8;
  string download_url = 9;
  // line_key is the row's STABLE identity across saves and across FILE REPLACEMENT (the url is not —
  // replacing the sheet mints a new object url). Mint a ULID on first upload and round-trip it
  // unchanged; keep it when replacing the file and change only the url. ONE KEY NAMES ONE ROW: the
  // same sheet hung on two sizes is two rows and therefore two keys — reusing a key on two payload
  // rows is rejected. Empty = a legacy/stale client — the server then matches by (size_id, url)
  // exactly as before and assigns a key itself.
  string line_key = 10;
  // bom_line_key binds this sheet to the fabric BOM line it is cut from («один DXF = одна ткань»),
  // set at upload time. Explicit presence, same rules as `name`: ABSENT — the server preserves the
  // stored binding (a stale client cannot wipe it); PRESENT — stored as sent, empty string unbinds.
  // A non-empty value must name a fabric-section BOM line of this card, except when it round-trips
  // the row's stored value unchanged (the slot may have been deleted — the binding then reads as
  // «слот удалён» rather than blocking the save).
  //
  // LEGACY HALF since 0267 — resolve through fabric_purpose first, never read this alone. It cannot
  // be migrated away: a sheet bound to line L has no purpose to move to until L is sorted, and 0265
  // deliberately guessed a purpose for nobody.
  optional string bom_line_key = 11;
  // fabric_purpose binds the sheet to a НАЗНАЧЕНИЕ (0265) rather than to one BOM line, which is what
  // a выкройка actually is at card level: «это лекало основной ткани» is a CLASS. The concrete line
  // matters only where the ARTICLE does — the раскладка (width/selvedge come off the colourway's
  // pinned article) and the production run — and neither is stored on this row.
  //
  // Resolution, everywhere, is: fabric_purpose, else bom_line_key. Both coexist deliberately, so a
  // card nobody has sorted keeps working untouched and migrates itself when somebody sorts it.
  //
  // Explicit presence, same rules as `bom_line_key`: ABSENT — the server preserves the stored value;
  // PRESENT — stored as sent, UNSET clearing it. A value other than UNSET must be a назначение
  // carried by at least one roll-goods BOM line of this card, except when it round-trips the row's
  // stored value unchanged.
  optional TechCardBomPurpose fabric_purpose = 12;
}

// TechCardLabelType classifies a label / tag (Sheet «Этикетки и упаковка»).
enum TechCardLabelType {
  TECH_CARD_LABEL_TYPE_UNKNOWN = 0;
  TECH_CARD_LABEL_TYPE_MAIN = 1; // основная (бренд)
  TECH_CARD_LABEL_TYPE_SIZE = 2; // размерная
  TECH_CARD_LABEL_TYPE_CARE = 3; // состав / уход
  TECH_CARD_LABEL_TYPE_ORIGIN = 4; // страна производства
  TECH_CARD_LABEL_TYPE_FLAG = 5; // флаговая
  TECH_CARD_LABEL_TYPE_HANGTAG = 6; // навесной ярлык (хэнгтег)
  TECH_CARD_LABEL_TYPE_BARCODE = 7; // штрихкод / RFID
  TECH_CARD_LABEL_TYPE_SPECIAL = 8; // спецэтикетка
}

// TechCardMachineType is the SECOND AXIS of a sewing step: operation_type says WHAT is done
// («machine», «press», «fusing»…), this says ON WHAT. Holding both on one field is what made the
// old TechCardOperationType a mixture of a verb and a machine class — a step could not say
// «прострочить на двухигольной» without the two answers colliding in one enum member.
//
// 23 machines of the owner's park + LOCKSTITCH_DOUBLE_NEEDLE, which exists for one specific
// reason: without it the migration of the legacy `double_needle` operation type would have
// collapsed irreversibly into the plain lockstitch and lost the fact somebody recorded.
enum TechCardMachineType {
  TECH_CARD_MACHINE_TYPE_UNKNOWN = 0; // unset; REJECTED on write for a MACHINE step
  TECH_CARD_MACHINE_TYPE_LOCKSTITCH = 1; // прямострочная (301)
  TECH_CARD_MACHINE_TYPE_LOCKSTITCH_DOUBLE_NEEDLE = 2; // двухигольная прямострочная
  TECH_CARD_MACHINE_TYPE_OVERLOCK = 3; // оверлок (504/514/516)
  TECH_CARD_MACHINE_TYPE_COVERSTITCH = 4; // распошивальная / плоскошовная (602/605)
  TECH_CARD_MACHINE_TYPE_COVERLOCK = 5; // коверлок
  TECH_CARD_MACHINE_TYPE_CHAINSTITCH = 6; // цепной стежок (401)
  TECH_CARD_MACHINE_TYPE_BLINDSTITCH = 7; // потайной стежок (103)
  TECH_CARD_MACHINE_TYPE_ZIGZAG = 8; // зигзаг (304)
  TECH_CARD_MACHINE_TYPE_BARTACK = 9; // закрепочная
  TECH_CARD_MACHINE_TYPE_BUTTONHOLE = 10; // петельная
  TECH_CARD_MACHINE_TYPE_BUTTON_ATTACH = 11; // пуговичная
  TECH_CARD_MACHINE_TYPE_EMBROIDERY = 12; // вышивальная
  TECH_CARD_MACHINE_TYPE_HANDSTITCH_IMITATION = 13; // имитация ручного стежка (AMF)
  TECH_CARD_MACHINE_TYPE_HARDWARE_ATTACH = 14; // пришивание фурнитуры
  TECH_CARD_MACHINE_TYPE_ELASTIC_ATTACH = 15; // притачивание резинки
  TECH_CARD_MACHINE_TYPE_BINDING_TAPING = 16; // бейка и кант
  TECH_CARD_MACHINE_TYPE_ZIPPER_SETTING = 17; // пришивание молнии
  TECH_CARD_MACHINE_TYPE_GATHERING = 18; // сборка / присбаривание
  TECH_CARD_MACHINE_TYPE_PATCH_POCKET_AUTO = 19; // автомат накладных карманов
  TECH_CARD_MACHINE_TYPE_WELT_POCKET_AUTO = 20; // автомат прорезных карманов
  TECH_CARD_MACHINE_TYPE_TEMPLATE_AUTO = 21; // шаблонный швейный автомат
  TECH_CARD_MACHINE_TYPE_COLLAR_CUFF_AUTO = 22; // автомат воротников/манжет/планок
  TECH_CARD_MACHINE_TYPE_SLEEVE_SETTING_AUTO = 23; // автомат втачивания рукавов
  TECH_CARD_MACHINE_TYPE_WAISTBAND_AUTO = 24; // автомат притачивания пояса
  TECH_CARD_MACHINE_TYPE_OTHER = 25; // + note on the profile / step
  // СВАРКА И ПРОКЛЕЙКА — иглы и нитки тут нет вовсе. Легаси-двойника среди 1..9
  // TechCardOperationType у них нет, поэтому в компат-канонизацию они не входят: шаг пишется как
  // (MACHINE, этот тип), ровно как coverlock сегодня. Ниточно-игольные overrides шага
  // (thread_count, needle_type, needle_size_nm, thread_tension, stitch_width_mm) при этих двух
  // типах отвергаются: у сварного шва их нет.
  TECH_CARD_MACHINE_TYPE_SEAM_TAPING = 26; // машина проклейки швов горячим воздухом
  TECH_CARD_MACHINE_TYPE_ULTRASONIC_WELDER = 27; // ультразвуковая сварочная
}

// TechCardPressEquipment is the «on what» of a ВТО step (PRESS / PRESS_OPEN / FUSING), the press
// side of the same second axis TechCardMachineType covers for sewing.
enum TechCardPressEquipment {
  TECH_CARD_PRESS_EQUIPMENT_UNKNOWN = 0; // unset; REJECTED on an aware write for a press step
  TECH_CARD_PRESS_EQUIPMENT_IRON = 1; // утюг (утюжильный стол)
  TECH_CARD_PRESS_EQUIPMENT_PRESS = 2; // пресс
  TECH_CARD_PRESS_EQUIPMENT_FUSING_PRESS = 3; // дублирующий пресс
  TECH_CARD_PRESS_EQUIPMENT_STEAM_DUMMY = 4; // паровоздушный манекен
  TECH_CARD_PRESS_EQUIPMENT_STEAMER = 5; // отпариватель
  TECH_CARD_PRESS_EQUIPMENT_OTHER = 6;
}

// TechCardNeedleType is the needle point, the fact that decides whether a knit is pierced or
// pushed aside. UNKNOWN = inherit (profile → nothing), never «universal by default».
enum TechCardNeedleType {
  TECH_CARD_NEEDLE_TYPE_UNKNOWN = 0; // unset / inherited
  TECH_CARD_NEEDLE_TYPE_UNIVERSAL = 1; // R
  TECH_CARD_NEEDLE_TYPE_BALLPOINT = 2; // SES/SUK, трикотаж
  TECH_CARD_NEEDLE_TYPE_STRETCH = 3;
  TECH_CARD_NEEDLE_TYPE_JEANS = 4;
  TECH_CARD_NEEDLE_TYPE_LEATHER = 5;
  TECH_CARD_NEEDLE_TYPE_MICROTEX = 6;
  TECH_CARD_NEEDLE_TYPE_EMBROIDERY = 7;
  TECH_CARD_NEEDLE_TYPE_OTHER = 8;
}

// TechCardBedType is the machine's bed. It is the IDENTITY of a machine, not a setting of a step —
// which is why it lives on the profile only and has deliberately no override on the operation:
// a different bed is a different machine, so the step changes machine_type instead.
enum TechCardBedType {
  TECH_CARD_BED_TYPE_UNKNOWN = 0;
  TECH_CARD_BED_TYPE_FLATBED = 1; // плоская
  TECH_CARD_BED_TYPE_CYLINDER_BED = 2; // цилиндрическая / рукавная
  TECH_CARD_BED_TYPE_POST_BED = 3; // колонковая
  TECH_CARD_BED_TYPE_FEED_OFF_ARM = 4; // П-образная (off-arm)
  TECH_CARD_BED_TYPE_OTHER = 5;
}

// TechCardAutomationLevel is an ORDERED SCALE, and therefore has NO `OTHER`: a scale with an
// «other» member is no longer a scale. Like bed_type it is machine identity, profile-only.
enum TechCardAutomationLevel {
  TECH_CARD_AUTOMATION_LEVEL_UNKNOWN = 0;
  TECH_CARD_AUTOMATION_LEVEL_BASIC = 1; // механическая
  TECH_CARD_AUTOMATION_LEVEL_SEMI_AUTO = 2; // автообрезка / позиционирование / закрепка
  TECH_CARD_AUTOMATION_LEVEL_AUTO = 3; // программируемый автомат
}

// TechCardThreadTension is a CLOSED SCALE relative to the machine's normal setting, plus a free
// thread_tension_note for the numbers a particular machine wants. A raw dial number was rejected
// deliberately: it means nothing across two machines of the same class.
enum TechCardThreadTension {
  TECH_CARD_THREAD_TENSION_UNKNOWN = 0; // unset / inherited
  TECH_CARD_THREAD_TENSION_LOOSER = 1; // слабее обычного
  TECH_CARD_THREAD_TENSION_NORMAL = 2;
  TECH_CARD_THREAD_TENSION_TIGHTER = 3; // туже обычного
  TECH_CARD_THREAD_TENSION_OTHER = 4; // + thread_tension_note
}

// TechCardPressCloth is what sits between the iron and the cloth.
//
// NONE IS NOT UNKNOWN HERE, and that is the point: with inheritance in play, «не указано» means
// «take the card profile's answer», so without an explicit NONE a step could never CANCEL the
// profile's press cloth. The same argument added NONE to TechCardAttachmentKind.
enum TechCardPressCloth {
  TECH_CARD_PRESS_CLOTH_UNKNOWN = 0; // не указано / наследуется
  TECH_CARD_PRESS_CLOTH_NONE = 1; // явное «без проутюжильника»
  TECH_CARD_PRESS_CLOTH_PRESS_CLOTH = 2; // сухой проутюжильник
  TECH_CARD_PRESS_CLOTH_DAMP_PRESS_CLOTH = 3; // влажный
  TECH_CARD_PRESS_CLOTH_TEFLON_SHEET = 4;
  TECH_CARD_PRESS_CLOTH_OTHER = 5;
  TECH_CARD_PRESS_CLOTH_SILICONE_PAPER = 6; // силиконовая бумага — прокладка термопереноса и фольги
}

// TechCardMachineProfile is one row of CARD DEFAULTS: «this card is sewn on such a machine, set up
// like this». A step then names the machine TYPE (or points at this exact profile by key) and
// overrides only what it genuinely deviates in — everything unset is inherited live and NEVER
// materialised into the step's row.
//
// IDENTITY IS profile_key, a durable client-minted ULID exactly like bom_line_key / piece_line_key:
// the list is full-replaced on every save, so a positional index or an id would break every step
// reference the moment a row moves. `label` is a NAME FOR A HUMAN («оверлок у окна») and is NOT
// part of the identity — the scope_key lesson (two different keys living under one name) is what
// keeps them separate. There may be MANY profiles of one type: two identical machines set up
// differently is the normal case, not a mistake to deduplicate.
message TechCardMachineProfile {
  string profile_key = 1; // 26-char durable key; empty = the server mints one
  string label = 2; // optional human name, ≤64
  TechCardMachineType machine_type = 3; // REQUIRED; UNKNOWN is rejected
  int32 thread_count = 4; // 1..20; 0 = unset
  TechCardNeedleType needle_type = 5;
  int32 needle_size_nm = 6; // Nm, 35..300; 0 = unset
  TechCardBedType bed_type = 7; // machine identity
  TechCardAutomationLevel automation = 8; // machine identity
  TechCardThreadTension thread_tension = 9;
  string thread_tension_note = 10; // ≤64; only alongside the scale
  TechCardAttachmentKind attachment_kind = 11; // default foot / folder; NONE is legal
  google.type.Decimal stitches_per_cm = 12; // 1..20, per CENTIMETRE
  google.type.Decimal stitch_width_mm = 13; // 0..20 mm; NOT topstitch.width_mm (that is an edge distance)
  string note = 14; // machine model, the detail behind OTHER; ≤255
}

// TechCardPressProfile is the ВТО twin of TechCardMachineProfile: one press / iron / steamer of the
// card, with the settings a step inherits. Same durable-key rules.
message TechCardPressProfile {
  string profile_key = 1;
  string label = 2;
  TechCardPressEquipment press_equipment = 3; // REQUIRED; UNKNOWN is rejected
  // WHICH PROCESS this profile is for, so the form can offer it by default on the right step:
  // UNKNOWN (universal), PRESS, PRESS_OPEN or FUSING are legal; any other operation type is
  // rejected — a profile «for a lockstitch step» is not a thing a press can mean.
  TechCardOperationType operation_type = 4;
  int32 press_temperature_c = 5; // 40..250; 0 = unset (the floor catches «14» typed for «140»)
  int32 press_dwell_sec = 6; // 1..300; 0 = unset
  google.type.Decimal press_pressure_n_cm2 = 7; // PRESSURE ON THE CLOTH, N/cm² — the unit is IN THE NAME; 1..100
  optional bool press_steam = 8; // absent = not stated; false = «без пара», a real answer
  TechCardPressCloth press_cloth = 9; // NONE is legal (see the enum)
  string note = 10; // ≤255
}

// TechCardEquipmentDefaults wraps the two profile lists, and the WRAPPER IS THE PRESENCE SIGNAL —
// which is the whole reason it exists rather than two bare repeated fields on the construction:
//   absent (nil)  — the payload did not speak about equipment (an older bundle), so the server
//                   PRESERVES the stored profiles;
//   present       — full replace, and an EMPTY wrapper means «delete them all», an intent a bare
//                   repeated field can never express.
// A hand-made bool flag was rejected for this job: a flag inside the payload would be hashed into
// the section digest and would make every signature depend on which client saved last.
message TechCardEquipmentDefaults {
  repeated TechCardMachineProfile machines = 1;
  repeated TechCardPressProfile presses = 2;
}

// TechCardConstruction holds the card's DEFAULTS — the values an operation inherits when it does
// not override them. Until the operations break it was a block of free-text notes that nothing
// inherited (the editor said so out loud: «общие параметры по умолчанию, конкретные задавайте в
// операциях»), which is exactly why every step re-typed the same «5 мм» by hand.
//
// WHAT IS DELIBERATELY NOT HERE: the seam allowance. The card's standard already exists as
// TechCard.required_seam_allowance_mm, and 0277 put it on the CARD rather than in this message on
// purpose — anything added to a section's digest projection instantly marks every signed-off
// CONSTRUCTION approval as «edited since signing», on every card at once. A second card-level
// allowance here would also be a second answer to a question that already has one.
//
// AND NOT `main_stitch_type`: the stitch class (301 / 504 / 602) is a per-STEP fact carried by
// TechCardOperation.operation_type, and a card-wide default for it is not a thing a card can mean.
message TechCardConstruction {
  string hem_finish = 5; // обработка низа / подгибка — genuinely prose, stays text
  string notes = 8;
  // Inherited by TechCardOperation.seam_class when that one is UNKNOWN.
  TechCardSeamClass default_seam_class = 11;
  // Inherited by TechCardOperation.stitches_per_cm when that one is unset. In STITCHES PER
  // CENTIMETRE — stitch density is quoted per cm everywhere and is NOT part of the mm switch.
  google.type.Decimal default_stitches_per_cm = 12;
  // The card's machine and ВТО park: which machines this style is sewn on and with what settings,
  // which presses/irons it is pressed on. A step inherits from here (by profile key, or by type
  // when the card has exactly one profile of that type) and stores only what it overrides.
  //
  // Absent = preserve the stored profiles; present = full replace (empty = delete all). See
  // TechCardEquipmentDefaults for why presence lives in a wrapper and not in a flag.
  TechCardEquipmentDefaults equipment_defaults = 14;
  // 6 was `pressing` and 13 was `overlock_thread_count`, and both were RETIRED BY THE PARK, not
  // dropped: 0306 moved the prose into `notes` under a deterministic tag and turned the thread count
  // into an overlock PROFILE, because one thread count on a card could only ever describe one
  // overlock while a card may run several. Their positions in the CONSTRUCTION digest tuple stay
  // frozen at the values NULL used to marshal to (see the Go projection), so a card that never
  // filled them hashes byte for byte as before and its sign-off does not go stale.
  reserved 1, 2, 3, 4, 6, 7, 9, 10, 13;
  reserved "main_stitch_type", "stitch_density", "overlock_threads", "seam_allowances", "machine_class", "labour_rate", "labour_rate_currency", "pressing", "overlock_thread_count";
}

// TechCardOperationType says WHAT a step does. It used to mix that with the machine class, which
// is why 1-9 read like a machine list: a step could not say «прострочить» without also committing
// to a stitch class in the same value, and «на чём» had no field of its own. The second axis is
// TechCardMachineType / TechCardPressEquipment now, and the verbs left here are six: MACHINE,
// PRESS, PRESS_OPEN, FUSING, HANDWORK, OTHER.
//
// ВОЛНА ВИДОВ ОПЕРАЦИЙ добавила ещё девять глаголов (16..24). Шести не хватало: цех делает не
// только шов и ВТО, и установка фурнитуры, печать, подрезка, чистка концов, чистка изделия,
// контроль, складывание, упаковка и мокрая обработка записывались как OTHER плюс проза в note —
// то есть не записывались вовсе. Каждый новый глагол несёт СВОЙ блок настроек (поля 51..63
// TechCardOperation); FOLD и PACK не несут ни одного поля — у них нет ни машины, ни настроек,
// только место и время.
enum TechCardOperationType {
  TECH_CARD_OPERATION_TYPE_UNKNOWN = 0;
  // 1-9 ARE LEGACY AND LIVE FOREVER. They are still ACCEPTED on write (canonicalised into
  // (MACHINE, machine_type) before anything else sees them) but never EMITTED on read.
  //
  // The symbols themselves can never be deleted: a release snapshot is immutable protojson holding
  // these very names, and removing a member would make such a snapshot parse «successfully» while
  // silently losing what the step was. A cleanup phase for them was considered and cancelled.
  TECH_CARD_OPERATION_TYPE_LOCKSTITCH = 1 [deprecated = true]; // челночный (301) → MACHINE + lockstitch
  TECH_CARD_OPERATION_TYPE_DOUBLE_NEEDLE = 2 [deprecated = true]; // → MACHINE + lockstitch_double_needle
  TECH_CARD_OPERATION_TYPE_OVERLOCK = 3 [deprecated = true]; // → MACHINE + overlock
  TECH_CARD_OPERATION_TYPE_COVERSTITCH = 4 [deprecated = true]; // → MACHINE + coverstitch
  TECH_CARD_OPERATION_TYPE_CHAINSTITCH = 5 [deprecated = true]; // → MACHINE + chainstitch
  TECH_CARD_OPERATION_TYPE_BLINDHEM = 6 [deprecated = true]; // → MACHINE + blindstitch
  TECH_CARD_OPERATION_TYPE_BARTACK = 7 [deprecated = true]; // → MACHINE + bartack
  TECH_CARD_OPERATION_TYPE_BUTTONHOLE = 8 [deprecated = true]; // → MACHINE + buttonhole
  TECH_CARD_OPERATION_TYPE_BUTTON_ATTACH = 9 [deprecated = true]; // → MACHINE + button_attach
  TECH_CARD_OPERATION_TYPE_FUSING = 10; // дублирование / фиксация прокладки
  TECH_CARD_OPERATION_TYPE_HANDWORK = 11; // ручная операция
  TECH_CARD_OPERATION_TYPE_OTHER = 12;
  TECH_CARD_OPERATION_TYPE_MACHINE = 13; // машинная; «на чём» is machine_type
  TECH_CARD_OPERATION_TYPE_PRESS = 14; // ВТО: приутюжить / заутюжить / отпарить / финишное
  TECH_CARD_OPERATION_TYPE_PRESS_OPEN = 15; // разутюжка — the most frequent inter-operation step
  TECH_CARD_OPERATION_TYPE_HARDWARE_SET = 16; // установка фурнитуры: кнопка, люверс, хольнитен, пряжка
  TECH_CARD_OPERATION_TYPE_PRINT = 17; // печать и нанесение; «на чём» — print_method (поле 51)
  TECH_CARD_OPERATION_TYPE_TRIM = 18; // подрезка припуска, надсечки, высечки, выворачивание и выправка
  TECH_CARD_OPERATION_TYPE_THREAD_TRIM = 19; // чистка концов ниток
  TECH_CARD_OPERATION_TYPE_CLEAN = 20; // чистка изделия: пятно, пух, мел, клей
  TECH_CARD_OPERATION_TYPE_INSPECT = 21; // контроль качества
  TECH_CARD_OPERATION_TYPE_FOLD = 22; // складывание; полей шага не несёт вовсе
  TECH_CARD_OPERATION_TYPE_PACK = 23; // упаковка; полей шага не несёт вовсе
  TECH_CARD_OPERATION_TYPE_WET_PROCESS = 24; // мокрая обработка: полоскание, энзим, крашение, смягчение
}

// TechCardGarmentZone says WHERE ON THE GARMENT a step works — and it is one of the two fields a
// step cannot be saved without (the other is operation_type). Renamed from
// TechCardConstructionZone, which had only the three material BANDS and therefore could not answer
// «where»; the free-text `placement` carried that and is gone.
//
// ONE VOCABULARY, TWO CONSUMERS. These are the same tokens the fitting change-request zone uses
// (0256, chk_fcr_zone_v2), and entity.GarmentZoneTokens is now the single Go source both derive
// from. Fitting arrived here first — it started as a mirror of the old three bands and widened to
// garment areas because a fitting remark is about where on the garment the problem is; operations
// need exactly the same answer for exactly the same reason. Two independent copies of one
// vocabulary drift silently, which is the whole argument of 0278's header.
//
// NUMBERS ARE NOT REPACKED: OTHER stays 4 because it is already on the wire, and the areas take
// 5..17 after it. Reading order (bands, then areas, then other) lives in GarmentZoneTokens.
enum TechCardGarmentZone {
  TECH_CARD_GARMENT_ZONE_UNKNOWN = 0; // unset — REJECTED on write for an operation
  TECH_CARD_GARMENT_ZONE_OUTER = 1; // верх / основная ткань
  TECH_CARD_GARMENT_ZONE_LINING = 2; // подклад
  TECH_CARD_GARMENT_ZONE_INTERLINING = 3; // приклад / дублерин
  TECH_CARD_GARMENT_ZONE_OTHER = 4;
  TECH_CARD_GARMENT_ZONE_SLEEVE = 5;
  TECH_CARD_GARMENT_ZONE_COLLAR = 6;
  TECH_CARD_GARMENT_ZONE_NECKLINE = 7;
  TECH_CARD_GARMENT_ZONE_ARMHOLE = 8;
  TECH_CARD_GARMENT_ZONE_SHOULDER = 9;
  TECH_CARD_GARMENT_ZONE_CHEST = 10;
  TECH_CARD_GARMENT_ZONE_WAIST = 11;
  TECH_CARD_GARMENT_ZONE_HIP = 12;
  TECH_CARD_GARMENT_ZONE_HEM = 13;
  TECH_CARD_GARMENT_ZONE_POCKET = 14;
  TECH_CARD_GARMENT_ZONE_CLOSURE = 15;
  TECH_CARD_GARMENT_ZONE_BACK = 16;
  TECH_CARD_GARMENT_ZONE_FRONT = 17;
}

// TechCardSeamClass is the ISO 4916 seam class, in its six families: SS superimposed, LS lapped,
// EF edge finishing, BS bound, FS flat, OS ornamental. It replaces the free-text `seam_type`,
// whose suggestion list mixed the class with the PRESSING DIRECTION — «стачной взаутюжку» and
// «стачной вразутюжку» are one class (SS plain) pressed two ways, and holding them as two
// entries made the field answer two questions with one value. The pressing direction is a STEP of
// its own now — PRESS (заутюжить) and PRESS_OPEN (разутюжить), each with its own ВТО settings — and
// it stopped being prose on the construction when that field was retired by the equipment park.
//
// UNKNOWN = inherit TechCardConstruction.default_seam_class. Inheritance is a DISPLAY rule: the
// server stores the unset value and never materialises the inherited one, so «the technologist
// chose this» stays distinguishable from «it defaulted».
enum TechCardSeamClass {
  TECH_CARD_SEAM_CLASS_UNKNOWN = 0; // inherit the card default
  TECH_CARD_SEAM_CLASS_SS_PLAIN = 1; // стачной
  TECH_CARD_SEAM_CLASS_SS_FRENCH = 2; // французский / бельевой
  TECH_CARD_SEAM_CLASS_LS_LAPPED = 3; // настрочной
  TECH_CARD_SEAM_CLASS_LS_FLAT_FELLED = 4; // запошивочный
  TECH_CARD_SEAM_CLASS_EF_HEM_RAW = 5; // подгибка с открытым срезом
  TECH_CARD_SEAM_CLASS_EF_HEM_TURNED = 6; // подгибка с закрытым срезом
  TECH_CARD_SEAM_CLASS_EF_FACED = 7; // обтачной
  TECH_CARD_SEAM_CLASS_BS_BOUND = 8; // окантовочный
  TECH_CARD_SEAM_CLASS_FS_FLAT = 9; // встык
  TECH_CARD_SEAM_CLASS_OS_TOPSTITCH = 10; // отделочная строчка
  TECH_CARD_SEAM_CLASS_OTHER = 11;
}

// TechCardAttachmentKind is the folder / guide / presser foot the step runs with.
//
// THERE IS A `NONE` NOW, AND IT IS NOT A SPELLING OF UNKNOWN. The old comment here said the
// opposite — «none» and «not specified» are the same fact — and it was TRUE for as long as this
// field was not inherited: with nothing above the step, both meant «nothing on the machine».
// Since the card carries machine profiles, UNKNOWN means «take the profile's foot» and the step
// lost any way to say «this one runs bare». NONE is that sentence. The two are different facts and
// both are stored.
//
// `walking_foot` is deliberately NOT in this list: in an industrial shop a walking foot is a
// machine with a unison / top feed — a property of the TRANSPORT, not a snap-on foot an operator
// fits per step. If it is ever needed it belongs next to bed_type on the machine, not here.
enum TechCardAttachmentKind {
  TECH_CARD_ATTACHMENT_KIND_UNKNOWN = 0; // not specified — inherit the profile's foot
  TECH_CARD_ATTACHMENT_KIND_BINDER = 1; // окантовыватель
  TECH_CARD_ATTACHMENT_KIND_HEMMER_FOLDER = 2; // подгибатель
  TECH_CARD_ATTACHMENT_KIND_SCROLL_FOOT = 3; // лапка-улитка
  TECH_CARD_ATTACHMENT_KIND_ZIPPER_FOOT = 4;
  TECH_CARD_ATTACHMENT_KIND_INVISIBLE_ZIPPER_FOOT = 5;
  TECH_CARD_ATTACHMENT_KIND_EDGE_GUIDE = 6; // направитель
  TECH_CARD_ATTACHMENT_KIND_PIPING_FOOT = 7; // лапка для канта
  TECH_CARD_ATTACHMENT_KIND_ELASTIC_ATTACHMENT = 8; // лапка для резинки
  TECH_CARD_ATTACHMENT_KIND_OTHER = 9;
  TECH_CARD_ATTACHMENT_KIND_TEFLON_FOOT = 10; // тефлоновая лапка
  TECH_CARD_ATTACHMENT_KIND_ROLLER_FOOT = 11; // роликовая лапка
  TECH_CARD_ATTACHMENT_KIND_NONE = 12; // explicit «no foot / no attachment», cancels the profile's
}

// TechCardTopstitchMode replaces the free-text `topstitch_width`, whose real values were three
// different KINDS of answer at once: «нет», «в край» (a placement, not a width) and «2 × 6 мм»
// (a width AND a row count).
enum TechCardTopstitchMode {
  TECH_CARD_TOPSTITCH_MODE_UNKNOWN = 0; // no topstitching
  TECH_CARD_TOPSTITCH_MODE_EDGE = 1; // в край
  TECH_CARD_TOPSTITCH_MODE_WIDTH = 2; // at the stated width
  // В ШОВ («в канавку»): строчка ложится в сам шов, ширины у неё нет — width_mm отвергается,
  // ровно как у EDGE.
  TECH_CARD_TOPSTITCH_MODE_IN_DITCH = 3;
  // ПАРАЛЛЕЛЬНО ШВУ: width_mm здесь REQUIRED и значит ОТСТУП ОТ ЛИНИИ ШВА. От WIDTH отличается
  // точкой отсчёта: у WIDTH это край детали, здесь — шов. Два разных факта под одним числом
  // разошлись бы на печати молча, поэтому это отдельный режим, а не примечание к WIDTH.
  TECH_CARD_TOPSTITCH_MODE_PARALLEL_TO_SEAM = 4;
}

// TechCardTopstitch is the three answers that used to share one string.
message TechCardTopstitch {
  TechCardTopstitchMode mode = 1;
  // Required when mode = WIDTH or PARALLEL_TO_SEAM, rejected under EDGE and IN_DITCH — a width
  // carried alongside «в край» would be a shadow value nothing reads. Точка отсчёта у двух
  // требующих режимов разная: WIDTH меряется от края детали, PARALLEL_TO_SEAM — от линии шва.
  google.type.Decimal width_mm = 2;
  int32 rows = 3; // 1 = single, 2 = the old «2 × 6 мм»; 0 = unset
}

// ── ВИДЫ ОПЕРАЦИЙ: СЛОВАРИ И БЛОКИ НАСТРОЕК ШАГА ───────────────────────────────────────────────
//
// Девять новых глаголов (TechCardOperationType 16..24) принесли то, чего у шага раньше не было:
// СВОИ настройки. Держать их плоским списком на TechCardOperation значило бы дать каждому шагу
// шесть десятков полей, из которых осмысленны три, — поэтому настройки собраны в блоки-сообщения
// по семействам (прецедент TechCardTopstitch: на проводе вложенное сообщение, в базе плоские
// колонки).
//
// ОТСУТСТВУЮЩИЙ БЛОК ЗНАЧИТ «бандл про это семейство молчит», а не «все поля пустые». Разница
// видна только на записи, и именно она даёт неосведомлённому клиенту сохранить шаг, не стерев
// того, чего он не умеет показать.
//
// UNKNOWN ВЕЗДЕ = «не указано» и НИКОГДА не «нет». Явное «нет» там, где оно бывает, — отдельный
// член NONE: тот же довод, что добавил NONE к TechCardPressCloth и TechCardAttachmentKind.
// Числовые поля так же: 0 = не указано, а не «ноль».

// Закрепка концов строчки. NONE — явное «без закрепки»: так шьётся то, что дальше поймается
// другим швом, и это не то же самое, что «не указано».
enum TechCardSeamSecuring {
  TECH_CARD_SEAM_SECURING_UNKNOWN = 0; // не указано
  TECH_CARD_SEAM_SECURING_NONE = 1; // явное «без закрепки»
  TECH_CARD_SEAM_SECURING_BACKTACK = 2; // обратный ход (реверс)
  TECH_CARD_SEAM_SECURING_CONDENSED = 3; // кондензация — уплотнённый стежок
  TECH_CARD_SEAM_SECURING_LATCHED = 4; // цепочка заправлена и закреплена в шов
}

// Способ КРЕПЛЕНИЯ фурнитуры — дискриминатор шага HARDWARE_SET: поле REQUIRED, и UNKNOWN на таком
// шаге отвергается. Отвечает «как ставим», а не «что ставим»: что — это kind строки BOM.
enum TechCardHardwareAttachMethod {
  TECH_CARD_HARDWARE_ATTACH_METHOD_UNKNOWN = 0; // не указано; REJECTED на шаге HARDWARE_SET
  TECH_CARD_HARDWARE_ATTACH_METHOD_SEW = 1; // пришивная
  TECH_CARD_HARDWARE_ATTACH_METHOD_PRONG_CLINCH = 2; // загибом зубцов (prong)
  TECH_CARD_HARDWARE_ATTACH_METHOD_PRESS_SET = 3; // прессом (кнопка, хольнитен, люверс)
  TECH_CARD_HARDWARE_ATTACH_METHOD_CRIMP = 4; // обжимом
  TECH_CARD_HARDWARE_ATTACH_METHOD_THREADED = 5; // продеванием (пряжка, регулятор) — только тут законен foldback_mm
}

// Подготовка отверстия под фурнитуру. NONE — явный ответ «фурнитура прокалывает сама».
enum TechCardHolePrep {
  TECH_CARD_HOLE_PREP_UNKNOWN = 0; // не указано
  TECH_CARD_HOLE_PREP_NONE = 1; // явное «отверстие не готовим»
  TECH_CARD_HOLE_PREP_PRONG_PIERCE = 2; // прокол зубцами самой фурнитуры
  TECH_CARD_HOLE_PREP_AWL_PIERCE = 3; // шилом
  TECH_CARD_HOLE_PREP_PUNCH = 4; // пробойником
}

// Усилитель под фурнитурой, петлёй или закрепкой. NONE — явное «без усилителя». Здесь только
// СПОСОБ; сам материал усилителя — строкой BOM, а не тенью в этом поле.
enum TechCardReinforcement {
  TECH_CARD_REINFORCEMENT_UNKNOWN = 0; // не указано
  TECH_CARD_REINFORCEMENT_NONE = 1; // явное «без усилителя»
  TECH_CARD_REINFORCEMENT_FUSIBLE_PATCH = 2; // клеевая заплатка
  TECH_CARD_REINFORCEMENT_FABRIC_STAY = 3; // тканевая подложка
  TECH_CARD_REINFORCEMENT_TAPE = 4; // лента / долевик
  TECH_CARD_REINFORCEMENT_SEAM_CATCH = 5; // ловится швом
  TECH_CARD_REINFORCEMENT_OTHER = 6; // + note шага
}

// Вторая ось шага PRINT — точный образец пары MACHINE / machine_type: глагол говорит ЧТО делаем,
// это — ЧЕМ. Носитель — TechCardOperation.print_method (поле 51), REQUIRED при PRINT.
//
// LASER_ENGRAVE — метод без краски, без носителя и без прижима: при нём отвергаются peel_mode,
// second_press_sec, pressure_scale и весь ВТО-блок шага.
enum TechCardPrintMethod {
  TECH_CARD_PRINT_METHOD_UNKNOWN = 0; // не указано; REJECTED на шаге PRINT
  TECH_CARD_PRINT_METHOD_SCREEN = 1; // шелкография
  TECH_CARD_PRINT_METHOD_DTF = 2; // перенос с плёнки (direct-to-film)
  TECH_CARD_PRINT_METHOD_HEAT_TRANSFER = 3; // термотрансфер
  TECH_CARD_PRINT_METHOD_FOIL = 4; // фольгирование
  TECH_CARD_PRINT_METHOD_LASER_ENGRAVE = 5; // лазерная гравировка — без краски и без прижима
}

// Съём носителя после прижима. NONE — явное «носителя нет вовсе» (шелкография, гравировка), а не
// «не указано».
enum TechCardPeelMode {
  TECH_CARD_PEEL_MODE_UNKNOWN = 0; // не указано
  TECH_CARD_PEEL_MODE_NONE = 1; // носителя нет
  TECH_CARD_PEEL_MODE_HOT = 2; // снимать горячим
  TECH_CARD_PEEL_MODE_WARM = 3; // снимать тёплым
  TECH_CARD_PEEL_MODE_COLD = 4; // снимать холодным
}

// Прижим термопресса — УПОРЯДОЧЕННАЯ ШКАЛА, и поэтому без OTHER (прецедент
// TechCardAutomationLevel: шкала с «другим» перестаёт быть шкалой). Вендорские «40 psi» — это
// показание манометра цилиндра, а не давление на ткань; настоящее число, когда оно есть, живёт в
// press_pressure_n_cm2 — тот же довод, что развёл thread_tension и thread_tension_note.
enum TechCardPressureScale {
  TECH_CARD_PRESSURE_SCALE_UNKNOWN = 0; // не указано
  TECH_CARD_PRESSURE_SCALE_LIGHT = 1; // лёгкий
  TECH_CARD_PRESSURE_SCALE_MEDIUM = 2; // средний
  TECH_CARD_PRESSURE_SCALE_FIRM = 3; // сильный
}

// Что именно делает шаг TRIM — дискриминатор: поле REQUIRED, UNKNOWN на таком шаге отвергается.
enum TechCardTrimAction {
  TECH_CARD_TRIM_ACTION_UNKNOWN = 0; // не указано; REJECTED на шаге TRIM
  TECH_CARD_TRIM_ACTION_TRIM_EVEN = 1; // срезать ровно
  TECH_CARD_TRIM_ACTION_GRADE_LAYERS = 2; // подрезать слои разноуровнево
  TECH_CARD_TRIM_ACTION_CLIP_CONCAVE = 3; // надсечь вогнутое
  TECH_CARD_TRIM_ACTION_NOTCH_CONVEX = 4; // высечь выпуклое
  TECH_CARD_TRIM_ACTION_CORNER_DIAGONAL = 5; // срезать уголки наискось
  TECH_CARD_TRIM_ACTION_TURN_AND_SHAPE = 6; // вывернуть и выправить
}

// Что чистит шаг CLEAN — дискриминатор: REQUIRED, UNKNOWN отвергается. ЧЕМ чистит (вода,
// растворитель, пар, щётка) — отложено: у цеха на это пока один ответ, и поле сегодня записывало
// бы одно и то же.
enum TechCardCleaningKind {
  TECH_CARD_CLEANING_KIND_UNKNOWN = 0; // не указано; REJECTED на шаге CLEAN
  TECH_CARD_CLEANING_KIND_SPOT_CLEAN = 1; // пятно
  TECH_CARD_CLEANING_KIND_DUST_LINT = 2; // пух и пыль
  TECH_CARD_CLEANING_KIND_CHALK_REMOVAL = 3; // следы мела и разметки
  TECH_CARD_CLEANING_KIND_ADHESIVE_REMOVAL = 4; // следы клея
}

// Охват контроля — дискриминатор шага INSPECT: REQUIRED, UNKNOWN отвергается. Он же разводит
// межоперационный контроль (SAMPLE_PER_BUNDLE), финальный (AQL_PLAN), сплошной (EACH_UNIT) и
// первую единицу прогона (FIRST_OUTPUT) — четыре разных работы под одним глаголом.
enum TechCardInspectCoverage {
  TECH_CARD_INSPECT_COVERAGE_UNKNOWN = 0; // не указано; REJECTED на шаге INSPECT
  TECH_CARD_INSPECT_COVERAGE_EACH_UNIT = 1; // каждое изделие
  TECH_CARD_INSPECT_COVERAGE_SAMPLE_PER_BUNDLE = 2; // выборка с пачки
  TECH_CARD_INSPECT_COVERAGE_AQL_PLAN = 3; // по плану AQL
  TECH_CARD_INSPECT_COVERAGE_FIRST_OUTPUT = 4; // первая единица прогона
}

// Вид мокрой обработки — дискриминатор шага WET_PROCESS: REQUIRED, UNKNOWN отвергается. Носитель —
// TechCardOperation.wet_process_kind (поле 61), а не блок: семейство из одного факта не нуждается
// в сообщении вокруг него.
enum TechCardWetProcessKind {
  TECH_CARD_WET_PROCESS_KIND_UNKNOWN = 0; // не указано; REJECTED на шаге WET_PROCESS
  TECH_CARD_WET_PROCESS_KIND_RINSE = 1; // полоскание
  TECH_CARD_WET_PROCESS_KIND_ENZYME = 2; // энзимная обработка
  TECH_CARD_WET_PROCESS_KIND_GARMENT_DYE = 3; // крашение готового изделия
  TECH_CARD_WET_PROCESS_KIND_SOFTENER = 4; // смягчение
}

// Форма петли. Обтачной петли здесь нет и не будет: она не форма, а несколько швейных шагов.
enum TechCardButtonholeStyle {
  TECH_CARD_BUTTONHOLE_STYLE_UNKNOWN = 0; // не указано
  TECH_CARD_BUTTONHOLE_STYLE_STRAIGHT = 1; // бельевая / рубашечная (LBH)
  TECH_CARD_BUTTONHOLE_STYLE_EYELET = 2; // глазковая со сбегом (MEB)
  TECH_CARD_BUTTONHOLE_STYLE_ROUND_END = 3; // с закруглённым концом
  TECH_CARD_BUTTONHOLE_STYLE_OTHER = 4; // + note шага
}

// Направление петли на изделии. Точное МЕСТО петли — выноской на снимке шага, а не полем: место
// это координата, и полем оно выражается ровно один раз — неправильно.
enum TechCardButtonholeOrientation {
  TECH_CARD_BUTTONHOLE_ORIENTATION_UNKNOWN = 0; // не указано
  TECH_CARD_BUTTONHOLE_ORIENTATION_HORIZONTAL = 1; // поперечная
  TECH_CARD_BUTTONHOLE_ORIENTATION_VERTICAL = 2; // продольная
  TECH_CARD_BUTTONHOLE_ORIENTATION_ANGLED = 3; // под углом; сам угол — выноской DIM на медиа шага
}

// Рисунок пришивания пуговицы. Согласованность с числом отверстий — мягкое предупреждение формы,
// а не отказ сохранения: число отверстий это свойство артикула из строки BOM, и оно может прийти
// позже самого шага.
enum TechCardButtonAttachPattern {
  TECH_CARD_BUTTON_ATTACH_PATTERN_UNKNOWN = 0; // не указано
  TECH_CARD_BUTTON_ATTACH_PATTERN_CROSS_X = 1; // крест-накрест
  TECH_CARD_BUTTON_ATTACH_PATTERN_PARALLEL = 2; // параллельно
  TECH_CARD_BUTTON_ATTACH_PATTERN_SQUARE = 3; // квадратом
  TECH_CARD_BUTTON_ATTACH_PATTERN_U_SHAPE = 4; // П-образно
  TECH_CARD_BUTTON_ATTACH_PATTERN_OTHER = 5; // + note шага
}

// Метод втачивания молнии — закрытый список исполнений.
enum TechCardZipperApplication {
  TECH_CARD_ZIPPER_APPLICATION_UNKNOWN = 0; // не указано
  TECH_CARD_ZIPPER_APPLICATION_CENTERED = 1; // симметричная
  TECH_CARD_ZIPPER_APPLICATION_LAPPED = 2; // с настрочным припуском
  TECH_CARD_ZIPPER_APPLICATION_INVISIBLE = 3; // потайная
  TECH_CARD_ZIPPER_APPLICATION_EXPOSED = 4; // открытая, лента напоказ
  TECH_CARD_ZIPPER_APPLICATION_FLY = 5; // гульфик
  TECH_CARD_ZIPPER_APPLICATION_SEPARATING_CF = 6; // разъёмная по борту
  TECH_CARD_ZIPPER_APPLICATION_IN_SEAM_POCKET = 7; // в шве кармана
  TECH_CARD_ZIPPER_APPLICATION_OTHER = 8; // + note шага
}

// Как сложена бейка. ISO-класс шва при этом НЕ расщепляется: BS_BOUND остаётся одним классом, а
// это его исполнение — иначе один факт отвечал бы на два вопроса, как когда-то `seam_type`.
enum TechCardBindingStyle {
  TECH_CARD_BINDING_STYLE_UNKNOWN = 0; // не указано
  TECH_CARD_BINDING_STYLE_RAW = 1; // BSa — с открытым срезом
  TECH_CARD_BINDING_STYLE_SINGLE_FOLD = 2; // BSb — в один перегиб
  TECH_CARD_BINDING_STYLE_DOUBLE_FOLD = 3; // BSc — в два перегиба
}

// Схема пришивания этикетки. Сама этикетка — строкой BOM (bom_line_keys), здесь только шов; тип
// фолда этикетки — свойство артикула, а не шага.
enum TechCardLabelAttachStitch {
  TECH_CARD_LABEL_ATTACH_STITCH_UNKNOWN = 0; // не указано
  TECH_CARD_LABEL_ATTACH_STITCH_FOUR_SIDES = 1; // по четырём сторонам
  TECH_CARD_LABEL_ATTACH_STITCH_TWO_SIDES_TOP_BOTTOM = 2; // сверху и снизу
  TECH_CARD_LABEL_ATTACH_STITCH_TWO_SIDES_LEFT_RIGHT = 3; // слева и справа
  TECH_CARD_LABEL_ATTACH_STITCH_ONE_EDGE = 4; // по одному краю
  TECH_CARD_LABEL_ATTACH_STITCH_CAUGHT_IN_SEAM = 5; // ловится швом
  TECH_CARD_LABEL_ATTACH_STITCH_CORNERS_TACK = 6; // закрепками по углам
  TECH_CARD_LABEL_ATTACH_STITCH_OTHER = 7; // + note шага
}

// Параметры строчки. Только operation_type = MACHINE.
message TechCardOperationStitching {
  int32 needle_count = 1; // игл в строчке, шт; 1..12; 0 = не указано
  // Расстояние МЕЖДУ ИГЛАМИ, мм; 1.6..25.4; unset = не указано. Осмысленно только при
  // needle_count >= 2 — иначе отвергается (правило Go; в БД двухколоночных CHECK'ов нет).
  google.type.Decimal needle_gauge_mm = 2;
  TechCardSeamSecuring seam_securing = 3; // UNKNOWN = не указано, NONE = явное «без закрепки»
  // Расстояние между РЯДАМИ строчек, мм; 1..30; unset = не указано. Не путать с needle_gauge_mm:
  // тот про иглы в одной строчке, этот про соседние строчки.
  google.type.Decimal row_spacing_mm = 4;
  // Посадка / сборка / дифференциал подачи, ОТНОШЕНИЕ (не проценты); 0.6..4.0; unset = посадки и
  // сборки нет. 1.0 — «слои идут один в один», 2.0 — «присборить вдвое».
  google.type.Decimal fullness_ratio = 5;
  TechCardBindingStyle binding_style = 6; // только при ЯВНОМ machine_type = binding_taping
  TechCardLabelAttachStitch label_attach_stitch = 7; // любой MACHINE; сама этикетка — строкой BOM
}

// Сколько раз и с каким шагом операция повторяется на изделии: кнопки, петли, закрепки, принты.
// operation_type = MACHINE | HARDWARE_SET | PRINT.
message TechCardOperationPlacement {
  int32 count = 1; // повторов, шт; 1..99; 0 = не указано, читается как один повтор
  // Шаг между повторами, мм; 5..500; unset = не указано. Осмыслен только при count >= 2 — иначе
  // отвергается (правило Go).
  google.type.Decimal pitch_mm = 2;
}

// Установка фурнитуры. Целиком относится к HARDWARE_SET. На шаге MACHINE с ЯВНЫМ machine_type =
// buttonhole | button_attach | bartack законны ТОЛЬКО hole_prep, reinforcement и
// cycle_stitch_count: у петли и закрепки есть подготовка отверстия и усилитель, но нет «способа
// крепления» и нет стропы, которую подгибают, — attach_method и foldback_mm там отвергаются.
message TechCardOperationHardware {
  TechCardHardwareAttachMethod attach_method = 1; // REQUIRED при HARDWARE_SET; на MACHINE отвергается
  TechCardHolePrep hole_prep = 2; // UNKNOWN = не указано, NONE = явное «не готовим»
  TechCardReinforcement reinforcement = 3; // UNKNOWN = не указано, NONE = явное «без усилителя»
  // Подгиб стропы через пряжку, мм; 10..80; unset = не указано. Только при
  // attach_method = THREADED (правило Go).
  google.type.Decimal foldback_mm = 4;
  // Стежков в цикле автомата, шт; 8..64; 0 = не указано, то есть штатная программа машины.
  int32 cycle_stitch_count = 5;
}

// Печать и нанесение. Только operation_type = PRINT; сам МЕТОД лежит полем 51 TechCardOperation,
// потому что он REQUIRED, а обязательное поле не прячут внутрь необязательного сообщения.
//
// Все три поля отвергаются при print_method = LASER_ENGRAVE: у гравировки нет ни носителя, ни
// прижима. ВТО-факты PRINT-шага (температура, выдержка, давление, оборудование) идут ОБЩИМ
// ВТО-блоком 39..45 и здесь не дублируются — один факт живёт в одном месте.
message TechCardOperationPrint {
  TechCardPeelMode peel_mode = 1; // UNKNOWN = не указано, NONE = носителя нет
  int32 second_press_sec = 2; // второй прижим, сек; 1..30; 0 = второго прижима нет
  TechCardPressureScale pressure_scale = 3; // шкала прижима; UNKNOWN = не указано
}

// Сварка и проклейка. Только MACHINE с ЯВНЫМ machine_type = seam_taping | ultrasonic_welder; тип,
// разрешённый через machine_profile_key, здесь НЕ засчитывается — правило шага, а не профиля.
message TechCardOperationWeld {
  // Температура горячего воздуха, °C; 100..750; 0 = не указано. ТОЛЬКО seam_taping: у ультразвука
  // горячего воздуха нет вовсе.
  int32 air_temperature_c = 1;
  google.type.Decimal feed_speed_m_min = 2; // скорость подачи, м/мин; 0.3..10.0; unset = не указано
}

// Подрезка и выправка. Только operation_type = TRIM.
message TechCardOperationTrim {
  TechCardTrimAction action = 1; // REQUIRED при TRIM; UNKNOWN отвергается
  // Сколько припуска ОСТАЁТСЯ после подрезки, мм; 1..10; unset = не указано. Это НЕ
  // seam_allowance_mm: тот говорит, с каким припуском кроили, этот — до скольких срезать.
  google.type.Decimal residual_allowance_mm = 2;
}

// Чистка концов ниток. Только operation_type = THREAD_TRIM.
message TechCardOperationThreadTrim {
  // Допустимый хвост нитки, мм; 1..10 (типовой стандарт цеха <= 3); unset = стандарт цеха.
  google.type.Decimal residual_tail_max_mm = 1;
}

// Чистка изделия. Только operation_type = CLEAN.
message TechCardOperationClean {
  TechCardCleaningKind kind = 1; // REQUIRED при CLEAN; UNKNOWN отвергается
}

// Контроль качества. Только operation_type = INSPECT.
message TechCardOperationInspect {
  TechCardInspectCoverage coverage_mode = 1; // REQUIRED при INSPECT; UNKNOWN отвергается
}

// Петли, закрепки, пуговицы, молнии. Только MACHINE, и каждое поле — при своём ЯВНОМ machine_type
// (резолв через machine_profile_key не засчитывается нигде).
//
// REQUIRED тут НЕТ НИ ОДНОГО, в отличие от дискриминаторов новых глаголов: эти глаголы и машинки
// живут в проде годами, и старая карточка «MACHINE + buttonhole» без единого нового поля обязана
// сохраняться как есть. Довод «глагол доказывает осведомлённость бандла» к ним неприменим.
message TechCardOperationFastening {
  TechCardButtonholeStyle buttonhole_style = 1; // machine_type = buttonhole
  // Прорезь петли, мм; 4..120; unset = не указано. Границы — санити, а не стандарт: LBH даёт
  // 6.4..31.8, спец-ножи 70 и 120.
  google.type.Decimal cut_length_mm = 2;
  TechCardButtonholeOrientation buttonhole_orientation = 3; // machine_type = buttonhole
  // Длина закрепки, мм; 1..40; unset = не указано. Диапазон — санити объединением: петельная
  // закрепка 1..10, цикловая до 40. machine_type = buttonhole | bartack.
  google.type.Decimal bartack_length_mm = 4;
  TechCardButtonAttachPattern attach_pattern = 5; // machine_type = button_attach
  TechCardZipperApplication zipper_application = 6; // machine_type = zipper_setting
}

// TechCardOperation is one sewing step of the assembly order (Sheet «Обработка»).
//
// THE BREAK (operations were never filled on prod, so this is one clean cut, not a migration
// path). Eleven fields left, and they left for three different reasons:
//
//   (a) THE CODE WROTE THEM, NOT A PERSON. `machine` and `stitches_per_cm` were filled from an
//       operation-type preset, `thread` from the linked BOM line, `placement` from the joined
//       piece names, and each was then stored as a fact and hashed into a signed digest. The
//       printed tech pack had to SUBTRACT `thread` from the material list to stop printing the
//       same string twice — a repair for a duplication that should not have existed.
//   (b) NOBODY READ THEM. `needle` duplicated material_thread_attr.needle_reco, which the thread
//       article already carries, and no consumer anywhere read the operation's copy.
//   (c) THEY ASKED A QUESTION WITH NO SINGLE ANSWER. `node` («узел / что», REQUIRED) offered a
//       list mixing seams, garment areas, pieces and materials, and repeated the verb the type
//       field already held. A working pattern-maker could not fill it and asked whether it was
//       needed. It is not replaced by an optional title: an optional field asking the same
//       unanswerable question just gets answered differently on every card.
//
// WHAT A STEP IS NOW: a verb (operation_type), a place (zone), what it joins (piece_line_keys)
// and what it consumes (bom_line_keys), and how long it takes (smv). Its heading is COMPOSED —
// «join · side seams · Front + Back» — never typed.
//
// EXACTLY TWO FIELDS ARE REQUIRED, and both are closed lists: operation_type and zone. Nothing
// with free input is mandatory ever again; that pairing is what made `node` a trap.
//
// EVERYTHING BELOW «отклонения» IS AN OVERRIDE: unset means INHERIT from the card
// (TechCardConstruction, and TechCard.required_seam_allowance_mm for the allowance), which
// inherits from the workshop. The inherited value is shown as a placeholder and NEVER written
// into the row — the day it is written, «the technologist decided 4 st/cm» stops being
// distinguishable from «it defaulted to 4», which is precisely today's defect.
// ── ВЫНОСКИ НА ФОТО УЗЛА ────────────────────────────────────────────────────────────────────────
//
// Выноска отвечает швее на два вопроса, которые не помещаются в текст шага: ЧТО тут делать и ПО
// КАКОМУ РАЗМЕРУ. Поэтому она живёт поверх снимка узла, а не в описании.
//
// ЗАКРЫТЫЙ СЛОВАРЬ `kind`, А НЕ СВОБОДНЫЕ ОСИ. Проектировался набор осями (якорь × геометрия ×
// лидер × подпись), но хранить оси независимыми полями значит валидировать комбинаторику
// бессмыслицы: скобка с одной точкой, номер на мерке, лидер у того, у чего нет якоря. Вид —
// одно значение, и оно определяет и число точек, и что рисуется, и чем является текст.
//
// СООБЩЕНИЕ НЕ ЗНАЕТ СЛОВА «ОПЕРАЦИЯ». Тот же тип пригодится карточному эскизу, детали кроя и
// примерке — им нужно будет лишь своё поле, а не свой формат выноски.
enum TechCardAnnotationKind {
  TECH_CARD_ANNOTATION_KIND_UNKNOWN = 0;
  // 1 точка. Номер — позиция в списке; текст — заметка, читается в легенде.
  TECH_CARD_ANNOTATION_KIND_PIN = 1;
  // 1 точка + плашка. Текст — подпись, лидер-стрелка строится сам.
  TECH_CARD_ANNOTATION_KIND_LABEL = 2;
  // 2 точки. Размерная линия с засечками; текст — значение с единицами («6 мм»).
  TECH_CARD_ANNOTATION_KIND_DIM = 3;
  // 2 точки. Скобка над участком; текст — что с этим участком делать.
  TECH_CARD_ANNOTATION_KIND_BRACKET = 4;
  // 2..8 точек. Одна подпись, ветвящаяся к нескольким местам («закрепки ×3»).
  TECH_CARD_ANNOTATION_KIND_MULTI = 5;
  // 3 точки: начало, ТОЧКА НА КРИВОЙ, конец. Дуга — единственный способ показать линию, которая на
  // изделии не прямая: посадку оката, скругление борта, ход отделочной строчки по кокетке. Отрезком
  // это не сказать, а ломаной из десяти точек — сказать нельзя дважды одинаково.
  //
  // Средняя точка ЛЕЖИТ НА КРИВОЙ, а не управляет ей со стороны. Управляющая точка Безье не
  // принадлежит кривой, и технолог, ставящий её мышью, каждый раз промахивается мимо линии, которую
  // рисует; из трёх точек НА кривой управляющая считается однозначно (2·P1 − (P0+P2)/2).
  TECH_CARD_ANNOTATION_KIND_ARC = 6;
  // 3..40 точек. ЗАМКНУТЫЙ КОНТУР — область, а не линия: «эту зону продублировать клеевой»,
  // «здесь настрочить». Ни мерка, ни скобка область не выражают: они говорят про отрезок, а
  // порок ткани и участок дублирования имеют форму пятна.
  //
  // Замыкание ПОДРАЗУМЕВАЕТСЯ и последней точкой не дублируется. Хранить повторение первой точки
  // значило бы завести два места для одной координаты, которые однажды разойдутся: правка первой
  // точки не догнала бы копию, и контур разомкнулся бы на волосок — незаметно на экране и
  // предательски на печати.
  TECH_CARD_ANNOTATION_KIND_POLYGON = 7;
  // 2..200 точек. СВОБОДНЫЙ СЛЕД МАРКЕРА — ломаная без правил, «обвёл и показал». Существует не
  // вместо чертёжных видов, а рядом с ними: разговор у стола идёт быстрее, чем ставится мерка, и
  // набросок, который не сделали, не заменяется точной фигурой, которую не сделали тоже.
  //
  // Верхний предел — не вкус: точки лежат decimal-парами в JSON, и след, снятый с каждого
  // движения мыши, набирает тысячи за секунду. Клиент прореживает след ДО отправки, поэтому 200
  // здесь потолок, а не норма.
  TECH_CARD_ANNOTATION_KIND_INK = 8;
}

// Цвет выноски. ЗАКРЫТЫЙ СПИСОК, а не свободный hex: лист швеи печатается и на чёрно-белом
// принтере, и произвольный цвет там превратился бы в неразличимый серый. Значение по умолчанию
// (UNKNOWN) — чернильный, то есть тот же, каким рисуется всё остальное на листе; цвет РАЗЛИЧАЕТ
// пересекающиеся выноски, а не кодирует смысл — смысл несёт вид и текст.
enum TechCardAnnotationColor {
  TECH_CARD_ANNOTATION_COLOR_UNKNOWN = 0; // чернильный
  TECH_CARD_ANNOTATION_COLOR_RED = 1;
  TECH_CARD_ANNOTATION_COLOR_BLUE = 2;
  TECH_CARD_ANNOTATION_COLOR_GREEN = 3;
  TECH_CARD_ANNOTATION_COLOR_ORANGE = 4;
  // Белый. Единственный цвет, который читается на тёмной ткани, — а тёмная ткань это половина
  // снимков узла. На бумаге он не исчезает: отрисовка кладёт под белую линию тёмное гало, поэтому
  // на белом листе видно контур, а на чёрном снимке — саму линию.
  TECH_CARD_ANNOTATION_COLOR_WHITE = 5;
}

// Точка выноски в НОРМАЛИЗОВАННЫХ координатах кадра (0..1) — та же система, что у pos_x/pos_y
// карточных выносок. Decimal, а не float: промежуточный ввод и круговой рейс без потерь, и один
// тип на обе системы координат карточки.
message TechCardAnnotationPoint {
  google.type.Decimal x = 1;
  google.type.Decimal y = 2;
}

message TechCardAnnotation {
  TechCardAnnotationKind kind = 1;
  // Число точек определяется видом и проверяется сервером: PIN/LABEL — 1, DIM/BRACKET — 2,
  // ARC — 3, MULTI — от 2 до 8.
  repeated TechCardAnnotationPoint points = 2;
  string text = 3;
  // Положение плашки с текстом, 0..1. Лидер НЕ хранится — он строится от плашки к якорю по
  // правилу отрисовки; хранить его значило бы хранить производное и дать ему разойтись.
  google.type.Decimal label_x = 4;
  google.type.Decimal label_y = 5;
  TechCardAnnotationColor color = 6;
  // ДЕТАЛЬ КРОЯ, О КОТОРОЙ ЭТА ВЫНОСКА. Стабильный line_key детали ЭТОЙ ЖЕ карточки — тот же ключ,
  // которым деталь адресуют вход операции и назначение материала, а не имя: имя переживает
  // переименование хуже, чем ссылка.
  //
  // ССЫЛКА СОВЕТУЮЩАЯ, а не проверяемая. Указание можно поставить раньше, чем деталь заведена
  // (снимок узла приходит с примерки, детали кроя рождаются из чертежа позже), и отказ сохранения
  // всей карточки из-за неразрешимого ключа стоил бы дороже, чем висящая ссылка: клиент показывает
  // «деталь удалена», человек перевыбирает. Ровно так же ведут себя piece_line_keys операции.
  //
  // УСТАРЕЛО в пользу piece_line_keys ниже, но не снято: клиент, который про список не знает,
  // по-прежнему шлёт и читает это поле. Сервер отдаёт его ПЕРВЫМ элементом списка.
  string piece_line_key = 7;
  // ПУНКТИР ВМЕСТО СПЛОШНОЙ. На чертеже это различие несёт смысл, а не украшает: сплошная —
  // то, что видно и делают, пунктир — построение, припуск, линия под слоем. Поэтому поле входит
  // в подпись секции, как и сам вид, а не остаётся оформлением вроде цвета.
  //
  // У PIN линии нет вовсе, и сервер приводит поле к false: два способа записать одно и то же
  // «нечего рисовать пунктиром» разошлись бы в отпечатке.
  bool dashed = 8;
  // ЗАШТРИХОВАТЬ ОБЛАСТЬ ПОД ПОЛИГОНОМ. Контур говорит «вот эта граница», штриховка — «вот эта
  // площадь»; на дублировании и на пороке ткани это разные указания.
  //
  // Только у POLYGON. У прочих видов заливать нечего, и сервер приводит поле к false, а не
  // отвергает карточку: бессмысленный флаг это не порча данных, а отказ здесь стоил бы дороже,
  // чем молчаливое приведение к тому единственному, что поле могло бы значить.
  bool filled = 9;
  // ДЕТАЛИ КРОЯ, О КОТОРЫХ УКАЗАНИЕ. Список, а не одна: узел законно собирает несколько деталей
  // сразу — «втачать рукав в пройму» это и рукав, и полочка, и спинка, и указание на снимке
  // относится ко всем трём. Одиночным полем это выражалось выбором «какая из них главная»,
  // которого у шва нет.
  //
  // СОВМЕСТИМОСТЬ БЕЗ ФЛАГА ПРИСУТСТВИЯ: пустой список читается как [piece_line_key], непустой
  // вытесняет старое поле целиком. Клиенту, который шлёт только piece_line_key, ничего менять не
  // нужно; сервер отдаёт оба, и piece_line_key = первый элемент списка.
  repeated string piece_line_keys = 10;
}

// Одна картинка операции со своими выносками. Картинка ОПЕРАЦИОННАЯ: она принадлежит шагу, а не
// карточке, и вложенность делает невалидную ссылку невыразимой — в отличие от карточных выносок,
// которые операция адресует НОМЕРОМ, а номер позиционный и переживает пересортировку шагов плохо.
message TechCardOperationMedia {
  int32 media_id = 1; // FK media(id)
  string caption = 2;
  repeated TechCardAnnotation annotations = 3;
}

message TechCardOperation {
  // --- core: what, where, with what, how long -------------------------------------------------
  int32 operation_number = 8; // human step number (10, 20, …); 0 = derive from position
  TechCardOperationType operation_type = 14; // REQUIRED — the verb; UNKNOWN is rejected on write
  TechCardGarmentZone zone = 17; // REQUIRED — where on the garment; UNKNOWN is rejected on write
  // The cut pieces this step joins. Advisory when empty (a step can legitimately be drafted
  // before its pieces exist) — never a save error.
  repeated string piece_line_keys = 21;
  // The BOM lines this step consumes — thread, fusing, the zip it sets. Also advisory when empty.
  repeated string bom_line_keys = 23;
  google.type.Decimal smv = 25; // minutes. THE only time field; the legacy time_norm is gone
  int32 callout_number = 16; // links to a TechCardCallout.number; 0 = none

  // --- отклонения от стандарта: unset = inherit, never materialised -----------------------------
  // STITCHES PER CENTIMETRE — density is quoted per cm in every language and is NOT part of the
  // millimetre switch below.
  google.type.Decimal stitches_per_cm = 4;
  TechCardSeamClass seam_class = 26; // UNKNOWN = inherit construction.default_seam_class
  // MILLIMETRES (the whole allowance chain is mm: workshop → card → step). Unset = inherit
  // TechCard.required_seam_allowance_mm. ZERO IS A REAL SETTING here as everywhere else in that
  // chain — «our patterns carry the cut line» — and must never collapse into «not set».
  optional google.type.Decimal seam_allowance_mm = 27;
  TechCardTopstitch topstitch = 28;
  TechCardAttachmentKind attachment_kind = 29;
  optional google.type.Decimal attachment_size_mm = 30; // binder 32/8 etc.; needs attachment_kind

  // --- «на чём»: the machine block, for operation_type = MACHINE ---------------------------------
  // REQUIRED when the step is MACHINE (on an aware write); rejected on any other type. This is the
  // second axis: the verb is above, the machine is here.
  TechCardMachineType machine_type = 31;
  // Points at ONE profile of construction.equipment_defaults BY KEY — the card may hold several
  // machines of the same type, and «the overlock» is then not an answer. Empty = resolve by type
  // (used only when the card has exactly one profile of that type). A key naming no profile in the
  // payload DETACHES to unset rather than failing the save (the callout precedent: tidying the
  // defaults must not block saving the steps); a key naming a profile of a DIFFERENT machine type
  // is a FieldViolation, because that is two answers to one question.
  string machine_profile_key = 32;
  // Overrides. Unset = INHERIT (step → profile → card defaults) and the inherited value is NEVER
  // written into the row: the day it is, «the technologist chose 4» stops being distinguishable
  // from «it defaulted to 4».
  int32 thread_count = 33;
  TechCardNeedleType needle_type = 34;
  int32 needle_size_nm = 35;
  TechCardThreadTension thread_tension = 36;
  string thread_tension_note = 37; // only alongside the scale — a note with no tension states nothing
  // Stitch WIDTH — the zigzag amplitude, the bite of an overlock / coverstitch. NOT
  // topstitch.width_mm, which is a distance from an edge; the two are different facts and the
  // labels must stay different everywhere they are printed.
  google.type.Decimal stitch_width_mm = 38;
  // Stitch LENGTH is deliberately absent: density (stitches_per_cm, above) is the stored truth and
  // length is 10 / density, computed wherever it is shown. One number, written once.
  //
  // bed_type and automation are ALSO deliberately absent from a step: they are machine identity.
  // A step that needs a different bed needs a different machine_type.

  // --- the ВТО block, for operation_type = PRESS / PRESS_OPEN / FUSING ---------------------------
  TechCardPressEquipment press_equipment = 39; // REQUIRED for a press step on an aware write
  string press_profile_key = 40; // same key rules as machine_profile_key
  int32 press_temperature_c = 41;
  int32 press_dwell_sec = 42;
  google.type.Decimal press_pressure_n_cm2 = 43; // N/cm², the unit is in the name
  optional bool press_steam = 44; // absent = inherit; false = «без пара», a real instruction
  TechCardPressCloth press_cloth = 45; // NONE cancels the profile's press cloth

  // --- the only free text left ------------------------------------------------------------------
  // One box, not two: `description` and `note` sat side by side with no rule saying which was
  // which, which guarantees two cards fill them the opposite way round.
  string note = 7;

  // --- OUTPUT ------------------------------------------------------------------------------------
  repeated int64 piece_ids = 22; // resolved FKs to the cut-pieces, in the order given
  repeated int64 bom_item_ids = 24; // resolved FKs to the BOM lines, in the order given

  // --- сборка: что шаг берёт со стола и что производит -----------------------------------------
  // ЕДИНЫЙ упорядоченный список входов шага: каждый ключ — либо TechCardPiece.line_key (деталь),
  // либо output_unit_key более раннего шага (узел). Предпочтительная форма.
  //
  // piece_line_keys (21) остаётся легаси-проекцией «только детали»: она принимается от
  // неосведомлённой записи и ЭМИТИТСЯ НА ЧТЕНИИ ВСЕГДА. Ни номер 21, ни его имя не
  // освобождаются никогда: имена полей в JSON REST-гейтвея производны от прото-имён, и на них
  // держится разбор архивных релизных снапшотов, которые хранятся вербатимным protojson.
  //
  // Осведомлённая запись (assembly_aware) берёт входы отсюда, а 21 игнорирует: одно поле — один
  // источник истины на запись. Но РАЗБИРАЮТСЯ эти поля всегда, независимо от флага: флаг
  // объявляет способность бандла, а не выключает поля. Иначе серверный round-trip (клон сезона
  // строит payload сам и флага не несёт) молча стёр бы всю разметку.
  repeated string input_keys = 46;
  // Код узла, который производит шаг («SHELL», «FRONT-L»). Пусто = шаг ничего не собирает, это
  // ОБРАБОТКА: его входы остаются доступными следующим шагам (отстрочка по готовому узлу, ВТО).
  //
  // Ключ, совпадающий с одним из input_keys-УЗЛОВ, — ПОГЛОЩЕНИЕ: узел сохраняет идентичность и
  // получает содержимое (GARMENT + HEM → GARMENT). Без поглощения граф не сходится, потому что
  // большинство поздних шагов именно таковы.
  //
  // Совпадение с input_keys-ДЕТАЛЬЮ поглощением НЕ является и отклоняется: у деталей и узлов
  // одно пространство имён. Джойну нужно не меньше двух РАЗЛИЧНЫХ СУЩЕСТВУЮЩИХ входов — «узел
  // из одного входа» это обработка, а не узел. Сравнение ключей ПОБАЙТНОЕ: «SHELL» и «Shell» —
  // два разных узла.
  string output_unit_key = 47;
  // Человеческое имя узла («корпус», «полочка левая в сборе»). Хранится на первом производящем
  // шаге; поглощающий шаг может его не повторять — на чтении имя разрешается по первому
  // производителю. Имя без ключа — теневое значение, отклоняется. В дайджест секции НЕ входит:
  // имя не факт цеха, и хешировать его значило бы протухать подпись от невидимой правки.
  string output_unit_name = 48;
  // Фотографии этого шага с выносками. До 10 на шаг, до 30 выносок на картинку — пределы
  // проверяет сервер. Порядок списка — порядок показа и печати.
  repeated TechCardOperationMedia media = 49;

  // --- виды операций: блоки настроек новых глаголов (16..24) ------------------------------
  // ДЫРА 50 — за полем `tooling_key` фазы оснастки, которая придёт отдельно. Номер
  // НЕ объявлен `reserved` НАМЕРЕННО: reserved закрыл бы его навсегда, а он обещан
  // конкретному будущему полю. То же верно про 62 и 64 ниже.
  //
  // Каждое семейство — ОТДЕЛЬНОЕ СООБЩЕНИЕ, а не набор плоских полей: отсутствующий блок
  // значит «бандл про это семейство молчит», и это единственный способ дать неосведомлённому
  // клиенту сохранить шаг, не стерев того, чего он не показывает. В базе они лежат плоскими
  // колонками — ровно как TechCardTopstitch.
  //
  // ВТО-БЛОК (39..45) ЛЕГАЛЕН ТАКЖЕ ПРИ PRINT — термопресс это то же оборудование, и
  // второй комплект тех же полей был бы дублём, — кроме print_method = LASER_ENGRAVE, где прижима
  // нет вовсе. press_equipment при PRINT ОПЦИОНАЛЕН: REQUIRED-if-aware он остаётся только у
  // PRESS / PRESS_OPEN / FUSING.
  //
  // zone = OTHER — ЗАКОННЫЙ ответ финишных глаголов (THREAD_TRIM, CLEAN, INSPECT, FOLD, PACK,
  // WET_PROCESS): «нитки по всему изделию» области не имеет. FOLD и PACK полей не несут вовсе.

  // Метод печати — REQUIRED при PRINT, отвергается при любом другом глаголе. Живёт полем шага, а
  // не внутри блока `print`: обязательное поле не прячут в необязательное сообщение, которого
  // может не быть вовсе.
  TechCardPrintMethod print_method = 51;
  TechCardOperationStitching stitching = 52; // только MACHINE
  // ИМЯ ПОЛЯ — `placement_layout`, А НЕ `placement`: имя «placement» стоит в reserved-списке ИМЁН
  // ниже (легаси-поле свободного текста), и protoc отверг бы файл. Снять имя с reserved нельзя:
  // JSON-ключи легаси-полей держат разбор архивных релизных снапшотов. Колонки при этом
  // остаются placement_count / pitch_mm, а сообщение — TechCardOperationPlacement.
  TechCardOperationPlacement placement_layout = 53; // MACHINE | HARDWARE_SET | PRINT
  TechCardOperationHardware hardware = 54; // HARDWARE_SET целиком; MACHINE + цикловые — частично
  TechCardOperationPrint print = 55; // только PRINT
  TechCardOperationWeld weld = 56; // MACHINE + явный seam_taping | ultrasonic_welder
  TechCardOperationTrim trim = 57; // только TRIM
  TechCardOperationThreadTrim thread_trim = 58; // только THREAD_TRIM
  TechCardOperationClean clean = 59; // только CLEAN
  TechCardOperationInspect inspect = 60; // только INSPECT
  // Вид мокрой обработки — REQUIRED при WET_PROCESS, отвергается при прочих. Полем, а не блоком:
  // семейство состоит из одного факта, и сообщение вокруг него было бы пустой обёрткой.
  TechCardWetProcessKind wet_process_kind = 61;
  // 62 — ДЫРА: номер обещан полю `properties` фазы расширяемых свойств. `reserved` НЕ ставить.
  TechCardOperationFastening fastening = 63; // только MACHINE + явный machine_type по каждому полю
  // 64 — ДЫРА: номер обещан блоку `TechCardOperationHandwork handwork`. Оба его поля
  // (handwork_kind, handwork_thread) отложены, само сообщение не заводится, и хвост дайджеста
  // "handwork" не рождается вовсе. `reserved` НЕ ставить.

  reserved 1, 2, 3, 5, 6, 9, 10, 11, 12, 13, 15, 18, 19, 20;
  reserved "node", "description", "seam_type", "topstitch_width", "thread", "machine", "seam_allowance", "needle", "time_norm", "attachment", "bom_item_index", "placement", "bom_line_key", "bom_item_id";
}

// TechCardIssueSeverity ranks a flagged construction issue.
enum TechCardIssueSeverity {
  TECH_CARD_ISSUE_SEVERITY_UNKNOWN = 0; // defaults to MEDIUM on write
  TECH_CARD_ISSUE_SEVERITY_LOW = 1;
  TECH_CARD_ISSUE_SEVERITY_MEDIUM = 2;
  TECH_CARD_ISSUE_SEVERITY_HIGH = 3;
}

// TechCardIssueStatus is the resolution state of a flagged issue.
enum TechCardIssueStatus {
  TECH_CARD_ISSUE_STATUS_UNKNOWN = 0; // defaults to OPEN on write
  TECH_CARD_ISSUE_STATUS_OPEN = 1;
  TECH_CARD_ISSUE_STATUS_RESOLVED = 2;
  TECH_CARD_ISSUE_STATUS_WONTFIX = 3;
}

// TechCardIssue is a maker-flagged problem ("this seam is impossible") against an
// operation or callout (Sheet «Обработка» / «Тех. эскиз»).
message TechCardIssue {
  int32 operation_number = 1; // the operation it concerns; 0 = none
  int32 callout_number = 2; // the sketch callout it concerns; 0 = none
  string raised_by = 3; // who flagged it (e.g. seamstress)
  TechCardIssueSeverity severity = 4; // UNKNOWN defaults to MEDIUM
  TechCardIssueStatus status = 5; // UNKNOWN defaults to OPEN
  string description = 6; // what is hard / impossible (required)
  string resolution_note = 7;
}

// TechCardLabel is one label / tag spec (Sheet «Этикетки и упаковка»).
// TechCardLabel is the garment's label/tag SPEC — one of the three historically-unconnected "label"
// concepts (S21): (a) THIS spec, (b) the shipment label (common/shipment.proto — a shipping document,
// deliberately NOT merged, a different domain), (c) the label MATERIAL as a BOM line
// (tech_card_bom_item, section=label). WS7 unifies (a)↔(c) via bom_item_id below, and classifies the
// auxiliary item via TechCard.aux_subtype. DEPRECATION (destructive → M3, not done here): once
// bom_item_id + aux_subtype are adopted, label_type collapses into aux_subtype and the free-text
// content/placement/attachment/size overlap (also carried structurally by the linked material + the
// assembly bill's print_note/position_note) is dropped in a guarded migration.
message TechCardLabel {
  TechCardLabelType label_type = 1; // required. DEPRECATED-PENDING-M3: to be subsumed by TechCard.aux_subtype.
  string content = 2; // содержание / артикул. DEPRECATED-PENDING-M3: overlaps the linked BOM material.
  string placement = 3; // размещение. DEPRECATED-PENDING-M3: use StyleAssembly.position_note.
  string attachment = 4; // крепление. DEPRECATED-PENDING-M3: use StyleAssembly.position_note.
  string size = 5; // размер
  string note = 6;
  // WS7/§2.8 (S21 unification bridge): FK to the physical label material's BOM line
  // (tech_card_bom_item). 0 = unlinked. Links this free-text label SPEC to the material it prints on.
  int32 bom_item_id = 7;
}

// TechCardPackaging holds the packaging spec (Sheet «Этикетки и упаковка»).
message TechCardPackaging {
  string folding_method = 1; // способ складывания
  string polybag = 2; // полибэг (тип / размер)
  string bag_sticker = 3; // стикер на пакет
  string inserts = 4; // доп. вложения
  int32 units_per_box = 5; // кол-во в коробе; 0 = unset
  string box_marking = 6; // маркировка короба
  string box_dimensions = 7; // размеры короба (Д×Ш×В)
  int32 weight_net_grams = 8; // вес нетто, граммы (0 = unset)
  int32 weight_gross_grams = 9; // вес брутто, граммы (0 = unset)
  string notes = 10;
}

// TechCardCostLine is one currency bucket of the materials rollup.
message TechCardCostLine {
  string currency = 1; // empty = usage lines without a currency
  google.type.Decimal amount = 2;
}

// TechCardColorwayCost is the computed cost of ONE colourway (Sheet «Калькуляция»),
// OUTPUT-ONLY (ignored on write). Materials come from that colourway's usages; the manual
// articles (CMT/hardware/…) are shared across colourways, so unit_cost folds them in. All
// figures are per GARMENT except order_cost (whole run). No FX conversion.
message TechCardColorwayCost {
  reserved 1; // was `colorway_index` (positional into the removed TechCardInsert.colorways, R1)
  reserved "colorway_index";
  int64 colorway_id = 10; // explicit colourway id = product.id (R1/§14.3); OUTPUT-ONLY
  repeated TechCardCostLine materials_total = 2; // per-unit material cost grouped by article currency
  google.type.Decimal materials_per_unit = 6; // Σ per-garment usage cost in costing.currency (and currency-less)
  google.type.Decimal unit_cost = 7; // (materials_per_unit + shared manual articles) × (1 + defect/100), per garment
  int32 order_qty = 8; // Σ size_quantities.order_qty (same whole-run qty for every colourway)
  google.type.Decimal order_cost = 9; // unit_cost × order_qty
  bool has_unconverted_currencies = 5; // a usage currency ≠ costing.currency → excluded from materials_per_unit
  // OUTPUT-ONLY: set when at least one authored usage of THIS colourway could not be costed at all
  // (no price / unresolvable pin / no norm / per-size norms without order qty); such a line
  // contributes to NO currency bucket, so unit_cost is withheld from cost seeding for this
  // colourway and should not be trusted as complete.
  bool has_unpriced = 11;
  // OUTPUT-ONLY: set when at least one roll slot of THIS colourway was costed by AREA ESTIMATE
  // (Ф1, ступень 0) — площадь деталей ÷ раскройную ширину — instead of an authored norm.
  //
  // ЭТО NETTO, НИЖНЯЯ ГРАНИЦА. Межлекальных выпадов и концов настила в ней нет и быть не может: их
  // знает только раскладка. Число показывать МОЖНО и нужно (иначе карточка стоит ноль при полностью
  // заполненной спецификации), но подписывать им каталожную себестоимость — нельзя: сервер сам не
  // сеет cost_price с этим флагом, и клиент обязан показывать цифру как ОЦЕНКУ, а не как цену.
  bool has_estimate = 12;
  reserved 3, 4; // was materials_cost, size_run_total (superseded by the per-unit / per-order model)
}

// TechCardCosting holds the manually-entered per-unit cost articles (Sheet «Калькуляция»).
// Everything is in a SINGLE currency. The materials line and the unit/order totals are
// COMPUTED on read (output-only, ignored on write). Model: cost is built per GARMENT, then
// scaled to the whole order by order_qty. There is NO pricing here — markup/wholesale/retail
// were removed; pricing lives on the published product.
message TechCardCosting {
  // hardware_cost / packaging_cost were REMOVED (production-costing Phase 2, plan 01 §1.1): both
  // duplicated first-class BOM sections priced through the per-colourway recipe — a flat per-unit
  // scalar cannot express a colourway that swaps a metal zip for nylon, and the packaging scalar
  // had no double-count guard at all. Migration 0237 moved draft cards' scalars into synthetic BOM
  // lines (consumption 1 per colourway); exceptions (double-counted / zero-colourway / non-draft
  // cards) are recorded in tech_card_costing_migration_exception for manual review. Hardware and
  // packaging money now flows ONLY through the BOM into the computed materials figures below.
  reserved 2, 3;
  reserved "hardware_cost", "packaging_cost";

  // manual per-unit cost articles (per ONE garment), all in `currency`.
  google.type.Decimal cmt_cost = 1; // пошив / работа (CMT) за 1 изделие
  google.type.Decimal logistics_cost = 4; // логистика / доставка, за 1 изделие
  google.type.Decimal overhead_cost = 5; // накладные расходы, за 1 изделие
  google.type.Decimal defect_percent = 6; // брак / запас (%), 0..100
  string currency = 10; // ISO 4217 — the single currency for every article and total
  string notes = 11;
  // target_margin_pct is the gross margin this STYLE is expected to make, 0..100. It is the number
  // the costing waterfall measures the achieved margin against; without it the admin had to carry a
  // hard-coded house constant. 0 / unset = fall back to the house default (alert_setting
  // `target_margin_pct`), which is what effective_target_margin_pct below resolves to.
  google.type.Decimal target_margin_pct = 26;

  // OUTPUT-ONLY computed rollup (ignored on write). Root figures are the PRIMARY colourway
  // (colorways index 0); per-colourway figures are in colorway_costs. Materials come from the
  // BOM via each colourway's usages, normalised to a PER-GARMENT figure (a usage graded only
  // per size is divided by order_qty), then taken in the single `currency` — a BOM line in
  // another currency is flagged in has_unconverted_currencies and left out of materials_per_unit
  // (it still appears in materials_total under its own currency, never silently dropped).
  repeated TechCardCostLine materials_total = 12; // per-unit material cost (colourway 0) grouped by article currency
  google.type.Decimal materials_per_unit = 19; // Σ per-garment material cost (colourway 0) in `currency`
  google.type.Decimal unit_cost = 20; // (materials_per_unit + cmt + logistics + overhead) × (1 + defect/100); hardware/packaging ride inside materials via the BOM
  int32 order_qty = 21; // Σ size_quantities.order_qty (the whole production run)
  google.type.Decimal order_cost = 22; // unit_cost × order_qty
  bool has_unconverted_currencies = 15; // a material line (colourway 0) is in a currency other than `currency`
  // OUTPUT-ONLY: set when at least one authored usage of the PRIMARY colourway could not be costed
  // at all (no price / unresolvable pin / no norm / per-size norms without order qty); such a line
  // contributes to NO currency bucket, so unit_cost/unit_cost_base are withheld from cost seeding
  // and should not be trusted as complete.
  bool has_unpriced = 30;
  // OUTPUT-ONLY: the root rollup was costed, in part, by AREA ESTIMATE (Ф1, ступень 0). Same
  // meaning and same warning as TechCardColorwayCost.has_estimate: netto, lower bound, shown but
  // never seeded into the catalogue.
  bool has_estimate = 31;
  google.type.Decimal total_sam = 16; // Σ operation smv, time_norm where smv is unset (minutes); informative
  repeated TechCardColorwayCost colorway_costs = 18; // OUTPUT-ONLY, per colourway

  // OUTPUT-ONLY base-currency rollup. The unit/order cost of the primary colourway folded into
  // the base currency via the manual costing FX rates. Set ONLY when every currency involved
  // has a rate — this is the figure the product-cost seed uses, so a non-base costing can seed
  // cost_price too. Absent when a needed rate is missing (then has_unconverted_currencies).
  google.type.Decimal unit_cost_base = 23; // unit_cost converted to base_currency
  google.type.Decimal order_cost_base = 24; // unit_cost_base × order_qty
  string base_currency = 25; // the base currency the *_base figures are in

  // OUTPUT-ONLY: the target margin actually in force for this style — target_margin_pct above when
  // set, otherwise the house default from alert_setting. Resolved here so the costing tab needs one
  // read (already gated by costing:read) instead of a second, analytics-gated settings call.
  google.type.Decimal effective_target_margin_pct = 27;

  // OUTPUT-ONLY VAT context for the margin on this read: which country's rate the colourway
  // net_prices were computed at, and what that rate is. Surfaced so the tab can SAY which market it
  // is showing a margin for instead of presenting one number as if it were universal.
  //
  // The rate comes from the same `vat_rate` table the order snapshot, the accounting VAT engine and
  // the margin-by-style report read — deliberately not a second, costing-owned copy that could drift
  // from them. vat_rate_pct is unset when the country has no rate on file (export: nothing to net).
  string vat_country_code = 28;
  google.type.Decimal vat_rate_pct = 29;

  reserved 7, 8, 9; // pricing removed (markup_multiplier, wholesale_price, retail_price — moved to product)
  reserved 13, 14, 17; // was materials_cost, total_cost, labour_cost (superseded / removed)
}

// TechCardInsert is the writable payload for a tech card. Nested lists are full
// replacements on update (like ColorwayNew).
// TechCardSignoffSection is the sheet a sign-off covers.
enum TechCardSignoffSection {
  TECH_CARD_SIGNOFF_SECTION_UNKNOWN = 0;
  TECH_CARD_SIGNOFF_SECTION_DESIGN = 1;
  TECH_CARD_SIGNOFF_SECTION_CONSTRUCTION = 2;
  reserved 3; // was TECH_CARD_SIGNOFF_SECTION_POM (POM removed)
  TECH_CARD_SIGNOFF_SECTION_MATERIALS = 4;
  TECH_CARD_SIGNOFF_SECTION_COLOUR = 5;
  TECH_CARD_SIGNOFF_SECTION_LABELS = 6;
  TECH_CARD_SIGNOFF_SECTION_PACKAGING = 7;
  TECH_CARD_SIGNOFF_SECTION_COSTING = 8;
}

// TechCardSignoffState is the sign-off decision for a section.
enum TechCardSignoffState {
  TECH_CARD_SIGNOFF_STATE_UNKNOWN = 0; // defaults to PENDING on write
  TECH_CARD_SIGNOFF_STATE_PENDING = 1;
  TECH_CARD_SIGNOFF_STATE_APPROVED = 2;
  TECH_CARD_SIGNOFF_STATE_REJECTED = 3;
}

// TechCardSignoff records one responsible role's sign-off of a sheet, so the
// header approval_state isn't the only gate (Sheet «Титул» coordination).
message TechCardSignoff {
  TechCardSignoffSection section = 1; // required; unique per card
  TechCardSignoffState state = 2; // UNKNOWN defaults to PENDING
  string signed_by = 3; // who signed (free text / role name)
  google.protobuf.Timestamp signed_at = 4;
  string note = 5;
  // signed_digest is the fingerprint of THIS SECTION's content at the moment it was signed, so
  // "changed since sign-off" survives a page reload. Compare it against the matching entry in
  // TechCard.section_digests: equal = the sheet still says what was approved; different = it was
  // edited afterwards and the sign-off is stale.
  //
  // Server-COMPUTED, but the caller controls WHEN. Send it back as you read it on an ordinary save
  // and it is carried through untouched, so an approval keeps pointing at the content it actually
  // covered. Send it EMPTY to mean "I am approving this now" — the server then fingerprints the
  // payload being written, which is the only moment it can be sure the digest describes what the
  // approver looked at. That is also how a re-approval after review clears a stale flag.
  //
  // The server never simply re-stamps on every save: doing so would let a save that edits the BOM
  // silently re-bless the materials sign-off against its own new content, which is precisely the
  // failure this field exists to catch. A pending or rejected section carries no digest.
  //
  // Deliberately per-section, not the card's lock_version: a costing edit must not invalidate the
  // design sign-off, and a lock_version comparison cannot tell those apart.
  string signed_digest = 6;
}

// TechCardSectionDigest is the current fingerprint of one sign-off section's content (see
// TechCardSignoff.signed_digest). OUTPUT-ONLY, recomputed on every read.
message TechCardSectionDigest {
  TechCardSignoffSection section = 1;
  string digest = 2;
}

// TechCardPieceColorwayMaterial maps ONE cut-piece to its fabric (and optional fusing) for ONE
// colourway. The colourway is addressed by an explicit colorway_id = product.id (R1/§14.3); the old
// positional colorway_index into TechCardInsert.colorways is gone (colourways are no longer style
// children). The BOM refs remain positional into TechCardInsert.bom_items.
message TechCardPieceColorwayMaterial {
  reserved 1; // was `colorway_index` (positional into the removed TechCardInsert.colorways, R1)
  reserved "colorway_index";
  int64 colorway_id = 5; // explicit colourway id = product.id (R1/§14.3)
  optional int32 bom_item_index = 2; // 0-based index into TechCardInsert.bom_items (the fabric)
  optional int32 fusing_bom_item_index = 3; // 0-based index into bom_items (the fusing / клеевая), if any
  string note = 4;
  // bom_line_key / fusing_bom_line_key reference the fabric / fusing BOM line by its stable line_key
  // (WS3 follow-up: positionality off the wire). Preferred over the positional *_index (kept for the
  // transition). The store resolves them to the real FKs bom_item_id / fusing_bom_item_id (output).
  string bom_line_key = 6;
  string fusing_bom_line_key = 7;
  int64 bom_item_id = 8; // OUTPUT: resolved FK to the fabric BOM line
  int64 fusing_bom_item_id = 9; // OUTPUT: resolved FK to the fusing BOM line
}

// TechCardPieceDxfAlias maps one DXF block name to a cut-piece, SCOPED to the cloth it is cut from.
// The canonical piece name lives only in TechCardPiece.name; block names are per-file exporter noise
// («PERED_S», «front-38»), so the same generic name in different cloths' files maps independently
// while any spelling within one cloth's files (all its size DXFs) resolves to one piece.
//
// Since 0267 the scope is a НАЗНАЧЕНИЕ (fabric_purpose) where the card has been sorted and the
// legacy bom_line_key where it has not: scope = fabric_purpose, else bom_line_key. The DB UNIQUE
// moved with it and is case-insensitive per (card, scope, block) — computed from the generated
// column scope_key so the index and the server agree by construction. Swapping the purpose into the
// OLD (card, line, block) index instead would have turned two same-named blocks of two lines sharing
// one purpose into a duplicate, and a duplicate fails the WHOLE card save.
message TechCardPieceDxfAlias {
  // bom_line_key is the LEGACY scope, and on a purpose-scoped row it is compatibility: the writer
  // records the line here too when the purpose owns exactly ONE line, and leaves it empty when the
  // purpose owns several (there is no single honest answer then). Required only when fabric_purpose
  // is UNSET — one of the two must name something.
  string bom_line_key = 1;
  string block_name = 2; // DXF block name, normalized (trim + inner whitespace collapsed); required
  string piece_line_key = 3; // the cut-piece, by its stable TechCardPiece.line_key; required
  // fabric_purpose is the scope proper (UNSET = not purpose-scoped; the row falls back to
  // bom_line_key). No explicit presence here and none needed: the alias SET already carries presence
  // as a whole (TechCardPieceDxfAliasSet) and each row is written whole, so an omitted field on a
  // row that IS being written means «this row is line-scoped», never «leave the stored value alone».
  TechCardBomPurpose fabric_purpose = 4;
}

// TechCardPieceDxfAliasSet is a presence wrapper: proto3 cannot distinguish an EMPTY repeated field
// from an ABSENT one, and these aliases follow the pattern-binding precedent — a stale client that
// predates the feature must not wipe mappings it never saw. Message ABSENT → the server carries the
// stored aliases forward untouched; message PRESENT → its items are the new full set (empty items
// clears all). New clients always send it, round-tripping what they read.
message TechCardPieceDxfAliasSet {
  repeated TechCardPieceDxfAlias items = 1;
}

// TechCardPiece is one structural cut-piece of the garment (полочка, спинка, обтачка горловины…):
// how many per garment, whether mirrored/paired, its grainline (долевая) and whether it is fused
// (клеевая). materials picks, per colourway, which BOM fabric it is cut from. Full-replace child.
message TechCardPiece {
  string name = 1; // «полочка», «спинка», «обтачка горловины»…
  int32 pieces_per_garment = 2; // how many times cut per garment (default 1)
  // ОТСТАВЛЕНО (миграция 0266). Означало «деталь кроится зеркальной парой», и cut list удваивал
  // по нему pieces_per_garment. Функцией не пользовались; 0266 свернул удвоение в само количество
  // и погасил флаг, поэтому сервер больше НИЧЕГО по нему не считает. Поле оставлено, чтобы старая
  // строка доезжала без потерь — но описывать им правило больше нельзя, иначе следующий читатель
  // вернёт удвоение.
  bool mirrored = 3;
  string grainline = 4; // долевая: lengthwise|crosswise|bias|any
  bool fused = 5; // клеевая (fused with interlining)
  optional int32 callout_number = 6; // link to a sketch callout pin (like operations)
  string note = 7;
  repeated TechCardPieceColorwayMaterial materials = 8; // per-colourway fabric mapping
  // line_key is the stable client-generated ULID identity of the cut-piece (S8, mirrors BOM's
  // line_key): the store keyed-upserts by it so the piece id stays stable across saves, which is what
  // lets a colourway recipe usage hold a real piece_id FK. Empty on a legacy payload → server mints one.
  string line_key = 9;
  // detached is OUTPUT-ONLY: the store sets it when the piece's callout_number no longer resolves to a
  // callout on the card (its source sketch callout was removed) — the piece survives, visibly
  // detached, instead of being silently dropped (orphan-control, S8).
  bool detached = 10;
  // КАК КРОИТСЯ (0275). Отвечает на вопрос «как связаны эти pieces_per_garment панелей», и ничего не
  // умножает — см. TechCardPieceCutSymmetry.
  //
  // ЯВНОЕ ПРИСУТСТВИЕ, а не голый энум, по той же причине, что и fabric_direction на строке BOM:
  // вкладка со старым бандлом поля не шлёт вовсе, голый proto3-энум приехал бы как UNKNOWN и СТЁР бы
  // разметку на всех деталях карточки — а разметка, в отличие от направления, невосстановима без
  // человека с лекалами. ОТСУТСТВИЕ ⇒ сервер несёт хранимое значение дальше (store:
  // IF(:cut_symmetry_omitted, …), и та же перенос-склейка перед дайджестом, иначе подпись из такой
  // вкладки рождается устаревшей). ЯВНЫЙ UNKNOWN ⇒ очистить в «не размечено», это осознанное
  // действие. Новый клиент шлёт поле ВСЕГДА, круглым рейсом того, что прочитал.
  optional TechCardPieceCutSymmetry cut_symmetry = 11;
  // ДЕТАЛЬ НЕ ГРАДУИРУЕТСЯ (UNI). Один и тот же контур входит в комплект КАЖДОГО размера целиком:
  // карман, шлёвка, обтачка одинаковы от XS до XL, и второго контура для них не существует.
  //
  // Это ЗАЯВЛЕНИЕ КОНСТРУКТОРА, а не вывод из имени блока чертежа. Раньше безразмерность угадывалась
  // на клиенте по тому, что в имени блока нет токена размера, — и угадывание молчит ровно там, где
  // ошибается: деталь, названная без размера по небрежности, читалась как UNI и входила бы во все
  // размеры одним контуром, а градуированная деталь с размером в имени не могла быть объявлена
  // безразмерной вовсе. Флаг отвечает на вопрос один раз и хранимо.
  //
  // ПОСЛЕДСТВИЕ на замере площадей: у помеченной детали пер-размерных строк не бывает — запись
  // отказывает (ungraded_piece_measured_by_size). Обратное НЕ верно: безразмерная строка у
  // непомеченной детали остаётся законной, потому что весь массив живых карточек написан до этого
  // поля и ставит его в false.
  //
  // ЯВНОЕ ПРИСУТСТВИЕ, ровно как у cut_symmetry выше и по той же причине: вкладка со старым бандлом
  // поля не шлёт вовсе, а голый proto3-bool приехал бы как false и СТЁР бы пометку на всех деталях
  // карточки — сохранением, которое эту вкладку даже не спрашивало про градацию. ОТСУТСТВИЕ ⇒
  // сервер несёт хранимое значение дальше (store: IF(:ungraded_omitted, …), и та же перенос-склейка
  // ПЕРЕД дайджестом, иначе подпись CONSTRUCTION из такой вкладки рождается устаревшей). ЯВНЫЙ false
  // ⇒ снять пометку, это осознанное действие. Новый клиент шлёт поле ВСЕГДА, круглым рейсом того,
  // что прочитал.
  optional bool ungraded = 12;
  // КАК ИМЕННО ДУБЛИРУЕТСЯ (0304) — см. TechCardPieceFusingMode. Осмысленно только при fused=true;
  // сервер гасит разметку вместе со снятой галкой, потому что уцелевший режим при снятом fused
  // читался бы как «не дублируется», а норму давал бы полосой.
  //
  // ЯВНОЕ ПРИСУТСТВИЕ по той же причине, что у двух соседей выше, и цена ошибки та же: вкладка со
  // старым бандлом поля не шлёт вовсе, голый proto3-энум приехал бы как UNKNOWN и СТЁР бы разметку
  // на всех деталях карточки. ОТСУТСТВИЕ ⇒ сервер несёт хранимое дальше (store:
  // IF(:fusing_omitted, …), и та же перенос-склейка ПЕРЕД дайджестом, иначе подпись CONSTRUCTION из
  // такой вкладки рождается устаревшей). ЯВНЫЙ UNKNOWN ⇒ очистить в «не размечено», это осознанное
  // действие. Новый клиент шлёт поле ВСЕГДА, круглым рейсом того, что прочитал.
  //
  // ПАРА АТОМАРНА: присутствие ЭТОГО поля управляет и шириной под ним. Клиент, приславший режим,
  // обязан прислать и ширину — иначе полоса без числа досталась бы шириной от прошлой правки, то
  // есть чужой, и молча.
  optional TechCardPieceFusingMode fusing_mode = 13;
  // Ширина клеевой полосы в МИЛЛИМЕТРАХ. Обязательна и осмысленна ТОЛЬКО при STRIP: при остальных
  // режимах сервер её гасит, потому что число рядом с SEAM_ALLOWANCE спорит с эталоном припуска, и
  // спор молчаливый — на экране видно одно, в расчёте другое. Потолок 100 мм (0304): шире бывает
  // только ошибка единиц.
  //
  // Миллиметры — та же единица, что у эталона припуска (0290 перевёл его туда из сантиметров), и
  // это не совпадение: режим SEAM_ALLOWANCE берёт ширину полосы прямо из эталона. В сантиметры
  // геометрии переводит РОВНО ОДНО место — расчёт нормы, у которого на руках оба сомножителя.
  google.type.Decimal fusing_width_mm = 14;
}

// SkuSeason is the normalized style-owned season used in every SKU. The pair is atomic: callers
// either omit the whole message (early draft/idea) or provide both a known code and a 2000..2099
// year. Free-text season labels are not part of the contract.
message SkuSeason {
  SeasonEnum code = 1;
  int32 year = 2;
}

// StyleNumberSource records how a tech card's style_number was set (PLM-rework Q1): GENERATED = the
// server proposed it from the season+sequence contract (SuggestStyleNumber); MANUAL = the owner
// overrode the proposal (the value then passes the strict format validator). UNKNOWN defaults to
// GENERATED on write.
enum StyleNumberSource {
  STYLE_NUMBER_SOURCE_UNKNOWN = 0;
  STYLE_NUMBER_SOURCE_GENERATED = 1;
  STYLE_NUMBER_SOURCE_MANUAL = 2;
}

// AssemblyResolutionBasis records WHY the packing spec named (or refused to name) a warehouse bucket
// for one assembly line of one order item — the difference between "this is the black bag because the
// garment is black" and "this is the only bag there is". A packer reading a prescribed colour has to be
// able to tell a match from a substitution, and an operator facing a refusal has to be told which
// refusal it is, because each has a different fix.
//
// The three resolved values are ordered by strength; the four unresolved ones each name their own fix.
enum AssemblyResolutionBasis {
  // Not attempted: a bill read on its own (ListStyleAssembly) has no order item to resolve against.
  ASSEMBLY_RESOLUTION_BASIS_UNKNOWN = 0;
  // Resolved: an ACTIVE colour variant whose code equals the item's colourway. The real answer.
  ASSEMBLY_RESOLUTION_BASIS_COLOR_MATCH = 1;
  // Resolved by substitution: the card has exactly ONE live colour, so there is no choice to get
  // wrong (a single-colour dust bag ships with every colourway). Not a colour match — show it as such.
  ASSEMBLY_RESOLUTION_BASIS_SOLE_VARIANT = 2;
  // Resolved: the card has no colours at all and its single tech_card.output_material_id stands.
  ASSEMBLY_RESOLUTION_BASIS_LEGACY_OUTPUT = 3;
  // Unresolved: the item's colour EXISTS on this card but is RETIRED. Never auto-substituted — fix by
  // reactivating that colour, or by deciding a substitute deliberately.
  ASSEMBLY_RESOLUTION_BASIS_RETIRED_COLOR = 4;
  // Unresolved: the card has live colours, none of them this item's (and more than one, so no sole
  // fallback). Fix by adding the colour.
  ASSEMBLY_RESOLUTION_BASIS_NO_COLOR_MATCH = 5;
  // Unresolved: a bucket WAS named but its material is archived nomenclature. Fix by un-archiving it
  // or pointing the colour at a live material.
  ASSEMBLY_RESOLUTION_BASIS_ARCHIVED_MATERIAL = 6;
  // Unresolved: the component card has neither colours nor an output material — it was never wired to
  // the warehouse. Fix on the card.
  ASSEMBLY_RESOLUTION_BASIS_NO_OUTPUT = 7;
}

message TechCardInsert {
  // identification (Sheet «Титул»)
  // Артикул. Required from the PROTO stage onward; OPTIONAL (empty) while stage == IDEA — an idea
  // is by definition pre-article (NF-03/B-2). Moving a card out of IDEA without a real style
  // number is rejected with InvalidArgument. A hand-typed override must set style_number_source =
  // MANUAL and pass the strict format validator; the global UNIQUE(style_number) index is the
  // authority on collisions (Q1). Use SuggestStyleNumber to get the server proposal.
  string style_number = 1;
  StyleNumberSource style_number_source = 104; // provenance; UNKNOWN defaults to GENERATED
  string name = 2; // Название изделия (required)
  string brand = 3;
  reserved 4;
  reserved "season";
  string collection = 5;
  int32 category_id = 6; // FK category(id); 0 = unset
  GenderEnum target_gender = 7; // UNKNOWN = unset
  TechCardStage stage = 8; // UNKNOWN defaults to PROTO
  string status = 9; // freeform workflow notes (soft, non-gating)
  TechCardApprovalState approval_state = 35; // UNKNOWN defaults to DRAFT
  // approved_by (36) removed (Q5): approval is the APPROVER role + a server-stamped journal event,
  // not a free-text name. version (10) / revision_date (11) removed (Q1): the card's version is the
  // sequence of named releases (Rev.N) + the auto-journal, not a free-text string. designer (14) /
  // constructor (15) / technologist (16) removed (Q5): roles are admin-account assignments now (see
  // the role-assignment RPCs). Migration 0223 drops all six retired columns from tech_card.
  google.protobuf.Timestamp released_at = 37; // when released to manufacture
  TechCardMeasurementUnit measurement_unit = 38; // UNKNOWN defaults to MM
  int32 base_model_id = 12; // FK model(id); 0 = unset
  int32 base_sample_size_id = 13; // FK size(id); 0 = unset

  // construction description (lower block of Sheet «Титул») now lives in details[]; the
  // header targets / currency were removed (pricing is on costing, single brand policy).
  string notes = 29;

  // children (full-replace on update)
  repeated int32 size_ids = 30; // size range / grade (FK size(id))
  reserved 31; // was `product_ids`; the product↔style link is now derived from product.style_id (R1/R4), never client-supplied. Read GetStyle.colorways (AdminColorwayRef) for a style's colourways.
  reserved "product_ids";
  // Sketch media split into two INDEPENDENT lists (replaces the single `media = 32`):
  //   moodboard_media — mood / inspiration / reference / fabric-swatch photos (design intent)
  //   technical_media — flat sketches used in construction (front / back / detail / lining / preview)
  // Construction consumes ONLY technical_media. Each item's `kind` sub-classifies within its
  // list. Both are full-replace on update. A callout pins onto ANY media_id on the card — moodboard
  // OR technical (the backend does not restrict the category), so at the idea stage a callout can pin
  // onto a moodboard/reference image before any technical sketch exists.
  repeated TechCardMediaItem moodboard_media = 55;
  repeated TechCardMediaItem technical_media = 56;
  repeated TechCardCallout callouts = 33; // sketch callouts (pin onto any moodboard or technical media by media_id)
  // revisions (34) removed as INPUT (Q1): the revision log is a server-stamped auto-journal, not a
  // client-supplied list — read it on the TechCard message (TechCard.revisions).

  // materials (Phase 2): bill of materials (article catalog). Colourways are no longer style
  // children (R1 merge — a colourway is a product); their material recipe lives on the colourway via
  // ColorwayDevelopmentInsert.usages, keyed by an explicit colorway_id = product.id.
  // CONTRACT (nf05-01): downstream references into bom_items are POSITIONAL, by index, and every
  // write is a full replace (bom_items have no stable ids across a save). So when a BOM line is
  // removed or reordered, the client MUST renumber all downstream bom_item_index / fusing_bom_item_index
  // in the SAME payload (operations, pieces). An out-of-range index is rejected; an in-range-but-wrong
  // one is not — the server range-checks but cannot detect a wrong-but-valid index. Pieces address
  // their colourway by explicit colorway_id (not a positional index).
  repeated TechCardBomItem bom_items = 40;
  reserved 41; // was `colorways`; colourways are products now (R1), addressed by colorway_id
  reserved "colorways";

  // production (Phase 3): construction, operations, labels, packaging, costing.
  TechCardConstruction construction = 43; // 1:1; null = unset
  repeated TechCardOperation operations = 44;
  repeated TechCardLabel labels = 45;
  TechCardPackaging packaging = 46; // 1:1; null = unset
  TechCardCosting costing = 47; // 1:1; null = unset

  // hardening (Phase 3.5a)
  google.protobuf.Timestamp approved_at = 48; // auto-set on approve/release if unset
  string concept = 49; // design concept / intent (designer)
  repeated TechCardIssue issues = 50; // maker-flagged construction issues
  repeated TechCardSizeQuantity size_quantities = 51; // per-size order quantity (size run)
  repeated TechCardSignoff signoffs = 52; // per-section sign-off
  repeated TechCardSizePattern patterns = 53; // per-size PDF выкройки (cut patterns)

  // construction-description aspects with reference images (replaces the flat strings).
  repeated TechCardDetail details = 54;

  // structural cut-pieces (детали кроя) + per-colourway fabric mapping (NF-05). Full-replace.
  repeated TechCardPiece pieces = 100;

  // NF-07 auxiliary items. purpose is "sellable" (default/empty) or "auxiliary"; an auxiliary card
  // produces a packaging material rather than a product, so it may not link products and its run
  // output receipts into output_material_id (required before the first run; 0 = unset).
  TechCardPurpose purpose = 101; // R6: type change string→enum on the same wire number

  int32 output_material_id = 102;
  SkuSeason sku_season = 103; // optional as a whole; required before a styled product can mint SKU

  // WS7: sub-classifies an auxiliary card (UNKNOWN=unset). Ignored / must be UNKNOWN for a sellable card.
  TechCardAuxSubtype aux_subtype = 105;

  // Planning date for the overdue view (production cockpit): the calendar day this style is planned
  // to drop, the anchor a run's promised_at is judged against ("до дропа N дней / просрочен"). Owner-
  // set intent, not a workflow stamp like approved_at/released_at — unset means no drop planned.
  // Only the DATE part is persisted (tech_card.target_drop_date is a DATE column); any time of day
  // sent on the wire is dropped. NOTE: a RELEASED card is frozen for edits (ErrTechCardReleased), so
  // this planning date is only settable while the card is draft/approved — see the store's freeze check.
  google.protobuf.Timestamp target_drop_date = 106;

  // DXF block-name → cut-piece aliases, scoped per fabric slot (§2.2). Presence-gated via the
  // wrapper (see TechCardPieceDxfAliasSet): absent = preserve stored, present = full replace.
  // Send the wrapper ONLY when the alias editor is wired, and always round-trip what was read —
  // the wrapper protects against a STALE client, not a half-implemented one: a client that
  // defaults to an empty PRESENT wrapper clears the whole table on every save.
  TechCardPieceDxfAliasSet piece_dxf_aliases = 107;

  // ТРЕБУЕМЫЙ ПРИПУСК of this style, in MILLIMETRES (Ф3.2) — the right-hand side the readiness gate
  // compares a раскладка's recorded allowance against, AND the head of the allowance cascade the
  // sewing steps inherit from (workshop → THIS → operation.seam_allowance_mm).
  //
  // MILLIMETRES, not centimetres (0290): the whole allowance chain speaks one unit, so no
  // conversion sits between the standard and the step that must honour it. The cutting TABLE and
  // the fabric EDGE MARGIN stay in centimetres — a 12 m table reads worse in millimetres — and the
  // suffix on every field name is what keeps the two straight.
  //
  // ABSENT = fall back to the workshop default (admin.WorkshopSettings.default_seam_allowance_mm),
  // which may itself be absent — and then there is NO STANDARD, and a consumer must answer «no
  // verdict» rather than substitute zero. Zero is legal here and states something specific: «the
  // выкройки of this model carry the cut line, no offset needed». Confusing «0» with «not
  // configured» would declare every раскладка with a 10 mm allowance in breach of a standard nobody
  // set.
  //
  // It deliberately lives on the card header and not on the construction section: any field added
  // to a section's digest projection instantly marks EVERY signed-off CONSTRUCTION approval as
  // «edited since signing», on every card at once. (The free-text twin it used to be confused with,
  // construction.seam_allowances, no longer exists — the operations break removed it.)
  google.type.Decimal required_seam_allowance_mm = 109;

  // Says «this bundle KNOWS about the machine / ВТО fields on operations and profiles». A new
  // client sets it on every save; nothing else may.
  //
  // Operations are full-replace with no per-field protection, so a save from a bundle that has
  // never heard of machine_type would silently wipe every machine fact on the card. With this flag
  // the server can tell the two cases apart and refuse instead: a write WITHOUT it against a card
  // that carries machine facts fails with FailedPrecondition naming the reason, and a write
  // without it that nevertheless echoes the new fields fails the same way. A card with no machine
  // facts saves from an old bundle exactly as before.
  //
  // TRANSPORT, NOT CONTENT: it is NOT part of any section digest — which client saved a card is
  // not something a signature can depend on.
  bool machine_fields_aware = 110;

  // Осведомлённость бандла о полях сборки (input_keys / output_unit_key / output_unit_name).
  // Зеркалит machine_fields_aware выше слово в слово по семантике:
  //   - новый клиент ставит флаг на каждом сохранении; серверные пути (клон сезона) ставят сами;
  //   - запись БЕЗ флага против карточки, несущей сборочные факты, — FailedPrecondition с
  //     внятной причиной («карточка размечена узлами сборки; обновите вкладку админки»);
  //   - запись без флага, которая тем не менее эхоит новые поля, — тот же отказ;
  //   - карточка без сборочных фактов сохраняется старым бандлом ровно как раньше.
  //
  // Флаг НЕ ФИЛЬТРУЕТ ПОЛЯ. Он объявляет способность, а не выключает разбор: операции пишутся
  // полной заменой, и «игнорировать 46–48 при aware=false» превратило бы штатный клон сезона
  // (server-built payload, флага не несёт) в тихий стиратель разметки.
  //
  // ТРАНСПОРТ, НЕ СОДЕРЖАНИЕ: не входит ни в один дайджест секции.
  bool assembly_aware = 111;
  // Явное намерение снять разметку узлов целиком.
  //
  // Щит выше закрывает СТАРЫЙ бандл. Он не закрывает запись, которая осведомлена, но пуста:
  // параллельная вкладка нового клиента, открытая до разметки; применение AI-черновика поверх
  // размеченной карточки; восстановление до-фичевого локального черновика; сидер или скрипт.
  // Все они шлют assembly_aware=true и ноль узлов.
  //
  // Поэтому: осведомлённая запись, не несущая ни одного сборочного факта против карточки,
  // которая их несёт, отклоняется, если этот флаг не выставлен. Ставит его только кнопка
  // «снять разметку узлов» в клиенте — так одно поле служит и защитой, и честным путём
  // отступления. Флаг без разметки в payload'е и флаг вместе с присланными узлами — оба
  // противоречивы и отклоняются.
  //
  // ТРАНСПОРТ, НЕ СОДЕРЖАНИЕ: в дайджест не входит.
  bool assembly_cleared = 112;

  // ЩИТ СОВМЕСТИМОСТИ ДЛЯ ОПЕРАЦИОННЫХ ФОТО (0308) — третий той же породы, и по той же причине.
  //
  // Операции пишутся ПОЛНОЙ ЗАМЕНОЙ: payload без поля `media` неотличим от «удалили все снимки
  // со всех шагов». Отставшая вкладка, восстановленный до-фичевый черновик или скрипт стёрли бы
  // десятки выносок молча — и протухшую подпись CONSTRUCTION никто бы не связал с причиной.
  //
  // Флаг НЕ ФИЛЬТРУЕТ ПОЛЯ: разбор `media` идёт всегда. «Игнорировать при aware=false»
  // превратило бы клон сезона (payload строит сервер, флага не несёт) в тихого стирателя.
  //
  // ТРАНСПОРТ, НЕ СОДЕРЖАНИЕ: не входит ни в один дайджест секции.
  bool media_aware = 113;
  // Явное намерение снять ВСЕ операционные фотографии карточки — единственный законный путь
  // прислать осведомлённую пустоту против карточки, у которой снимки есть.
  bool media_cleared = 114;

  // ЧЕТВЁРТЫЙ ЩИТ ТОЙ ЖЕ ПОРОДЫ — для 32 колонок волны видов операций (0324), и заведён он не
  // ради девяти новых глаголов.
  //
  // У девяти новых глаголов потери быть не должно: старый бандл не знает токенов 16..24 и шага
  // с таким глаголом не построит. Но ТРИНАДЦАТЬ полей волны сидят на СТАРЫХ парах (глагол,
  // machine_type), которые живут в проде годами и которые сегодняшний бандл шлёт каждый день:
  //   - блок `stitching` (52) целиком — любой MACHINE: needle_count, needle_gauge_mm,
  //     seam_securing, row_spacing_mm, fullness_ratio, а также binding_style (binding_taping) и
  //     label_attach_stitch (любой MACHINE);
  //   - блок `fastening` (63) целиком — MACHINE + buttonhole | bartack | button_attach |
  //     zipper_setting: шесть полей петель, закрепок, пуговиц и молний;
  //   - часть блоков `hardware` (54) и `placement_layout` (53) — на MACHINE с цикловым
  //     machine_type.
  //
  // Операции пишутся ПОЛНОЙ ЗАМЕНОЙ, у шага нет стабильного ключа, и перенести хранимое, как
  // переносится разметка детали, невозможно. Значит сценарий потери такой: технолог заполнил
  // поля новым клиентом → кто-то открыл ту же карточку отставшей вкладкой → сохранил → факты
  // стёрты молча. ПОРЯДКОМ ВЫКАТКИ ЭТО НЕ ЗАКРЫВАЕТСЯ: открытая вкладка ест данные и после
  // деплоя клиента.
  //
  // Семантика — слово в слово machine_fields_aware выше:
  //   - новый клиент ставит флаг на каждом сохранении; серверные пути (клон сезона, сидер)
  //     ставят сами;
  //   - запись БЕЗ флага против карточки, несущей факты волны, — FailedPrecondition с внятной
  //     причиной;
  //   - запись без флага, которая тем не менее эхоит новые блоки или новые глаголы, — тот же
  //     отказ;
  //   - карточка без фактов волны сохраняется старым бандлом ровно как раньше.
  //
  // ПАРНОГО `*_cleared` У НЕГО НЕТ, и это осознанно — как у machine_fields_aware и в отличие от
  // узлов и снимков. Там снятие разметки целиком есть отдельное намерение, выразимое кнопкой.
  // Здесь «поле пусто» — рядовая правка: технолог стёр стиль петли, потому что он больше не
  // нужен. Бекстоп «осведомлённая пустота против непустой карточки» объявил бы такую правку
  // ошибкой и сделал бы поле НЕСТИРАЕМЫМ. Осведомлённая запись очищает поля волны честно.
  //
  // Флаг НЕ ФИЛЬТРУЕТ ПОЛЯ: разбор блоков 51..61 и 63 идёт всегда, независимо от флага.
  // «Игнорировать при aware=false» превратило бы клон сезона (payload строит сервер) в тихого
  // стирателя — ровно то, от чего щит защищает.
  //
  // ТРАНСПОРТ, НЕ СОДЕРЖАНИЕ: не входит ни в один дайджест секции.
  bool operation_kinds_aware = 115;

  reserved 108;
  reserved "required_seam_allowance_cm";

  // Reserved so a future field can never collide with a removed one. 17-19 targets+currency;
  // 20-28 construction-desc strings → details[]; 32 was the single `media` list (split into
  // moodboard_media/technical_media); 42 pom_points; 39 prior.
  reserved 10, 11, 14, 15, 16, 17 to 28, 32, 34, 36, 39, 42, 57 to 99;
  reserved "version", "revision_date", "designer", "constructor", "technologist", "approved_by", "revisions";
}

// TechCard is a stored tech card with resolved sketch media.
message TechCard {
  int32 id = 1;
  TechCardInsert tech_card = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 lock_version = 6; // optimistic-lock token; echo into UpdateTechCardRequest.expected_lock_version
  // Server-stamped audit usernames (norm §2.11, GetAdminUsername). Read-only: set by the server on
  // create/update, never accepted from the write payload.
  string created_by = 10;
  string updated_by = 11;
  // Responsible-account roles (Q5), read-only here — managed via the role-assignment RPCs, not the
  // tech-card write. Replaces the removed free-text designer/constructor/technologist strings.
  repeated TechCardRoleAssignment role_assignments = 12;
  // Server-stamped auto-journal (Q1): who/what/when across the card's significant transitions.
  // Read-only — appended by the server, never client-supplied. Replaces the removed input `revisions`.
  repeated TechCardRevision revisions = 13;
  // Resolved sketch media (MediaFull), split to mirror the writable lists.
  repeated TechCardMediaFull resolved_moodboard_media = 7;
  repeated TechCardMediaFull resolved_technical_media = 8;
  // OUTPUT-ONLY derived colourways of this style (R1/§3.3): a style's colourways are its products.
  // Not writable through the style — created/relinked via the Colorway RPCs.
  repeated AdminColorwayRef colorways = 9;
  // composition_entries is the style's structured fibre composition (S17/M1 fix), resolved from
  // style_composition; empty when the style has no structural composition data yet. Read-only,
  // admin/constructor view — the storefront's equivalent is StorefrontColorwayDisplay.composition_entries.
  repeated CompositionEntry composition_entries = 14;
  // fit / composition (legacy free-text) / care_instructions are style catalogue facts stored on
  // the tech_card row but WRITTEN via UpdateStyle (StylePatch), not the tech-card write — so they are
  // read-only projections here, surfaced for the constructor to display and edit-in-place (the admin
  // saves them through UpdateStyle). composition is always legacy plain text on the wire (M1); the
  // structured fibre breakdown is composition_entries above.
  string fit = 15;
  string composition = 16;
  string care_instructions = 17;
  // care_entries is the STRUCTURED projection of care_instructions above, resolved against the
  // care_symbol dictionary and always in canonical print order. care_instructions keeps holding the
  // raw comma-joined codes; render entries when present and fall back to the string for rows that
  // still hold pre-ISO free text. OUTPUT-ONLY — care is written as the code string.
  repeated CareEntry care_entries = 19;
  // section_digests is the CURRENT fingerprint of each sign-off section's content, recomputed on
  // every read. Compare an entry against the matching TechCardSignoff.signed_digest to tell whether
  // an approved section has been edited since it was signed. OUTPUT-ONLY.
  repeated TechCardSectionDigest section_digests = 18;

  // model_wears_* is the fit reference the studio shoots against: the height of the model in the
  // lookbook and the size worn. Like fit/composition/care_instructions above it is a style catalogue
  // fact WRITTEN via UpdateStyle and read-only here — it was previously visible only on the product /
  // storefront messages, so the style view could set it and never read it back.
  int32 model_wears_height_cm = 20; // 0 = unknown
  int32 model_wears_size_id = 21; // FK size(id); 0 = unset
  // The derived taxonomy path behind the card's category_id (TechCardInsert.category_id): the same
  // triple ListTechCardsRequest.category_ids filters on and TechCardListItem already emits. Present
  // here too so a card opened directly, rather than through a list, knows its own category path.
  // Server-derived on write (syncStyleCategoryTriple), read-only here; 0 = unset.
  int32 top_category_id = 22;
  int32 sub_category_id = 23;
  int32 type_id = 24;
  // OUTPUT-ONLY colour variants of an AUXILIARY card's warehouse output. Empty for a sellable card
  // and for an aux card still in legacy single-output mode (tech_card.output_material_id is then the
  // whole answer). Written through the dedicated Upsert/DeleteTechCardOutputVariant RPCs, never
  // through the tech-card save — a variant owns warehouse stock, so a full-replace save must not be
  // able to re-mint or drop one.
  repeated TechCardOutputVariant output_variants = 25;
  // OUTPUT-ONLY summaries of the card's saved раскладки (markers, 0257) — the measured fabric
  // layouts costing reads consumption from. Summaries only: the layout blob is 60-100 KB per
  // marker and travels exclusively on GetTechCardMarker. Written through the dedicated
  // Save/DeleteTechCardMarker RPCs, never through the tech-card save (and marker writes do not
  // bump lock_version — saving a раскладка must not 409 the operator's own open card form).
  repeated TechCardMarkerSummary markers = 26;
  // OUTPUT-ONLY измеренные площади деталей кроя (Ф0, 0297), сгруппированные по скоупу ткани — то,
  // из чего сервер ВЫВОДИТ норму расхода, когда её никто не вписал руками.
  //
  // ЗДЕСЬ ОНИ ЖИВУТ ИМЕННО ПОТОМУ, ЧТО ЭТО ЧИТАЕМАЯ ПРОЕКЦИЯ, А НЕ ВХОД ЗАПИСИ: площади пишет
  // отдельный RPC (SaveTechCardPieceAreas) с подтверждением условий замера оператором, а полная
  // замена карточки не должна иметь возможности их стереть — ровно та же дисциплина, что у
  // markers и output_variants выше.
  //
  // И ЭТО ЖЕ КЛАДЁТ ИХ В СЛЕПОК РЕЛИЗА, который есть protojson ЭТОГО сообщения. Без них
  // released-карточка теряла бы способность считать материалы: у детали кроя в контракте нет id,
  // только line_key, и любой ключ на piece_id был бы в слепке нулевым.
  repeated TechCardPieceAreaScope piece_area_scopes = 27;
  // OUTPUT-ONLY: разрешённые операционные картинки карточки — дистинкт по media_id, тем же
  // TechCardMediaFull, что мудборд и тех-эскизы. Write-сообщение операции возит только media_id:
  // URL и размеры это read-данные, и класть их во вход записи значило бы принимать от клиента то,
  // что сервер обязан знать сам.
  repeated TechCardMediaFull resolved_operation_media = 28;
  reserved 5; // was resolved_media (single combined list; now split)
}

// TechCardPieceAreaScope — площади деталей ОДНОГО скоупа ткани, с вердиктом об устаревании.
//
// Скоуп, а не карточка: после T4 одна деталь законно кроится из нескольких слоёв материала, и у
// подкладочной версии свой контур и своя площадь. Ключ тот же, что у привязок блоков (0267) и у
// индекса размеров (0280) — COALESCE(назначение, line_key строки BOM).
message TechCardPieceAreaScope {
  string scope_key = 1;
  repeated TechCardPieceArea areas = 2;
  // stale = источник этого скоупа менялся после замера: отпечаток (листы И привязки блок→деталь),
  // посчитанный сервером СЕЙЧАС, не совпал с тем, под которым мерили.
  //
  // НА ЖИВОЙ КАРТОЧКЕ вычисляется на чтении, отдельной колонки состояния нет — хранимый флаг был бы
  // неверен ровно в тот момент, когда лист перезалили, а карточку никто не открывал. В СЛЕПКЕ
  // РЕЛИЗА он, наоборот, заморожен: слепок и есть утверждение «вот так это выглядело на релизе»,
  // и пересчитывать его по сегодняшним файлам значило бы менять историю.
  bool stale = 3;
  // Условия и провенанс замера — одни на скоуп (их пишет одна транзакция).
  string contour_layer = 4;
  google.type.Decimal seam_allowance_mm = 5;
  string parsed_by = 6;
  google.protobuf.Timestamp parsed_at = 7;
}

// TechCardPieceArea — площадь ОДНОГО ЭКЗЕМПЛЯРА контура детали, см².
//
// ИМЕННО ОДНОГО ЭКЗЕМПЛЯРА, без pieces_per_garment: количество на изделие живёт на детали кроя,
// меняется отдельной правкой карточки и к геометрии файла отношения не имеет. Умножает читатель.
message TechCardPieceArea {
  // Деталь кроя — по стабильному line_key. Не по id: в слепке релиза у детали id нет.
  string piece_line_key = 1;
  // 0 = деталь НЕ ГРАДУИРУЕТСЯ и входит в комплект каждого размера целиком (то же правило, что у
  // неградуируемых деталей раскладки в MarkerSizeAreasPerGarment).
  int32 size_id = 2;
  google.type.Decimal area_cm2 = 3;
  // ПЕРИМЕТР того же контура, см (0305) — вторая мера того же обмера, по тем же условиям. Ею
  // считается КРАЕВОЕ дублирование: клеевая полоса вдоль среза стоит `периметр × ширину полосы`,
  // тогда как площадь отвечает только за дублирование целиком (см. TechCardPieceFusingMode).
  //
  // НЕ ЗАПОЛНЕН — законное и постоянное состояние, а не переходное: все замеры до 0305 периметра не
  // несут, клиент его тогда не считал. Такая строка честно означает «площадь есть, периметра нет», и
  // краевая оценка по ней ОТКАЗЫВАЕТ (AreaEstimateNoPerimeter) вместо того, чтобы вывести полосу из
  // площади правдоподобной формулой. Правдоподобной формулы не существует: у компактной детали и у
  // длинной узкой одной площади периметры отличаются вдвое, и ошибка ушла бы прямо в закупку.
  google.type.Decimal perimeter_cm = 6;
  // Контур заменён выпуклой оболочкой при раздутии припуском: площадь завышена, но воспроизводима.
  bool hulled = 4;
  // На слое было несколько совпадающих по площади кандидатов, взят первый: число зависит от порядка
  // листов в пачке, и сравнивать его с чем-либо нельзя. НЕ то же самое, что hulled — состояния
  // разные и ведут к разным фразам на экране.
  bool ambiguous_pick = 5;
}

// TechCardSlotAreaEstimate — ОЦЕНКА РАСХОДА ОДНОГО РУЛОННОГО СЛОТА в ЭТОМ колорвее: сколько ткани
// уходит на изделие, если норму никто не вписал, а детали кроя на слот назначены и их площади
// измерены (Ф1, ступень 0).
//
// ЗАЧЕМ ЭТО НА ПРОВОДЕ. Рецепт колорвея рисуется одним списком по тканям, и у слота, посчитанного
// оценкой, строки рецепта НЕТ вовсе — деньги за него уже вошли в костинг, а расход на экране был бы
// пуст. Вывести его на клиенте нельзя: это был бы ВТОРОЙ расчёт того же числа (площади ÷ раскройную
// ширину, усреднение по размерному ряду, лестница пина), и однажды рецепт напечатал бы одну цифру,
// а заголовок костинга — другую, ничем этого не выдав. Поэтому считает сервер, ОДНИМ проходом с
// деньгами: per_garment — это ровно тот множитель, на который умножена цена в TechCardCosting.
//
// БАЗИС — СТИЛЕВОЙ, то есть СРЕДНЕЕ ПО ОБЪЯВЛЕННОМУ РАЗМЕРНОМУ РЯДУ, а не один выбранный размер (то
// же правило, что у авторской нормы с T6). Опубликовать здесь норму базового размера значило бы
// разойтись со стоимостью на весь градационный разброс.
//
// ЭТО NETTO, НИЖНЯЯ ГРАНИЦА: межлекальных выпадов и концов настила в ней нет и быть не может — их
// знает только раскладка. Показывать как ОЦЕНКУ, не как норму; закупать по ней нельзя (план
// материалов честно остаётся блокером — см. MaterialPlanReason).
//
// НЕ ДЕНЬГИ, И ПОЭТОМУ НЕ ВЫРЕЗАЕТСЯ КОСТИНГ-РОЛЬЮ. Расход — это метры ткани на изделие, ровно та же
// «структура», что consumption у строки рецепта и у сметы: аккаунт без costing:read видит, ИЗ ЧЕГО
// сшито и сколько уходит, но не почём. По той же причине здесь нет ни цены, ни суммы: их место — в
// TechCardCosting, который такому аккаунту вырезается целиком.
//
// В СЛЕПКЕ РЕЛИЗА ЗАМОРАЖИВАЕТСЯ ВМЕСТЕ С КАРТОЧКОЙ, и это осознанно: слепок и есть утверждение
// «вот так это выглядело на релизе», а входы этой оценки — piece_area_scopes с их stale — в том же
// слепке уже заморожены (там же сказано, почему пересчитывать их по сегодняшним файлам значило бы
// менять историю). Замороженная оценка при этом НЕ становится нормой производства: она лежит
// ОТДЕЛЬНО от usages, читатели замороженных денег (ReleaseFrozenColorwayCosts) отказываются от
// колорвея с has_estimate, а costing-проекция снапшота собирает нормы только из usages.
//
// СТУПЕНЬ ЭТОЙ СТРОКИ — ЭТО ПОЛЕ, В КОТОРОМ ОНА ПРИЕХАЛА, и другого признака у неё нет.
// AdminColorwayRef.area_estimates — АКТИВНАЯ оценка: у слота нет авторской нормы, и именно эта
// цифра стоит в костинге. AdminColorwayRef.shadow_area_estimates — ТЕНЬ: норма у слота есть,
// вписана человеком, а тень лежит рядом справочно и в деньги не входит. Скалярной пометки внутри
// строки нет намеренно (почему — сказано у shadow_area_estimates), поэтому строку, вынутую из
// своего списка, восстановить как активную или теневую уже нельзя: не перемешивать.
message TechCardSlotAreaEstimate {
  // Строка BOM — по СТАБИЛЬНОМУ ключу, тем же, которым клиент сшивает свой список по тканям. Не по
  // id: в слепке релиза часть строк приходит без него, а line_key есть всегда.
  string bom_line_key = 1;
  // Скоуп площадей, на которых стоит (или стоял бы) ответ: COALESCE(назначение, line_key строки
  // BOM) — тот же ключ, что у TechCard.piece_area_scopes, где лежат сами площади подеталь.
  string scope_key = 2;
  // Расход на ИЗДЕЛИЕ в ЕДИНИЦЕ СЛОТА (unit ниже). Пусто, когда есть refusal.
  google.type.Decimal per_garment = 3;
  // Единица слота — свойство строки BOM, а не пришпиленного артикула: пин подменяет цену, но строка
  // с расходящейся единицей вообще не ценится. Заполнена всегда, в том числе при отказе.
  string unit = 4;
  // ПОЧЕМУ ОЦЕНКИ НЕТ — типизированной причиной, а не пустотой. Каждая причина ведёт в РАЗНОЕ место:
  //
  //   no_pieces_assigned        — ни одна деталь кроя не назначена на эту ткань в этом колорвее
  //   no_measured_areas         — площади этого скоупа не измерены (вкладка выкроек)
  //   areas_incomplete_for_size — у части деталей нет площади на размер ряда: комплект неполон
  //   areas_stale               — выкройки менялись после замера
  //   no_cutting_width          — у ткани не заполнена ширина полотна
  //   unit_not_convertible      — единица слота не переводится из длины (кг считаются по раскладке)
  //   no_price                  — у ткани нет цены ни в строке, ни в каталоге
  //   no_basis                  — нет размера, на котором считать
  //   pin_conflict              — детали слота пришпилены к РАЗНЫМ артикулам
  //
  // Пустая строка = оценка посчитана. Единый «не посчитано» отправлял бы искать везде сразу.
  string refusal = 5;
  // Та же причина ГОТОВОЙ ФРАЗОЙ для экрана (сервер её не переводит на лету — она одна на систему,
  // и второй перевод на клиенте разошёлся бы с формулировками костинга).
  string refusal_text = 6;
  // Сколько деталей кроя колорвей назначил на этот слот. Ноль — это и есть no_pieces_assigned;
  // ненулевое при отказе означает «назначения есть, не хватает другого факта».
  int32 piece_count = 7;
  // Площади этого скоупа устарели: отпечаток источника (листы И привязки блок→деталь) не совпал с
  // тем, под которым мерили. Отказ тогда areas_stale — устаревшие площади НЕ «примерно те же».
  bool stale = 8;
  // Условия замера, без которых площадь — не число, а мнение: слой контура и припуск, которым его
  // раздували. Echo of the scope in TechCard.piece_area_scopes (одно чтение, один источник — разойтись
  // им негде), чтобы строка рецепта описывала себя целиком, без второго join'а на экране.
  string contour_layer = 9;
  google.type.Decimal seam_allowance_mm = 10;
  string parsed_by = 11;
  google.protobuf.Timestamp parsed_at = 12;
}

// TechCardOutputVariant is one colour of an AUXILIARY card's warehouse output: "this card, in this
// colour, produces into that material". An aux card sewn from several fabrics (a кофр in black and
// in bone) needs one stock bucket per colour — its own on-hand, its own moving average — instead of
// the single TechCardInsert.output_material_id.
//
// ZERO variants on a card is legacy single-output mode and behaves exactly as it always did; the
// first variant switches the card over. NOT a size variant (ProductSize) and not a grade variant
// (A/B stock) — everything here carries the output_ prefix for exactly that reason.
message TechCardOutputVariant {
  int32 id = 1; // 0 in a write creates a new colour
  int32 tech_card_id = 2;
  string color_code = 3; // CHAR(3) from the shared colour dictionary, like product.color_code
  string color_name = 4; // read-only, resolved from the dictionary
  int32 material_id = 5; // the warehouse bucket this colour produces into; 0 in a write auto-creates it
  string material_name = 6; // read-only
  // Current on-hand balance of the bucket. UNSET (not zero) when the material has no stock row at
  // all — "no balance recorded" is not the same statement as "none left". Read-only.
  google.type.Decimal on_hand = 7;
  string unit = 8; // read-only; every colour of one card shares one unit of measure
  // false retires the colour: it stops being plannable and stops counting toward the card's list
  // totals, but keeps its bucket, its stock and its history. Deleting the variant is the harder
  // action — it is the only way to un-pin the card's auxiliary purpose.
  bool active = 9;
}

// TechCardMarkerSummary is the list row of a saved раскладка (marker, tech_card_marker): the
// measured fabric layout of a СОСТАВ of pattern pieces on a strip of fabric. The heavy layout blob
// (contours + placements) deliberately does NOT ride here — it travels only on GetTechCardMarker.
//
// Ф2 replaced «one size × N комплектов» with a composition (size → garments). The identity of a
// marker in a list is therefore `composition` (:25), not `size_id` (:3) — a mixed раскладка has no
// single size to show, and the legacy fields read 0 on one.
message TechCardMarkerSummary {
  int32 id = 1;
  int32 tech_card_id = 2;
  // ЛЕГАСИ. The size of a homogeneous marker taken before Ф2; 0 = a marker with a composition,
  // read `composition` (:25). The number is never reused and the field is never removed — a stored
  // pre-Ф2 row still carries it, and a stale client bundle still sends it back on save.
  int32 size_id = 3;
  string name = 4; // unique per (card, composition-vs-legacy size) — see uniq_tcm_card_sizekey_name
  // Provenance of the layout geometry. "auto" = the nesting engine as it ran; "manual" = an
  // operator adjusted placements (Ф5); "imported" reserved for external CAD markers.
  string source = 5;
  // The BOM fabric line this marker measures, as the stable wire identity of that line ("" = not
  // linked, or the slot was deleted — the marker stays valid geometry and merely drops out of
  // costing suggestions). Resolved server-side to tech_card_bom_item(id) with ON DELETE SET NULL.
  string bom_line_key = 6;
  string bom_item_name = 7; // read-only display; "" when unlinked
  string bom_item_unit = 8; // read-only display; free text from the BOM line ("м", "cm", …)
  google.type.Decimal fabric_width_cm = 9;
  google.type.Decimal gap_cm = 10;
  google.type.Decimal edge_margin_cm = 11;
  bool allow_cross_grain = 12; // 90° rotations were permitted
  // ЛЕГАСИ, exactly like size_id above: комплектов of the ONE size a pre-Ф2 marker cut. 0 = a
  // marker with a composition, read total_units (:26).
  int32 sets = 13;
  google.type.Decimal used_length_cm = 14;
  google.type.Decimal efficiency_pct = 15; // unset = not recorded
  // placed/total instance counts at save time. The server refuses to save an incomplete marker
  // (placed < total, FailedPrecondition) — a layout that did not fit every piece is not a
  // consumption norm — so on stored rows these are always equal; kept as two fields for honesty.
  int32 placed_count = 16;
  int32 total_count = 17;
  // OUTPUT-ONLY, = used_length_cm / total_units — fabric per ONE garment.
  //
  // WITHHELD (unset, not zero) on a marker whose composition holds MORE THAN ONE SIZE. On a mixed
  // раскладка this quotient is the mean across the состав: it overstates the small sizes and
  // understates the large ones, which is the very distortion Ф2 exists to remove. It is also the
  // number a client copies verbatim into tech_card_colorway_usage.consumption with
  // consumption_source='marker' — i.e. it stops being a display value and becomes a persistent
  // costing fact nothing downstream can tell apart from a measured one. So the server does not
  // hand it out; scalar_apply_refusal (:27) says so in words.
  //
  // Ф2.4 DID NOT LIFT THE WITHHOLDING — it supplied the alternative. The per-size figures now ride
  // on composition[].consumption_per_unit_cm (:25), and a mixed раскладка is applied THROUGH THEM;
  // this field stays unset there, because «cloth per garment» with no size named is still a question
  // a mixed настил has no true answer to, and this is still the field a client copies into a sizeless
  // costing row.
  google.type.Decimal consumption_per_unit_cm = 18;
  string created_by = 19; // server-stamped
  string updated_by = 20; // server-stamped
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  // Кромка (selvedge, cm per edge) the раскладка ran with — snapshotted at save time from the
  // effective article so the waste decomposition stays auditable after the material changes.
  google.type.Decimal selvedge_cm = 23;
  // The colourway whose ARTICLE this layout was measured on (0264); 0 = not colourway-specific.
  // Every colourway of a style cuts the same pieces, but each pins its own catalog article per
  // slot, and articles differ in roll width and кромка — so the same geometry on two colourways
  // is two markers with two measured lengths. A costing suggestion that ignored this would apply
  // a length taken at another cloth's width, and be wrong in a way that reads as plausible.
  int32 colorway_id = 24;
  // OUTPUT-ONLY СОСТАВ of the раскладка, one entry per size, ordered by size_id. ALWAYS populated,
  // for every marker including those taken before Ф2 — migration 0273 projected each legacy row
  // into the same shape, one entry {size_id, sets}. It is never empty and never carries quantity 0;
  // an empty composition on the wire is a read bug, not «a marker without a состав».
  //
  // Since Ф2.4 each entry also carries THE PER-SIZE НОРМА, and this list is therefore the thing a
  // mixed раскладка is applied from. total_units (:26), scalar_apply_refusal (:27) and these entries
  // are all derived server-side from ONE slice, so they cannot describe three different раскладки.
  repeated TechCardMarkerCompositionEntry composition = 25;
  // OUTPUT-ONLY. How many GARMENTS (not pieces!) this раскладка cuts — Σ composition[].quantity, and
  // the divisor behind consumption_per_unit_cm. Equals `sets` for a legacy marker. NOT to be confused
  // with total_count (:17), which counts placed PIECE INSTANCES.
  int32 total_units = 26;
  // OUTPUT-ONLY. Empty = the scalar consumption_per_unit_cm (:18) may be applied to a recipe. A
  // non-empty string is the server REFUSING to supply a scalar norm for this раскладка, and its text
  // is the explanation to show: which раскладка, why a single number would be wrong, and what to do
  // instead. Set exactly when the composition holds more than one size (or none at all).
  //
  // Since Ф2.4 the REMEDY the text names depends on this row: a mixed раскладка whose composition
  // carries per-size расход is told to apply BY SIZE, and one whose areas were never recorded (taken
  // before Ф2.4) is told to re-save. So the string is not a constant per case and must be shown, not
  // pattern-matched.
  string scalar_apply_refusal = 27;

  // УСЛОВИЯ СЪЁМКИ (Ф3), as recorded on the row. See TechCardMarkerInsert (:17-21) for what each
  // one means and why absence is a distinct answer from zero.
  //
  // A раскладка whose seam_allowance_mm is ABSENT is «СТАРАЯ НОРМА»: nobody recorded what was laid
  // out or under what rules, so костинг cannot tell a marker measured along the seam line from one
  // measured along the cut line — and the two differ by the allowance around the whole perimeter of
  // every piece. That category is DERIVED, never a flag: there is no «is_legacy» column and there
  // never will be one, because the unmarked stays old by itself.
  //
  // MILLIMETRES since 0290 (the stored centimetres were multiplied by ten in place), so these two
  // compare directly against TechCard.required_seam_allowance_mm with no conversion in the middle.
  google.type.Decimal seam_allowance_mm = 37;
  google.type.Decimal contour_allowance_mm = 38;
  reserved 28, 29;
  reserved "seam_allowance_cm", "contour_allowance_cm";
  optional string contour_layer = 30;
  optional string grain_layer = 31;
  optional bool allow_flip = 32;

  // This раскладка is the НОРМИРОВОЧНАЯ one for its cloth on this card: the measurement costing and
  // the readiness gate are meant to read. Set through SetTechCardMarkerNorm, never through a save —
  // re-saving geometry must not be able to seize the norm, and a stale bundle must not be able to
  // drop it by not knowing the field exists.
  bool is_norm = 33;

  // OUTPUT-ONLY. Whether the card's set of cut-pieces has changed since this раскладка was taken.
  // Three-valued ON PURPOSE — see the enum.
  TechCardMarkerPieceSetStatus piece_set_status = 34;

  // OUTPUT-ONLY. Empty on a healthy card. Non-empty is the server REPORTING that more than one
  // раскладка of the SAME cloth on this card carries is_norm — a state the schema does not prevent
  // (exclusivity is held by the SetTechCardMarkerNorm transaction, not by a UNIQUE index; a unique
  // index on the norm turns deleting a BOM line into ERROR 1761 and takes the whole card save down
  // with it). Every marker of the offending scope carries the same text, so the conflict cannot be
  // seen from one row and missed from another.
  //
  // It is reported rather than silently resolved because the readers DO resolve it: they take the
  // norm deterministically (newest updated_at, then highest id), so a corrupted state yields ONE
  // answer everywhere instead of a different one per screen. Readers disagreeing would be worse
  // than two norms; readers agreeing SILENTLY would be worse than saying so.
  string norm_conflict = 35;

  // Прогон, которому принадлежит РАСКРОЙНЫЙ маркер (Ф4.2, migration 0282); 0 = карточный (норма и
  // все сегодняшние). Только на выход. Карточные списки такие маркеры не показывают вовсе, поэтому
  // увидеть ненулевое значение можно ровно в одном месте — ListProductionRunLays.run_markers.
  int32 production_run_id = 36;

  // ЧЕРНОВИК (0299). OUTPUT-ONLY и, в отличие от одноимённого поля на TechCardMarkerInsert, здесь это
  // не согласие, а состояние строки: сервер пишет колонку из placed_count < total_count и ниоткуда
  // больше. Часть деталей легла, часть не успела (стоимость поиска растёт как квадрат их числа), и
  // такая раскладка ХРАНИТСЯ, чтобы её было видно и можно было пересчитать. Раскладок, где не легло
  // ничего, здесь не бывает — их не сохранить в принципе (см. is_draft на TechCardMarkerInsert).
  //
  // FALSE НЕ ДОКАЗЫВАЕТ ПОЛНОТУ. Из двух счётчиков сервер сверяет с блобом только placed_count;
  // total_count — утверждение клиента, и заниженный знаменатель читается как полная раскладка. Долг
  // назван на TechCardMarkerInsert.is_draft.
  //
  // ЧИСЛА ПО НЕЙ НЕТ, и это главное, что должен знать клиент. consumption_per_unit_cm не приходит, на
  // строках состава не приходят ни consumption_per_unit_cm, ни area_per_garment_cm2 (площадь ушла
  // вместе с расходом: её публикуют как БАЗИС, продолжаемый на размеры вне состава, и у черновика она
  // занижена ровно так же). Причина — словами в scalar_apply_refusal, и она называет действие:
  // поднять бюджет поиска и пересчитать. Сам состав — какие размеры и сколько изделий — остаётся: это
  // то, что раскладку ПРОСИЛИ разложить, и для черновика это тоже правда.
  //
  // Нормой такая раскладка не назначается, штампом norm_marker_id в рецепте не бывает и в секцию
  // настила не встаёт — сервер отказывает на всех трёх путях. Экран обязан пометить её как черновик:
  // единственное отличие от измеренной раскладки в остальных полях — отсутствие числа, а отсутствие
  // числа само по себе выглядит как «ещё не посчитали».
  bool is_draft = 39;
}

// TechCardMarkerPieceSetStatus compares a раскладка's stored fingerprint of the card's cut-piece set
// against the set the card carries TODAY (Ф3.6).
//
// Three states and not a bool, because two are not enough: a marker taken before Ф3 carries no
// fingerprint at all, and collapsing that into «changed» would declare EVERY stored раскладка
// changed at once — noise where a signal is needed. UNKNOWN is therefore not a badge on the screen
// but a grey caption; it is the other half of the «старая норма» category.
//
// SCOPE IS THE WHOLE CARD, not the marker's own cloth, and the cost of that is named rather than
// hidden: adding a LINING piece raises the status on a MAIN-fabric marker too. The badge must
// therefore be worded «набор деталей КАРТОЧКИ изменился — перепроверьте», never «раскладка неверна».
// The alternative — a fingerprint scoped to the marker's cloth — was rejected on evidence: the
// piece→cloth binding is per-colourway and OPTIONAL, so wherever it is unfilled a scoped fingerprint
// hashes the EMPTY set, every marker gets the same hash, and the answer is «не менялось» forever.
// That is a silent false negative feeding a readiness gate; card-wide is a noisy false positive, and
// the noise is recoverable by a human looking twice.
enum TechCardMarkerPieceSetStatus {
  // No fingerprint recorded (a раскладка taken before Ф3), or one cannot be computed today.
  // NEVER read this as «changed».
  TECH_CARD_MARKER_PIECE_SET_STATUS_UNKNOWN = 0;
  TECH_CARD_MARKER_PIECE_SET_STATUS_MATCHES = 1; // the card cuts the same set of pieces as at save time
  TECH_CARD_MARKER_PIECE_SET_STATUS_CHANGED = 2; // the set moved — re-check the раскладка
}

// TechCardMarkerCompositionEntry is one line of a раскладка's СОСТАВ: how many GARMENTS of one size
// this marker cuts in a single spread. A mixed состав packs tighter than a homogeneous one — the
// small pieces of one size settle into the межлекальные выпады of another — and «size + комплекты»
// was replaced by a map for exactly that reason: the tighter layout was not expressible.
//
// repeated, deliberately NOT map<int32,int32>, for three reasons: the order of the entries inside
// the stored blob must be stable (the Ф0.5 regression probe asserts «same input ⇒ same blob»); a map
// degrades into an object with string keys through grpc-gateway/OpenAPI; and a repeated entry can
// grow a field later where a map value cannot — which is exactly what Ф2.4 did, hanging the per-size
// расход (:3) and its area basis (:4) here rather than in a parallel array keyed by size_id. A
// parallel array would have had to be JOINed to this one by every reader, and two arrays that must
// agree about which sizes a раскладка cuts are two arrays that will eventually disagree.
message TechCardMarkerCompositionEntry {
  int32 size_id = 1; // FK size(id); must be one of the card's sizes at save time
  int32 quantity = 2; // garments of this size in the раскладка, >= 1

  // РАСХОД ПО ПЛОЩАДИ (Ф2.4). OUTPUT-ONLY, and ONLY on TechCardMarkerSummary.composition — inside a
  // layout blob these two are always absent, and the save path STRIPS them from an incoming
  // layout.composition rather than storing them. A derived number frozen in an immutable blob is a
  // second copy that goes stale the first time used_length is corrected, which is the same reason
  // consumption_per_unit_cm has never been a column.
  //
  // consumption_per_unit_cm is cm of cloth per ONE garment OF THIS SIZE:
  //
  //     расход(s) = a_s · used_length_cm / Σ_j (quantity_j · a_j),   a = area_per_garment_cm2
  //
  // i.e. the measured length of the настил split between the sizes in proportion to the area each
  // one actually occupies. It is what replaces the mean the summary's own consumption_per_unit_cm
  // (:18) refuses to hand out on a mixed состав, and it CONVERGES BY CONSTRUCTION:
  // Σ (quantity × consumption_per_unit_cm) = used_length_cm, exactly, before display rounding. A
  // client that finds otherwise is reading two different раскладки.
  //
  // UNSET on every line at once, never on some, and never to be replaced by used_length/total_units:
  // absence means this раскладка has no per-size answer (it was taken before Ф2.4 and its areas were
  // never recorded, or its geometry carries no usable area), and the mean is the exact number the
  // whole mechanism exists to keep out of a recipe. scalar_apply_refusal (:27) says which case this
  // is in words.
  google.type.Decimal consumption_per_unit_cm = 3;
  // area_per_garment_cm2 is a_s, the BASIS above published beside the result: the area ONE garment of
  // this size occupies on the настил — the graded pieces of this size plus a full set of the
  // size-agnostic ones (a block with no size suffix does not grade, so every garment cuts one set of
  // it, identically for S and for XL).
  //
  // It rides so the distribution is auditable and so it can be CONTINUED. The plan (03-composition.md)
  // wants one настил to нормировать the whole размерный ряд, including sizes the состав does not
  // cut — «площади градуированных деталей известны из файлов БЕЗ маркера». THE SERVER CANNOT DO THAT
  // HALF: it never parses a DXF, and the blob it reads holds pieces only for the sizes the состав
  // cuts. A client that parses the выкройки computes a_s for a missing size itself and applies the
  // SAME constant — used_length_cm / Σ(quantity × area_per_garment_cm2) — which is why the
  // denominator's ingredients are on the wire. It should first check its own areas against these for
  // the sizes that ARE in the состав: a disagreement means the files moved since the норма was taken,
  // and the continuation is invalid.
  google.type.Decimal area_per_garment_cm2 = 4;
}

// TechCardMarker is a full stored marker: the summary plus the self-contained layout.
message TechCardMarker {
  TechCardMarkerSummary summary = 1;
  TechCardMarkerLayout layout = 2;
}

// TechCardMarkerInsert is the writable payload of SaveTechCardMarker. Geometry is SELF-CONTAINED
// (contours inside the layout): pattern rows are a full-replace child whose CDN objects are
// garbage-collected the moment no row references them, so a marker that stored url references
// would go dark on the next sheet replacement. source_url inside pieces is provenance only.
message TechCardMarkerInsert {
  // ЛЕГАСИ pair with `sets` (:9). The СОСТАВ travels in layout.composition and nowhere else — one
  // copy on the wire, so there is no «which of the two is right» question to answer and no
  // cross-validation to write, and the blob stays self-contained (its pieces are tagged with sizes;
  // the состав is the header of that same geometry).
  //
  // These two survive for ONE reason: a STALE ADMIN BUNDLE. The admin is an SPA, an open tab keeps
  // sending the payload it was built with, and Ф1 already paid this price on fabric_direction. A
  // payload with a non-empty layout.composition ignores both fields; a payload without one is
  // accepted as a homogeneous marker when size_id > 0 and sets >= 1, and is stored in exactly the
  // legacy shape. Neither present nor absent is guessed at: with no composition AND no size_id/sets
  // the save is REFUSED, because inventing «1 комплект» would inflate the per-garment norm N-fold
  // and a client writes that number straight into a recipe.
  int32 size_id = 1;
  string name = 2; // required; unique per (card, size) for a legacy marker, per (card, name) with a состав
  string source = 3; // auto | manual | imported; "" = auto
  string bom_line_key = 4; // "" = not linked to a BOM fabric line
  google.type.Decimal fabric_width_cm = 5; // required, > 0
  google.type.Decimal gap_cm = 6; // >= 0
  google.type.Decimal edge_margin_cm = 7; // >= 0
  bool allow_cross_grain = 8;
  int32 sets = 9; // ЛЕГАСИ, see size_id (:1); >= 1 when sent
  google.type.Decimal used_length_cm = 10; // required, > 0
  google.type.Decimal efficiency_pct = 11; // 0..100; unset = not recorded
  int32 placed_count = 12;
  int32 total_count = 13; // >= 1; must equal placed_count (incomplete markers are refused)
  TechCardMarkerLayout layout = 14; // required, non-empty pieces + placements
  // Кромка the layout was computed with (cm per edge, >= 0; 0 = none/unknown). The nesting
  // client populates it from the linked article's selvedge_cm at save time.
  google.type.Decimal selvedge_cm = 15;
  // The colourway this раскладка is measured for; 0 = not colourway-specific (legacy markers and
  // cards whose colourways share one article). Must be a live colourway of this card.
  int32 colorway_id = 16;

  // УСЛОВИЯ СЪЁМКИ (Ф3). All five carry PRESENCE, not just a value, and that is the whole design:
  // the admin is an SPA, an open tab survives a deploy, and a bundle that predates Ф3 will not send
  // them at all. Absence means «these conditions were not recorded», and such a раскладка honestly
  // becomes «старая норма» — NOT a раскладка with zero allowance and flipping forbidden. Ф1 already
  // paid this exact price on fabric_direction and reached the same conclusion. A save that omits
  // them is therefore ACCEPTED, never refused: the readiness gate is what declines to accept an
  // unlabelled measurement, and moving that refusal into the save path would only stop the geometry
  // from being stored at all.

  // The allowance the layout ADDED by offsetting the contour outward, MILLIMETRES, >= 0. ZERO IS A
  // LEGAL VALUE and means «we laid the line as drawn»; ABSENT means «nobody recorded it». Not to be
  // confused with contour_allowance_mm below — their SUM is the allowance that actually lies
  // between the seam line and the cut line on the cloth.
  //
  // MILLIMETRES since 0290 while selvedge_cm and the cutting-table length stay CENTIMETRES: the
  // allowance chain speaks one unit end to end, cloth and table dimensions speak another, and the
  // suffix is what keeps them apart. The nesting ENGINE is centimetres throughout (it is a
  // coordinate system, not a field), so exactly one named pair of functions converts at its edge.
  google.type.Decimal seam_allowance_mm = 24;

  // The allowance ALREADY CONTAINED in the contour that was laid out, MEASURED off the file, cm,
  // >= 0, MILLIMETRES. 0 = the laid contour IS the seam line (a closed contour was found outside by a
  // steady distance). > 0 = the laid contour is the CUT line, and this is how far outside it sits.
  // ABSENT = there was nothing to measure with (one closed contour in the block, or the second one
  // crosses the first — which is how a non-grading layer behaves on a non-base size). Absence is NOT
  // zero: the server neither refuses on it nor adds it up, it marks the allowance unconfirmed.
  //
  // SEAM + CONTOUR > 0 TOGETHER IS REFUSED (double allowance): the allowance would be counted twice
  // and the spread length overstated by it around the perimeter of every piece. There is exactly one
  // way an operator reaches that state — overriding the contour layer by hand onto the cut line and
  // leaving the offset on — which is what makes the refusal both rare and cheap.
  google.type.Decimal contour_allowance_mm = 25;
  reserved 17, 18;
  reserved "seam_allowance_cm", "contour_allowance_cm";

  // The DXF layer the laid contour was taken from. "" = no layer was chosen (there was nothing to
  // choose from in the file). Recorded so the piece DRAWING can be REBUILT at export time from the
  // same geometry rather than from whatever ranks first today.
  optional string contour_layer = 19;

  // The DXF layer the ДОЛЕВАЯ (grain) was read from. AN EMPTY STRING HERE IS MEANINGFUL and means
  // «do not orient» — the operator can switch orientation off deliberately. Hence `optional`: "" and
  // «did not send it» are different answers, and collapsing them would re-orient, on rebuild, pieces
  // the operator forbade orienting.
  optional string grain_layer = 20;

  // The FLIP POLICY the search ran under: was a piece allowed to be laid upside down (180° or
  // mirrored, Ф1)? Recorded SEPARATELY from the cloth's fabric_direction because направление ткани
  // is a property of the cloth TODAY and changes, while a marker must be judged by the conditions it
  // was taken under; and because an unlinked раскладка has no cloth at all.
  //
  // It cannot be inferred from the geometry: «no placement in this layout is flipped» does not mean
  // «flipping was forbidden». Inferring would OVERSTATE strictness and let the «не хуже» rule pass a
  // marker that was in fact free to flip.
  optional bool allow_flip = 21;

  // Сделать маркер РАСКРОЙНЫМ для этого прогона (Ф4.2, migration 0282). 0 = карточный.
  // НЕИЗМЕНЯЕМО после создания: перевод карточного маркера в прогонный (и обратно) переносит право
  // на его жизнь — раскройный умирает вместе с прогоном по FK CASCADE — а вместе с этим правом
  // меняется смысл ссылок из секций настила. Кому надо — копирует.
  //
  // Раскройный маркер не может быть нормой: CHECK chk_tcm_run_not_norm держит это инвариантом, а не
  // соглашением, поэтому смерть прогона физически не может унести норму карточки.
  int32 production_run_id = 22;

  // СОГЛАСИЕ СОХРАНИТЬ ЧАСТИЧНО УЛОЖЕННУЮ РАСКЛАДКУ (0299), а не описание её. Движок раскладки
  // работает В БРАУЗЕРЕ, и его стоимость растёт КАК КВАДРАТ числа деталей, так что на большом наборе
  // поиск успевает разложить часть деталей и упирается в бюджет. Без этого поля такой исход не
  // оставляет ничего: сохранение отказывает (placed_count != total_count), минуты единственного
  // исполнителя выбрасывают, а оператор не видит даже следа того, что задание считалось.
  //
  // ЧТО ИМЕННО МОЖНО СОХРАНИТЬ — РАСКЛАДКУ, ГДЕ ЧАСТЬ ДЕТАЛЕЙ ЛЕГЛА, и не меньше того. Прогон, не
  // уложивший НИ ОДНОЙ детали, маркера не оставляет вовсе, и это не оговорка: used_length_cm обязан
  // быть положительным, а SaveTechCardMarker отказывает на пустом срезе placements. Запись «поиск
  // упёрся в бюджет до первого размещения» — событие клиента, и жить она должна у клиента; схема
  // маркеров её выразить не может и не пытается.
  //
  // ЧТО ЧЕРНОВИК НЕ МОЖЕТ. Стать нормой (SetTechCardMarkerNorm отказывает; CHECK
  // chk_tcm_draft_not_norm держит это инвариантом), назвать расход — ни скалярный
  // consumption_per_unit_cm, ни пер-размерный на строках состава (оба withheld, причина в
  // scalar_apply_refusal), быть штампом norm_marker_id в рецепте и встать в секцию настила. Он может
  // ровно одно: существовать, быть видимым и быть пересчитанным.
  //
  // СЕРВЕР НЕ КОПИРУЕТ ЭТО ПОЛЕ В КОЛОНКУ — она выводится из пары placed_count/total_count. Поэтому
  // true на полной раскладке не помечает её черновиком (сохранится обычной), а пересчёт, уложивший
  // все детали, снимает признак сам, без отдельного подтверждения.
  //
  // И РОВНО ПОЭТОМУ ВАЖНО, ЧТО СЕРВЕР ПРОВЕРЯЕТ ТОЛЬКО ЧИСЛИТЕЛЬ. placed_count обязан равняться
  // числу элементов layout.placements — сервер хранит этот блоб и считает сам. total_count остаётся
  // УТВЕРЖДЕНИЕМ КЛИЕНТА: кратность деталей живёт в карточке, а не в одном числе. Значит клиент,
  // приславший заниженный total_count, и сегодня выдаёт неполную раскладку за полную — так же, как до
  // 0299. Это унаследованный долг, а не обещание контракта; закрыть его сможет клиент, который
  // сохраняет в блобе и НЕУЛОЖЕННЫЕ детали (тогда знаменатель выводится как Σ quantity × состав).
  //
  // Устаревший бандл админки поля не знает, шлёт false и получает прежний отказ — безопасное
  // направление: не зная о черновиках, он не может их наплодить.
  bool is_draft = 26;
}

// TechCardMarkerLayout is the self-contained geometry of a marker, stored as an opaque proto-JSON
// blob (idiom: tech_card_release.snapshot). schema_version guards forward evolution — readers
// degrade gracefully on a version they do not know.
message TechCardMarkerLayout {
  // 1 = the original geometry; 2 adds piece_line_key/block_name on a piece; 3 adds `flipped` on a
  // placement (Ф1); 4 adds `composition` here and `size_id` on a piece (Ф2). The server accepts all
  // four and every stored blob stays readable forever.
  //
  // THIS NUMBER DOES NOT DECIDE WHETHER THE POLICY APPLIES, and an earlier version of this comment
  // said it did. The directional-cloth rule has no version gate: a layout is judged on its geometry
  // whatever version it declares. The number the exemption is read from is a SERVER-WRITTEN column
  // (`tech_card_marker.layout_schema_version`, migration 0268) — a policy generation, not this
  // field. Keying the exemption here was a real defect twice over: `flipped` cannot be forged
  // because the field did not exist before 3, but a 180° is expressible in every version, so
  // «declare schema_version 1» was a working opt-out of the exact ban the policy exists to enforce.
  //
  // What this field IS load-bearing for is `flipped` alone: a mirrored placement in a blob
  // declaring less than 3 is an impossible payload — no stored blob can contain one — and is
  // refused as such rather than as a policy violation.
  int32 schema_version = 1;
  TechCardMarkerNestParams params = 2;
  repeated TechCardMarkerPiece pieces = 3;
  repeated TechCardMarkerPlacement placements = 4;
  repeated string warnings = 5; // parse/nest warnings as shown at save time
  // СОСТАВ of the раскладка (schema_version 4). EMPTY means a legacy blob «one size, N комплектов»:
  // the reader takes the состав from the summary instead — a single entry {summary.size_id,
  // summary.sets} — and gets precisely the pre-Ф2 semantics back. Branch on THE PRESENCE OF THIS
  // FIELD, never on schema_version: the version exists to decide forgery and grandfathering (Ф1),
  // and a reader that switched on it would have to know about versions it will never see again.
  //
  // Only size_id and quantity mean anything HERE. The derived fields the same message carries on a
  // summary (consumption_per_unit_cm, area_per_garment_cm2) are STRIPPED by the save path before the
  // blob is marshalled: the blob is immutable history, and a derived number frozen inside it would
  // outlive the used_length it was derived from — and would be indistinguishable from a измеренное
  // one to every future reader.
  repeated TechCardMarkerCompositionEntry composition = 6;
}

// TechCardMarkerNestParams are the engine inputs that produced the layout — enough to label the
// result honestly; NOT enough to re-run the nest (the contours already carry the parse outcome).
//
// NB (Ф3.5): unit / tol_cm / tol_chain_cm are a CONTRACT ON RE-PARSING, and that half of the
// sentence above needs the qualification. Rebuilding the piece drawing at export time re-parses
// TODAY'S выкройка with EXACTLY these values and checks the resulting contour against the stored one;
// re-parsing with today's defaults instead would tessellate differently and report a geometry drift
// on a file nobody touched. The SEARCH remains irreproducible (the GA is seeded by the composition),
// and that has not changed.
message TechCardMarkerNestParams {
  string unit = 1; // the DXF unit the contours were parsed under (mm | cm | in); "" = auto
  double tol_cm = 2; // tessellation tolerance
  double tol_chain_cm = 3; // loop-chaining tolerance
  double rdp_eps_cm = 4; // simplification epsilon the PLACEMENT ran on (display contours are exact)
  double target_length_cm = 5; // 0 = no target was set
  int32 time_budget_s = 6; // 0 = unknown
}

// TechCardMarkerPiece is one distinct pattern piece: its exact contour (cm, local origin at the
// piece bbox corner) and how many instances ONE GARMENT cuts.
message TechCardMarkerPiece {
  int32 piece_id = 1; // layout-local id placements reference; stable within this blob only
  string name = 2; // block name from the DXF, or the operator's label
  string source = 3; // source DXF filename (display provenance)
  string source_url = 4; // pattern CDN url AT SAVE TIME; provenance only — the object may be GC'd
  // Instances per ONE GARMENT, >= 1. Total instances of this piece in the раскладка:
  //
  //     quantity × (size_id > 0 ? composition[size_id].quantity : total_units)
  //
  // Legacy blob: no size_id anywhere, composition empty, the состав is {summary.size_id,
  // summary.sets} and total_units = sets ⇒ the formula gives quantity × sets, which is exactly what
  // this comment said before Ф2. ONE formula, no branch on the version.
  int32 quantity = 5;
  repeated TechCardMarkerPoint poly = 6; // closed CCW contour, cm, >= 3 points
  double bbox_w_cm = 7;
  double bbox_h_cm = 8;
  double area_cm2 = 9;
  // schema_version 2 additions (both optional): the resolved cut-piece identity at save time, so a
  // marker survives piece renames — readers resolve the display name through the alias map and fall
  // back to `name` as saved. piece_id above stays parse-local (a v1 decision that remains right).
  string piece_line_key = 10; // TechCardPiece.line_key; "" = unresolved at save time
  string block_name = 11; // the DXF block name this piece came from; "" = unknown
  // schema_version 4: the size whose GRADATION this contour belongs to. 0/absent = the piece is
  // size-agnostic (a DXF block with no size suffix — it does not grade, so one is cut per garment
  // of the whole состав) OR the blob is legacy. Both readings collapse into the same formula, see
  // quantity above. A size named here must appear in layout.composition — the server refuses a blob
  // whose piece points at a size the состав does not cut, because the formula would silently give
  // that piece zero instances.
  int32 size_id = 12;
}

message TechCardMarkerPoint {
  double x_cm = 1;
  double y_cm = 2;
}

// TechCardMarkerPlacement is one placed instance: piece contour rotated by rot_deg (CCW) then
// translated by (x_cm, y_cm) in strip coordinates — x along the fabric, y across the width.
message TechCardMarkerPlacement {
  int32 piece_id = 1;
  int32 instance = 2; // 0-based within the piece's instance count, as defined by the formula on TechCardMarkerPiece.quantity
  int32 rot_deg = 3; // 0 | 90 | 180 | 270
  double x_cm = 4;
  double y_cm = 5;
  // The instance is MIRRORED — the contour reflected before rot_deg is applied, so its chirality is
  // the opposite of the piece as parsed. No rotation expresses this: a left and a right полочка are
  // the same outline turned OVER, never turned around, and an engine that can only rotate cuts 44
  // left fronts and zero right ones off a half-set of выкройки. That is the failure this field
  // exists to make expressible (schema_version 3, Ф1).
  //
  // Directional cloth forbids a mirror for the same reason it forbids 180°: both put the piece on
  // the fabric the wrong way up, and ворс, twill or a print then run against the neighbouring
  // piece. The save path refuses either one on a one_way scope, whatever version the blob declares
  // — see the schema_version note above for what that field does and does not decide.
  //
  // THE AXIS IS PART OF THE CONTRACT, and naming it is not pedantry. The reflection is
  // `(x, y) ↦ (−x, y)` — about the Y axis, in the piece's own coordinates, applied BEFORE rot_deg:
  //
  //     placed(p) = R(rot_deg) · M^flipped · p + (x_cm, y_cm),   M: (x, y) ↦ (−x, y)
  //
  // Reflecting about the other axis would also produce a correct chirality, so a reader that
  // guesses wrong still draws a plausible piece — it just draws it a HALF TURN from where the
  // writer meant, because M_x = R(180) · M_y. On plain cloth that is invisible; on ворс it is a
  // ruined panel, and in the label planner it is text upside down. Both renderers and the layout
  // editor must compose this exact expression, and the order matters as much as the axis:
  // M · R(θ) = R(−θ) · M, so mirroring after rotating differs by 2θ, not by a sign.
  bool flipped = 6;
}

// TechCardListItem is a lightweight tech-card header for list views.
message TechCardListItem {
  int32 id = 1;
  string style_number = 2;
  string name = 3;
  string brand = 4;
  TechCardStage stage = 5;
  string status = 6;
  GenderEnum target_gender = 7;
  reserved 8;
  reserved "season";
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  TechCardApprovalState approval_state = 11;
  int32 lock_version = 12; // optimistic-lock token, so a list→edit needs no extra GET
  // Thumbnail URL for a grid/gallery view (idea gallery). For an IDEA card it is the first
  // moodboard image; otherwise the PREVIEW-kind sketch (falling back to the first technical, then any
  // media). Empty when the card has no media. Resolved server-side to avoid an N+1 GetTechCard.
  string preview_url = 13;
  // Card purpose: "sellable" (default) or "auxiliary" (NF-07). Lets a board/list badge auxiliary
  // cards (dust bags, shoppers…) without an N+1 GetTechCard, mirroring TechCard.purpose.
  TechCardPurpose purpose = 14; // R6: type change string→enum on the same wire number
  SkuSeason sku_season = 15;
  // WS7: auxiliary sub-type badge for list views (UNKNOWN=unset), mirroring purpose above.
  TechCardAuxSubtype aux_subtype = 16;
  // Category of the style, so a list/board can group and label by category without an N+1
  // GetTechCard. category_id is the leaf tag; the top/sub/type triple is the derived taxonomy path
  // (0 = unset) — the same columns ListTechCardsRequest.category_ids filters on.
  int32 category_id = 17;
  int32 top_category_id = 18;
  int32 sub_category_id = 19;
  int32 type_id = 20;
  // colorway_count is how many LIVE (non-archived) colourways the style has — the number a list row
  // shows next to a style. Resolved server-side in one batched query for the page, never N+1.
  // NOTE: unrelated to MarginByStyleRow.colorway_count, which counts SKUs that SOLD.
  int32 colorway_count = 21;
  // Auxiliary output material (NF-07): the warehouse material an auxiliary card's run receipts into,
  // plus its name and on-hand balance. Zero/empty for a sellable card. Present so an aux picker can
  // show "820 on hand" beside a dust bag from the list alone — it previously needed one GetTechCard
  // per card plus a warehouse read.
  int32 output_material_id = 22;
  string output_material_name = 23;
  google.type.Decimal output_material_on_hand = 24; // unset when the card has no output material
  // Colour variants of that output (0252), summarised for the row: how many colours the card
  // produces and what the warehouse holds across them ("3 colours · 820 on hand"). ACTIVE variants
  // only — the badge answers "what can I plan", not "what has ever existed". 0/unset means the card
  // is in legacy single-output mode, where output_material_* above is the whole answer.
  int32 output_variant_count = 25;
  google.type.Decimal output_variants_on_hand = 26;
  // How many saved раскладки (markers, 0257) the card carries, batched for the page like
  // colorway_count. The COUNT only — a "latest consumption" here would be a lie without naming
  // the size and the BOM slot it was measured for.
  int32 marker_count = 27;
}
