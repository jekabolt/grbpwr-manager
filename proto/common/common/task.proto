syntax = "proto3";

package common;

import "common/media.proto";
// Указания на вложенной картинке — тот же примитив, что на эскизе и на снимке шага сборки
// (TechCardAnnotation). Импорт односторонний: techcard.proto о задачах не знает.
import "common/techcard.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// Task is a unit of internal team work tracked on the kanban board (NOT a
// customer order). Tasks belong to a board (department) and move across status
// columns via drag-and-drop.
//
// Identity (assignee, created_by, comment author) references an
// admin.AdminAccount by its `username` — the SAME identity used for RBAC. There
// is no separate display name / email in the account model, so `username` is
// exactly what the UI renders and what the assignee picker (populated from
// ListAccounts) stores. `created_by`/`author` are stamped server-side from the
// caller's JWT (never client-supplied); the board itself is gated by a new
// `tasks` RBAC section.

// TaskBoard is the department lane a task lives in. Fixed taxonomy for now; a
// task belongs to exactly one board. Extend by appending members (never reuse
// numbers) — 0 stays UNKNOWN per proto3 convention.
enum TaskBoard {
  TASK_BOARD_UNKNOWN = 0;
  TASK_BOARD_DEVELOPMENT = 1; // портной/конструктор — разработка вещей (образцы, техкарты)
  TASK_BOARD_DESIGN = 2; // дизайн
  TASK_BOARD_MARKETING = 3; // маркетинг
  TASK_BOARD_PRODUCTION = 4; // производство / пошив партии
  TASK_BOARD_SOURCING = 5; // закупка тканей и фурнитуры, поставщики
  TASK_BOARD_CONTENT = 6; // съёмка / контент / подготовка дропа
}

// TaskStatus is the kanban column. A drag between columns is a status change.
enum TaskStatus {
  TASK_STATUS_UNKNOWN = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_TODO = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_REVIEW = 4;
  TASK_STATUS_DONE = 5;
}

enum TaskPriority {
  TASK_PRIORITY_UNKNOWN = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_MEDIUM = 2;
  TASK_PRIORITY_HIGH = 3;
  TASK_PRIORITY_URGENT = 4;
}

// TaskInsert is the writable CONTENT of a task (create/update). Placement on the
// board — board, status, position — is deliberately NOT here: it is set at
// AddTask and changed only via MoveTask, so a content edit can never silently
// re-file a card into another lane/column or reorder it. Other server-managed
// fields (id, created_by, timestamps, resolved media) also live on Task.
message TaskInsert {
  string title = 1; // required
  string description = 2; // optional, free text / markdown
  // DEPRECATED АЛИАС ОДНОГО РЕЛИЗА, а не «главный исполнитель». Настоящий список — assignees ниже.
  // На ВХОДЕ читается только когда assignees пуст (тогда трактуется как список из одного); на
  // ВЫХОДЕ равен assignees[0] или "". Снять reserved'ом СЛЕДУЮЩЕЙ волной по процедуре инвентаря
  // retired-полей (комментарий к newAdminJSONMarshaler, internal/api/http/http.go).
  //
  // ПОЧЕМУ НЕ СНЯТО СРАЗУ: admin-гейтвей разбирает JSON с DiscardUnknown: false, поэтому reserved на
  // живом поле превратил бы каждое сохранение карточки из ОТКРЫТОЙ старой вкладки в 400.
  string assignee = 3 [deprecated = true];
  TaskPriority priority = 4; // TASK_PRIORITY_UNKNOWN = unset
  google.protobuf.Timestamp due_date = 5; // optional; unset = no deadline
  repeated string labels = 6; // freeform lightweight tags within a board (client/list filtering)
  repeated int32 media_ids = 7; // attached reference images/files via the existing media bucket
  // Attached files from the private files library. Separate from media_ids
  // because the two live in buckets with opposite privacy: media is public-read
  // on the CDN (it ships to the storefront), library files are private and leave
  // only through a short-lived presigned url. The UI merges both into a single
  // "attachments" list — the split is a storage fact, not a distinction a person
  // should have to hold in their head.
  repeated int32 file_ids = 16;

  // Optional typed links to existing admin entities (0 / "" = none). Follows the
  // fitting precedent (several nullable typed FKs, NOT a polymorphic entity_type
  // ref) so a card can deep-link to the artifact it is about while that artifact
  // keeps its own state machine (techcard stage/approval, fitting verdict, …).
  // Each target has a single-get RPC so the card can resolve a title/thumbnail.
  int32 tech_card_id = 8; // техкарта — DEVELOPMENT/PRODUCTION anchor; GetTechCard
  int32 product_id = 9; // specific product / SKU / sample; GetProductByID
  string order_uuid = 10; // order needing action; GetOrderByUUID
  int32 archive_id = 11; // drop / timeline being prepared; GetArchiveByID
  int32 fitting_id = 12; // примерка — try-on session this card is about; GetFitting
  int32 production_run_id = 14; // партия — production run this card is about; GetProductionRun
  int32 sample_id = 15; // сэмпл — sample this card is about; GetSample (new-flow NF-04)
  // ПРОЕКТ БИБЛИОТЕКИ ФАЙЛОВ — ВОСЬМОЙ ТИП ССЫЛКИ (0322). Съёмка, лукбук, дроп: контекст, В
  // КОТОРОМ делается эта работа. Тот же пикер и тот же чип, что у семи соседей выше.
  //
  // КОЛОНКА, А НЕ СВЯЗЬ МНОГИЕ-КО-МНОГИМ, в отличие от пары «проект ↔ стиль». Задача — единица
  // работы, и работа происходит в ОДНОМ контексте: «отретушировать отобранное» принадлежит одной
  // съёмке и не может принадлежать двум, не перестав быть одной задачей. У стиля множественность
  // настоящая (одна съёмка покрывает капсулу, одна вещь попадает и в съёмку, и в лукбук).
  //
  // ССЫЛАТЬСЯ МОЖНО ТОЛЬКО НА ТЕМУ kind='project'. Ярлык отвергается InvalidArgument с фразой; на
  // несуществующий id отвечает внешний ключ — тем же отказом, что и у остальных семи ссылок.
  // Проверка в коде, а не CHECK'ом: ретроактивный CHECK проверяет всю историю и валит старт прода.
  //
  // ЗААРХИВИРОВАННЫЙ ПРОЕКТ ССЫЛКУ ПРИНИМАЕТ — как и у стилей (0321). Архив съёмки значит «работа
  // закончена», а не «о ней запрещено говорить»; хвост задач по законченной съёмке нормален, и
  // требовать разархивации ради записи правды значило бы сделать архив препятствием.
  //
  // Понижение проекта в обычную тему и удаление темы ОБНУЛЯЮТ эту ссылку и называют, у скольких
  // карточек. Сама карточка при этом остаётся: она про работу, а не про съёмку.
  int32 project_topic_id = 18;

  // Planned start (when work SHOULD begin), the manual counterpart of due_date.
  // The ACTUAL start (when the card first entered IN_PROGRESS) is the
  // server-stamped Task.started_at, not this field. Unset = no planned start.
  google.protobuf.Timestamp start_date = 13;

  // УКАЗАНИЯ, НАРИСОВАННЫЕ НА ВЛОЖЕННЫХ КАРТИНКАХ. «Тут шов кривой», «вот эту молнию», «отсюда
  // досюда» — сказанное стрелкой на самом снимке, а не пересказанное словами в описании.
  //
  // ПОЛНАЯ ЗАМЕНА ВМЕСТЕ С СОДЕРЖИМЫМ, ровно как media_ids, и по той же причине: обе стороны
  // пишет одна форма карточки, и присланный без указаний список означает «указаний больше нет».
  // Присутствия у repeated-поля нет, поэтому клиент обязан слать то, что прочитал, — тот же
  // круговой рейс, что у labels и media_ids.
  //
  // НАБОР БЕЗ СВОЕЙ КАРТИНКИ СБРАСЫВАЕТСЯ СЕРВЕРОМ: указание на снимке, снятом с карточки,
  // нельзя ни увидеть, ни убрать, а хранить его значило бы копить невидимое.
  repeated TaskMediaAnnotations media_annotations = 17;

  // ИСПОЛНИТЕЛИ КАРТОЧКИ — СПИСОК БЕЗ «ГЛАВНОГО». AdminAccount.username каждый; пусто = задачу
  // никто не взял. Порядок = порядок показа аватарок.
  //
  // ПОЛНАЯ ЗАМЕНА ПРИ СОХРАНЕНИИ, как labels/media_ids: обе стороны пишет одна форма карточки, и
  // присланный пустой список означает «исполнителей больше нет». Клиент обязан слать то, что
  // прочитал.
  //
  // «Главного» в модели НЕТ намеренно: ни фильтр «мои», ни строка карточки файла, ни доска не
  // различают первого и остальных, а различие без потребителя — это поле, которое заполняют
  // наугад. Появись потребитель — им станет первый элемент, и контракт менять не придётся.
  //
  // Существование аккаунта сервером НЕ проверяется — паритет с прежним поведением одиночного
  // assignee: пикер клиента наполняется из ListAccounts.
  repeated string assignees = 19;
}

// TaskMediaAnnotations — указания одной прикреплённой картинки.
//
// ТА ЖЕ СТРУКТУРА, ЧТО НА ЭСКИЗЕ ТЕХ-КАРТЫ И НА СНИМКЕ ШАГА СБОРКИ: `TechCardAnnotation`, вместе с
// её видами, точками, цветом и пунктиром. Имя историческое — примитив указания в системе ОДИН (см.
// довод миграций 0308/0309), и заводить рядом второй набор видов с второй проверкой ради задачи
// значило бы развести их на первой же правке: человек рисует одним и тем же жестом, а читатель
// смотрел бы в две системы.
//
// `piece_line_key`/`piece_line_keys` у задачи смысла не имеют (деталей кроя у карточки нет) и
// сервером ОЧИЩАЮТСЯ: ссылка на деталь чужой тех-карты, которую здесь нечем ни выбрать, ни
// показать, — это висящий ключ, который однажды напечатают.
message TaskMediaAnnotations {
  int32 media_id = 1; // FK media(id); ОБЯЗАН быть одним из media_ids этой же карточки
  repeated TechCardAnnotation annotations = 2;
}

// TaskLinkKind — ВИД СВЯЗИ С ТОЧКИ ЗРЕНИЯ ВЛАДЕЛЬЦА СПИСКА, а не вид строки в хранилище.
//
// В хранилище видов ДВА (blocks|relates) и на один факт приходится ОДНА строка: BLOCKED_BY — это
// blocks, прочитанный с другого конца. Две строки на один факт позволили бы паре полусуществовать —
// A знает, что блокирует B, а B не знает, что заблокирована.
//
// RELATES симметрична и нормализуется при записи (меньший id первым), поэтому дубль (A,B)+(B,A)
// невыразим схемой, а не только кодом.
enum TaskLinkKind {
  TASK_LINK_KIND_UNKNOWN = 0;
  TASK_LINK_KIND_BLOCKS = 1; // эта задача блокирует ту
  TASK_LINK_KIND_BLOCKED_BY = 2; // ту задачу надо закончить раньше этой
  TASK_LINK_KIND_RELATES = 3; // просто связаны
}

// TaskLink — строка связи, КАК ЕЁ РИСУЕТ КАРТОЧКА: второй конец УЖЕ разрешён в заголовок, статус и
// доску (та же доктрина проекции, что у admin.LibraryFileTask), чтобы бейдж «заблокирована» и
// список связей не требовали ни второго RPC, ни N+1.
//
// БЛОКЕР — СОВЕТ, А НЕ ЗАМОК: сервер НЕ запрещает перевести в DONE задачу с открытыми блокерами.
// Доска — drag-and-drop, и отказ посреди жеста хуже бейджа; заархивированный недоделанный блокер
// замуровал бы карточку навсегда. Заблокированность считает клиент: есть BLOCKED_BY со status !=
// DONE. Заархивированный блокер считается ОТКРЫТЫМ, пока не done, — архив прячет с доски, но не
// отменяет «сначала то, потом это».
message TaskLink {
  int32 task_id = 1; // id ВТОРОГО конца связи (не той карточки, в чьём списке эта строка едет)
  TaskLinkKind kind = 2;
  string title = 3;
  TaskStatus status = 4;
  TaskBoard board = 5;
  bool archived = 6;
}

// TaskChecklistItem is one row of a task's checklist — a lightweight subtask with
// a done flag. Checklist items are managed by dedicated add/toggle/delete RPCs
// (NOT bundled into TaskInsert's replace-on-update semantics like labels/media),
// so a content edit never wipes per-item done state.
message TaskChecklistItem {
  int32 id = 1;
  int32 task_id = 2;
  string content = 3; // the checklist line
  bool is_done = 4;
  int32 position = 5; // order within the checklist
  google.protobuf.Timestamp created_at = 6;
}

// Task is a stored kanban card: its content (TaskInsert), its placement on the
// board (board/status/position — server-managed, set by AddTask and mutated only
// by MoveTask), resolved media, and server-stamped identity/timestamps.
message Task {
  int32 id = 1;
  TaskInsert task = 2; // content
  TaskBoard board = 3; // placement: department lane; set by AddTask, changed by MoveTask
  TaskStatus status = 4; // placement: kanban column; set by AddTask, changed by MoveTask
  int32 position = 5; // placement: order within its (board,status) column; managed by AddTask/MoveTask
  repeated MediaFull media = 6; // resolved from task.media_ids for display
  string created_by = 7; // AdminAccount.username, set from the caller's JWT
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Soft-archive: set = the card is archived (hidden from the board and default
  // list, but preserved and restorable via UnarchiveTask); unset = active.
  // Orthogonal to placement — archiving does not change board/status/position.
  google.protobuf.Timestamp archived_at = 10;
  repeated TaskChecklistItem checklist = 11; // resolved checklist items, ordered by position
  // Actual start: server-stamped the FIRST time the card enters IN_PROGRESS
  // (never client-supplied, never cleared on later moves). Unset = the card has
  // not been started yet. This is distinct from the planned TaskInsert.start_date.
  google.protobuf.Timestamp started_at = 12;
  // Ids of the attached library files. Only the ids: the resolved files, with
  // their expiring presigned urls, ride on admin.GetTaskResponse.files, because
  // this message is reused in contexts that get persisted.
  repeated int32 file_ids = 13;

  // РОДИТЕЛЬ-САБТАСКА. 0 = верхний уровень.
  //
  // ЧИТАЕТСЯ ЗДЕСЬ, НО МЕНЯЕТСЯ ТОЛЬКО ЧЕРЕЗ SetTaskParent, и в TaskInsert его НЕТ намеренно:
  // содержимое карточки сохраняется полной заменой, и клиент, не знающий поля, стирал бы родителя
  // каждым сохранением (ровно ловушка «отсутствующее поле = дефолт»). Единственное исключение —
  // AddTaskRequest.parent_task_id, чтобы «создать сабтаску» было одним вызовом.
  //
  // КОЛОНКА, А НЕ ВИД СВЯЗИ: у карточки РОВНО ОДИН родитель, и в колонке два родителя невозможны
  // физически, тогда как таблица связей потребовала бы условного UNIQUE, которого у MySQL нет.
  // Глубина не ограничена; циклы запрещает стор.
  int32 parent_task_id = 14;

  // ВСЕ связи карточки: и blocks/blocked_by в обе стороны, и relates. Вид назван с точки зрения
  // ЭТОЙ карточки (см. TaskLinkKind).
  //
  // ЗДЕСЬ ТОЛЬКО ЧТЕНИЕ. Пишутся связи отдельными идемпотентными AddTaskLink/DeleteTaskLink, а не
  // полной заменой внутри TaskInsert: связь принадлежит ДВУМ карточкам сразу, и полная замена
  // «связей карточки A» при сохранении её формы снесла бы связь, добавленную с карточки B, пока
  // форма A была открыта.
  repeated TaskLink links = 15;

  // Свёртка сабтасок для карточки на доске: сколько АКТИВНЫХ (незаархивированных) детей и сколько
  // из них в DONE. Заголовки детей здесь не резолвятся — доска рисует счётчик, детальная страница
  // берёт их фильтром ListTasks(parent_task_id).
  int32 subtask_total = 16;
  int32 subtask_done = 17;
}

// TaskCommentInsert is the writable payload for a comment. author is set
// server-side from the caller's JWT (not client-supplied).
message TaskCommentInsert {
  int32 task_id = 1;
  string body = 2;
}

message TaskComment {
  int32 id = 1;
  int32 task_id = 2;
  string author = 3; // AdminAccount.username AS OF WRITING — строка-факт, переживает удаление аккаунта
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  // ЖИВАЯ ссылка на аккаунт автора; 0 = аккаунта больше нет (строка author при этом остаётся).
  //
  // Клиент по ней решает, рисовать ли кнопку удаления; ПРОВЕРЯЕТ сервер, и проверяет он ровно эту
  // пару — совпадение имени ПРИ живой ссылке. Одного имени мало: UNIQUE на admins.username
  // освобождает имя при удалении аккаунта, и новый однофамилец совпал бы по строке со всей
  // перепиской прежнего (тот же гейт и тот же довод, что у LibraryFileComment, 0316).
  int32 author_id = 6;
}
