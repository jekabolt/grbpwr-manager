syntax = "proto3";

package common;

import "common/techcard.proto";
import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// ProductionRunStatus is the lifecycle state of a production run (партия). A run is planned, then
// started (in_progress), then received into stock, then closed; it can be cancelled from any
// non-terminal state. Stored as its lowercase name in the DB.
enum ProductionRunStatus {
  PRODUCTION_RUN_STATUS_UNKNOWN = 0;
  PRODUCTION_RUN_STATUS_PLANNED = 1;
  PRODUCTION_RUN_STATUS_IN_PROGRESS = 2;
  PRODUCTION_RUN_STATUS_RECEIVED = 3;
  PRODUCTION_RUN_STATUS_CLOSED = 4;
  PRODUCTION_RUN_STATUS_CANCELLED = 5;
  // At least one partial receipt is booked and the operator has not yet declared the run complete
  // (production-costing Phase 5). Receipt commands own this state and RECEIVED — neither is
  // writable through UpdateProductionRun.
  PRODUCTION_RUN_STATUS_PARTIALLY_RECEIVED = 6;
  // DRAFT (Ф2): расчётная партия — состав набран, деньги считаются, производство НЕ начато.
  //
  // Отличается от PLANNED ровно тремя обязательствами, которых у неё НЕТ: она не резервирует ткань,
  // не проходит гейт готовности и не печатает наряд. Всё это появляется на переходе draft → planned.
  //
  // Так и должно быть: прикидка «сколько будет стоить сто чёрных и полсотни белых» не имеет права
  // занимать сырьё на складе, иначе соседний прогон увидит нехватку из-за чужого черновика.
  PRODUCTION_RUN_STATUS_DRAFT = 7;
}

// ProductionRunLine is one colour-model × size line of a run: which product (colourway) at which
// size, the planned quantity, and — once received — the received and defective counts (unset until
// received) that drive plan/fact. product_id may be 0 while planning (the colourway may not be
// published as a product yet), but every line with a received_qty > 0 must carry it at receive
// time. Replaces the flat ProductionRunSize grid so one marker yields several colour-models (NF-06).
message ProductionRunLine {
  int32 product_id = 1; // FK product(id); 0 = unset (planning only)
  int32 size_id = 2; // FK size(id)
  int32 planned_qty = 3;
  optional int32 received_qty = 4; // unset until the run is received
  optional int32 defect_qty = 5; // unset until the run is received
  // Stable identity of this line, echoed back on read. The store diffs the submitted grid by it
  // instead of delete+reinserting the whole grid, so the row's database id survives an edit — which
  // is what lets receipt lines hold a real foreign key to it. Contract: empty on the way in means
  // "new line, the server mints one" (its fallback is standard base32 — 26 characters of [A-Z2-7]);
  // anything non-empty must be EXACTLY 26 characters of [0-9A-Z] or the save is rejected with
  // InvalidArgument. The admin client mints uppercase Crockford ULIDs (like a tech-card BOM line's
  // line_key) and migration 0230 backfilled 'LEGACY'-prefixed keys onto pre-existing rows; both fit
  // that shape. NEVER regenerate a key the server handed out — that retires the row it names.
  string line_key = 6;
  // The AUX colour this line produces (TechCardOutputVariant.id); 0 = unset. A line carries EITHER a
  // product or a colour variant, never both — a sellable line books into product stock, a colour
  // line into that colour's warehouse bucket. Only a run whose tech card is auxiliary AND has the
  // colour registered as one of its own ACTIVE variants may set it; anything else is refused at
  // save. A product-less line with no variant is the single output line of a legacy single-output
  // aux card, and stays exactly as legal as it was. Like the aux line, a colour line needs no size.
  int32 output_variant_id = 7;
}

// ProductionRunCostKind is the article category of an actual production-run cost.
enum ProductionRunCostKind {
  PRODUCTION_RUN_COST_KIND_UNKNOWN = 0;
  PRODUCTION_RUN_COST_KIND_MATERIALS = 1;
  PRODUCTION_RUN_COST_KIND_CMT = 2;
  PRODUCTION_RUN_COST_KIND_HARDWARE = 3;
  PRODUCTION_RUN_COST_KIND_PACKAGING = 4;
  PRODUCTION_RUN_COST_KIND_LOGISTICS = 5;
  PRODUCTION_RUN_COST_KIND_DUTY = 6;
  PRODUCTION_RUN_COST_KIND_OTHER = 7;
}

// ProductionRunCost is one actual cost article incurred for a run (phase 2). amount is in
// `currency`; amount_base is the base-currency equivalent — server-folded via the costing FX
// rates when left unset on write, or supplied manually — so run totals need no read-time FX.
message ProductionRunCost {
  ProductionRunCostKind kind = 1;
  string description = 2;
  google.type.Decimal amount = 3;
  string currency = 4; // ISO 4217
  google.type.Decimal amount_base = 5; // base-currency amount (server-folded when unset)
  google.protobuf.Timestamp incurred_at = 6;
  // Cost-document fields (plan 12.3, columns landed in 0234): who invoices this article, under
  // which document, with what VAT, and where the payable stands. They are what lets the UI say
  // "оплачено" instead of only "начислено". All optional.
  int32 supplier_id = 7; // supplier catalog FK; 0 = none
  string document_ref = 8; // invoice / proforma number
  google.type.Decimal vat_rate = 9; // %, e.g. 23
  google.type.Decimal vat_amount = 10; // document VAT amount, in `currency`
  string ap_status = 11; // accrued (default) | invoiced | paid
}

// ProductionRunCostByKind is the base-currency total of actual costs of one kind.
message ProductionRunCostByKind {
  ProductionRunCostKind kind = 1;
  google.type.Decimal amount_base = 2;
}

// ProductionRunActuals is the computed-on-read plan/fact summary of a run: actual totals from the
// cost articles + the phase-1 size grid, against the frozen planned unit cost.
message ProductionRunActuals {
  google.type.Decimal actual_total_base = 1; // Σ cost.amount_base
  string base_currency = 2;
  int32 planned_qty_total = 3;
  int32 received_qty_total = 4;
  int32 defect_qty_total = 5;
  google.type.Decimal actual_unit_cost = 6; // actual_total_base / received_qty_total
  google.type.Decimal defect_pct_actual = 7; // defect / (received + defect) × 100
  repeated ProductionRunCostByKind by_kind = 8;
  google.type.Decimal planned_total_base = 9; // planned_unit_cost × received_qty_total
  google.type.Decimal unit_cost_variance = 10; // actual_unit_cost − planned_unit_cost
  google.type.Decimal total_variance = 11; // actual_total_base − planned_total_base
  bool has_base = 12; // false when some cost article could not be folded to base (total is partial)
  // materials issued from the warehouse (NF-06): Σ (issue_production − return_production) ×
  // unit_cost_base. Folded INTO actual_total_base, so a run can cost its fabric either by hand
  // (a kind=materials cost article) or from stock issues — or, with the caveat below, both.
  google.type.Decimal materials_from_stock_base = 13;
  bool mixed_materials_sources = 14; // both a manual kind=materials cost AND stock issues exist (possible double count)
  bool has_uncosted_issues = 15; // some stock issue had no average cost, so materials_from_stock understates
  // Per-colourway material cost (gap-07 v2 C): stock issues grouped by the product_id they were cut
  // for. Covers materials_from_stock only (manual cost articles stay run-level). Issues with no
  // product_id fall into unattributed_materials_base, not any colourway.
  repeated ProductionRunColorwayCost by_colorway = 16;
  google.type.Decimal unattributed_materials_base = 17; // stock issues not attributed to a colourway
}

// ProductionRunColorwayCost is one colour-model's slice of a run's material-from-stock cost (gap-07
// v2 C): the net material issued for that product and, if it received units, its per-unit material
// cost. Manual (non-stock) cost articles are run-level and are NOT split here.
message ProductionRunColorwayCost {
  int32 product_id = 1;
  int32 received_qty = 2; // units of this colour-model received (from the run lines)
  google.type.Decimal materials_from_stock_base = 3; // net (issue − return) × unit_cost_base for this product
  google.type.Decimal materials_unit_cost = 4; // materials_from_stock_base / received_qty (omitted if none received)
  bool has_uncosted = 5; // an issue for this product had no average cost, so its figure understates
}

// ProductionRunReceiptLine is one counted plan line of a receipt: which line (by its stable
// line_key), what was booked as good stock and what was counted as defect. product_id/size_id are
// snapshots of the plan line at receipt time; size_id 0 means the line has no size (auxiliary runs).
message ProductionRunReceiptLine {
  string line_key = 1; // the plan line's stable identity (ProductionRunLine.line_key)
  int32 product_id = 2; // snapshot; 0 = product-less line (aux output / defect-only planning line)
  int32 size_id = 3; // snapshot; 0 = size-less line (aux output)
  int32 good_qty = 4; // units posted to stock (or the material warehouse for aux)
  int32 defect_qty = 5; // units counted as defect — never A-grade stock
  // Where the defect units went (Phase 7): "scrap" (recorded fact + posting-rule resolution) or
  // "seconds" (booked into the product's B-grade variant stock).
  string defect_disposition = 6;
}

// ProductionRunReceipt is one immutable receiving event of a run (Phase 4, receipt v1; Phase 5
// allows several per run): who received what and when, at what frozen valuation.
// unit_cost_base/base_currency are money and are stripped without costing:read; has_base false
// means the valuation was not computable at receipt time (uncosted issues / unfolded cost
// articles) and unit_cost_base is unset.
message ProductionRunReceipt {
  int32 id = 1;
  int32 run_id = 2;
  google.protobuf.Timestamp received_at = 3;
  string admin_username = 4;
  string note = 5;
  google.type.Decimal unit_cost_base = 6; // frozen actual unit cost at receipt time (money)
  string base_currency = 7;
  bool has_base = 8;
  repeated ProductionRunReceiptLine lines = 9;
  google.protobuf.Timestamp created_at = 10;
  // The receipt that declared the run complete and flipped it to RECEIVED (Phase 5). Every
  // pre-Phase-5 receipt is final by construction.
  bool final = 11;
  // Accounting outbox state of this receipt: 'pending' | 'posted' | 'dead_letter'. Read-only
  // operational fact (the posting worker owns it); visible without costing:read — it carries no
  // amounts.
  string posting_status = 12;
  // Phase 6 reversal linkage. On a reversal row, reversal_of names the receipt it reversed; on a
  // reversed receipt, reversed_by names its reversal row. 0 = not set. A reversed receipt's units
  // and money are excluded from every rollup; the pair stays in the history for the audit trail.
  int32 reversal_of = 13;
  int32 reversed_by = 14;
}

// ProductionMarkerSource / ProductionRunMarker were REMOVED (production-costing Phase 2, review
// cut): the marker import surface shipped write-only — no editor ever existed and the admin client
// always sent an empty list, so the table held nothing. The run-level marker facts that ARE used
// (marker_efficiency_pct / marker_notes on ProductionRunInsert) stay. The table is dropped by a
// follow-up contract migration once no serving binary references it (expand/contract).

// ProductionRunInsert is the writable payload for a run (header + colour-model × size lines).
// planned_unit_cost / planned_currency are NOT here — they are server-snapshotted at plan time
// (from the linked tech_card_release or the live card's computed costing) and are read-only on write.
message ProductionRunInsert {
  int32 tech_card_id = 1; // required
  int32 release_id = 2; // optional tech_card_release to plan from (0 = none / plan from live card)
  ProductionRunStatus status = 3; // required
  google.protobuf.Timestamp started_at = 4;
  // server-owned since Phase 0a; a client-sent value is ignored. received_at is the timestamp of a
  // physical receipt, stamped only by the receive flow beside the stock it books — a client-writable
  // one let an open run be back-dated into the accounting scan with no stock movement behind it.
  google.protobuf.Timestamp received_at = 5 [deprecated = true];
  string notes = 6;
  repeated ProductionRunLine lines = 9; // colour-model × size grid (NF-06, replaces sizes)
  repeated ProductionRunCost costs = 8; // actual cost articles (phase 2)
  google.type.Decimal marker_efficiency_pct = 10; // % fabric utilisation from the nesting software (NF-06)
  string marker_notes = 11; // free marker / раскладка parameters
  // markers (the ProductionRunMarker list) removed — see the tombstone above ProductionRunInsert.
  reserved 12;
  reserved "markers";
  // Run ACTUAL cutting wastage % (0..100), entered per run once the marker/lay is known. When set it
  // OVERRIDES the BOM line's estimate wastage_percent in the run's cost calc (planned-cost snapshot +
  // material plan); unset falls back to the BOM estimate. Refines the plan side only — the run's ACTUAL
  // cost still derives from real material issues.
  google.type.Decimal actual_wastage_percent = 13;
  // Planning dates for the overdue view (production cockpit). Client-writable, unlike started_at's
  // sibling received_at: they are INTENT, not a stamped fact, so nothing downstream books stock or
  // accrues cost from them.
  //   planned_start_at — when the batch is planned to go into work (started_at is the real transition).
  //   promised_at      — дата, к которой партия обещана. An open run (planned/in_progress) whose
  //                      promised_at is in the past is overdue; that is exactly what
  //                      ListProductionRunsRequest.overdue_only filters on.
  google.protobuf.Timestamp planned_start_at = 14;
  google.protobuf.Timestamp promised_at = 15;
  // The factory running the batch (Phase 9, plan 12.1): FK to the supplier catalog; 0 = none.
  // Unlocks per-vendor variance/defect reporting.
  int32 supplier_id = 16;
  reserved 7; // was `repeated ProductionRunSize sizes` (flat per-size grid; replaced by lines)
}

// ProductionRun is a stored run: the writable payload plus the server-owned identity, the frozen
// plan snapshot, and timestamps.
message ProductionRun {
  int32 id = 1;
  ProductionRunInsert run = 2;
  google.type.Decimal planned_unit_cost = 3; // snapshot of the card/release unit cost at plan time
  string planned_currency = 4; // currency of planned_unit_cost
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  ProductionRunActuals actuals = 7; // computed-on-read plan/fact summary
  // Optimistic-lock token, bumped on every UpdateProductionRun. Echo into
  // UpdateProductionRunRequest.expected_lock_version so a list→edit needs no extra GET (mirrors
  // TechCard.lock_version).
  int32 lock_version = 8;
  // The run's receiving events (Phase 4, receipt v1), oldest first. Populated on the single-run
  // read (GetProductionRun); list reads leave it empty to keep them light. Money on each receipt is
  // stripped without costing:read.
  repeated ProductionRunReceipt receipts = 9;
  // The run's append-only lifecycle audit trail (Phase 8), oldest first. Single-run read only.
  // receipt_posted / receipt_reversed events REFERENCE their receipt in the JSON payload — they
  // never duplicate its data.
  repeated ProductionRunEvent events = 10;
  // Server-side "expected vs booked" cross-checks over the run's journals (plan 04 §4.2 / 12.5).
  // Single-run read only; every failed check carries an operator-facing detail sentence.
  repeated ProductionRunReconCheck recon = 11;
  // Ф6.7. Та же формула планового юнит-коста, посчитанная по СЕГОДНЯШНЕЙ карточке.
  // planned_unit_cost (:3) снимается ОДИН РАЗ, на создании, и сознательно не пересчитывается на
  // update — дата того снимка есть created_at и ничто другое.
  //
  // Значит два числа законно расходятся: пересъёмка нормы двигает цену карточки и не двигает цену
  // прогона. Клиент показывает расхождение, СРАВНИВАЯ ЭТИ ДВА ЧИСЛА, а не сравнивая даты: ни
  // сохранение раскладки (store/techcard/markers.go), ни запись рецепта не двигают
  // tech_card.updated_at, поэтому датой расхождение не ловится ровно в том случае, ради которого
  // бейдж и заводится.
  //
  // НО ПРИЧИНУ РАСХОЖДЕНИЯ НАЗЫВАТЬ НЕЛЬЗЯ — сказать «карточка изменилась» значит соврать в
  // распространённом случае. В формулу входит и actual_wastage_percent САМОГО ПРОГОНА, а его
  // UpdateProductionRun правит (productionrun.go, UPDATE ... actual_wastage_percent). Оператор,
  // поправивший процент раскроя у прогона, получил бы обвинение карточки, в которой никто ничего
  // не трогал, и пошёл бы искать несуществующую правку. Клиент обязан сказать ФАКТ («снимок от
  // <created_at>: A; сегодня та же формула даёт B») и перечислить обе возможные причины.
  //
  // ПУСТО значит «сегодня посчитать не удалось» (карточка исчезла, костинг не в базовой валюте) —
  // НЕ ноль, и отличать это обязан клиент. planned_unit_cost тоже законно бывает пуст
  // (setPlannedCostIfBase пишет NULL при небазовой валюте), поэтому «снапшота нет» и «расхождение
  // есть» — разные предложения.
  //
  // ТОЛЬКО на одиночном чтении (GetProductionRun); на списках пусто всегда — это лишний расчёт
  // костинга на строку. Деньги: снимается stripProductionRunCosting наравне с planned_unit_cost.
  google.type.Decimal planned_unit_cost_today = 12;
  // ПОЧЕМУ цены партии нет — словами, а не догадкой по пустоте.
  //
  // До этого поля пустая цена была неотличима от «ноль» и от «пока не считали»: сервер возвращал
  // невалидный decimal, и клиент выводил причину сам, из соседних признаков. Причин же несколько, и
  // ведут они в РАЗНЫЕ места: у партии нет строк с количеством; ячейка (колорвей, размер) не
  // считается; строка называет колорвей, которого у карточки нет; ячейки разошлись по валютам.
  //
  // ПУСТАЯ СТРОКА = цена посчитана (или её никто не спрашивал). Непустая — готовое предложение для
  // экрана; клиент его показывает, а не переводит.
  string planned_cost_reason = 13;
}

// ProductionRunEvent is one row of the run's append-only audit trail: who did what to the run,
// when, why, with a JSON payload describing the effects (references, never duplicated data).
message ProductionRunEvent {
  int32 id = 1;
  string event_type = 2; // created | started | receipt_posted | receipt_reversed | units_scrapped | closed | cancelled
  string actor = 3; // admin username; empty = system
  string reason = 4;
  string payload = 5; // JSON object; shape depends on event_type
  google.protobuf.Timestamp created_at = 6;
}

// ProductionRunReconCheck is one typed cross-check of the run's derived state against its
// journals. ok=false means the two disagree; detail says what to look at.
message ProductionRunReconCheck {
  string key = 1; // stable identifier, e.g. units_receipts_vs_stock_journal
  string expected = 2;
  string actual = 3;
  bool ok = 4;
  string detail = 5;
}

// НАСТИЛЫ ПРОГОНА (Ф4). Настил — собственная сущность (production_run_lay / _section, migration
// 0281), а не поле прогона: сохранение прогона его не касается НИКОГДА, и это структурная починка
// причины смерти 0119 (полная замена детей на каждом сохранении, 0243:3-9).

// Режим настилания. Решает три физических вопроса сразу (00-model.md:35-39): обязано ли число
// слоёв быть чётным, можно ли направленную ткань, и как развёртка зеркальных деталей в маркере
// превращается в изделия.
enum ProductionLayMode {
  PRODUCTION_LAY_MODE_UNSPECIFIED = 0;
  PRODUCTION_LAY_MODE_FACE_UP = 1; // лицом вверх: каждая деталь пары — отдельное размещение
  PRODUCTION_LAY_MODE_FACE_TO_FACE = 2; // лицом к лицу: пара слоёв даёт левую и правую из ОДНОГО размещения
}

// Чем ИЗМЕРЕН фактический расход настила (Ф5б.2). Метод едет рядом с числом, а не подразумевается,
// потому что два метода врут по-разному: рулон до/после наследует ошибку измерения остатка и не
// видит того, что уехало в обрезки, а взвешивание переводится в метры через плотность и ширину и
// потому чувствительно к ним обеим. Число без метода — это число, о точности которого нечего
// сказать, поэтому схема требует их вместе (chk_prlay_actual_complete, 0285).
enum ProductionLayActualMethod {
  PRODUCTION_LAY_ACTUAL_METHOD_UNSPECIFIED = 0; // факт не введён
  PRODUCTION_LAY_ACTUAL_METHOD_ROLL_BEFORE_AFTER = 1; // замер рулона до и после настилания
  PRODUCTION_LAY_ACTUAL_METHOD_WEIGHED = 2; // взвешивание израсходованного
}

// Статус любой проверки Ф4. UNKNOWN — ПЕРВОКЛАССНОЕ значение и НИКОГДА не читается как OK:
// «не смогли проверить» и «проверили, всё хорошо» — разные предложения, и клиент обязан их
// различать. Это та же дисциплина, что unknown_count у гейта Ф6.
enum ProductionLayCheckStatus {
  PRODUCTION_LAY_CHECK_STATUS_UNSPECIFIED = 0;
  PRODUCTION_LAY_CHECK_STATUS_OK = 1;
  PRODUCTION_LAY_CHECK_STATUS_WARNING = 2;
  PRODUCTION_LAY_CHECK_STATUS_BLOCKER = 3;
  PRODUCTION_LAY_CHECK_STATUS_UNKNOWN = 4;
}

// ПОДПИСЬ ИСТОЧНИКА ПОКРЫТИЯ живёт НЕ здесь. Ф6 приехала первой и объявила
// admin.ProductionRunCoverageSource в admin.proto; правило «кто приехал вторым — берёт чужой»
// (решение оркестратора Р1) применяется к самой Р1, поэтому Ф4 использует существующее
// перечисление и лишь дополняет его значением MIXED. Двух определений одного слова нет.

message ProductionRunLayQtyEntry {
  int32 size_id = 1;
  int32 qty = 2;
}

// Одна проверка годности. key стабилен и называет ФАКТ, а не экран и не предложение — правила
// ключей те же, что у находок гейта Ф6.
message ProductionLayCheck {
  string key = 1;
  ProductionLayCheckStatus status = 2;
  string label = 3;
  string detail = 4; // фактическое состояние; ПУСТО только у OK
  int32 marker_id = 5; // 0 = проверка про настил целиком
  string piece_line_key = 6; // "" = проверка не про конкретную деталь
}

message ProductionRunLaySectionInsert {
  string section_key = 1;
  int32 marker_id = 2;
  int32 plies = 3;
  int32 position = 4;
}

message ProductionRunLaySection {
  int32 id = 1;
  string section_key = 2;
  int32 marker_id = 3;
  string marker_name = 4;
  int32 plies = 5;
  int32 position = 6;
  google.type.Decimal marker_length_cm = 7;
  google.type.Decimal marker_width_cm = 8;
  google.type.Decimal section_length_cm = 9; // marker_length_cm × plies
  repeated ProductionRunLayQtyEntry marker_composition = 10;
  repeated ProductionLayCheck checks = 11;
}

message ProductionRunLayInsert {
  string lay_key = 1; // ULID; пусто = сервер минтит (создание)
  int32 colorway_id = 2;
  string bom_line_key = 3; // слот адресуется СТАБИЛЬНЫМ ключом, не id — мир line_key (0230/0159)
  ProductionLayMode mode = 4;
  google.type.Decimal end_loss_cm = 5; // на ОДИН конец ОДНОГО слоя
  string name = 6;
  string note = 7;
  int32 display_order = 8;
  repeated ProductionRunLaySectionInsert sections = 9;
  // qty_snapshot СОЗНАТЕЛЬНО ОТСУТСТВУЕТ: снимок считает сервер по СВОИМ строкам прогона.
  // Принятый от клиента снимок можно подделать, а подделанный снимок гасит бейдж устаревания —
  // то есть ровно тот сигнал, ради которого он существует.

  // С КАКОГО РУЛОНА настилали (Ф5б.1). 0 = рулон не назван. Едет ТОЛЬКО идентификатор: снимок
  // lot_code сервер снимает сам в момент привязки — присланный клиентом снимок можно разойтись с
  // лотом, на который он якобы ссылается, и тогда настил называл бы не тот рулон, что взял.
  int32 lot_id = 10;

  // ФАКТ РАСХОДА (Ф5б.2) — «целиком или никак». actual_qty задан ⇒ заданы и actual_uom, и
  // actual_method; это CHECK в схеме (0285), а не соглашение: факт без единицы — число, которое
  // нечем сложить. Обратное не требуется: единица, выбранная в форме раньше количества, — это
  // наполовину заполненная форма, а не ложь.
  //
  // Единица закрыта ПРОВОДОМ, а не колонкой: перечислением MaterialUnit клиент физически не может
  // прислать «метры». Хранение остаётся текстовым — так же, как каталожный material.unit (0271),
  // где нормализация живёт на чтении, а не в схеме.
  //
  // actual_by / actual_at НЕ принимаются: их штампует сервер. Кто и когда назвал число — это то,
  // что делает факт фактом, и присланное клиентом «кто» ничего не удостоверяет.
  google.type.Decimal actual_qty = 11;
  MaterialUnit actual_uom = 12;
  ProductionLayActualMethod actual_method = 13;

  // ЛОТ И ФАКТ — ЕДИНСТВЕННЫЕ ПОЛЯ ЭТОГО СООБЩЕНИЯ, ГДЕ МОЛЧАНИЕ НЕ ЕСТЬ СТИРАНИЕ, И ЭТИ ДВА ФЛАГА
  // СУЩЕСТВУЮТ РОВНО ЗАТЕМ, ЧТОБЫ ТАК МОЖНО БЫЛО СКАЗАТЬ.
  //
  // Всё остальное здесь — полная замена состояния: не прислал имя, значит имя стёрлось. Для лота и
  // факта это неприемлемо, потому что их пишет ДРУГОЙ ЧЕЛОВЕК В ДРУГОЙ МОМЕНТ. Замер делает цех,
  // после того как рулон уже раскроен, а число слоёв правит планировщик — и правит на экране, где
  // факта не видно. Оптимистичная блокировка от этого не спасает: она ловит УСТАРЕВШУЮ копию, а
  // здесь копия свежая, просто писатель про поле не знает. Стёртый замер не переснять: рулон уже
  // разрезан.
  //
  // Отсюда три состояния вместо двух, и голым lot_id их не выразить — int32 не различает «не
  // трогай» и «отвяжи», оба приезжают нулём:
  //
  //   lot_id > 0                          → привязать этот лот
  //   clear_lot = true                    → ОТВЯЗАТЬ (lot_id при этом игнорируется)
  //   ни того, ни другого                 → НЕ ТРОГАТЬ уже привязанный лот
  //
  //   actual_qty задан                    → записать факт (uom и method обязательны вместе с ним)
  //   clear_actual = true                 → СНЯТЬ факт целиком, вместе с автором и временем
  //   ни того, ни другого                 → НЕ ТРОГАТЬ уже введённый факт
  //
  // Флаг, а не «отрицательный id» и не «пустая строка»: отвязка — это НАМЕРЕНИЕ, и оно обязано быть
  // произнесено, а не закодировано в значении, которое можно прислать по невнимательности.
  bool clear_lot = 14;
  bool clear_actual = 15;
}

message ProductionRunLay {
  int32 id = 1;
  string lay_key = 2;
  int32 colorway_id = 3;
  string colorway_name = 4;
  int32 bom_item_id = 5; // 0 = слот удалён из BOM; настил BROKEN, см. checks
  string bom_line_key = 6;
  string bom_item_name = 7;
  int32 material_id = 8; // артикул, который колорвей пинит СЕГОДНЯ (не снимок)
  string material_name = 9;
  ProductionLayMode mode = 10;
  google.type.Decimal end_loss_cm = 11;
  string name = 12;
  string note = 13;
  int32 display_order = 14;
  int32 lock_version = 15;
  repeated ProductionRunLaySection sections = 16;
  repeated ProductionRunLayQtyEntry qty_snapshot = 17;
  repeated ProductionRunLayQtyEntry qty_current = 18;
  bool quantities_stale = 19; // снимок ≠ сегодняшние строки прогона
  int32 total_plies = 20; // Σ plies по секциям
  google.type.Decimal cloth_length_cm = 21; // Σ(длина маркера × слои) — БЕЗ концевых потерь
  google.type.Decimal end_loss_total_cm = 22; // 2 × end_loss_cm × total_plies
  google.type.Decimal planned_length_cm = 23; // сумма двух — ЭТО и есть план настила
  google.type.Decimal stack_height_cm = 24; // не задано ⇒ пусто, см. чек lay_stack_height
  repeated ProductionLayCheck checks = 25;
  string created_by = 26;
  string updated_by = 27;
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;

  // РУЛОН, С КОТОРОГО НАСТИЛАЛИ (Ф5б.1). Две половины, и вторая не декоративна: lot_id = 0 при
  // НЕПУСТОМ lot_code означает «рулон удалён из справочника» (FK стоит на SET NULL), и настил
  // по-прежнему может НАЗВАТЬ то, что взял. Обе пусты — рулон просто не назвали. Различать эти два
  // случая обязательно: первый — история, которую нельзя переписать, второй — незаполненное поле.
  int32 lot_id = 30;
  string lot_code = 31;

  // ФАКТ РАСХОДА (Ф5б.2), как его ввёл человек. actual_uom = MATERIAL_UNIT_UNKNOWN при пустом
  // actual_qty — это «факта нет», а не «единица неизвестна».
  google.type.Decimal actual_qty = 32;
  MaterialUnit actual_uom = 33;
  ProductionLayActualMethod actual_method = 34;
  string actual_by = 35;
  google.protobuf.Timestamp actual_at = 36;

  // ДРЕЙФ = actual_qty / план настила − 1, в процентах. Пусто, если нет факта, нет плана или их
  // единицы несводимы — «нечего сравнить» и «сошлось» обязаны выглядеть по-разному.
  //
  // Сравнивается с ПЛАНОМ НАСТИЛА (planned_length_cm), и круга здесь нет — это самое неочевидное
  // место фазы. Решение Ф4 постановило, что коэффициент раскроя артикула на пути настилов НЕ
  // применяется, поэтому план настила — чистая геометрия. Коэффициент же покрывает усадку, обход
  // пороков, сращивание и оттеночные полосы, то есть ровно то, чего геометрия не видит. Значит
  // дрейф — честная оценка того, что коэффициент обязан покрыть. Применяйся коэффициент к настилу,
  // калибровка стала бы круговой: коэффициент правил бы план, а план — коэффициент.
  google.type.Decimal actual_drift_percent = 37;
}

// Клетка покрытия (Ф4.5). Считается ПО РАЗМЕЩЕНИЯМ, минимум по всем деталям всех тканей колорвея.
message ProductionRunLayCoverageCell {
  int32 colorway_id = 1;
  int32 size_id = 2;
  int32 planned_qty = 3;
  int32 covered_qty = 4;
  ProductionLayCheckStatus status = 5; // OK | BLOCKER | UNKNOWN — WARNING здесь не бывает
  repeated int64 blocking_bom_item_ids = 6;
  repeated string blocking_piece_names = 7;
  int32 unknown_piece_count = 8;
}

// Диагностика клетки: почему покрытие такое. Читается человеком в поповере клетки.
message ProductionRunLayPieceYield {
  int32 colorway_id = 1;
  int32 size_id = 2;
  string piece_line_key = 3;
  string piece_name = 4;
  int64 bom_item_id = 5;
  int32 required_per_garment = 6;
  int32 cut_as_drawn = 7;
  int32 cut_mirrored = 8;
  int32 garment_yield = 9;
  int32 overcut_qty = 10; // выкроено сверх нужного на covered_qty изделий — цена режима
  ProductionLayCheckStatus status = 11;
  string detail = 12;
}

// ПРИЁМКА КРОЯ (Ф5б.5): строка на пару (настил, размер).
//
// ЦЕПОЧКА ЧИСЕЛ ПРОГОНА НАЗЫВАЕТСЯ ЗДЕСЬ, ОДИН РАЗ И ЦЕЛИКОМ:
//
//   заказано (production_run_line.planned_qty)
//     → ВЫКРОЕНО (cut_qty)
//       → ПРИНЯТО В ПОШИВ (accepted_qty)
//         → сдано готовым (production_run_line.received_qty)
//           → брак (production_run_line.defect_qty)
//
// Приёмка кроя вставляет ДВА НОВЫХ числа МЕЖДУ заказанным и сданным. Существующие поля при этом НЕ
// переозначиваются, и это не аккуратность, а необходимость: переименуй мы received_qty в «принято»,
// завелась бы двойная бухгалтерия, где «принято в пошив» и «сдано готовым» неизбежно разойдутся, а
// называться будут одинаково.
//
// ЧИСЛА НЕ ВАЛИДИРУЮТСЯ ДРУГ ПРОТИВ ДРУГА. «Заказано 10, выкроено 12» — законный перекрой;
// «выкроено 12, принято 10» — законный брак раскроя. Расхождение ПОКАЗЫВАЕТСЯ, а не запрещается:
// запрет превратил бы отчёт о том, что произошло со столом, в спор с формой ввода.
//
// ЗАКАЗАННОГО И СДАННОГО ЗДЕСЬ СОЗНАТЕЛЬНО НЕТ, хотя показывать их надо рядом. planned_qty и
// received_qty живут на строке прогона, а её ключ — (колорвей, размер), тогда как ключ настила —
// (колорвей, слот BOM). У одного колорвея законно несколько настилов (разные размерные блоки,
// разные ткани), поэтому копия planned_qty в каждую строку приёмки была бы одним и тем же числом,
// размноженным по настилам, и любая сумма по строкам приёмки удвоила бы заказ. Клиент показывает
// цепочку целиком, соединяя эти строки со строками прогона, которые у него уже есть.
message ProductionRunCutReceipt {
  int32 id = 1;
  string lay_key = 2; // настил адресуется СТАБИЛЬНЫМ ключом, а не id — мир lay_key (0281)
  int32 size_id = 3;
  string size_name = 4;
  int32 cut_qty = 5; // ВЫКРОЕНО с этого настила
  int32 accepted_qty = 6; // ПРИНЯТО В ПОШИВ из выкроенного
  string note = 7;
  string created_by = 8;
  string updated_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Апсерт строки приёмки. Пара (настил, размер) — естественный ключ: у одного настила один размер
// приходит один раз, поэтому повторное сохранение той же пары ПРАВИТ строку, а не заводит вторую.
message ProductionRunCutReceiptInsert {
  int32 size_id = 1;
  int32 cut_qty = 2;
  int32 accepted_qty = 3;
  string note = 4;
}

// КАЛИБРОВКА КОЭФФИЦИЕНТА РАСКРОЯ ПО ФАКТУ НАСТИЛОВ (Ф5б.3, решение Р4).
//
//   дрейф_настила = actual_qty / planned_lay_qty − 1
//   предложение   = МЕДИАНА дрейфов настилов этого артикула, где есть И план, И факт
//
// КРУГА ЗДЕСЬ НЕТ, и это самое неочевидное место фазы. Ф4 постановила, что коэффициент раскроя на
// пути настилов НЕ ПРИМЕНЯЕТСЯ: план настила — чистая геометрия (длина маркера × слои + концевые
// потери). Коэффициент покрывает ровно то, чего геометрия НЕ видит: усадку, обход пороков,
// сращивание, оттеночные полосы. Отсюда право делить одно на другое. Применяйся коэффициент к
// настилу, калибровка стала бы круговой и сходилась бы к произвольной точке.
//
// ПРЕДЛОЖЕНИЕ, А НЕ ПРИМЕНЕНИЕ. Сервер не пишет коэффициент никогда; принимает его рука владельца
// артикула — та же дисциплина, что у нормы в Ф3 и у пер-размерного расхода в Ф2.4.
enum MaterialCoefficientSuggestionStatus {
  // Сервер ВСЕГДА присылает одно из трёх ниже. Ноль остаётся за «поле не заполнено» и обязан
  // читаться клиентом как ОТСУТСТВИЕ предложения — никогда как READY.
  MATERIAL_COEFFICIENT_SUGGESTION_STATUS_UNSPECIFIED = 0;
  // Настилов с планом И фактом меньше трёх. Предложения нет вовсе, и это содержание ответа, а не
  // его отсутствие: коэффициент, выведенный из одного замера, — догадка в одежде числа.
  MATERIAL_COEFFICIENT_SUGGESTION_STATUS_TOO_FEW_FACTS = 1;
  // Медиана посчитана, но коэффициент из неё поле не примет (вне [1, 3], chk 0270). ИЗМЕРЕНИЕ
  // отдаётся (median_drift_percent), число-предложение — НЕТ, и оно НЕ ПРИЖИМАЕТСЯ к границе:
  // зажать −12% в 1.0 значило бы подменить измерение ближайшим сохраняемым значением.
  MATERIAL_COEFFICIENT_SUGGESTION_STATUS_OUT_OF_RANGE = 2;
  // Предложение есть, и его можно сохранить как есть.
  MATERIAL_COEFFICIENT_SUGGESTION_STATUS_READY = 3;
}

// Вклад ОДНОГО настила в калибровку — с ТРЕТЬИМ ОТВЕТОМ.
//
// Разбор едет наружу ЦЕЛИКОМ, вошедшие и невошедшие настилы вместе: медиана по построению ПРЯЧЕТ
// выброс, а выброс — это, скорее всего, опечатка замерщика («ввели 500 вместо 50»). Отдать только
// медиану значило бы починить арифметику и оставить неверную строку в базе навсегда. Увидеть её
// должен человек, поэтому настил называет себя (прогон, карточка, имя), а не только id.
message MaterialCoefficientLayDrift {
  int32 lay_id = 1;
  string lay_key = 2;
  string lay_name = 3;
  int32 run_id = 4;
  int32 tech_card_id = 5;
  string tech_card_name = 6;
  // ПЛАН настила, пересчитанный в единицу ФАКТА, — чтобы два числа встали рядом без второго
  // перевода на клиенте. Пусто, когда плана нет либо он несводим с единицей факта.
  google.type.Decimal planned_qty = 7;
  google.type.Decimal actual_qty = 8;
  MaterialUnit actual_uom = 9;
  // ДРЕЙФ В ПРОЦЕНТАХ (+6.00 = «ушло на 6% больше плана»), как и actual_drift_percent на настиле:
  // единица названа В ИМЕНИ ПОЛЯ, и это единственное место, где она названа. ПУСТО ровно у тех
  // настилов, что в медиану не вошли, — и тогда причина названа в skipped.
  google.type.Decimal drift_percent = 10;
  // Причина невхождения. НЕПУСТА РОВНО У НЕВОШЕДШИХ: строка без числа и без объяснения неотличима
  // от бага.
  string skipped = 11;
  google.protobuf.Timestamp actual_at = 12;
}

// ПРЕДЛОЖЕНИЕ ПРОЦЕНТА РАСКРОЯ (T7 волна 2) — СОСЕД калибровки коэффициента выше, И ЭТО ДРУГОЕ
// ЧИСЛО С ДРУГИМ ЗНАМЕНАТЕЛЕМ. Не сливать:
//
//   калибровка КОЭФФИЦИЕНТА: дрейф = факт ÷ ПЛАН-ГЕОМЕТРИЯ настила (длина раскладки × слои +
//     концевые). Длина раскладки уже содержит межлекальные выпады, поэтому медиана меряет ТОЛЬКО
//     усадку/пороки/сращивание (2–6%) и ложится в material.cutting_coefficient.
//
//   предложение ПРОЦЕНТА: дрейф = факт ÷ (NETTO настила × КОЭФФИЦИЕНТ артикула). Netto — состав
//     раскладки × netto-норма «по выкройкам», БЕЗ выпадов; коэффициент вынимает усадку и пороки,
//     которые он оплачивает сам. Остаток — ровно геометрия настила: выпады + концы (15–30%), и
//     ложится в bom_item.wastage_percent.
//
// Вписать медиану коэффициента в поле процента — занизить закупку на все межлекальные выпады,
// линейно и молча. Поэтому у этого предложения свой статус, своя строка дрейфа и НИ ОДНОГО общего
// сообщения с калибровкой коэффициента.
//
// ЗНАМЕНАТЕЛЬ ДВИНУЛСЯ ВМЕСТЕ СО СМЫСЛОМ ПОЛЯ (W3). До W3 процент оплачивал и усадку, поэтому
// честным знаменателем было чистое netto. W3 сузил процент до геометрии настила и отдал
// усадку/пороки/сращивание коэффициенту, который с тех пор входит в те же деньги нормы; оставь
// знаменатель прежним — и на артикуле с коэффициентом усадка оплачивалась бы ДВАЖДЫ. Круга нет:
// коэффициент калибруется от план-геометрии настила, а не от netto, так что ссылка однонаправленна.
//
// ЛИНЕЙКА СМЕНИЛАСЬ, А НЕ ФАКТ: значения процента, применённые ДО W3, посчитаны по чистому netto и
// на артикуле с коэффициентом с тех пор завышены примерно на него. Ответ называет свой знаменатель
// (denominator_cutting_coefficient), чтобы разницу читали как смену линейки, а не как дрейф цеха.
// Ничто не переписывает применённые значения — система никогда не применяет предложение сама.
enum BomWastageSuggestionStatus {
  // Сервер всегда присылает одно из трёх ниже; ноль остаётся за «поле не заполнено» и читается
  // клиентом как ОТСУТСТВИЕ предложения — никогда как READY.
  BOM_WASTAGE_SUGGESTION_STATUS_UNSPECIFIED = 0;
  // Настилов с netto И фактом меньше трёх. Это СОСТОЯНИЕ, а не ошибка: «фактов пока N из 3» — и
  // после выката это основной ответ (настилов с замером может не быть месяцами).
  BOM_WASTAGE_SUGGESTION_STATUS_TOO_FEW_FACTS = 1;
  // Медиана посчитана, но поле её не примет (wastage_percent живёт в [0, 100]). ИЗМЕРЕНИЕ отдаётся
  // (median_over_netto_percent), число-предложение — НЕТ, и оно НЕ ПРИЖИМАЕТСЯ к границе.
  BOM_WASTAGE_SUGGESTION_STATUS_OUT_OF_RANGE = 2;
  // Предложение есть, и его можно вписать в поле как есть.
  BOM_WASTAGE_SUGGESTION_STATUS_READY = 3;
}

// Вклад ОДНОГО настила в предложение процента раскроя. Разбор едет наружу целиком, вошедшие и
// невошедшие вместе, и каждый настил называет свою КАРТОЧКУ: медиана «по 3 настилам» может стоять
// на одной чужой модели, и человек обязан это видеть, прежде чем применять число к своей.
message BomWastageLayDrift {
  int32 lay_id = 1;
  string lay_key = 2;
  string lay_name = 3;
  int32 run_id = 4;
  int32 tech_card_id = 5;
  string tech_card_name = 6;
  // ЗНАМЕНАТЕЛЬ: netto настила — сколько ткани дала бы норма «по выкройкам» без единого выпада —
  // в единице факта (actual_uom). Пусто, когда netto взять неоткуда; причина тогда в skipped.
  google.type.Decimal netto_qty = 7;
  // true = netto взят из ШТАМПА, поставленного в момент записи факта (переживает переход карточки
  // на marker-норму); false = пересчитан по ЖИВОЙ dxf-норме карточки — она могла уйти от той, при
  // которой мерили.
  bool netto_stamped = 8;
  google.type.Decimal actual_qty = 9;
  MaterialUnit actual_uom = 10;
  // ДРЕЙФ В ПРОЦЕНТАХ НАД NETTO (+22.00 = «ушло на 22% больше, чем безотходная норма»). Пусто
  // ровно у невошедших — причина в skipped.
  google.type.Decimal drift_percent = 11;
  string skipped = 12;
  google.protobuf.Timestamp actual_at = 13;
}
