syntax = "proto3";

package common;

import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// ProductionRunStatus is the lifecycle state of a production run (партия). A run is planned, then
// started (in_progress), then received into stock, then closed; it can be cancelled from any
// non-terminal state. Stored as its lowercase name in the DB.
enum ProductionRunStatus {
  PRODUCTION_RUN_STATUS_UNKNOWN = 0;
  PRODUCTION_RUN_STATUS_PLANNED = 1;
  PRODUCTION_RUN_STATUS_IN_PROGRESS = 2;
  PRODUCTION_RUN_STATUS_RECEIVED = 3;
  PRODUCTION_RUN_STATUS_CLOSED = 4;
  PRODUCTION_RUN_STATUS_CANCELLED = 5;
  // At least one partial receipt is booked and the operator has not yet declared the run complete
  // (production-costing Phase 5). Receipt commands own this state and RECEIVED — neither is
  // writable through UpdateProductionRun.
  PRODUCTION_RUN_STATUS_PARTIALLY_RECEIVED = 6;
}

// ProductionRunLine is one colour-model × size line of a run: which product (colourway) at which
// size, the planned quantity, and — once received — the received and defective counts (unset until
// received) that drive plan/fact. product_id may be 0 while planning (the colourway may not be
// published as a product yet), but every line with a received_qty > 0 must carry it at receive
// time. Replaces the flat ProductionRunSize grid so one marker yields several colour-models (NF-06).
message ProductionRunLine {
  int32 product_id = 1; // FK product(id); 0 = unset (planning only)
  int32 size_id = 2; // FK size(id)
  int32 planned_qty = 3;
  optional int32 received_qty = 4; // unset until the run is received
  optional int32 defect_qty = 5; // unset until the run is received
  // Stable identity of this line, echoed back on read. The store diffs the submitted grid by it
  // instead of delete+reinserting the whole grid, so the row's database id survives an edit — which
  // is what lets receipt lines hold a real foreign key to it. Contract: empty on the way in means
  // "new line, the server mints one" (its fallback is standard base32 — 26 characters of [A-Z2-7]);
  // anything non-empty must be EXACTLY 26 characters of [0-9A-Z] or the save is rejected with
  // InvalidArgument. The admin client mints uppercase Crockford ULIDs (like a tech-card BOM line's
  // line_key) and migration 0230 backfilled 'LEGACY'-prefixed keys onto pre-existing rows; both fit
  // that shape. NEVER regenerate a key the server handed out — that retires the row it names.
  string line_key = 6;
}

// ProductionRunCostKind is the article category of an actual production-run cost.
enum ProductionRunCostKind {
  PRODUCTION_RUN_COST_KIND_UNKNOWN = 0;
  PRODUCTION_RUN_COST_KIND_MATERIALS = 1;
  PRODUCTION_RUN_COST_KIND_CMT = 2;
  PRODUCTION_RUN_COST_KIND_HARDWARE = 3;
  PRODUCTION_RUN_COST_KIND_PACKAGING = 4;
  PRODUCTION_RUN_COST_KIND_LOGISTICS = 5;
  PRODUCTION_RUN_COST_KIND_DUTY = 6;
  PRODUCTION_RUN_COST_KIND_OTHER = 7;
}

// ProductionRunCost is one actual cost article incurred for a run (phase 2). amount is in
// `currency`; amount_base is the base-currency equivalent — server-folded via the costing FX
// rates when left unset on write, or supplied manually — so run totals need no read-time FX.
message ProductionRunCost {
  ProductionRunCostKind kind = 1;
  string description = 2;
  google.type.Decimal amount = 3;
  string currency = 4; // ISO 4217
  google.type.Decimal amount_base = 5; // base-currency amount (server-folded when unset)
  google.protobuf.Timestamp incurred_at = 6;
}

// ProductionRunCostByKind is the base-currency total of actual costs of one kind.
message ProductionRunCostByKind {
  ProductionRunCostKind kind = 1;
  google.type.Decimal amount_base = 2;
}

// ProductionRunActuals is the computed-on-read plan/fact summary of a run: actual totals from the
// cost articles + the phase-1 size grid, against the frozen planned unit cost.
message ProductionRunActuals {
  google.type.Decimal actual_total_base = 1; // Σ cost.amount_base
  string base_currency = 2;
  int32 planned_qty_total = 3;
  int32 received_qty_total = 4;
  int32 defect_qty_total = 5;
  google.type.Decimal actual_unit_cost = 6; // actual_total_base / received_qty_total
  google.type.Decimal defect_pct_actual = 7; // defect / (received + defect) × 100
  repeated ProductionRunCostByKind by_kind = 8;
  google.type.Decimal planned_total_base = 9; // planned_unit_cost × received_qty_total
  google.type.Decimal unit_cost_variance = 10; // actual_unit_cost − planned_unit_cost
  google.type.Decimal total_variance = 11; // actual_total_base − planned_total_base
  bool has_base = 12; // false when some cost article could not be folded to base (total is partial)
  // materials issued from the warehouse (NF-06): Σ (issue_production − return_production) ×
  // unit_cost_base. Folded INTO actual_total_base, so a run can cost its fabric either by hand
  // (a kind=materials cost article) or from stock issues — or, with the caveat below, both.
  google.type.Decimal materials_from_stock_base = 13;
  bool mixed_materials_sources = 14; // both a manual kind=materials cost AND stock issues exist (possible double count)
  bool has_uncosted_issues = 15; // some stock issue had no average cost, so materials_from_stock understates
  // Per-colourway material cost (gap-07 v2 C): stock issues grouped by the product_id they were cut
  // for. Covers materials_from_stock only (manual cost articles stay run-level). Issues with no
  // product_id fall into unattributed_materials_base, not any colourway.
  repeated ProductionRunColorwayCost by_colorway = 16;
  google.type.Decimal unattributed_materials_base = 17; // stock issues not attributed to a colourway
}

// ProductionRunColorwayCost is one colour-model's slice of a run's material-from-stock cost (gap-07
// v2 C): the net material issued for that product and, if it received units, its per-unit material
// cost. Manual (non-stock) cost articles are run-level and are NOT split here.
message ProductionRunColorwayCost {
  int32 product_id = 1;
  int32 received_qty = 2; // units of this colour-model received (from the run lines)
  google.type.Decimal materials_from_stock_base = 3; // net (issue − return) × unit_cost_base for this product
  google.type.Decimal materials_unit_cost = 4; // materials_from_stock_base / received_qty (omitted if none received)
  bool has_uncosted = 5; // an issue for this product had no average cost, so its figure understates
}

// ProductionRunReceiptLine is one counted plan line of a receipt: which line (by its stable
// line_key), what was booked as good stock and what was counted as defect. product_id/size_id are
// snapshots of the plan line at receipt time; size_id 0 means the line has no size (auxiliary runs).
message ProductionRunReceiptLine {
  string line_key = 1; // the plan line's stable identity (ProductionRunLine.line_key)
  int32 product_id = 2; // snapshot; 0 = product-less line (aux output / defect-only planning line)
  int32 size_id = 3; // snapshot; 0 = size-less line (aux output)
  int32 good_qty = 4; // units posted to stock (or the material warehouse for aux)
  int32 defect_qty = 5; // units counted as defect — recorded, never stocked
}

// ProductionRunReceipt is one immutable receiving event of a run (Phase 4, receipt v1; Phase 5
// allows several per run): who received what and when, at what frozen valuation.
// unit_cost_base/base_currency are money and are stripped without costing:read; has_base false
// means the valuation was not computable at receipt time (uncosted issues / unfolded cost
// articles) and unit_cost_base is unset.
message ProductionRunReceipt {
  int32 id = 1;
  int32 run_id = 2;
  google.protobuf.Timestamp received_at = 3;
  string admin_username = 4;
  string note = 5;
  google.type.Decimal unit_cost_base = 6; // frozen actual unit cost at receipt time (money)
  string base_currency = 7;
  bool has_base = 8;
  repeated ProductionRunReceiptLine lines = 9;
  google.protobuf.Timestamp created_at = 10;
  // The receipt that declared the run complete and flipped it to RECEIVED (Phase 5). Every
  // pre-Phase-5 receipt is final by construction.
  bool final = 11;
  // Accounting outbox state of this receipt: 'pending' | 'posted' | 'dead_letter'. Read-only
  // operational fact (the posting worker owns it); visible without costing:read — it carries no
  // amounts.
  string posting_status = 12;
  // Phase 6 reversal linkage. On a reversal row, reversal_of names the receipt it reversed; on a
  // reversed receipt, reversed_by names its reversal row. 0 = not set. A reversed receipt's units
  // and money are excluded from every rollup; the pair stays in the history for the audit trail.
  int32 reversal_of = 13;
  int32 reversed_by = 14;
}

// ProductionMarkerSource / ProductionRunMarker were REMOVED (production-costing Phase 2, review
// cut): the marker import surface shipped write-only — no editor ever existed and the admin client
// always sent an empty list, so the table held nothing. The run-level marker facts that ARE used
// (marker_efficiency_pct / marker_notes on ProductionRunInsert) stay. The table is dropped by a
// follow-up contract migration once no serving binary references it (expand/contract).

// ProductionRunInsert is the writable payload for a run (header + colour-model × size lines).
// planned_unit_cost / planned_currency are NOT here — they are server-snapshotted at plan time
// (from the linked tech_card_release or the live card's computed costing) and are read-only on write.
message ProductionRunInsert {
  int32 tech_card_id = 1; // required
  int32 release_id = 2; // optional tech_card_release to plan from (0 = none / plan from live card)
  ProductionRunStatus status = 3; // required
  google.protobuf.Timestamp started_at = 4;
  // server-owned since Phase 0a; a client-sent value is ignored. received_at is the timestamp of a
  // physical receipt, stamped only by the receive flow beside the stock it books — a client-writable
  // one let an open run be back-dated into the accounting scan with no stock movement behind it.
  google.protobuf.Timestamp received_at = 5 [deprecated = true];
  string notes = 6;
  repeated ProductionRunLine lines = 9; // colour-model × size grid (NF-06, replaces sizes)
  repeated ProductionRunCost costs = 8; // actual cost articles (phase 2)
  google.type.Decimal marker_efficiency_pct = 10; // % fabric utilisation from the nesting software (NF-06)
  string marker_notes = 11; // free marker / раскладка parameters
  // markers (the ProductionRunMarker list) removed — see the tombstone above ProductionRunInsert.
  reserved 12;
  reserved "markers";
  // Run ACTUAL cutting wastage % (0..100), entered per run once the marker/lay is known. When set it
  // OVERRIDES the BOM line's estimate wastage_percent in the run's cost calc (planned-cost snapshot +
  // material plan); unset falls back to the BOM estimate. Refines the plan side only — the run's ACTUAL
  // cost still derives from real material issues.
  google.type.Decimal actual_wastage_percent = 13;
  // Planning dates for the overdue view (production cockpit). Client-writable, unlike started_at's
  // sibling received_at: they are INTENT, not a stamped fact, so nothing downstream books stock or
  // accrues cost from them.
  //   planned_start_at — when the batch is planned to go into work (started_at is the real transition).
  //   promised_at      — дата, к которой партия обещана. An open run (planned/in_progress) whose
  //                      promised_at is in the past is overdue; that is exactly what
  //                      ListProductionRunsRequest.overdue_only filters on.
  google.protobuf.Timestamp planned_start_at = 14;
  google.protobuf.Timestamp promised_at = 15;
  reserved 7; // was `repeated ProductionRunSize sizes` (flat per-size grid; replaced by lines)
}

// ProductionRun is a stored run: the writable payload plus the server-owned identity, the frozen
// plan snapshot, and timestamps.
message ProductionRun {
  int32 id = 1;
  ProductionRunInsert run = 2;
  google.type.Decimal planned_unit_cost = 3; // snapshot of the card/release unit cost at plan time
  string planned_currency = 4; // currency of planned_unit_cost
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  ProductionRunActuals actuals = 7; // computed-on-read plan/fact summary
  // Optimistic-lock token, bumped on every UpdateProductionRun. Echo into
  // UpdateProductionRunRequest.expected_lock_version so a list→edit needs no extra GET (mirrors
  // TechCard.lock_version).
  int32 lock_version = 8;
  // The run's receiving events (Phase 4, receipt v1), oldest first. Populated on the single-run
  // read (GetProductionRun); list reads leave it empty to keep them light. Money on each receipt is
  // stripped without costing:read.
  repeated ProductionRunReceipt receipts = 9;
}
