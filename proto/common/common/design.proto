syntax = "proto3";

package common;

import "common/media.proto";
// The DESIGN band marks up moodboard references, and it marks them up with the ONE annotation
// primitive the whole system draws with: TechCardAnnotation, its kinds, its points and its palette
// are declared in techcard.proto and reused here verbatim. There is no DesignAnnotationKind and
// there must never be one — a shape drawn on a reference and a shape drawn on the card must stay
// the same arc on both sides of the move. No cycle: techcard.proto knows nothing about the band.
import "common/techcard.proto";
import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// The DESIGN band is the studio half of a tech card: generation runs, the pictures they produce,
// and the bench that promotes pictures into views. It lives OUTSIDE the card document (its own
// lifecycle, its own writes) — which is why it has its own file rather than another thousand lines
// of techcard.proto.
//
// VOCABULARIES ARE OPEN STRINGS ON PURPOSE, not enums. Every one of them has already grown once
// during design (source_class gained `drawn`), and a closed proto enum would make the next member
// undeployable until every client is out. The server is the authority on the accepted set; an
// unknown value renders as itself rather than collapsing to UNKNOWN.

// DesignRun is one row of the band's history: a generation job, its money, its inputs and its
// output pictures. A run is NEVER deleted — archiving hides it presentationally (see archived_at).
message DesignRun {
  int32 id = 1; // the row's address; the handle a human says out loud as «run 5»
  int32 tech_card_id = 2; // FK tech_card(id); which card's band this row belongs to
  // Which state of the studio produced this row: flat | render | threed | vector | draft_idea |
  // recolor | pattern. Written by the client at start; immutable afterwards.
  //
  // `recolor` IS THE ON MODEL SECTION'S OWN VERB (K-17). The owner's ask — «мы можем загрузить фото
  // реальное на модели с разных сторон и нам можно будет поменять цвет вещи» — and the owner's own
  // decision on how: the colour is changed BY GENERATION, not by a filter, so the weave, the folds
  // and the shadows survive the change. It is NOT `render` with a flag, because a render COMPOSES a
  // photograph that does not exist and a recolour must not touch the one that does: the two
  // instructions to the model contradict each other line by line. Inputs are the photographs named
  // in params.extra_input_media_ids, ONE PAID CALL EACH; the target colour is params.colour.
  //
  // `pattern` MAKES A REPEATING TILE OUT OF ONE PICTURE (K-13): «заапдоудить картинку и через
  // gpt image 2 сделать из неё повторяемый паттерн». Exactly one input (see
  // extra_input_media_ids), exactly one output, and the output is a picture of kind `pattern` —
  // neither a flat nor a render, because a tile is not a state of the garment.
  //
  // `vector` IS A MEMBER OF THIS VOCABULARY AND NOT AN RPC OF ITS OWN. Machine vectorisation is a
  // paid provider call exactly like a flat or a render, so it walks through StartDesignRun — the
  // ONE door the money goes through. A verb of its own would be a second budget check, a second
  // reservation and a second place to forget the ledger, for no gain: the thing being asked for is
  // still «spend the key's money and give me a picture back».
  //
  // ImportDesignVector is NOT that verb and does not belong to this list: it files an SVG that
  // already exists and spends nothing.
  string kind = 3;
  // OUTPUT-ONLY lifecycle: pending | running | done | failed | cancelled. A tile that is still
  // running renders differently from a finished one, so this is the field the band polls.
  string status = 4;
  // IDEMPOTENCY KEY minted by the client (UUID). A double click on GENERATE is ONE payment: a
  // second StartDesignRun with the same value returns THIS row with OK instead of starting a
  // second paid job. Unique across the whole table.
  string client_request_id = 5;
  // OUTPUT-ONLY provenance of the server-side prompt profile that ran, pinned at launch:
  // «flat-3view @ v4» under the history row. Profiles are server config, not a client-writable
  // object — a client that could name the prompt could bill the org for anything.
  string profile_name = 6;
  string profile_version = 7;
  // The delta phrase the human typed («wider collar»); the caption of the history row. Empty on a
  // first generation, which asked for nothing in particular.
  //
  // A MANUAL UPLOAD IS NOT A RUN AND HAS NO ROW HERE — it is a DesignBatch. The band's feed is the
  // two of them merged by time; see GetDesignBandResponse.
  string ask = 8;
  // What was asked for. Written by the client at start, echoed back verbatim; the run panel is
  // unreadable without it. Capped at 8 KB — a params blob larger than that is not a request, it is
  // a payload.
  DesignRunParams params = 9;
  // OUTPUT-ONLY SNAPSHOT of what the inputs WERE at launch. The SERVER assembles it — a
  // client-supplied provenance is not provenance, it is a claim. Capped at 64 KB.
  DesignInputSnapshot inputs = 10;
  // OUTPUT-ONLY copy of the card's fit at launch, so the badge «fit slim ≠ card oversized» can be
  // drawn on an old picture. Empty = the fit was not stated, which is the ordinary case for a
  // manually uploaded picture: it carries no fit of its own, and stamping one would record a claim
  // nobody actually made.
  string fit_at_launch = 11;
  // OUTPUT-ONLY render revision — the «r4» caption in the colour history. MAX+1 per card, assigned
  // only for kind=render; 0 on every other kind.
  int32 rrev = 12;
  // OUTPUT-ONLY: how many pictures were asked for. `done · 2 of 3` needs the denominator; without
  // it a partial provider answer is indistinguishable from a complete one.
  int32 requested_outputs = 13;
  // OUTPUT-ONLY, and the reason the money register can be honest: «failed · attempt 2 of 3 · $0.04
  // was still charged». Without per-attempt rows price_actual shows the price of the LAST attempt
  // and the budget bar undercounts every retry.
  repeated DesignRunAttempt attempts = 14;
  // OUTPUT-ONLY money. price_estimate is what was reserved against the day BEFORE dispatch;
  // price_actual is the SUM of attempts[].price, paid failures included. Unset (null) means «not
  // known yet», which is not zero.
  //
  // costing-shaped: stripped when the account lacks costing:read
  google.type.Decimal price_estimate = 15;
  // costing-shaped: stripped when the account lacks costing:read
  google.type.Decimal price_actual = 16;
  // ISO 4217. On the wire so the budget bar never hard-codes «$».
  string currency = 17;
  // OUTPUT-ONLY stamp of the admin who started the run. Without it a race between two authors is
  // invisible on the history row.
  string author = 18;
  // OUTPUT-ONLY: set when a running row was asked to stop; drives the `cancelling…` pill. A result
  // that arrives after this stamp is STILL paid and STILL recorded — the row says so rather than
  // pretending the money was not spent.
  google.protobuf.Timestamp cancel_requested_at = 19;
  // OUTPUT-ONLY, PRESENTATIONAL AND REVERSIBLE: a collapsed row (`· K archived`) and who collapsed
  // it. Archiving hides the ROW, never its pictures — picture invisibility has exactly one
  // persistent verb, and it is HideDesignPicture.
  google.protobuf.Timestamp archived_at = 20;
  string archived_by = 21;
  // OUTPUT-ONLY failure facts, so a dead row reads `failed · provider timeout` instead of being a
  // silent hole. error_code is the stable machine token; last_error is the human tail.
  string error_code = 22;
  string last_error = 23;
  // OUTPUT-ONLY result of a TEXT run (kind=draft_idea). Empty on every picture-producing kind.
  string output_text = 24;
  // OUTPUT-ONLY timing: `0:14 / ~25 s` and the sort order of the history.
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp started_at = 26;
  google.protobuf.Timestamp completed_at = 27;
  // The pictures this run produced, UNDER their own row rather than in a flat list beside it. A
  // card with 40 runs × 3 outputs would otherwise ship 120 MediaFull on every read of the band.
  // Hidden pictures are included WITH their flag — the client filters, the server never lies about
  // what exists.
  repeated DesignPicture pictures = 28;
  // OUTPUT-ONLY: the run this one repeats — design_run(id), 0 when it repeats nothing. Set by the
  // SERVER from StartDesignRunRequest.rerun_of_run_id; the client never writes it.
  //
  // IT IS THE ONLY HONEST SPELLING OF «run it again». The alternative — the client re-posting the
  // old run's inputs — lets a caller post inputs that never existed, and the history stops being a
  // record of what was sent and becomes a record of what somebody typed. Here the server re-reads
  // run N's own frozen snapshot, and this field is the edge that says which one it read.
  //
  // NO FOREIGN KEY, deliberately: a run is never deleted, so nothing needs enforcing, and a FK
  // would make the row's lineage a reason a card cannot be cleaned up later.
  int32 rerun_of = 29;
  // OUTPUT-ONLY: the COMPOSED BASE INSTRUCTION the worker built for this run — the ask, the
  // garment, the fit, the colour, the numbered reference captions («image 1: front — …», counting
  // through the pictures in the order they were attached) and, on flats, the owner's craft
  // paragraphs.
  //
  // ⚠ «BASE», AND THE WORD IS LOAD-BEARING. On the single-call flat route this IS the text the
  // provider received, byte for byte. On `per_view` each paid call gets «view:\n<view>» appended,
  // and on 3D the text is cut to the provider's texture ceiling — so on those two routes what
  // went out is NOT what is stored, and a reader who takes this field for a transcript will be
  // wrong. It was called «what the worker sent» here until a review pointed out that the sentence
  // is false on two of four routes.
  //
  // STORED AT DISPATCH, NEVER RECONSTRUCTED ON READ. This is a deliberate fork: a preview verb
  // would compose the text a second time, and what the modal shows could drift from what the
  // model was told. Instead the worker writes the very string it is about to send, before the
  // first paid attempt, and this field echoes that record — the history carries the sent text by
  // construction — for the base text, with the two deviations named above.
  //
  // EMPTY MEANS TWO DIFFERENT THINGS, and a reader must not collapse them: either no worker has
  // picked this run up yet, or the run PREDATES the column (migration 0352). Every historical row
  // is empty forever — the text was never kept — so a screen that says «not dispatched yet» over
  // an old finished run is lying about history.
  string prompt = 30;
  // OUTPUT-ONLY: which colourway this run was FOR — product(id), 0 = none. The server copies it
  // from params.colorway_id at start (see there for the semantics per kind); it is a live column
  // so the history can be sliced by colourway, while the frozen params remember forever what was
  // asked even after the colourway itself is deleted (this echo then reads 0).
  int32 colorway_id = 31;
}

// DesignRunAttempt is ONE paid provider call. It exists because the history row must be able to
// say «the first attempt was paid for and the answer never arrived»: without it price_actual is
// the price of the last attempt, the budget bar undercounts retries, and the answer to «where did
// the money go» is untrue.
message DesignRunAttempt {
  int32 attempt_no = 1; // 1-based, unique within the run
  string provider = 2;
  string provider_request_id = 3; // for reconciliation against the provider's own billing
  // The idempotency key sent TO the provider. Minted once per RUN and STABLE across its attempts —
  // that is the whole point: a retry must not buy a second picture.
  //
  // IT IS THE RUN'S KEY, REPEATED IN EVERY ATTEMPT, AND IT IS STORED ONCE — on design_run, not per
  // attempt. It appears here so a reader holding one attempt can reconcile against the provider's
  // billing without loading the run. Do NOT give the attempt table a column of its own: two homes
  // for one key is how a retry ends up buying a second picture.
  string provider_idempotency_key = 4;
  // dispatching | accepted | delivered | failed | unknown.
  // `unknown` is load-bearing: it means the money was POSSIBLY taken and the outcome is not
  // knowable from our side. Collapsing it into `failed` would be a lie about the ledger.
  string state = 5;
  // The price of THIS attempt. Unset = not billed (or not known yet); 0 = billed nothing.
  //
  // costing-shaped: stripped when the account lacks costing:read
  google.type.Decimal price = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  string error_code = 9;
}

// DesignRunParams is what was asked for — written by the client at start, replayed verbatim into
// the run panel. Total encoded size is capped at 8 KB.
message DesignRunParams {
  // Which views were requested: front | back | side_l | side_r | three_quarter_l | three_quarter_r
  // | detail. Drives the placeholder tiles that stand in for outputs that have not arrived yet.
  repeated string views = 1;
  // one | per_view — a single composite sheet against one picture per view. A composite has no
  // single view and therefore cannot be clicked into a bench slot; it is split first.
  string layout = 2;
  // The colour recipe of a render submission. The chips in the colour history restore THIS, not
  // the picture — the recipe migrates, the pixels do not.
  //
  // IT IS ALSO THE TARGET OF A `recolor` RUN, and it is REQUIRED there: «change the colour» with no
  // colour named is a request a model answers with any shade at all, at full price, and the history
  // could not tell that run from a correct one. Any one of code / hex / words satisfies it — all
  // three reach the prompt as the same block.
  DesignColourRecipe colour = 3;
  DesignThreedParams threed = 4; // only meaningful for kind=threed
  // `fix: back` — which view of the bench this run was asked to fix. Empty = not a fix. Feeds the
  // history column «input = slots (back)».
  //
  // SILHOUETTE SIDES ONLY: front | back | side_l | side_r | three_quarter_l | three_quarter_r. On a
  // 3D run only the four cardinal sides (front, back, side_l, side_r) may be named — a three-quarter
  // plate is neither a Meshy view nor a fal slot, and a run narrowed to one would be silently built
  // from fewer sides than were picked. A detail slot is deliberately NOT
  // targetable, because a bare view key cannot name one of several details and this field is frozen
  // into the run's history — an ambiguous target here could never be repaired afterwards. If fixing
  // a detail is ever wanted, it arrives as a slot_id field beside this one, not as a `detail`
  // string inside it.
  //
  // SUPERSEDED BY fix_targets, AND LEFT EXACTLY AS IT WAS. Runs already frozen in the history state
  // their target here; re-typing this number as `repeated` would silently rewrite what those rows
  // say on the wire, and a snapshot whose meaning changes after the fact is not a snapshot. A NEW
  // run states its selection in fix_targets / fix_slot_ids and leaves this empty. A READER takes
  // fix_targets when it is non-empty and falls back to this scalar otherwise — the old meaning
  // stays readable forever, which is the whole reason the field was not reused.
  string fix_target = 5;
  // The media the human handed THIS run, besides the bench slots. FK media(id).
  //
  // ⚠ ITS NAME SAYS «EXTRA», AND ON TWO KINDS IT CARRIES THE PRIMARY INPUT — deliberate reuse, not
  // an oversight. On a render these really are extras (an unmarked flat somebody dropped in); on
  // `recolor` they are THE PHOTOGRAPHS BEING RECOLOURED, one paid call each, and on `pattern` it is
  // THE ONE PICTURE the tile is built from. It is one list — «media this person gave this run» —
  // and it is one list on purpose: it already has a card-boundary check, a freezing path and a
  // reader in the prompt builder, and a second field with the same meaning would mean a second of
  // each, one of which somebody eventually forgets.
  //
  // COUNTS ARE PER KIND AND ARE ENFORCED AT THE DOOR, before anything is reserved: `recolor` needs
  // at least one, `pattern` needs exactly one (a tile glued out of two swatches cannot join to
  // itself), and every kind is capped at the snapshot's own reference ceiling.
  repeated int32 extra_input_media_ids = 6;
  // WHICH SIDES OF THE BENCH this run was asked to fix — «select everything in FLAT SLOTS» (W-10),
  // which a single string could not express at all: the studio marks up three plates and asks for
  // one correction across them, and a scalar target would make that three paid runs.
  //
  // SILHOUETTE SIDES ONLY, exactly as the scalar above: front | back | side_l | side_r |
  // three_quarter_l | three_quarter_r (3D: the four cardinal sides only, as above). A detail is
  // named in fix_slot_ids instead, because a bare view key cannot tell two details apart and this
  // list is frozen into the run's history, where an ambiguous target could never be repaired.
  repeated string fix_targets = 7;
  // The DETAIL slots this run was asked to fix, by design_bench_slot(id). Together with fix_targets
  // this is the whole selection: sides by their view key, details by their address. The two lists
  // are one selection and not two modes — a fix may name three sides and a cuff in one run.
  repeated int32 fix_slot_ids = 8;
  // Only meaningful with layout = one: the composite this run produces should come back WITH A
  // PROPOSED CUT, so the human confirms frames instead of drawing four rectangles from nothing.
  //
  // IT CUTS NOTHING BY ITSELF. The frames stay a human's and the cut stays SplitDesignPicture's: a
  // wrong rectangle is paid for twice — once in the ruined plate, once in the regeneration that
  // replaces it — so the server may GUESS and only a person may act. The flag records that the
  // guess was asked for, which is why it belongs in the frozen params and not in a UI preference.
  bool auto_split = 9;
  // The DETAIL slots whose own outputs this run requested, by design_bench_slot(id), in the same
  // order as the `detail` entries in views. A mutable detail name cannot keep a frozen run's output
  // attached to the same bench address after that detail is renamed, while the slot id can.
  //
  // EMPTY DOES NOT MEAN «the card has no details»; it means this run requested no detail outputs.
  // Its length MUST equal the number of `detail` entries in views: otherwise one list says how many
  // detail pictures were requested and the other cannot name all and only their slots, so one of
  // the two statements is false.
  repeated int32 detail_slot_ids = 10;
  // Only meaningful for kind=pattern.
  DesignPatternParams pattern = 11;

  // ОТДАТЬ ЭТОМУ ФЛЕТ-ПРОГОНУ ПЛИТЫ СОБСТВЕННЫХ `FLAT SLOTS` КАРТОЧКИ КАК РЕФЕРЕНСЫ.
  //
  // УМОЛЧАНИЕ false, И УМОЛЧАНИЕ — ЭТО ВСЁ ПОЛЕ ЦЕЛИКОМ. Плита флет-слота, как правило, флет,
  // который эта же машина и нарисовала; прикладывая их без спроса, мы отдавали модели готовый
  // ответ, и она переписывала их один в один, не глядя на фотографии, которые человек принёс.
  // Кому нужны старые плиты в промпте — говорит это вслух, и замороженные params запоминают, что
  // он это сказал.
  //
  // ОСМЫСЛЕНО ТОЛЬКО ДЛЯ kind=flat. Рендер СТРОИТСЯ из флетов, а 3D — из рендеров: это и есть
  // содержание тех видов прогона, а не их настройка. Вектор сужается до своей единственной плиты
  // через fix_slot_ids.
  bool use_flat_slots = 12;

  // WHICH COLOURWAY THIS RUN IS FOR — product(id), the colourway object of the card (colourways
  // ARE product rows since their domain merge). The owner's model, verbatim: «у фабрик рендера
  // должно быть так 1 колорвей там должно быть мультивью которое мы генерим … и потом мы в 3д
  // рендере уже выбираем колорвей который будем рендерить».
  //
  // MEANINGFUL ON render / recolor (the multiview being generated is THIS colourway's), on threed
  // (the build reads ONLY this colourway's render bench) and — since round 15 — on PATTERN: there
  // it names the colourway this tile is being MADE FOR, and the asset the run lands on the shelf is
  // given to that colourway in the same transaction that closes the run (single-select, so it is
  // taken off whatever cloth wore it before). REFUSED on flat / vector / draft_idea with
  // `colorway_forbidden`: a flat is ONE markup for the whole card and has no colourway BY NATURE —
  // not «not filled in yet». 0 = no colourway stated, which on a
  // render keeps the legacy meaning (an unattributed render, exactly what every render made
  // before this axis existed is) and on a 3D run selects ONLY the unattributed render bench —
  // never a mixture of colourways.
  //
  // FROZEN LIKE EVERY OTHER PARAM: a rerun inherits it from the parent's params, so repeating a
  // colourway-A render is a colourway-A render without restating it. An inherited colourway that
  // has since been DELETED does not make the rerun impossible — the run rides unattributed while
  // these params keep naming what was asked (the same pair the parent row itself ends up in).
  //
  // ⚠ NOTHING RECONCILES THIS FIELD WITH `colour` (RECORDED, NOT FIXED). A run may name colourway
  // 7 (navy in the card's colourway list) and carry colour.hex = "#FF0000", and the server accepts
  // it: the two are independent inputs, one an attribution and one a recipe. Migration 0356
  // refuses to backfill old renders precisely because their recipe may match no colourway row —
  // and going forward the axis now PERMITS that same divergence rather than closing it. Two honest
  // exits exist and neither is taken here: derive the recipe from the named colourway on
  // kind=render (making the attribution authoritative), or keep them independent and stop treating
  // "recipe may not match a colourway" as a fact about legacy data only. The second is what the
  // code does today; whoever revisits it should pick deliberately, because a wrong-coloured render
  // filed under a colourway is indistinguishable from a right one after the fact.
  int32 colorway_id = 13;

  // WHICH of the card's flat slots travel, when `use_flat_slots` is on — design_bench_slot(id).
  //
  // EMPTY IS TODAY'S BEHAVIOUR AND MEANS «ALL FILLED FLAT SLOTS», never «none». That is what makes
  // the field additive: every run frozen before it, and every client that does not know it,
  // keeps meaning exactly what it meant. «Send no plates» already has its own spelling, and it is
  // `use_flat_slots = false`.
  //
  // ONLY MEANINGFUL TOGETHER WITH `use_flat_slots` ON A kind=flat RUN — it narrows that switch, it
  // does not replace it. It is IGNORED on render / 3D / recolor / pattern, whose plates are the
  // content of those kinds rather than an option (see `use_flat_slots`), and on the selective fix
  // path, which does its own narrowing through `fix_targets` / `fix_slot_ids`.
  //
  // WHY THE LIST IS OF SLOT IDS AND NOT MEDIA IDS: the operator is excluding a PLACE on the bench
  // («not the left side»), and the plate standing there can be replaced between the click and the
  // GENERATE. A media id would silently start meaning a different slot; a slot id cannot.
  //
  // FROZEN LIKE EVERY OTHER PARAM: a rerun repeats the same exclusion without restating it. An id
  // naming a slot that has since been deleted or emptied simply matches nothing — the run loses
  // that plate, which is what its absence already means.
  repeated int32 flat_slot_ids = 14;
}

// DesignPatternParams is the frozen ask of a REPEATING-TILE run (kind=pattern, K-13).
//
// ONE FIELD, AND IT IS A NUMBER THE MODEL CAN ACT ON. That is V-7's own argument about
// design_asset.repeat_mm, repeated here because it is the same argument: «крупный» and «мелкий» are
// not instructions a generator can obey, «120 mm» is. It is also the number an ASSET built from
// this tile inherits, so «generated at 120 mm» and «placed at 120 mm» stay one claim about one
// cloth instead of two that drift.
//
// WHAT IS DELIBERATELY NOT HERE. There is no `seamless` flag: a tile that does not repeat is not a
// cheaper tile, it is a useless one, so the whole route asks for a repeat and never asks whether to.
// There is no rotation either — how a pattern SITS on a garment is placement
// (design_asset.rotation_deg), and the tile itself has no orientation to state.
message DesignPatternParams {
  // The repeat this tile is meant to be printed at, in whole millimetres on the finished garment.
  // 0 = not stated, which is legal AND IS NOW THE DEFAULT: the craft block tells the model to take
  // the density from the source picture itself, which is the answer the number used to give. A
  // non-zero value still reaches the model as a SCALE instruction («one tile covers 120 mm of
  // cloth»), never as a pixel size — legacy runs and clients that still state it keep their words.
  int32 repeat_mm = 1;

  // THE NAME THE KEPT PATTERN IS FILED UNDER, and the name a render cites it by.
  //
  // REQUIRED ON kind=pattern, refused free with `pattern_name_required` before anything is
  // reserved, and at most 60 characters — the SAME rule UpsertDesignAsset.name obeys, because it
  // lands in the same column (design_asset.name, VARCHAR(60) NOT NULL). Naming the tile BEFORE the
  // money is what makes the landing possible at all: the run closes by putting a `pattern` asset on
  // this card's shelf, and a shelf row with no name reaches a later prompt as the bare word
  // «pattern» — the failure detail slots already went through once.
  string name = 2;

  // THE SHELF ROW THE SOURCE PICTURE CAME FROM — design_asset(id) of THIS card, kind fabric or
  // pattern. 0 = the source was a library file or a paste, which is the ordinary case.
  //
  // It is written into the kept asset's `derived_from_asset_id` (V-7 parentage), so «this pattern
  // was made from that cloth» survives the run it was made in. A foreign id is refused like every
  // other asset reference on this message; an id whose row is later deleted leaves the pattern
  // standing with its parentage cleared (the FK's ON DELETE SET NULL), because a tile with a
  // picture is still a usable instruction after its swatch is gone.
  int32 source_asset_id = 3;
}

// DesignColourRecipe is the colour submission of a render run, in a form that a history chip can
// RESTORE. fabric_media_id is not optional decoration: without it a photo-sourced recipe cannot be
// rebuilt from the chip at all.
message DesignColourRecipe {
  string source = 1; // dictionary | own | photo
  string code = 2; // colourway code when source=dictionary, e.g. OLV
  string hex = 3; // #RRGGBB screen approximation; a visualisation override, never canonical
  string words = 4; // the free «in words» description that went to the model
  // FK media(id); REQUIRED when source=photo, otherwise 0.
  //
  // SUPERSEDED BY `fabrics` BELOW AND LEFT EXACTLY AS IT WAS, on the rule this file already
  // applies to fix_target: runs frozen in the history state their swatch here, and re-typing the
  // field would silently rewrite what those rows say. A NEW run states its cloths in `fabrics` and
  // ALSO repeats the first one's texture here, because the prompt's order-of-authority paragraph
  // (designgen/renderprompt.go) reads this field to name the governing photograph by its image
  // number; a reader takes `fabrics` when it is non-empty and falls back to this scalar otherwise.
  int32 fabric_media_id = 5;
  // THE CLOTHS OF THIS GARMENT — one entry per cloth, in the order they are stated (V-8: «если у
  // нас в изделии используется больше чем одна ткань что бы была возможность добавить несколько
  // тканей»).
  //
  // ONE FIELD, NOT TWO. A single-cloth run is this list with one member; there is no separate
  // «one fabric» spelling and there must not be one, or the two would disagree the first time
  // either grew a property.
  repeated DesignFabricUse fabrics = 6;
  // THE COLOUR MAPS OF THIS RUN — frozen copies, exactly like `fabrics`. Empty = nothing was
  // painted, and that is the ordinary run.
  //
  // ⚠ A MAP IS NOT A REFERENCE, AND THAT IS WHY IT TRAVELS HERE RATHER THAN IN
  // `extra_input_media_ids`. An extra input is captioned «additional reference image» — one
  // sentence for every picture nobody else described — and a colour map read under that caption is
  // a drawing of the garment in improbable colours. The map is part of the RECIPE: it is what
  // `DesignFabricUse.map_hex` points at, and a picture the prompt names by number has to be a
  // picture the prompt can recognise.
  repeated DesignColourMap colour_maps = 7;
}

// DesignColourMap is ONE PAINTED VIEW of a colour plan: the flat of `view`, flooded part by part in
// flat colours.
//
// ⚠ THE COLOURS ARE LABELS, NEVER THE GARMENT'S OWN, and everything about this message follows from
// that one sentence. A part painted steel blue is not a part that will be steel blue; it is a part
// that wears whatever cloth the plan pinned to `#3a7bd5`. The garment's actual colours are stated
// where they have always been stated — on the cloths — so a reader that took these pixels for the
// answer would render the plan instead of the garment.
message DesignColourMap {
  int32 media_id = 1; // FK media(id): the painted PNG, white ground, the size of the flat
  string view = 2; // front | back | side_l | side_r | three_quarter_l | three_quarter_r
  // FK media(id): THE FLAT IT WAS PAINTED OVER. A different flat standing in that slot means the
  // map is stale — the geometry it was painted against is gone — and the client refuses to send it.
  // It is kept beside the map rather than derived because the slot legitimately moves on, and a map
  // that could not name its own base would be un-stale-able for ever after.
  int32 base_media_id = 3;
  // THE COLOURS ACTUALLY USED ON THIS MAP, with their exact-match pixel counts. Frozen with the
  // map because the palette is what makes the map READABLE: it is the closed set of labels the
  // prompt may name, and re-deriving it would mean scanning a PNG on the server.
  repeated DesignColourSwatch palette = 4;
  // OUTPUT-ONLY. The painted PNG itself, joined from media_id at read time — the SAME PAIR
  // DesignInputRef states (media + deleted) and for the same reason: IDS ARE STORED, MediaFull IS
  // SERVED, and AdminService has no verb that reads media by id.
  //
  // ⚠ WITHOUT IT A SAVED PLAN CANNOT BE SHOWN OR RE-OPENED. The map's PNG is its own upload — it
  // is not a DesignPicture, not a bench plate, not a shelf row — so a stored map that travels as a
  // bare number reaches the screen as a number and nothing else. The painting then survives a
  // reload in the database and NOWHERE ELSE: the tile falls back to the flat, `paint ▸` opens a
  // blank canvas over it, and the next save writes that blank over twenty minutes of work — the
  // very loop this feature exists for («paint → save → come back → adjust») is a dead end. It is
  // the same defect, and the same fix, that DesignEditLayer.raster_media already records.
  //
  // ⚠ UNSET IS NEVER «PRESENT», IN EITHER LIFE OF THIS MESSAGE, AND THAT IS A PROPERTY RATHER THAN
  // A RULE. On DesignColourPlan.maps the server joins every map before the message leaves (both
  // producers of a plan do it, so «empty» cannot mean «nobody ran the join»), and on the FROZEN
  // copy in DesignColourRecipe.colour_maps the door STRIPS both fields before it marshals the
  // recipe — freezing a URL is wrong for the same reason DesignInputSnapshot states, and a client
  // echoing back the plan it was just served must not be able to write a picture into history.
  // So `media` empty means «there is no picture here», everywhere, and a reader that treats it as
  // present is reading a field nobody set.
  MediaFull media = 5;
  // OUTPUT-ONLY: media_id names a row that NO LONGER EXISTS. The plan still remembers the id —
  // «which painting disappeared» has to be answerable from the plan itself — and the screen says
  // so instead of showing a hole.
  //
  // It is a POSITIVE assertion and only that: false plus an empty `media` means «not joined here»
  // (the frozen recipe) or «the join could not be run» (a media read that errored), and neither is
  // a claim that the file is gone. The distinction is DesignEditLayer.raster_deleted's, verbatim:
  // a failed lookup must not report a deletion that may not have happened.
  bool deleted = 6;
}

// DesignColourSwatch is ONE label of a colour map: a colour somebody deliberately chose, and how
// much of the map it covers.
//
// `px` IS THE EXACT-MATCH COUNT AND NOTHING ELSE. The painter's brush and its bucket both blend at
// their edges, so a raw scan of the pixels contains hundreds of intermediate colours nobody chose;
// the count here is over the CLOSED set of recorded inks, which is what keeps an antialiased rim
// from becoming a cloth. It is also what makes a three-pixel accident nameable as one (the stray
// rule) instead of reaching the model as a part of the garment.
message DesignColourSwatch {
  string hex = 1; // #rrggbb, lower-case; never #000000 / #ffffff — those are line ink and paper
  int32 px = 2; // exact-match pixels at the moment the map was saved
}

// DesignColourPlan is the DURABLE colour plan of a card — the pre-launch state, one document per
// card: which views are painted, and which cloth each painted colour stands for.
//
// ⚠ IT IS NOT A LAYER AND NOT A PICTURE, and both of those were the obvious homes. An edit layer is
// unique per base (uq_design_edit_layer_base), so a colour painting over a flat would collide with
// that flat's own trace; a DesignPicture would be offered to bench slots and listed among the
// card's outputs as a drawing of the garment, which a map is precisely not. What it IS, is the
// working state of a screen — minutes of painting that must survive a reload and be visible from a
// colleague's browser — so it is one row per card under compare-and-set, the same shape
// SaveDesignEditLayer already uses to replace a whole document.
message DesignColourPlan {
  int32 tech_card_id = 1;
  // CAS TOKEN, exactly like DesignEditLayer.rev: SetDesignColourPlan echoes the rev it believed it
  // was acting on, and a mismatch is Aborted:colour_plan_rev_mismatch carrying the current rev.
  int32 rev = 2;
  repeated DesignColourMap maps = 3; // at most one per view
  // THE PALETTE'S ASSIGNMENTS, keyed by hex. A colour with no row here is a colour somebody painted
  // and has not yet said anything about — a legitimate half-finished state the screen shows as
  // `unassigned`, never as a cloth.
  repeated DesignColourCloth cloths = 4;
  string updated_by = 5; // server-stamped
  google.protobuf.Timestamp updated_at = 6;
}

// DesignColourCloth is WHAT ONE PAINTED COLOUR MEANS: the cloth, colour or words the parts wearing
// that label are made of.
//
// THE KEY IS THE HEX, not the asset. One cloth may legitimately label two colours (the same jersey
// in two colourways is two rows), and a colour may name no asset at all — a plain colour or a
// sentence is a complete answer to «what is this part made of». At least one of the three has to be
// said, or the row states nothing and the map's label points at silence.
message DesignColourCloth {
  string hex = 1; // #rrggbb, lower-case; must appear in the palette of some map of this plan
  int32 asset_id = 2; // design_asset(id) of this card, or 0
  string colour_hex = 3; // a plain colour picked for these parts, or ''
  string words = 4; // free words about these parts, or ''
  // THE HUMAN NAME OF THE PART(S) — «cuffs and collar» — or ''. It is what the render prompt prints
  // beside the painted colour and the ONLY half of this row the 3D steer can carry, because a
  // phrase addressed to a picture the texturing stage never sees is a phrase about nothing.
  string parts = 5;
}

// DesignFabricUse is ONE cloth of a render submission: which card asset it came from, what it looks
// like, and WHICH PART OF THE GARMENT it is for.
//
// THE FACTS ARE FROZEN, NOT JOINED, and that is the same decision DesignInputSlot.detail_name
// already records for the same reason: a run's history must still read after the asset is renamed,
// re-coloured or deleted. asset_id is kept beside the copies as provenance — «which shelf row was
// this» — and never as the thing a reader resolves in order to draw an old run.
message DesignFabricUse {
  int32 asset_id = 1; // design_asset(id); 0 when the cloth was stated without a shelf row
  string name = 2; // the asset's name at launch — «main jersey», «contrast rib»
  int32 media_id = 3; // FK media(id): the texture that went out as an image; 0 = none
  string colour_code = 4; // colourway code, when this cloth carries one
  string colour_hex = 5; // #RRGGBB screen approximation of that cloth
  string words = 6; // what the human wrote about THIS cloth
  // WHICH PARTS OF THE GARMENT THIS CLOTH IS FOR, in the human's own words, composed from the
  // marks drawn on the flats («body, back yoke»). EMPTY MEANS THE WHOLE GARMENT — the ordinary
  // case of a single-cloth run — and NOT «unknown»: a run that states two cloths and no parts is
  // telling the model to choose, which is a thing a person may legitimately ask for.
  string parts = 7;
  // The repeat of a PATTERN cloth, in whole millimetres on the finished garment; 0 = a plain
  // cloth, no repeat stated. It is the answer to «какого размера располагать этот паттерн» (V-7)
  // and it is a number the model can act on, unlike «large» or «small».
  int32 repeat_mm = 8;

  // WHAT THIS CLOTH IS: `fabric` | `pattern` — the shelf asset's kind AT LAUNCH, frozen like every
  // other field of this message.
  //
  // ⚠ IT IS NOT DERIVABLE, AND THAT IS WHY IT TRAVELS. A pattern tile is not a photograph of cloth:
  // the render prompt has to describe it as a repeat tile and tell the model to LAY IT OUT, which
  // it cannot do without knowing which of the two it is holding. `asset_id` is provenance and is
  // never resolved by a reader (see above), the asset itself may be deleted, and `repeat_mm` stopped
  // being evidence the moment the pattern screen stopped asking for a number — so the kind has to
  // be copied here beside the name and the picture, on the same argument that put those here.
  //
  // EMPTY = A FABRIC, and empty is what every run frozen before this field carries. That is what
  // keeps the render prompt of every existing single-cloth run byte-for-byte what it was: the new
  // paragraph fires on `kind == "pattern"` and on nothing else.
  string kind = 9;
  // THE FLAT COLOUR THAT MARKS THIS CLOTH'S PARTS on the run's colour maps (#rrggbb, lower-case).
  // '' = this cloth was not placed by painting, which is every run frozen before this field and
  // every run of a card nobody painted.
  //
  // ⚠ IT DOES NOT REPLACE `parts`, IT ANSWERS A DIFFERENT QUESTION. `parts` is the human's words —
  // «cuffs and collar» — and stays optional; this is the LABEL the map carries, and the prompt
  // prints the two together when both are there («the parts painted steel blue (#3a7bd5) on the
  // colour map»). A cloth with a map_hex and no words is fully placed: the picture says where.
  //
  // ⚠ AND IT IS IGNORED BY THE 3D STEER ON PURPOSE. That hint reaches a texturing stage which is
  // shown the render plates and nothing else, so «painted steel blue on the colour map» would
  // address a picture it has never seen.
  string map_hex = 10;
}

// DesignAsset is ONE THING THIS CARD IS MADE OF that is not a picture of the garment: a cloth, a
// pattern built from a cloth, or a piece of hardware. V-11, the owner's own words: «как-то надо
// хранить отдельно набор асетов тканей паттернов сгенеренных и фурнитуры внутри одной тех карты».
//
// ONE MESSAGE FOR THREE SHELVES, AND THE CHOICE IS THE WHOLE DESIGN. `kind` is a member of ONE
// vocabulary — what this asset IS — and the three members share every operation there is: they are
// listed on one shelf wall, uploaded through one door, marked onto a flat by one gesture, deleted
// by one verb and cited by one placement row. Three messages would have made the placement
// polymorphic (three nullable foreign keys, or a tag beside an id), which is exactly the false
// split this repository has already paid for twice: two members are one dictionary when the only
// difference between them is which neighbouring field is left unset.
//
// AND `kind` IS NOT TWO KEYS UNDER ONE NAME. It says what the asset is, never how it was made:
// a pattern's parentage is `derived_from_asset_id`, an edge of its own, so a pattern generated by a
// model and a pattern tiled from an uploaded swatch are the SAME kind of thing with different
// provenance — and a fabric may father several patterns at different repeats, which a «fabric with
// a repeat field» could not express at all.
//
// AN ASSET OUTLIVES A RUN. That is the point of the requirement: a run is a submission and dies
// into history, a cloth is a fact about the style and stays until somebody removes it.
message DesignAsset {
  int32 id = 1;
  int32 tech_card_id = 2; // FK tech_card(id)
  // fabric | pattern | hardware. An open string like every other vocabulary in this file: the
  // shelf wall is a wording question that belongs to the people using it, and a proto enum would
  // make the next shelf undeployable until every client is out.
  string kind = 3;
  // REQUIRED AND SHORT. The prompt cites a cloth by name («contrast rib on the collar») and the
  // sheet prints it; an unnamed asset reaches the model as the word «fabric», which is the failure
  // detail slots already went through once.
  string name = 4;
  // FK media(id): the texture, the pattern tile or the hardware photograph. 0 = the asset is
  // stated in words and colour only, which is legal — a cloth may be known before it is
  // photographed.
  int32 media_id = 5;
  // Resolved from media_id at read time. UNSET when media_id is 0 or the file is gone.
  MediaFull media = 6;
  string colour_code = 7; // colourway code, when this asset carries one
  string colour_hex = 8; // #RRGGBB screen approximation
  // What the human wrote about this asset — «brushed, slight sheen», «matte gunmetal, 15 mm».
  string note = 9;
  // The asset this one was BUILT FROM — design_asset(id), 0 when it was built from nothing.
  // Set on a pattern made from a fabric (V-7). It is a soft edge: deleting the fabric leaves the
  // pattern standing and clears this to 0, because a pattern with a picture and a repeat is still
  // a usable instruction after its swatch is gone.
  int32 derived_from_asset_id = 10;
  // THE REPEAT OF A PATTERN, in whole millimetres on the finished garment — «how large to place
  // it» (V-7). 0 on a plain cloth and on hardware.
  int32 repeat_mm = 11;
  // How the pattern sits, degrees clockwise from upright, 0..359. 0 = upright, which is also the
  // value of every asset that is not a pattern.
  int32 rotation_deg = 12;
  int32 ordinal = 13; // position on its shelf; lower comes first
  string created_by = 14; // server-stamped
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // WHOSE FABRIC THIS IS — product(id) of the colourway wearing it, 0 = nobody's. The owner's
  // model: a pattern is a seamless tile, a seamless tile is fabric, and a colourway wears «a
  // colour OR a pattern». The colour half is NOT stored here — the colourway row already carries
  // devHex / pantone / colorCode / swatch, and a second field would be a competing answer to a
  // question that already has one. Only «colourway N wears asset X» needed a home.
  //
  // ⚠ OUTPUT-ONLY, AND WRITTEN BY EXACTLY TWO PLACES: SetDesignAssetColorway, and the LANDING OF A
  // PATTERN RUN (the tile is filed with the colourway its run named — see DesignRunParams.colorway_id).
  // UpsertDesignAsset NEITHER CARRIES NOR CLEARS IT. That is deliberate and it is the whole reason
  // the assignment does not live on Upsert: Upsert is a full replace, so a proto3 scalar there would
  // arrive as 0 from every client that predates this field — and from every unrelated save (a
  // rename, a colour edit, «keep as cloth») — silently taking the fabric off the colourway. This
  // codebase has paid for that trap twice already. An assignment therefore survives any edit to the
  // asset. The second writer is the OPPOSITE case and not an exception to the rule: it is a
  // CREATE, of a row nobody could have assigned yet, by a run that stated the colourway before it
  // spent any money.
  //
  // SINGLE-SELECT: one colourway wears one fabric. Assigning an asset to a colourway takes that
  // colourway off every other asset of the card, in the same transaction.
  //
  // Reads 0 after the colourway is deleted (FK ON DELETE SET NULL): the asset stays a fabric of
  // the card, just nobody's.
  int32 colorway_id = 17;
}

// DesignAssetPlacement is ONE MARK ON ONE FLAT saying that a particular asset belongs THERE.
//
// IT IS THE ONE ANSWER TO THREE OF THE OWNER'S REQUIREMENTS, and they are one requirement wearing
// three hats: «разметить на флетах где какая фурнитура» (V-6), «показать примером на флете как и
// какого размера распологать этот паттерн» (V-7) and «на флетах показать маркером какая часть
// какой тканью» (V-8). All three are «this thing, on this drawing, here», so all three are this
// row. Three separate mechanisms would have been three geometries drifting apart on one picture.
//
// THE GEOMETRY IS THE CARD'S OWN TechCardAnnotation, reused verbatim for the reason stated at the
// top of this file: there is ONE annotation primitive in this system and a shape drawn on a flat
// must stay the same shape wherever it is read.
//
// IT HANGS OFF THE PICTURE, NOT OFF THE BENCH SLOT. Coordinates are fractions of an IMAGE; moving
// them onto whatever plate happens to stand in the front slot tomorrow would point them at pixels
// nobody drew them on. A slot that is re-marked therefore shows the marks of the plate it now
// holds — which is correct — and the old plate keeps its own.
message DesignAssetPlacement {
  int32 id = 1;
  int32 asset_id = 2; // FK design_asset(id); the thing being placed
  int32 picture_id = 3; // FK design_picture(id); the flat it is placed on
  // WHERE. Its `text` is left empty: the words live in `note` below, composed the same way the
  // band's frozen callouts arrange the same pair (see DesignMoodCallout).
  TechCardAnnotation annotation = 4;
  // What this mark says beyond naming the asset — «cut on the bias here», «two of these».
  string note = 5;
  string set_by = 6; // server-stamped
  google.protobuf.Timestamp set_at = 7;
}

// DesignThreedParams are the parameters of a turntable run.
message DesignThreedParams {
  int32 frames = 1; // number of turntable frames, e.g. 12
  string presentation = 2; // air | model — a garment floating, or a garment on a mannequin
  int32 model_id = 3; // FK model(id); 0 = unset. Only meaningful when presentation=model
  int32 garment_size_id = 4; // FK size(id); 0 = unset — the size the turntable claims to show
  // Overrides the card's fit for THIS submission only. Empty = the card's fit was used. A fit is a
  // property of the garment; presentation cannot change it, so an override is a stated deviation
  // and is stamped as one.
  string fit_override = 5;
  // The four render plates of ONE rrev that this turntable was built from. Without them the run
  // panel cannot show what the rotation was assembled out of, and a turntable stitched from
  // different rrevs (i.e. from different colours) would be indistinguishable from a coherent one.
  repeated int32 source_picture_ids = 6;
  // WHAT BODY the garment is asked to be shown on, when no particular model is named. A person
  // picks a model when they know whose photographs they want; they pick a body when they only know
  // the shape. The two are not alternatives to each other on the wire: model_id names an existing
  // model row, this names a build, and a run may state both (this one then reads as the build the
  // model is being asked to stand for). Empty = not stated; the generator picks.
  //
  // NOT AN ENUM ON PURPOSE. The vocabulary of builds is a wording question that belongs to the
  // people writing the ask, and an enum would freeze today's four words into the contract and into
  // every already-frozen run's history.
  string body_type = 7;
}

// DesignInputSnapshot is what the inputs WERE when the run started. Assembled by the SERVER only.
//
// IDS ARE STORED, MediaFull IS SERVED. The stored snapshot freezes media_id — freezing a URL is
// wrong because objects move — and the read joins media and hands back a ready picture. Nothing
// else could draw the run panel: AdminService has no RPC that reads media by id.
//
// Total encoded size capped at 64 KB; refs ≤ 24; slots ≤ 8. A snapshot must fit in a row and in an
// eye.
message DesignInputSnapshot {
  // The words that went to the model about the GARMENT — a frozen copy of the card's
  // garment_description (W-3) as it read at launch. Frozen rather than joined: editing the
  // description later must not rewrite what an old run was told.
  string garment_note = 1;
  DesignMoodSnapshot mood = 2; // what `draft the idea` actually read off the moodboard
  repeated DesignInputRef refs = 3; // reference thumbnails of the run panel
  repeated DesignInputSlot slots = 4; // the bench plates fed to a render / fix
  string fit = 5; // the fit the model was told about
  // The requested views and layout, frozen: the fingerprint that draws the `current / earlier`
  // divider in the history.
  repeated string views = 6;
  string layout = 7;
}

// DesignMoodSnapshot is the moodboard as the model read it — the note plus the callouts pinned on
// moodboard images. Moodboard callouts are ordinary TechCardCallout rows on the card; this is a
// frozen copy of what they said at launch, not a second home for them.
message DesignMoodSnapshot {
  string note = 1;
  repeated DesignMoodCallout callouts = 2;
  // THE PICTURES THIS RUN ACTUALLY SENT, in wire order — media(id) of every moodboard image that
  // survived resolution and became a content part.
  //
  // IT EXISTS BECAUSE THE SNAPSHOT USED TO LIE BY OMISSION. `draft the idea` has sent the board's
  // images since the multimodal merge, and the snapshot could only hold the board's WORDS: a run
  // over a wordless board would have filed a history row claiming nothing was read while twelve
  // pictures were paid for as input tokens. That is why the door refused a pictures-only board
  // (design_run.go), and this field is what lets the refusal shrink to «no pictures AND no words».
  //
  // ORDER IS THE BINDING, NOT A PREFERENCE: the prompt numbers the pinned notes «picture N» by this
  // very order, so the list is the only record of what «picture 2» meant. Ids, not URLs — objects
  // move, the same argument DesignInputRef.media_id already makes.
  //
  // Empty is a readable state: a board of words alone, or a run that predates this field.
  repeated int32 media_ids = 3;
}

// DesignMoodCallout is one frozen callout inside a run snapshot: which image, what it said, and
// WHERE IT POINTED.
//
// IT IS THE BAND'S SINGLE FROZEN-CALLOUT SHAPE and it is reused verbatim for reference images
// (DesignInputRef.callouts). The name says where it was born, not that there are two kinds of
// callout: a second message of the same shape would be two homes for one fact, and the two would
// disagree the first time one of them grew a field.
//
// GEOMETRY USED TO BE ABSENT HERE, on the argument that a marker position is not something a model
// reads. The argument outlived its reason. The snapshot is also what a RERUN replays and what the
// run panel draws, and both need the shape: freezing the words and dropping the markup produces a
// record that cannot reproduce the run it claims to describe, and a rerun that quietly sends LESS
// than the first run did.
message DesignMoodCallout {
  int32 media_id = 1; // FK media(id)
  string text = 2;
  // The frozen shape — the SAME TechCardAnnotation the card draws, at the same coordinate
  // precision. Its own `text` is left empty: the words that were read live in `text` above,
  // composed, exactly the way the card's own callouts arrange the same pair (a note is composed of
  // part / description / dimensions, and it is the COMPOSED line a reader sees, not the geometry's
  // label).
  //
  // Unset = this callout carried no shape, or predates the field. That is a readable state and is
  // NOT the same as a zero-area rectangle at the top-left corner, which is what a non-optional
  // geometry would have made it indistinguishable from.
  TechCardAnnotation annotation = 3;
}

// DesignInputRef is one reference image fed to the run.
message DesignInputRef {
  // WHAT THE SNAPSHOT FROZE. This is the stored fact and it is always populated, including when
  // the media row has since been deleted — «which input disappeared» must be answerable from the
  // snapshot itself, not from an object the server is obliged to leave empty.
  int32 media_id = 1;
  // The resolved picture, joined from media_id at read time. UNSET when deleted is true.
  MediaFull media = 2;
  string role = 3; // what the human said this reference is for (silhouette, fabric, mood …)
  string note = 4;
  bool deleted = 5; // the media row no longer exists; the snapshot still remembers its id
  // THE MARKUP FROZEN ON THIS REFERENCE — the callouts pinned on it at launch, geometry included.
  //
  // W-7 asks the run panel to show «our prompt: the pictures, the descriptions and the markup», and
  // a reference stripped of its markup answers two thirds of that. Same shape as the moodboard's
  // because it IS the same thing pinned on a different image; see DesignMoodCallout.
  //
  // Frozen like everything else in the snapshot: re-pinning the live callout later does not move
  // what an old run was told.
  repeated DesignMoodCallout callouts = 6;
}

// DesignInputSlot is one bench slot this run either SHOWED the model or was ASKED TO DRAW.
//
// TWO KINDS OF ROW, TOLD APART BY media_id. A plate (media_id > 0) is a picture that went out: it
// becomes a reference url and a numbered caption. A row with media_id = 0 is a detail slot named in
// `DesignRunParams.detail_slot_ids` that held NO picture at launch — the ordinary case of that
// field, since a person ticks a detail precisely so it gets drawn. It carries nothing but the slot
// address and the frozen name, and it exists because the name has exactly one reader
// (`detail_slot_ids` → `slots[*].slot_id` → `detail_name`) and no other place to come from. Without
// it the prompt said «draw these details: detail», which is what the ids were introduced to end.
message DesignInputSlot {
  string view_key = 1; // front | back | side_l | side_r | three_quarter_l | three_quarter_r | detail
  // WHICH SLOT, when view_key is `detail`. A view key alone cannot tell two details apart, and the
  // comparison «is this input stale» has no join key without it — so the badge would be
  // uncomputable for every card with more than one detail slot, FOREVER: a snapshot is frozen at
  // launch and is never repaired later.
  //
  // 0 for the six silhouette sides, which view_key already identifies.
  int32 slot_id = 2;
  // COPY of the detail's name at launch, so a snapshot still reads «detail: cuff» after the slot
  // has been renamed or deleted. Empty for the silhouette sides.
  string detail_name = 3;
  // What the snapshot froze, deleted media included. 0 ONLY on an asked-for-but-empty detail slot
  // (see the message comment); every plate has it.
  int32 media_id = 4;
  // Resolved at read time from media_id. UNSET when deleted is true (see DesignInputRef).
  MediaFull media = 5;
  // The plate's content hash AT LAUNCH. Comparing it against the CURRENT media.content_hash of the
  // slot is exactly what earns the `stale` badge — the plate was re-flattened or replaced since.
  // Empty = the media predates content hashing (0336) and no comparison is possible; say so rather
  // than guess.
  string content_hash = 6;
  int32 layer_rev = 7; // the edit layer's revision at launch, for the same staleness comparison
  bool deleted = 8;
}

// DesignPicture is one image in the band. It hangs under EITHER a run (generated) or a batch
// (uploaded by hand) — exactly one of run_id / batch_id is set, never both and never neither.
// Pictures are never deleted through this contract: invisibility (hidden_at) and erasing bytes are
// different floors of the building.
//
// THE CONTENT HASH IS ON `media.content_hash` and nowhere else. A picture has nothing to freeze —
// it IS the live file — so a second copy here could only ever disagree with the first.
message DesignPicture {
  int32 id = 1;
  int32 tech_card_id = 2; // FK tech_card(id)
  MediaFull media = 3; // the resolved image
  int32 run_id = 4; // FK design_run(id); set for GENERATED pictures, 0 for uploaded ones
  int32 batch_id = 5; // FK design_batch(id); set for UPLOADED pictures, 0 for generated ones
  int32 ordinal = 6; // position within its run/batch; stable, and the key of idempotent insertion
  // flat | render | threed | pattern.
  //
  // `pattern` is a REPEATING TILE, the output of a kind=pattern run. It has a name of its own
  // rather than borrowing `flat` because a tile that calls itself a flat becomes selectable into a
  // bench slot — «the front of the garment» would be a square of cloth — and one that calls itself
  // a render satisfies the «3D needs a fabric render first» gate on a card where nobody has drawn
  // the garment at all.
  string kind = 7;
  // The GHOST label: a hypothesis about which view this is, not a fact. Front-and-back guesses are
  // routinely wrong, so the label is shown as a guess and a human confirms it by putting the plate
  // into a slot. Empty = no hypothesis. On a crop this carries the frame's declared view.
  string ghost_view = 8;
  // Non-empty ONLY on a composite: the views glued into one image. A composite has no single view,
  // is not clickable into a slot, and must be split first (SplitDesignPicture).
  repeated string composite_views = 9;
  // The picture this one was derived from — a crop or a flattened edit. A derivative is a SIBLING
  // OF ITS PARENT: it inherits the parent's run_id or batch_id, and never gets a row of its own,
  // because no money was spent on it. A crop of an uploaded composite therefore sits under the same
  // BATCH the composite arrived in.
  int32 derived_from = 10;
  // WHICH VERB produced this picture from `derived_from`: '' | crop | flatten.
  //
  // READ IT ONLY AS A PAIR WITH `derived_from`, because '' carries TWO different meanings and a
  // reader that collapses them will call an orphaned crop a root:
  //   * derived_from = 0 and derivation = ''  — a ROOT: a run's output, an uploaded file, or the
  //     flatten of a layer drawn from nothing;
  //   * derived_from ≠ 0 and derivation = ''  — a legacy row migration 0359's backfill could not
  //     classify, because its parent is already gone (`derived_from` carries no FK by design).
  //
  // ⚠ `layer_rev` IS NOT A DISCRIMINATOR AND NEVER WAS — THIS FIELD EXISTS BECAUSE IT ISN'T.
  // A CROP INHERITS ITS PARENT'S `layer_rev` verbatim, so the crop of an EDITED sheet arrives with
  // exactly the non-zero revision a flatten arrives with; and «edit, save, edit again» files two
  // flattens whose revisions may coincide. The sentence on `layer_rev` below — «0 = not flattened»
  // — is therefore false in one direction already, and was false before this field existed: a
  // non-zero rev proves nothing about the verb. Grouping the feed by anything but `derivation`
  // folds a mere edit into the deck of cut pieces, which is the defect J-1 names.
  //
  // ⚠ IT IS NOT A SECOND SPELLING OF `source_class` either. That one answers «where the pixels
  // came from» (machine, hand, a foreign file); this one answers «by what gesture this row
  // detached from its parent's». A crop of an AI sheet and a flatten of an AI sheet share one
  // `source_class` and differ here.
  string derivation = 19;
  // PROVENANCE, an open vocabulary: ai | uploaded | ai_edits | imported_svg | drawn.
  // It has already grown once (`drawn`, for a vector base drawn from nothing), which is why it is
  // a string and not an enum.
  string source_class = 11;
  // This picture is the output of a fix whose INPUT slots were of mixed provenance. The flag does
  // not forbid anything — it refuses to let the mixture be laundered by one more generation.
  bool mixed_input = 12;
  // The edit layer revision this picture was flattened from.
  //
  // ⚠ ITS OLD SENTENCE — «0 = not flattened» — WAS ONLY EVER HALF TRUE, AND THE FALSE HALF COST A
  // FEATURE. A crop COPIES its parent's value, so a non-zero rev does NOT mean «this row is a
  // flatten»: the crop of an edited sheet carries one too. Zero still means «no layer was involved
  // in producing THIS row's pixels». To ask what verb made the row, read `derivation`.
  int32 layer_rev = 13;
  // Reversible invisibility — the ONLY persistent verb for hiding a picture. The guards live in
  // HideDesignPicture: a plate in a slot, feeding a live run, or parenting a live crop cannot be
  // hidden.
  google.protobuf.Timestamp hidden_at = 14;
  string hidden_by = 15;
  google.protobuf.Timestamp created_at = 16;
  // MARKED AS CHOSEN (W-12) — the plate the studio settled on among a run's outputs. Reversible and
  // presentational; it forbids nothing and gates nothing.
  //
  // IT IS NOT hidden_at WITH THE SIGN FLIPPED, and the two must never be collapsed. Hiding says «do
  // not show me this», choosing says «this is the one»; a card can have four visible turntables and
  // one chosen among them, and it can have a chosen plate that somebody later hid. Spending
  // hidden_at on both would make un-hiding a rejected frame silently re-elect it.
  //
  // The bench is where a FLAT becomes canonical — a slot holds at most one plate, and that IS the
  // choice. A 3D frame has no slot to be put into (the bench refuses kind=threed), so without this
  // flag «this is the render we go with» had nowhere at all to be written down.
  bool selected = 17;
  // WHICH COLOURWAY this picture belongs to — product(id), 0 = none. The pair (kind, colorway_id)
  // carries TWO different «none»s and a reader must not collapse them: on kind=flat (and pattern)
  // 0 means the picture has no colourway BY NATURE — a flat is one markup for the whole card, and
  // every write door refuses to give it one (`colorway_forbidden`). On kind=render|threed 0 means
  // UNATTRIBUTED: the picture predates the colourway axis, was filed without naming one, or its
  // colourway was deleted. Unattributed plates are legal forever — they form their own render
  // bench and feed only a 3D run that itself names no colourway; they are never silently mixed
  // into a named colourway's run.
  //
  // OUTPUT-ONLY here: a generated picture inherits the run's colourway, a crop and a flatten
  // inherit their parent's, an upload states it on DesignUploadItem.
  int32 colorway_id = 18;
  // ONLY FOR SHOWING (round 18, D-24). Visible on the sheet and in ARTIFACTS; never an input of any
  // paid call, never a bench plate, never a reference. Stated on DesignUploadItem.display_only at
  // registration and inherited by every crop and flatten of the picture. Every door that would let
  // it reach a prompt refuses with `display_only` (slot, role, split-for-input) or
  // `display_only_input` (a run or a draft, before the reserve). A run's own outputs are never
  // display-only: the flag is a statement about a file a person brought in, not about pixels.
  bool display_only = 20;
}

// DesignBatch is one upload gesture: the shelf stamp «uploaded · Т. · 14:41 · 12.4 MB» and the
// carrier of the batch's coherence — plates that arrived together are one hand's work, and the
// mixed-provenance warning reads that.
message DesignBatch {
  int32 id = 1;
  int32 tech_card_id = 2; // FK tech_card(id)
  // IDEMPOTENCY KEY minted by the client (UUID). Without it a retry after a network timeout files
  // a SECOND batch and a second set of pictures. Unique across the table.
  string client_request_id = 3;
  string author = 4; // server-stamped
  int32 files_count = 5;
  int64 size_bytes = 6; // the batch's real «price» — an upload costs megabytes, not money
  google.protobuf.Timestamp created_at = 7;
  // The pictures of this batch, UNDER their own shelf row — the same arrangement runs use, and for
  // the same reason. Without it an uploaded picture hangs under nothing readable: it has no run,
  // so no history row could carry it, and the upload shelf would be empty on every reload of the
  // tab. Hidden pictures are included WITH their flag; the client filters.
  repeated DesignPicture pictures = 8;
}

// DesignCardOutput is ONE generative output of the card, carrying the minimal facts of the run it
// came out of.
//
// WHY THE STAMP EXISTS AT ALL. This list is deliberately NOT page-bound (see
// GetDesignBandResponse.outputs), so the run a picture came out of may be nowhere in the response.
// Two facts are then unrecoverable from the picture alone and both are load-bearing:
//
//   * WHICH SECTION IT BELONGS TO. A recolour run produces pictures whose own kind is `render` —
//     that is true rather than a shortcut, the output IS a photograph of the garment — so a client
//     reading picture.kind files an ON MODEL result under RENDERS and the two sections lie about
//     each other. run_kind is the only place the difference survives.
//   * WHICH COLOURWAY AND WHICH REVISION. Both live on the run and neither is recoverable from
//     the picture's own row once the run has left the page.
//
// ⚠ THE STAMP SAYS WHICH RUN THIS BRANCH GREW OUT OF — IT DOES NOT SAY «A RUN PRODUCED THIS».
// The difference is real and a client that ignores it will mislabel pictures. A crop inherits its
// parent's run_id, and so does a flatten, so a hand-painted flatten laid over a render arrives here
// as run_id X, run_kind "render", run_rrev 7 — byte-for-byte indistinguishable from a direct output
// of run X IF THE STAMP IS ALL YOU READ. What separates them travels on the picture itself:
// `picture.source_class` (a direct output is `generated`; an edit over one carries an editor class)
// and `picture.derived_from` (0 on a direct output, the parent's id on a crop or a flatten). Any
// «was this generated or drawn?» question must be asked of those two fields, never of a non-empty
// run_kind.
//
// WHAT THE STAMP DOES CERTIFY, exactly: the kind, revision and colourway of the run this picture's
// ANCESTRY came out of. Since crops and flattens inherit kind and colourway along with run_id,
// those are precisely the facts needed to file the picture in the right section — which is what the
// stamp is for.
//
// A picture that hangs under an upload batch rather than a run answers run_id 0 and run_kind "" —
// nobody generated it, so there is no stamp to make up. It is classified by picture.kind, and
// batch_id says where it came from.
//
// ⚠ «NO RUN» DOES NOT IMPLY «HAS A BATCH». run_id 0 AND batch_id 0 together is a reachable, legal
// row: a flatten with no underlying picture (FlattenLayer with no parent) writes NULL to both
// columns. Such a picture belongs to the card and to nothing else. A client that treats
// `run_id == 0` as «came from batch_id» will render a shelf reference that does not exist.
message DesignCardOutput {
  DesignPicture picture = 1;
  // FK design_run(id). 0 = no run: an uploaded picture, or a parentless flatten. It does NOT imply
  // «a run produced this picture» when non-zero — see the ancestry note above.
  int32 run_id = 2;
  // render | threed | pattern | recolor — the kind of the RUN, never of the picture. "" when there
  // is no run at all.
  string run_kind = 3;
  int32 run_rrev = 4; // the render revision of that run; 0 when there is no run
  // The run's colourway — product(id), 0 = unattributed or no run.
  //
  // ⚠ THIS IS NOT THE SECTION KEY. Narrow by `picture.colorway_id`, which is what
  // GetDesignBandResponse.outputs_total_by_colorway is keyed by and what the bench already narrows
  // by. For everything a run produced the two are equal by construction (the run's colourway is
  // written onto its outputs, and crops and flattens inherit it); they part company on a picture
  // with no run, where this field is 0 while the picture's own colourway is named and real.
  int32 run_colorway_id = 5;
  int32 batch_id = 6; // FK design_batch(id); 0 = not on a shelf (a run output, or a parentless flatten)
}

// DesignReference is the ROLE of one reference image inside the band's prompt: which side of the
// garment this reference is about, and in what order it is fed.
//
// IT LIVES IN THE BAND, NOT IN THE DOCUMENT, and that is forced rather than chosen. A reference in
// the document is TechCardMediaItem{media_id, kind, caption}, where `kind` is ALREADY spent on what
// the image IS (MOODBOARD | REFERENCE | SWATCH). For a bench plate the argument «the view axis is
// the existing kind» holds; for a reference it does not — kind is occupied, so this is a genuine
// second axis. And it cannot become a column on tech_card_media either: that table has no row key
// at all, it is rewritten whole by every card save, and there would be nothing to carry the
// attribute onto the resent row.
//
// IT IS NOT PART OF THE DOCUMENT'S SIGNATURE. A role is a hint to the model and an order in the
// prompt, not a fact about the garment, so it enters no section digest and stales no sign-off.
message DesignReference {
  int32 tech_card_id = 1; // FK tech_card(id)
  int32 media_id = 2; // FK media(id); the reference image, which the document also holds
  // front | back | side_l | side_r | three_quarter_l | three_quarter_r | detail. NEVER EMPTY on the
  // wire: clearing a role deletes the row, so «no role stated» is expressed by the ABSENCE of a
  // DesignReference for that media, not by a present row carrying "". See SetDesignReferenceRole,
  // which takes "" as the clear verb.
  string role = 3;
  int32 ordinal = 4; // order in the prompt; lower goes first
  string set_by = 5; // server-stamped
  google.protobuf.Timestamp set_at = 6;
  // WHAT THE HUMAN SAID ABOUT THIS REFERENCE — «only the collar», «the fabric, not the cut» (W-3).
  // It goes to the model beside the image; without it a board of eight references states eight
  // roles and no intent, and the intent is the half that changes the answer.
  //
  // It is a hint to the model, exactly like `role`, so it enters NO section digest and stales no
  // sign-off: saving a note is not a change to the garment.
  //
  // Clearing the note is an empty string on a row that still has a role; clearing the ROLE deletes
  // the row and takes the note with it, because the row is the role's existence — see the comment
  // on `role` above and SetDesignReferenceRole.
  string note = 7;
  // WHICH DETAIL this reference is about — design_bench_slot(id), 0 = none.
  //
  // A REFERENCE WITH role=detail USED TO BE ABLE TO SAY ONLY THE BARE WORD «detail». The name the
  // operator typed lives on the bench slot the same gesture mints, and the two rows were
  // strangers, so the cell had nothing to print. This is the link, and it is a POINTER, not a copy
  // of the name: a detail name is renameable presentation, and a copy would drift from it in
  // silence. The same argument is already written on DesignRunParams.detail_slot_ids.
  //
  // 0 ON A role=detail ROW IS NOT AN ERROR: the row predates this field, or the slot was deleted
  // (the FK is ON DELETE SET NULL). Both are states a client says in words — «name it again» —
  // rather than inventing a name it does not have. On any role other than `detail` it is always 0,
  // and the store enforces that.
  int32 detail_slot_id = 8;
}

// DesignBenchSlot is one exclusive place on the bench: a view holds at most one plate. The six
// silhouette sides (front/back/side_l/side_r/three_quarter_l/three_quarter_r) are born lazily on
// first touch; detail slots are created by naming one.
message DesignBenchSlot {
  // The slot's OWN minted id. «Detail 1 / detail 2» as a key is forbidden: renaming a detail must
  // not move a plate, and two details named the same must still be two slots.
  int32 id = 1;
  string view_key = 2; // front | back | side_l | side_r | three_quarter_l | three_quarter_r | detail
  string detail_name = 3; // presentation only; required when view_key=detail, empty otherwise
  int32 picture_id = 4; // FK design_picture(id); 0 = the slot is empty
  // CAS TOKEN. Every write to this slot echoes the rev it believed it was overwriting; a mismatch
  // is Aborted:slot_rev_mismatch with the slot's current state attached. 0 = the slot does not
  // exist yet, which is the value a lazy first placement sends.
  int32 slot_rev = 5;
  string set_by = 6; // server-stamped
  google.protobuf.Timestamp set_at = 7;
  // THE RESOLVED PLATE, not just its id. Unset when the slot is empty.
  //
  // A bare picture_id is unreadable on its own: the plate a slot holds is routinely older than the
  // first page of runs, so the client would have nothing to draw the thumbnail from and no
  // source_class to compute the mixed-provenance warning with. It is also what makes the CAS
  // refusal usable — Aborted:slot_rev_mismatch hands back the slot's CURRENT state, and a bare id
  // there would force the loser of the race into another round trip before it could redraw.
  DesignPicture picture = 8;
  // WHICH BENCH this slot stands on: flat | render | threed. THE BENCH HAS TWO AXES, view × kind,
  // and this is the second one. Empty is read as `flat` — every slot that existed before this field
  // is a flat slot, and every caller written before it keeps meaning the bench it meant.
  //
  // ONE AXIS WAS A DEFECT, not a simplification. With view alone, a fabric render of the front and
  // the technical flat of the front are the same key: placing the render DISPLACES the flat, and
  // the bench then offers a colour render where the technical line-drawing stood — two different
  // answers to «what is the front», with the second silently erasing the first. Uniqueness is
  // (tech_card_id, kind, exclusive_key).
  string kind = 9;
  // WHOSE render bench this slot stands on — product(id) of the colourway, 0 = none. THE RENDER
  // BENCH IS PER COLOURWAY (the owner: «1 колорвей там должно быть мультивью которое мы генерим +
  // из его нарезаем сплитом стороны размеченные и на каждый колорвей так»): colourway A's front
  // and colourway B's front are TWO slots, occupied simultaneously — the colourway is part of the
  // slot's exclusivity key on the server, so they never collide.
  //
  // 0 on every flat slot (a flat bench has no colourway axis and a ref naming one is refused) and
  // on the legacy render bench: slots born before this axis keep 0 and stay exactly the slots
  // they were. The plate in a slot always carries the SAME colorway_id as the slot — a mismatch
  // is refused at placement (`colorway_mismatch`).
  int32 colorway_id = 10;
  // ═══ THE STAMP OF THE RUN THE PLATE CAME OUT OF — the same argument as `picture` above, one
  // level further in ═══════════════════════════════════════════════════════════════════════════
  //
  // `picture` is resolved server-side because «the plate a slot holds is routinely older than the
  // first page of runs». That sentence is true of the plate's RUN as well, and the consequence was
  // never drawn: `run_id` rides along on the picture, but the run row it points at is on the first
  // page of `runs` or nowhere, and a client can only look it up THERE. Twelve rows
  // (design.DefaultRunPageLimit). On any card with history the lookup returns nothing.
  //
  // WHAT WAS SILENTLY BROKEN BY THAT, and it is not cosmetic. The 3D screen refuses «four sides of
  // ONE revision r» by collecting the rrev of each marked side. With every lookup answering «not on
  // this page» the set of revisions collapses to EMPTY, the refusal cannot fire, and a turntable
  // gets built from a front of r3 and a back of r7 — two different colourings of the garment,
  // fused into one paid model, with `done` on the row and nothing in the history to tell them
  // apart. A guard fed zeroes is worse than no guard: it reads like coverage.
  //
  // WHY ON THE SLOT AND NOT ON DesignPicture. A picture reached any other way (`runs[].pictures`,
  // `batches`, `outputs`) already arrives beside the facts of its run — DesignCardOutput exists for
  // precisely that and carries this same stamp. The bench is the ONE place a plate arrives orphaned
  // from its run, so this is where the missing half belongs. Putting it on the picture would make a
  // second carrier of a fact DesignCardOutput already states, and two carriers of one fact drift in
  // silence — this file says so about `run_colorway_id` two hundred lines up.
  //
  // NOT ADDED: the run's colourway. The slot states whose bench it is (`colorway_id` above) and the
  // plate states its own; a third writing of the same fact is the split this message just refused.
  //
  // render | threed | pattern | recolor — the kind of the RUN, never of the picture. "" when the
  // plate has no run at all (a hand upload, or a flatten with no parent).
  //
  // IT IS NOT THE SAME QUESTION AS `picture.kind`, AND ON THIS BENCH THE DIFFERENCE IS PAID FOR. A
  // recolour produces pictures whose own kind is `render` — truthfully, the output IS a photograph
  // of the garment — so a plate cut from an ON MODEL result is placeable on the render bench and
  // indistinguishable there from a fabric render. 3D would then build a body from a photograph of a
  // body. The only field in which that difference survives is this one.
  string run_kind = 11;
  // The render revision of that run — design_run.rrev, the card's own counter of fabric-render
  // runs. 0 when there is no run, and 0 on every run kind that does not take a revision (only
  // `render` mints one).
  //
  // ⚠ ABSENT ≠ 0 ON THE WIRE. The gateway emits unpopulated fields, so a server that knows this
  // field always sends a number; a response with no field at all is a binary older than it, where
  // the page-bound lookup is still the only answer available. A client must not read the silence of
  // an old server as «this plate has no revision».
  int32 run_rrev = 12;
}

// DesignEditLayer is a vector layer: strokes over a raster base, or strokes over nothing.
//
// ADDRESSED BY ITS OWN id, never by base_media_id. The `draw it` door opens a layer with NO base
// (base_media_id = 0), and a card may hold several such layers; the model «a layer is tracing
// paper over a picture» cannot express that at all.
message DesignEditLayer {
  int32 id = 1;
  int32 tech_card_id = 2; // FK tech_card(id)
  int32 base_media_id = 3; // FK media(id); 0 = a clean vector base, drawn from nothing
  // CAS TOKEN. SaveDesignEditLayer and FlattenDesignEditLayer both echo the rev they believed they
  // were acting on; a mismatch is Aborted:layer_rev_mismatch carrying the current rev.
  int32 rev = 4;
  // The layer's strokes, JSON-encoded. Capped at 512 KB — one vector edit; beyond that the answer
  // is «too many strokes, split it», not a slower save. There is deliberately no revision history:
  // the layer is a working surface, and what gets used downstream is the FLATTENED file, which is
  // an ordinary media row with its own identity and its own content hash.
  //
  // SERVED ONLY BY GetDesignEditLayer, AND LEFT EMPTY EVERYWHERE ELSE. GetDesignBand lists the
  // layers without their strokes on purpose: 512 KB is the cap per LAYER, a card may hold several,
  // and shipping them all would make every open of the tab cost megabytes to draw a list of
  // thumbnails. The editor fetches the one layer it is about to open.
  bytes strokes = 5;
  string updated_by = 6; // server-stamped
  google.protobuf.Timestamp updated_at = 7;
  // WHERE THE STROKES CAME FROM, an open vocabulary like every other in this file:
  // drawn | imported | vectorised. Empty reads as `drawn`, which is what every layer that predates
  // this field is.
  //
  // It is provenance, and it is the layer's half of the one DesignPicture.source_class already
  // states for pixels. A layer that cannot say whether a human drew it or a machine traced it makes
  // the mixed-provenance warning uncomputable for everything vector.
  string origin = 8;
  // FK media(id) RESTRICT: the AUTHORITATIVE vector file this layer is a projection of — the SVG
  // that was imported, or the one the vectoriser returned. 0 = there is no file; the strokes are
  // the original.
  //
  // MEDIA HOLDS THE FILE, `strokes` HOLDS THE EDITABLE PROJECTION, and this is the edge between
  // them. `download SVG` hands back THIS media and never a re-serialisation of the strokes: a round
  // trip through the canvas's own format is not the file the vectoriser produced, and quietly
  // substituting one for the other is how a supplier receives a different drawing than the one that
  // was approved. RESTRICT because the file may not be deleted out from under the layer.
  int32 source_media_id = 9;
  // FK design_picture(id): the RASTER this vector was traced from, when it was traced from one.
  // 0 = the file came from outside the band, or the layer was drawn from nothing.
  //
  // It is what lets the studio ask «which flat is this the vector of» after the fact, and what a
  // fix run needs in order to feed the raster and the vector as one input rather than two
  // unrelated ones.
  int32 source_picture_id = 10;
  // FK media(id) RESTRICT: THE PIXEL CHANNEL OF THIS LAYER — one RGBA image holding the FULL state
  // of its pixels, never a delta. 0 = nothing has been painted; the layer is pure vector.
  //
  // WHY FULL STATE AND NOT A DELTA. The eraser chews through the BASE as well (the owner's answer,
  // verbatim: «И саму фотографию тоже»), so the result is not expressible as «the base plus
  // something on top» at all — a hole in the photograph is the ALPHA OF THIS IMAGE. That is also
  // why there is no separate base mask: it would be a second way of stating the same fact, and a
  // second channel obliged not to drift from the revision.
  //
  // ONE PAINT LAYER PER PICTURE — the owner's answer, verbatim: «Один. Как сейчас».
  //
  // THE CLIENT PAINTS IT AND UPLOADS IT, exactly as it already does for the flatten: the server
  // does not rasterise (Р-2), so this arrives as a media id from UploadContentImage. It is served
  // by GetDesignBand as well as GetDesignEditLayer — unlike `strokes` it is a bare id, not
  // kilobytes, and the band's thumbnails need to know a layer has been painted.
  //
  // THE VECTOR STROKES LIVE ABOVE IT. Pen, curves and seams are a DRAWING and must stay editable;
  // a flatten is raster first, strokes on top.
  int32 raster_media_id = 11;
  // THE RESOLVED PIXELS, joined from raster_media_id at read time — the same promise
  // `DesignInputRef.media` and `DesignInputSlot.media` already make, kept by the same batch join.
  //
  // WHY THE ID ALONE WAS NOT ENOUGH. A bare id is a fact the writer stored; it is not a picture. The
  // editor's ONLY way back to yesterday's painting is its bytes, and no verb in this contract reads
  // a media by id — so a client handed the id and nothing else has exactly two moves, and both are
  // wrong: refuse to open the pixel tools, or seed the canvas from the BASE and let the next save
  // write that copy over the painting. There is no revision history on a layer, so that second move
  // is final. Serving the resolved media is what makes «painted → saved → reopened» a circle.
  //
  // SERVED BY GetDesignEditLayer AND LEFT UNSET BY GetDesignBand, and that is the same split
  // `strokes` is under, for the same reason read the other way round: the band needs to KNOW a layer
  // has been painted, which `raster_media_id` already answers, and it draws no layer pixels
  // anywhere — its thumbnails are pictures. Resolving it there would buy a media read on every open
  // of the tab for URLs nothing paints. The editor opens ONE layer and is the only screen that needs
  // the bytes.
  //
  // UNSET when raster_deleted is true, and ALSO unset when the join itself failed — see there.
  MediaFull raster_media = 12;
  // THE PAINTING'S MEDIA ROW IS GONE. True ONLY when the row was actually looked for and not found.
  //
  // «WE DO NOT KNOW» IS NOT «IT IS NOT THERE». If the media read fails, this stays false and
  // raster_media stays unset: the layer still answers with its strokes, its rev and its id, and a
  // client seeing an id with neither bytes nor a deletion knows it was told nothing — which is the
  // truth. Setting it on a failed read would be a lie about a file that is probably alive, and
  // failing the whole call would hide a layer whose strokes are perfectly readable.
  //
  // The distinction is not cosmetic: `raster_media_id = 0` means «nothing was ever painted, start
  // from the base», this flag means «there WAS a painting and it is unrecoverable», and neither one
  // may be shown to a person as the other.
  bool raster_deleted = 13;
}

// DesignBudget is the band's money bar: `today $0.41 of $2.00`.
//
// costing-shaped: EVERY money field below is stripped when the account lacks costing:read. A band
// read by an account without it shows no bar at all — a bar with blanks in it would read as «the
// budget is zero», which is a different and false statement.
message DesignBudget {
  string day = 1; // YYYY-MM-DD, computed in `timezone` — never in the MySQL session's day
  // ACTUALLY CHARGED today: the sum of attempt prices, paid failures included.
  google.type.Decimal spent = 2;
  // RESERVED today: the estimates of runs that are still in flight and have not been billed yet.
  //
  // TWO FIELDS, NOT ONE SUM — and the reason is no longer the one written here before. That
  // sentence argued that the GATE must add them, because counting only the charged half would let
  // two simultaneous starts both pass a ceiling only one of them fits under. There is no gate any
  // more (field 4 below), so the argument died with it, and it is replaced rather than deleted
  // silently: a rationale that outlives its reason is how the thing it justified grows back.
  //
  // What survives is the honest half. A single field called «spent» holding charged-plus-reserved
  // would LIE to the reader about what was actually paid: one is money gone, the other is money
  // promised by runs still in flight, and only the first is a fact. One fact, one field; whoever
  // needs the sum derives it where it is needed and says why.
  google.type.Decimal reserved = 3;
  // ⚠ FIELD 4 WAS `cap`, THE ORG'S DAILY CEILING, AND IT IS GONE — the ceiling itself was removed,
  // not raised (migration 0358). The owner, twice: there must be no generation ceiling at all,
  // whatever ate it. A run is never refused for money any more, so there is no limit left to draw
  // a bar against.
  //
  // CLIENTS MUST STOP DRAWING «spent of cap» and show the plain amount spent instead; the
  // `budget_exceeded` refusal is likewise unreachable and its branch should be deleted rather than
  // left waiting for a state the server no longer produces. The number itself did not go away —
  // that was the point: `spent` and `reserved` are still measured, recorded per run and served
  // here, because the owner does care what things cost.
  reserved 4;
  reserved "cap";
  string currency = 5; // ISO 4217
  // WHOSE «today» resets the bar. On the wire because that is an organisational decision, not a
  // property of the database session that happened to answer.
  string timezone = 6;
}

// DesignConstructionDraft is what `draft the construction` answers: ONE proposal covering the four
// groups the CONSTRUCTION tab draws, read off the moodboard pictures, the designer's concept and
// the notes pinned on the images.
//
// IT IS A PROPOSAL, NOT A WRITE. Nothing here is persisted onto the card by the run: every value
// lands in the client's staging state and reaches the form only through the SAME writers a
// hand-typed value uses, one deliberate click per row. That is why the shape is deliberately flat
// and stringly — it carries VALUES for fields that already exist, never rows of any table, and no
// field of it is ever handed to the card's own schema as an object.
//
// EMPTY IS SILENCE, NOT «CLEAR IT». A field the model did not answer is absent, and absence means
// the model had nothing to say — never that the card's value should go away. The client has no
// «apply all» for the same reason: omission must not be able to erase.
//
// WHAT IS DELIBERATELY NOT HERE: category, base model, base sample size (FK picks — a name is not
// an id and a guessed id is a wrong card), the size run (PATTERNS owns it), and the callout table's
// FEATURE and STITCH columns (derived from operations, so asking for them would invite a second,
// disagreeing answer).
message DesignConstructionDraft {
  string silhouette = 1; // → details[key=silhouette].text
  string fabric = 2; // → details[key=fabric].text
  string fit = 3; // one of the fit vocabulary, or '' when the pictures do not show it
  // Offered ONLY when the card's own concept is empty — the designer's words outrank the model's,
  // and a proposal that competes with them would ask a person to defend what they already wrote.
  string concept = 4;
  repeated DesignConstructionAspect aspects = 5; // one of the standard keys, or a custom one
  repeated DesignConstructionCallout callouts = 6; // UNPINNED rows for the construction table
  repeated DesignConstructionBomLine bom = 7;
  // What deserves a pinned note and has none. READ-ONLY ADVICE: it names a picture and a spot, it
  // proposes no value, and there is nothing on the card for it to land in.
  repeated string missing = 8;
}

// DesignConstructionAspect is one row of the aspects editor: its key and its text.
//
// The key is a STRING and not an enum because the aspects editor already accepts a custom key —
// closing the vocabulary here would make the model's legitimate answer («cuff», «vent») invalid on
// the wire while the human's identical answer stays legal.
message DesignConstructionAspect {
  string key = 1; // silhouette | collar | fastening | pockets | sleeve_cuff | topstitching | extra_details | aux_materials | a custom key
  string text = 2;
}

// DesignConstructionCallout is one proposed row of the construction callout table, in the three
// columns a human fills by hand: what it is, what to do about it, and how big it is.
//
// NO media_id AND NO NUMBER, and that is the whole point of the shape. A proposal is born as an
// UNPINNED row — the server mints the number on save, and the pin is a gesture on a picture that
// only a person can make. A model naming either would be inventing our identifiers.
message DesignConstructionCallout {
  string feature = 1; // → callout.part
  string details = 2; // → callout.description
  string dimensions = 3; // → callout.dimensions; empty unless the board actually states one
}

// DesignConstructionBomLine is one proposed component of the bill of materials, named BY ITS ROLE
// («main fabric», «neck binding», «care label») rather than by an article.
//
// material_id IS 0 UNLESS THE SERVER CONFIRMED IT against the catalogue — an id is a claim about
// our own database, and a model that guesses one produces a line that looks linked and priced while
// pointing at somebody else's article. An unlinked line is a legal, useful BOM row; a wrongly
// linked one is a costing error wearing a price tag.
message DesignConstructionBomLine {
  TechCardBomSection section = 1;
  TechCardBomPurpose purpose = 2; // roll goods only; UNSET otherwise
  TechCardBomKind kind = 3; // hardware / trims / decoration only; UNSET otherwise
  string name = 4; // the role this component plays on the garment
  string composition = 5;
  string colour = 6;
  string pantone = 7;
  int64 material_id = 8; // 0 unless catalogue matching confirmed the article
}
