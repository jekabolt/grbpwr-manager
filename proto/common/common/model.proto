syntax = "proto3";

package common;

import "common/media.proto";
import "common/product.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jekabolt/grbpwr-manager/proto/gen/common;common";

// BodyMeasurementName enumerates the body-measurement types captured for a fit
// model. It is intentionally separate from the garment MeasurementName dictionary.
enum BodyMeasurementName {
  BODY_MEASUREMENT_NAME_UNKNOWN = 0;
  // Torso
  BODY_MEASUREMENT_NAME_CHEST = 1;
  BODY_MEASUREMENT_NAME_UNDER_BUST = 2;
  BODY_MEASUREMENT_NAME_WAIST = 3;
  BODY_MEASUREMENT_NAME_HIGH_HIP = 4;
  BODY_MEASUREMENT_NAME_HIP = 5;
  BODY_MEASUREMENT_NAME_NECK_BASE = 6;
  // Arms
  BODY_MEASUREMENT_NAME_ACROSS_SHOULDER = 7;
  BODY_MEASUREMENT_NAME_SLEEVE_LENGTH = 8;
  BODY_MEASUREMENT_NAME_BICEP = 9;
  BODY_MEASUREMENT_NAME_WRIST = 10;
  // Legs
  BODY_MEASUREMENT_NAME_INSEAM = 11;
  BODY_MEASUREMENT_NAME_THIGH = 12;
  BODY_MEASUREMENT_NAME_KNEE = 13;
  BODY_MEASUREMENT_NAME_CALF = 14;
  BODY_MEASUREMENT_NAME_ANKLE = 15;
  // Vertical / lengths
  BODY_MEASUREMENT_NAME_HEIGHT = 16;
  BODY_MEASUREMENT_NAME_HPS_TO_WAIST_FRONT = 17;
  BODY_MEASUREMENT_NAME_CB_NECK_TO_WAIST = 18;
  // Widths (front / back)
  BODY_MEASUREMENT_NAME_ACROSS_FRONT = 19;
  BODY_MEASUREMENT_NAME_ACROSS_BACK = 20;
  // P0 mannequin-shape contract. These are distinct tape/vertical/depth
  // observations; HEIGHT remains standing stature and is not reinterpreted.
  // Exact landmarks and path semantics are identified by ModelMeasurement.metadata.
  BODY_MEASUREMENT_NAME_HPS_HEIGHT = 21;
  BODY_MEASUREMENT_NAME_CF_NECK_TO_WAIST = 22;
  BODY_MEASUREMENT_NAME_WAIST_HEIGHT = 23;
  BODY_MEASUREMENT_NAME_WAIST_TO_HIGH_HIP = 24;
  BODY_MEASUREMENT_NAME_WAIST_TO_HIP = 25;
  BODY_MEASUREMENT_NAME_CHEST_DEPTH = 26;
  BODY_MEASUREMENT_NAME_WAIST_DEPTH = 27;
  BODY_MEASUREMENT_NAME_HIP_DEPTH = 28;
  BODY_MEASUREMENT_NAME_SHOULDER_LENGTH = 29;
  BODY_MEASUREMENT_NAME_SHOULDER_DROP = 30;
  BODY_MEASUREMENT_NAME_ARMSCYE_DEPTH = 31;
  BODY_MEASUREMENT_NAME_ARMSCYE_CIRCUMFERENCE = 32;
  BODY_MEASUREMENT_NAME_BUST_APEX_TO_APEX = 33;
  BODY_MEASUREMENT_NAME_HPS_TO_BUST_APEX = 34;
  // P1 (body_measurement_schema_version 2). Mid-neck circumference, taped
  // around the neck at mid-length. Distinct from NECK_BASE: neither value is
  // ever derived from the other.
  BODY_MEASUREMENT_NAME_NECK = 35;
}

// ModelMannequinPoseSpace names the coordinate/control contract used by a
// mannequin pose. Stored V2 resources admit only DIRECT_POSE_V9; FULL_BODY_V4
// remains an explicit migration vocabulary value and must not be guessed.
enum ModelMannequinPoseSpace {
  MODEL_MANNEQUIN_POSE_SPACE_UNKNOWN = 0;
  MODEL_MANNEQUIN_POSE_SPACE_MAKEHUMAN_OPEN_REFERENCE_FULL_BODY_V4 = 1;
  MODEL_MANNEQUIN_POSE_SPACE_MAKEHUMAN_OPEN_REFERENCE_DIRECT_POSE_V9 = 2;
}

enum ModelMannequinArmMode {
  MODEL_MANNEQUIN_ARM_MODE_UNKNOWN = 0;
  MODEL_MANNEQUIN_ARM_MODE_LINKED = 1;
  MODEL_MANNEQUIN_ARM_MODE_INDEPENDENT = 2;
}

message ModelMannequinArmPoseV1 {
  sint32 shoulder_raise_degrees = 1;
  sint32 shoulder_forward_degrees = 2;
  sint32 elbow_bend_degrees = 3;
  sint32 wrist_bend_degrees = 4;
}

enum ModelMannequinLegMode {
  MODEL_MANNEQUIN_LEG_MODE_UNKNOWN = 0;
  MODEL_MANNEQUIN_LEG_MODE_LINKED = 1;
  MODEL_MANNEQUIN_LEG_MODE_INDEPENDENT = 2;
}

message ModelMannequinLegPoseV1 {
  sint32 hip_forward_degrees = 1;
  sint32 hip_side_degrees = 2;
  sint32 knee_bend_degrees = 3;
  sint32 ankle_bend_degrees = 4;
}

// ModelMannequinPoseV2 is the typed persistence shape for the direct-pose-v9
// editor. canonical_sha256 is the lowercase SHA-256 of the canonical frontend
// V2 JSON document; the server rebuilds and verifies it before every write.
message ModelMannequinPoseV2 {
  uint32 schema_version = 1; // exactly 2
  ModelMannequinPoseSpace pose_space = 2;
  sint32 body_flexion_degrees = 3;
  sint32 body_side_bend_degrees = 4;
  sint32 body_twist_degrees = 5;
  ModelMannequinArmMode arm_mode = 6;
  ModelMannequinArmPoseV1 left_arm = 7;
  ModelMannequinArmPoseV1 right_arm = 8;
  sint32 head_pitch_degrees = 9;
  sint32 head_yaw_degrees = 10;
  sint32 head_side_degrees = 11;
  ModelMannequinLegMode leg_mode = 12;
  ModelMannequinLegPoseV1 left_leg = 13;
  ModelMannequinLegPoseV1 right_leg = 14;
  string canonical_sha256 = 15;
  sint32 shoulder_protraction_degrees = 16;
  sint32 shoulder_elevation_degrees = 17;
  sint32 shoulder_level_degrees = 18;
}

message StoredModelMannequinPose {
  int32 model_id = 1;
  ModelMannequinPoseV2 pose = 2;
  // Canonical positive decimal uint64 string. The admin TypeScript generator
  // maps protobuf uint64 to number, which is lossy above 2^53.
  string revision = 3;
  google.protobuf.Timestamp updated_at = 4;
  string updated_by = 5;
}

// BodyMeasurementSource records how a value was obtained. It is provenance,
// not evidence that the value, landmarks, or resulting mannequin are accurate.
enum BodyMeasurementSource {
  BODY_MEASUREMENT_SOURCE_UNKNOWN = 0;
  BODY_MEASUREMENT_SOURCE_MANUAL_TAPE = 1;
  BODY_MEASUREMENT_SOURCE_THREE_D_SCAN = 2;
  BODY_MEASUREMENT_SOURCE_IMPORTED = 3;
  BODY_MEASUREMENT_SOURCE_DERIVED = 4;
}

// BodyMeasurementMetadataV1 binds one value to an acquisition method and a
// caller-owned protocol identifier. Presence is optional for legacy rows. When
// present, schema_version is exactly 1, source is non-UNKNOWN, and protocol_id
// is a non-empty stable identifier; the server validates all three together.
message BodyMeasurementMetadataV1 {
  uint32 schema_version = 1;
  BodyMeasurementSource source = 2;
  string protocol_id = 3;
}

// ModelMeasurement is a single body measurement value, in millimetres.
message ModelMeasurement {
  BodyMeasurementName name = 1;
  int32 value_mm = 2;
  BodyMeasurementMetadataV1 metadata = 3;
}

// ModelInsert is the writable payload for a fit-model profile. Measurements are
// sparse: include only the ones that are filled in.
message ModelInsert {
  reserved 4; // was default_sample_size_id (single); replaced by default_size_ids
  reserved "default_sample_size_id";
  string name = 1;
  string comment = 2;
  GenderEnum gender = 3;
  repeated ModelMeasurement measurements = 5;
  int32 thumbnail_id = 6; // FK media(id); 0 = unset (optional)
  repeated int32 media_ids = 7; // optional photo gallery
  repeated int32 default_size_ids = 8; // FK size(id); default sample sizes (multi, optional)
  // Writer-awareness version for BodyMeasurementName. The server emits 2.
  // 0 identifies a legacy writer that only knew values 1..20; on update the
  // server preserves stored values 21..35 that are absent from its payload.
  // 1 identifies a P0 writer that knew values 1..34; on update the server
  // preserves a stored value 35 (NECK) that is absent from its payload.
  // 2 means the sparse measurements list is authoritative for all values 1..35.
  uint32 body_measurement_schema_version = 9;
}

// Model is a stored fit-model profile.
message Model {
  int32 id = 1;
  ModelInsert model = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  MediaFull thumbnail = 5; // resolved thumbnail; null if unset
  repeated MediaFull media = 6; // resolved photo gallery
}
