message GetMaterialCuttingCoefficientSuggestionRequest {
  int32 material_id = 1;
}

// Предложение коэффициента раскроя ОДНОГО артикула по факту его настилов (Ф5б.3, §4.2).
//
// ДВА ЧИСЛА, И ЭТО НЕ ИЗБЫТОЧНОСТЬ. median_drift_percent — ИЗМЕРЕНИЕ (+3.00 = «уходит на 3%
// больше плана»); suggested_coefficient — МНОЖИТЕЛЬ (1.0300), то, что сохраняется в
// material.cutting_coefficient. 0270 хранит коэффициент множителем, потому что путь потребности на
// него УМНОЖАЕТ. Отдай сервер одно измерение — забытый на клиенте «+1» дал бы артикулу
// коэффициент 0.03, который entity.Material.EffectiveCuttingCoefficient читает как «НЕ ЗАДАНО»
// (всё, что меньше единицы, — не задано), и калибровка молча обнулила бы себя.
message GetMaterialCuttingCoefficientSuggestionResponse {
  common.MaterialCoefficientSuggestionStatus status = 1;
  // ИЗМЕРЕНИЕ, в процентах. ЗАПОЛНЕНО и при OUT_OF_RANGE — измерение остаётся фактом тогда, когда
  // поле его не принимает, и человеку показывают именно его. Пусто только при TOO_FEW_FACTS.
  google.type.Decimal median_drift_percent = 2;
  // МНОЖИТЕЛЬ, готовый к сохранению. ПУСТО при TOO_FEW_FACTS и при OUT_OF_RANGE, и ни в одном из
  // этих случаев это не «1.0»: коэффициента нет и коэффициент равен единице — разные утверждения.
  google.type.Decimal suggested_coefficient = 3;
  // Сколько настилов стоит ПОД медианой. Едет ВСЕГДА, в том числе при TOO_FEW_FACTS, где оно и есть
  // содержание ответа. Предложение без своей опоры нечем взвесить: «1.06 по трём настилам» и
  // «1.06 по сорока» — два разных утверждения, и решают по ним по-разному.
  int32 lay_count = 4;
  // Фраза для человека. НЕПУСТА ВСЕГДА, включая READY.
  string detail = 5;
  // Разбор ПО НАСТИЛАМ, вошедшие и невошедшие, в порядке от свежего замера к старому.
  repeated common.MaterialCoefficientLayDrift drifts = 6;
}

message GetBomWastageSuggestionRequest {
  int32 material_id = 1;
}

// Предложение процента раскроя (bom_item.wastage_percent) ОДНОГО артикула по факту его настилов
// (T7 волна 2): медиана «факт ÷ netto − 1» по настилам, где есть И замер, И netto-знаменатель.
//
// ЗДЕСЬ ОДНА ЕДИНИЦА — ПРОЦЕНТ, и это отличие от соседа сознательное: у коэффициента ответ несёт
// измерение-процент И множитель, потому что поле хранит множитель; у процента поле хранит процент,
// и вторая единица в ответе повторила бы путаницу «коэффициент против процента» в обратную сторону.
message GetBomWastageSuggestionResponse {
  common.BomWastageSuggestionStatus status = 1;
  // ИЗМЕРЕНИЕ: медиана дрейфа над netto, в процентах (+22.00 = «уходит на 22% больше безотходной
  // нормы»). Заполнено и при OUT_OF_RANGE — измерение остаётся фактом, когда поле его не принимает.
  // Пусто только при TOO_FEW_FACTS.
  google.type.Decimal median_over_netto_percent = 2;
  // ЧИСЛО ДЛЯ ПОЛЯ: тот же процент, отдаётся ТОЛЬКО при READY. Пусто при TOO_FEW_FACTS и при
  // OUT_OF_RANGE — и ни в одном случае это не «0»: процента нет и процент равен нулю — разные
  // утверждения о ткани.
  google.type.Decimal suggested_wastage_percent = 3;
  // Сколько настилов стоит ПОД медианой. Едет всегда — при TOO_FEW_FACTS это и есть содержание
  // ответа («фактов пока 1 из 3»).
  int32 lay_count = 4;
  // По скольким РАЗНЫМ карточкам (моделям) эти настилы. «Медиана по 3 настилам, 1 модель» и
  // «по 3 настилам, 3 модели» — разные основания применять число к СВОЕЙ модели: межлекальные
  // выпады — свойство модели, и медиана по чужой обязана быть видна как таковая.
  int32 tech_card_count = 5;
  // Фраза для человека. Непуста всегда, включая READY.
  string detail = 6;
  // Разбор ПО НАСТИЛАМ, вошедшие и невошедшие, от свежего замера к старому.
  repeated common.BomWastageLayDrift drifts = 7;
  // ОКНО ОТБОРА: сколько настилов-кандидатов РАССМОТРЕНО (свежие N — скан истории артикула
  // ограничен) и сколько измеренных кандидатов есть ВСЕГО. considered < total означает, что
  // медиана стоит на свежем окне, — и это видно, а не подразумевается: «медиана по N» без
  // названного окна непроверяема.
  int32 considered_lay_count = 8;
  int32 total_measured_lay_count = 9;
  // ЛИНЕЙКА, ПО КОТОРОЙ ПОСЧИТАНА МЕДИАНА (W3). Знаменатель дрейфа — netto × ЭТОТ коэффициент, а не
  // чистое netto: с W3 усадку/пороки оплачивает material.cutting_coefficient, и оставить их в
  // медиане значило бы предложить процент, который оплатит их ВТОРОЙ раз.
  //
  // ПУСТО = знаменатель чистое netto (у артикула коэффициента нет) — и тогда цифра означает ровно
  // то же, что означала до W3.
  //
  // ПОЛЕ ОБЯЗАНО ЧИТАТЬСЯ ВМЕСТЕ С ЧИСЛОМ. Значения, применённые до W3, считались по чистому netto,
  // поэтому у артикула с коэффициентом сегодняшнее предложение НИЖЕ прежнего примерно на величину
  // коэффициента. Это не «факт изменился» — это сменилась линейка, и оператор, сравнивающий с
  // сохранённым процентом, обязан видеть, чем именно мерили.
  google.type.Decimal denominator_cutting_coefficient = 10;
}

// RepriceTechCardBom (production-costing Phase 3, plan 11).
message RepriceTechCardBomRequest {
  int32 tech_card_id = 1;
}

// One catalog-linked BOM line the reprice action visited. `changed` is false when the catalog price
// already matched the line (provenance still restamped 'catalog' — the price is now provably the
// catalog's). A line with no resolvable catalog price is reported with new_price unset.
message RepricedBomLine {
  string line_key = 1;
  string name = 2;
  string section = 3;
  google.type.Decimal old_price = 4;
  string old_currency = 5;
  google.type.Decimal new_price = 6; // unset = no current catalog price in a resolvable currency
  string new_currency = 7;
  bool changed = 8;
}

message RepriceTechCardBomResponse {
  repeated RepricedBomLine lines = 1; // every catalog-linked line, in BOM order
  int32 skipped_unlinked = 2; // BOM lines with no material_id — reprice cannot touch them
}

// Phase 2 scalar→BOM migration exception report (read-only).
message CostingMigrationException {
  int32 tech_card_id = 1;
  string style_number = 2;
  string tech_card_name = 3;
  string article = 4; // hardware | packaging
  string kind = 5; // double_counted | zero_colorways | not_draft
  google.type.Decimal amount = 6;
  string currency = 7;
  string approval_state = 8; // the card's state when the migration ran
  google.protobuf.Timestamp created_at = 9;
}

message ListCostingMigrationExceptionsRequest {
  int32 tech_card_id = 1; // 0 = all cards
}

message ListCostingMigrationExceptionsResponse {
  repeated CostingMigrationException exceptions = 1;
}

// НАПРАВЛЕНИЕ ТКАНИ gap report (Ф1.8) — see ListTechCardFabricDirectionGaps.
message ListTechCardFabricDirectionGapsRequest {
  int32 tech_card_id = 1; // 0 = every card in scope; a card id re-checks one card after the fix
  // include_inactive adds back the cards the default worklist defers — today exactly the RELEASED
  // ones, and the `excluded` breakdown always names which states those were. Off by default because
  // the point of the report is a list somebody can finish; ON for the release go/no-go, because a
  // released card is deferred on a JUDGEMENT (that nobody re-opens it) and not on a proof.
  bool include_inactive = 2;
  // counts_only drops `cards` and answers with the totals alone. The go/no-go call is
  // (counts_only, include_inactive) = (true, true) — one question, one bounded answer, and that
  // matters because the unbounded form grows with the portfolio and its failure mode
  // (ResourceExhausted) would land on precisely the call that gates the release.
  bool counts_only = 3;
}

message ListTechCardFabricDirectionGapsResponse {
  repeated FabricDirectionGapCard cards = 1; // cards with at least one unset line, deterministic order
  int32 total_cards = 2;
  // total_lines — roll-goods lines still missing a направление IN THE SCOPE THAT WAS ASKED FOR. On a
  // default call zero means «nothing refuses today»; it is NOT on its own the release condition,
  // because the deferred cards below can be re-opened into scope by one ordinary card edit.
  //
  // THE GO/NO-GO IS total_lines + excluded_lines == 0 — equivalently total_lines == 0 with
  // include_inactive. That is the one number, and it is the strict form: it also survives somebody
  // moving a released card back to draft.
  int32 total_lines = 3;
  // What the scope deferred, ALWAYS priced even when the rows themselves are withheld. A filter
  // nobody can see is a report that lies by omission, and this one is read as a release gate; with
  // include_inactive this is empty and the totals above cover everything.
  repeated FabricDirectionGapExclusion excluded = 4;
  int32 excluded_cards = 5;
  int32 excluded_lines = 6;
}

// FabricDirectionGapExclusion is one reason rows were withheld, with its cost in cards and lines.
message FabricDirectionGapExclusion {
  common.TechCardApprovalState approval_state = 1;
  int32 cards = 2;
  int32 lines = 3;
}

// FabricDirectionGapCard is one tech card carrying unset cloth lines, with the facts an owner
// triages by. Cards carrying ANY bound раскладка come first (see linked_marker_count for why that
// and not blocked_marker_count); ties keep tech_card_id order, so working the list over days never
// reshuffles it under the operator.
message FabricDirectionGapCard {
  int32 tech_card_id = 1;
  string style_number = 2;
  string name = 3;
  common.TechCardStage stage = 4;
  common.TechCardApprovalState approval_state = 5;
  // marker_save_possible is false for a RELEASED card: every marker write on one is refused outright
  // before направление is consulted, so today its unset lines cannot refuse anything. It says
  // «right now», not «ever» — moving the card back to draft makes it mutable with the same unset
  // lines, which is exactly why released is DEFERRED and counted rather than dismissed.
  bool marker_save_possible = 6;
  // blocked_marker_count — the sum of the per-line counts below. NOT a count of refusals: see
  // FabricDirectionGapLine.blocked_marker_count. Informational; it decides nothing about the order.
  int32 blocked_marker_count = 7;
  // linked_marker_count — КАРТОЧНЫЕ раскладки bound to any BOM line of this card, i.e. every marker
  // a gap on THIS card could possibly refuse (a scope is built out of the card's own lines, and an
  // unlinked раскладка has no cloth at all).
  //
  // КАРТОЧНЫЕ — часть определения, а не оговорка (Ф4, решение Р6). С Ф4.2 у раскладки есть владелец,
  // и раскройные (`run_id IS NOT NULL`) в это число НЕ входят: отчёт — рабочий список кампании по
  // КАРТОЧКАМ, а прогонные однодневки умирают вместе со своим прогоном и раздували бы «радиус
  // поражения» строками, которые исчезнут сами. Направление они при этом берут с тех же строк BOM,
  // которые отчёт уже покрывает через карточку, — то есть работы не добавляют.
  //
  // Следствие для КЛИЕНТА, и оно обязательное: экран, печатающий это число, обязан сказать
  // «карточных». Без этого слова число прочтут как полное, и цех недосчитается ровно тех раскладок,
  // которые сейчас лежат в открытых прогонах.
  //
  // Over-inclusive внутри карточных и deliberately so: it is the only count here
  // with no false negatives, which is why the urgent tier is drawn on it. blocked_marker_count
  // cannot do that job — it misses the case where an unset line and an ANSWERED line share a
  // назначение and only the answered one carries markers, and those markers are refused through the
  // sibling. Re-deriving назначение here to catch that would be the marker rule restated, free to
  // disagree with itself; over-approximating with a sound count is the cheaper honest answer.
  int32 linked_marker_count = 8;
  bool has_patterns = 9; // the card has DXF sheets, so it can be nested — a раскладка is imminent
  repeated FabricDirectionGapLine lines = 10; // in BOM-tab order (display_order, id)
}

// FabricDirectionGapLine is one cloth line still waiting for an answer.
message FabricDirectionGapLine {
  int64 bom_item_id = 1;
  string line_key = 2; // stable wire identity of the row on the BOM tab
  // name resolves through the catalogue exactly as the BOM tab resolves it — a material-linked line
  // legitimately carries an empty name of its own, and printing the stored column alone would show
  // an operator a ULID where the screen says «ВЕЛЬВЕТ ИЗ КАТАЛОГА». Empty only when the line has
  // neither its own name nor a linked article; use line_key then.
  string name = 3;
  common.TechCardBomSection section = 4;
  common.TechCardBomPurpose purpose = 5; // UNSET = the line has not been sorted yet (0265)
  // is_sample marks семпловая ярдажа. Kept in the worklist rather than filtered out: the marker
  // rule asks the direction of sample cloth for SAMPLE раскладки, so dropping these rows would let
  // the report read «done» while a sample раскладка still refuses to save.
  bool is_sample = 6;
  // blocked_marker_count — раскладки bound to THIS line: the population the rule will judge on this
  // row, and an UPPER bound on what it refuses, never a count of refusals. The rule lets a layout
  // through before it ever asks about the cloth when that layout carries neither a 180° nor a
  // mirror — nothing upside down means no direction can change the verdict — so a marker counted
  // here may well keep saving. Telling the two apart needs the layout blob, which the store does not
  // parse by design (0257), so the report reports what it can actually see and says which it is.
  int32 blocked_marker_count = 7;
}

// Tech-card release snapshots (task 11).
message ListTechCardReleasesRequest {
  int32 tech_card_id = 1;
}

message ListTechCardReleasesResponse {
  repeated common.TechCardReleaseMeta releases = 1; // newest-first, metadata only
}

message GetTechCardReleaseRequest {
  int32 id = 1; // tech_card_release.id
}

message GetTechCardReleaseResponse {
  common.TechCardReleaseMeta release = 1;
  // snapshot is the frozen contract TechCard parsed from the stored blob. Absent (with
  // snapshot_error set) when the stored blob is incompatible — the call still returns the
  // metadata rather than failing (hero-v2 degradation rule).
  common.TechCard snapshot = 2;
  string snapshot_error = 3;
}

// Development cost journal (task 14).
message AddTechCardDevExpenseRequest {
  common.TechCardDevExpenseInsert expense = 1;
}

message AddTechCardDevExpenseResponse {
  common.TechCardDevExpense expense = 1; // the stored row, incl. computed amount_base
}

message DeleteTechCardDevExpenseRequest {
  int32 id = 1;
}

message DeleteTechCardDevExpenseResponse {}

message ListTechCardDevExpensesRequest {
  int32 tech_card_id = 1;
}

message ListTechCardDevExpensesResponse {
  repeated common.TechCardDevExpense expenses = 1; // newest-first
  common.TechCardDevCostSummary summary = 2; // computed roll-up (total, by-kind, amortized unit)
}

// Production runs (task 09).
message CreateProductionRunRequest {
  common.ProductionRunInsert run = 1;
}

message CreateProductionRunResponse {
  int32 id = 1;
}

message UpdateProductionRunRequest {
  int32 id = 1;
  common.ProductionRunInsert run = 2;
  // Optimistic-lock guard from GetProductionRun/list. PRESENCE, NOT MAGNITUDE (Ф6.5): SENDING the
  // field enforces the lock — including sending 0, which is what every run that has never been
  // saved reports. A mismatch means the run changed under the editor -> Aborted (reload and retry).
  //
  // The `>0 enforces / 0 opts out` contract this field used to carry (0120:9-10) was a hole, not a
  // setting: a fresh run is born at lock_version 0, so the FIRST save of EVERY run — the one two
  // tabs opened from the same list are most likely to collide on — went through unguarded, and the
  // second writer silently clobbered the first.
  //
  // OMITTING the field is the LEGACY last-write-wins path, kept so a pre-Ф6.5 caller is not broken
  // silently. It can be removed once no client omits it — see entity.NoLockVersion for the exact
  // retirement condition. Today's admin client already sends the version it read on every run
  // write, so it gains the guard with no client change at all.
  optional int32 expected_lock_version = 3;
}

message UpdateProductionRunResponse {}

message DeleteProductionRunRequest {
  int32 id = 1;
}

message DeleteProductionRunResponse {}

message GetProductionRunRequest {
  int32 id = 1;
}

message GetProductionRunResponse {
  common.ProductionRun run = 1;
  // Output-only токен-капабилити ('r' scope) публичного НАРЯДА НА ПАРТИЮ: печать зашивает в QR
  // {origin админки}/rp/{token}, а страница резолвит его через GET /api/rp/{token} этого бэкенда.
  // Живёт на ОТВЕТЕ, а не на common.ProductionRun, по той же причине, что и pattern_viewer_token на
  // ответе карточки: common.* сообщения ложатся в сохраняемые снапшоты, а токену доступа в
  // сохранённом снапшоте не место. Никогда не персистится; пусто, когда сервис наряда не подключён.
  string run_pack_token = 2;
}

message ListProductionRunsRequest {
  int32 tech_card_id = 1; // 0 = all cards
  string status = 2; // empty = all statuses
  int32 limit = 3;
  int32 offset = 4;
  // >0: return only "stale" runs — still open (planned/in_progress) and created more than N days ago
  // (the same rule as the stale_open_production_run dashboard alert). Server-side so the attention
  // filter/strip does not client-scan the two status pages (#10). 0 = no staleness filter.
  int32 stale_days = 5;
  // true: return only OVERDUE runs — still open (planned/in_progress) with a promised_at that has
  // already passed. Server-side so the production cockpit's «опаздывает» filter does not page the
  // whole list to count. Runs with no promised_at are never overdue. Combined with an explicit
  // status filter it just intersects (e.g. status=received + overdue_only yields nothing).
  bool overdue_only = 6;
}

message ListProductionRunsResponse {
  repeated common.ProductionRun runs = 1;
  int32 total = 2; // total matching runs, ignoring pagination
}

message ReceiveProductionRunRequest {
  int32 run_id = 1;
  // NF-06: the run is multi-colourway, so receive no longer takes a product_id — every line's
  // received_qty is booked into that line's own product. Each product must be linked to the run's
  // tech card, and at least one line must carry a received quantity.
  //
  // AUXILIARY runs (NF-07/B-3): when the run's tech card has purpose=auxiliary this same RPC
  // receives the output into the MATERIAL warehouse instead of product stock. Lines must NOT carry
  // a product_id (rejected with InvalidArgument — not ignored); Σ received_qty is booked into the
  // card's output_material_id as one receipt_production movement whose unit cost is the run's
  // actual per-unit base cost (manual cost articles + materials-from-stock, net of returns) — it
  // moves that material's moving average, or books uncosted when the actuals are incomplete. A
  // card without output_material_id fails with FailedPrecondition. update_cost_price is a no-op
  // for auxiliary runs (cost_price_updated is always false — there is no product).
  bool update_cost_price = 3; // also set every received product's cost_price from the run's actual unit cost
  reserved 2; // was product_id (single-product receive; replaced by per-line products)
}

message ReceiveProductionRunResponse {
  bool cost_price_updated = 1; // true when update_cost_price was requested and applied
}

// PostProductionRunReceiptLineInput is one counted line of the receipt command, addressed by the
// plan line's stable line_key (never by (product, size) — the whole point of 0230). good_qty is
// what gets POSTED TO STOCK; defect_qty is a disjoint count that is recorded, never stocked.
message PostProductionRunReceiptLineInput {
  string line_key = 1; // required; must name an existing plan line of the run
  int32 good_qty = 2; // >= 0
  int32 defect_qty = 3; // >= 0
  // Where this line's defect units go (Phase 7): "scrap" (default when empty — recorded fact, no
  // stock; cost resolved by the posting rule) or "seconds" (booked into the product's B-grade
  // variant stock at zero carried cost; needs a published product+size on the line).
  string defect_disposition = 4;
}

message PostProductionRunReceiptRequest {
  int32 run_id = 1;
  repeated PostProductionRunReceiptLineInput lines = 2;
  // Client-minted command identity: exactly 26 characters of [0-9A-Z] (an uppercase Crockford ULID
  // fits), minted once per user intent (per modal open, NOT per attempt) so a network retry replays
  // instead of double-booking.
  string idempotency_key = 3;
  // The lock_version the operator counted against (from the run read). Stale → Aborted: someone
  // edited the run between the count and the post. PRESENCE, NOT MAGNITUDE (Ф6.5) — sending 0 is a
  // real expectation (a run counted straight after creation reports 0), and only OMITTING the field
  // opts out (the deprecated ReceiveProductionRun shim, which never saw a client version).
  optional int32 expected_lock_version = 4;
  string note = 5; // optional free note stored on the receipt
  // Seed every received product's cost_price from the frozen actual unit cost (costing:write).
  bool update_cost_price = 6;
  // Phase 5: true books THIS delivery's counts without declaring the run complete — the run moves
  // to PARTIALLY_RECEIVED and further receipts stay possible. False (the default, and what every
  // pre-Phase-5 client sends implicitly) is a FINAL receipt: it declares the run complete and
  // flips it to RECEIVED. The flag is part of the idempotency request hash — the same key with a
  // flipped flag is a different intent and is rejected, never replayed.
  bool partial = 7;
  // Storefront side effect (stock-write contract): when true, customers waitlisted on a variant
  // this receipt takes 0→in-stock get the back-in-stock email — the same notification the manual
  // stock update fires. Operator-chosen per receipt (modal checkbox); the default false sends
  // nothing. ISR page revalidation fires regardless of this flag.
  //
  // DELIBERATELY NOT part of the idempotency request hash (unlike `partial`): pre-flag clients'
  // in-flight retries must keep replaying across the deploy, and the flag changes a side effect,
  // not the booked stock. The CLIENT therefore mints a FRESH idempotency key whenever the
  // checkbox changes — flipping it is a new intent carried by a new key, never a same-key
  // resubmission (which would replay the original receipt and silently send nothing).
  // Notifications fire only on the ORIGINAL execution, never on a replay.
  bool notify_waitlist = 8;
}

message PostProductionRunReceiptResponse {
  int32 receipt_id = 1;
  bool cost_price_updated = 2;
  // true when this response was replayed from the idempotency record (the command had already
  // executed) rather than executed now.
  bool replayed = 3;
  common.ProductionRun run = 4; // the run after the receipt (fresh read; costing-stripped per RBAC)
}

message ReverseProductionRunReceiptRequest {
  int32 run_id = 1;
  int32 receipt_id = 2; // must be a receipt of run_id
  // Required, non-empty. Stored on the reversal row (note), every stock-journal decrement
  // (comment) and the production_run_event.
  string reason = 3;
  // The lock_version the operator saw on the run. Stale → Aborted (reload and retry). PRESENCE, NOT
  // MAGNITUDE (Ф6.5) — see PostProductionRunReceiptRequest; omitting it is the legacy opt-out.
  optional int32 expected_lock_version = 4;
}

message ReverseProductionRunReceiptResponse {
  // The reversal row linked to the reversed receipt (reversal_of/reversed_by pair in the
  // receipt history).
  int32 reversal_receipt_id = 1;
  common.ProductionRun run = 2; // the run after the reversal (fresh read; costing-stripped per RBAC)
}

message GetProductionRunMaterialPlanRequest {
  int32 run_id = 1;
}

// MaterialPlanRow is the estimated requirement of one catalog material for a run, against stock.
message MaterialPlanRow {
  int32 material_id = 1;
  string material_name = 2;
  string unit = 3;
  google.type.Decimal required = 4; // Σ over lines: norm(colourway,size) × planned_qty × gross-up (see required_before_grossup)
  google.type.Decimal on_hand = 5; // material_stock.on_hand (NF-01)
  google.type.Decimal issued = 6; // net already issued to this run (issue_production − return_production)
  google.type.Decimal shortage = 7; // max(0, required − issued − on_hand)
  bool has_size_norms = 8; // false when some contributing norm was per-garment, not size-graded (rougher estimate)
  google.type.Decimal issued_variance = 9; // issued − required: >0 over-issued vs plan (scrap/overuse), <0 under-issued/leftover (gap-04). Meaningful after issuing/receive.
  // WHY `required` is bigger than the raw norm (Ф5а.2).
  //
  // required_before_grossup is Σ(norm × planned_qty) with NO gross-up of any kind applied — no BOM
  // wastage %, no cutting coefficient — converted into the same unit as `required`. It is the
  // "before" number of the before → after pair, and it is honest for every row: a manual row, a
  // marker row, a counted trim, a row with no coefficient at all.
  //
  // The ONE invariant that always holds is required >= required_before_grossup. The factor between
  // them is whatever gross-up each contributing line took — and since W3 a MEASURED line can take
  // TWO multipliers, not one, because they have different bases:
  //
  //     расход = ГЕОМЕТРИЯ(набор деталей, ширина, настил) × РЕАЛЬНОСТЬ_РУЛОНА(артикул)
  //
  //   * ГЕОМЕТРИЯ — the BOM line's wastage % (or the run's actual wastage %, which REPLACES it):
  //     inter-piece waste + lay ends, over a netto base. A MARKER-sourced norm never takes it — the
  //     measured length already contains it. A requirement computed from LAYS never takes it either,
  //     for the same reason: a lay is that measurement.
  //   * РЕАЛЬНОСТЬ РУЛОНА — the article's cutting_coefficient: усадка, обход пороков, сращивание,
  //     оттеночные полосы. Applied to EVERY measured roll-goods contribution regardless of how the
  //     requirement was computed — marker, manual, dxf and LAYS alike — because none of them can
  //     contain it. On the lay path it multiplies the requirement AFTER the geometry, never inside
  //     it: the lay geometry is the denominator that calibrates this very coefficient.
  //   * counted trim (4 buttons stay 4 buttons) → nothing at all.
  //   * a non-roll-goods slot → the percent only; a roll's shrinkage means nothing on thread.
  //
  // So required = required_before_grossup × cutting_coefficient holds only where the percent did not
  // also bite (a marker norm, or a lay). Do NOT derive the coefficient from the two numbers — read
  // it from cutting_coefficient.
  //
  // cutting_coefficient is the ARTICLE's coefficient, reported whenever the article has one even if
  // this run's contributions did not let it bite (counted quantities, non-roll-goods slots — a
  // caveat then says which). IT IS NO LONGER DEMAND-ONLY: since W3 the same coefficient multiplies
  // the MONEY of the norm too — the run's planned unit cost, the style cost estimate and
  // product.cost_price all contain it. Purchasing and costing therefore stand on the same
  // multipliers, which is the whole point of the change.
  google.type.Decimal required_before_grossup = 10;
  google.type.Decimal cutting_coefficient = 11;
  // Vocabulary normalisation of `unit` (Ф5а.3). UNKNOWN = the row's unit is free text this
  // server does not know, and quantities under it must not be added to anything else's.
  common.MaterialUnit unit_code = 12;
  // Откуда взято `required` ЭТОЙ строки (Ф4.6). MIXED = артикул собрал слоты с настилами и без них,
  // и тогда ни cutting_coefficient, ни отход не описывают строку целиком — читать надо вклады.
  // NOTE: на пути LAYS не применяется ПРОЦЕНТ раскроя — настил это измерение (длина × слои +
  // концевые потери), и выпады уже внутри него. КОЭФФИЦИЕНТ применяется и там (W3): усадка, пороки и
  // сращивание случаются с полотном независимо от того, чем посчитали требование. Он умножает
  // требование ПОСЛЕ геометрии — сама геометрия обязана остаться чистой, потому что она знаменатель
  // калибровки этого же коэффициента.
  ProductionRunCoverageSource source = 13;
}

// MaterialPlanContribution is one slot × colourway share of the plan — the factory-spec breakdown
// of a rollup row's `required`. Stock figures (on_hand / issued / shortage) live ONLY on the
// material-keyed rows above: two contributions resolving to the same article share ONE pile of
// stock, so repeating stock here would double-count it.
message MaterialPlanContribution {
  int64 bom_item_id = 1; // the slot (BOM line)
  string slot_name = 2; // the role: «основная молния»
  common.TechCardBomSection section = 3;
  int32 colorway_id = 4; // product id of the colourway
  string colorway_name = 5;
  int32 material_id = 6; // resolved article: the colourway's pin, else the slot default
  string material_name = 7;
  bool pinned = 8; // true = the colourway pinned this article; false = inherited slot default
  string unit = 9; // the slot's spec unit (rollup rows may convert to the stock unit)
  google.type.Decimal required = 10; // in `unit`; gross-ups applied to measured norms only
  bool has_size_norms = 11;
  // Same decomposition as on the rollup row, per slot × colourway: Σ(norm × planned_qty) with NO
  // gross-up applied (neither wastage % nor coefficient), and the article's cutting coefficient when
  // it has one (unset = it has none). required >= required_before_grossup always; the two are
  // related BY the coefficient alone only where the percent did not also bite (a marker norm, or a
  // lay) — the two-multiplier model is stated in full on MaterialPlanRow.
  google.type.Decimal required_before_grossup = 12;
  google.type.Decimal cutting_coefficient = 13;
  // Ф4.6. ВСЕГДА ЧИСТЫЙ (NORM или LAYS, никогда MIXED): вклад — это ОДИН слот одного колорвея, и
  // источник у него один по построению. MIXED появляется только на строке артикула выше.
  ProductionRunCoverageSource source = 14;
  // Разложение настильной потребности, ноль у NORM. Названы порознь, потому что это два разных
  // физических факта: ткань под лекалами и ткань, потерянная на концах каждого слоя.
  google.type.Decimal lay_cloth_length_cm = 15; // Σ(длина маркера × слои)
  google.type.Decimal lay_end_loss_cm = 16; // 2 × end_loss_cm × Σ слоёв
}

// MaterialPlanBlocker is a slot × colourway the plan could NOT count — a missing article (no pin,
// no slot default) or a colourway with no norm for the slot. A separate list, not a sentinel row:
// it has no material_id to key stock or an issue action on.
message MaterialPlanBlocker {
  int64 bom_item_id = 1;
  string slot_name = 2;
  int32 colorway_id = 3;
  string colorway_name = 4;
  int32 planned_qty = 5; // garments whose need for this slot is NOT in the plan
  string reason = 6; // human-readable: "no article (no pin, no slot default)" / "no consumption norm"
  // STABLE MACHINE KEY for the same cause: `no_article` | `no_norm`. `reason` above stays a human
  // sentence and is rewritten freely — a client that branched on its text would break on a typo fix.
  // The readiness gate (Ф6) computes these two facts from THIS list rather than recomputing them,
  // so the key is what keeps one fact from acquiring a second definition.
  string key = 7;
}

message GetProductionRunMaterialPlanResponse {
  repeated MaterialPlanRow rows = 1;
  repeated string caveats = 2; // BOM lines without material_id, colourways without norms, lines without a product
  repeated MaterialPlanContribution contributions = 3; // slot × colourway breakdown of rows' required
  repeated MaterialPlanBlocker blockers = 4; // slot × colourway the plan could not count
  // Ответ прогона целиком (Ф4.6): NORM пока ни одного настила нет, LAYS когда настилы закрыли все
  // считаемые слоты, MIXED посередине. Клиент пишет этим заголовок таблицы, и ошибиться в нём ему
  // нельзя — поэтому это поле, а не вывод из содержимого строк.
  ProductionRunCoverageSource plan_source = 5;
}

// КАТ-ЛИСТ ПАРТИИ (наряд на прогон). «Сколько каких деталей и из чего выкроить ИМЕННО в этой
// партии» — то, чем стиль отвечать не может и не должен: количество живёт на прогоне.
//
// Считается на СЕРВЕРЕ, хотя админка держит все исходные данные в руках и посчитала бы сама. Причина
// не в удобстве: этот же ответ уезжает в публичный манифест наряда (/api/rp/{token}), который швея
// открывает по QR без всякого JWT и без генерённого клиента. Посчитай его на клиенте — и «сколько
// выкроить» будет существовать в двух реализациях, которые обязаны совпадать и не совпадут. Ровно
// от такой пары («сколько нужно ткани» на карточке против материального плана прогона) этот наряд и
// избавляет цех, так что заводить вторую пару этажом ниже было бы смешно.
//
// ДЕНЕГ ЗДЕСЬ НЕТ НИ В КАКОМ ВИДЕ и не должно появиться: ответ по построению уходит на бумагу в цех
// и в публичный манифест, где RBAC-стрип костинга неоткуда взять. Нужна цена — есть материальный
// план и актуалы прогона, оба за costing:read.
message GetProductionRunCutPlanRequest {
  int32 run_id = 1;
}

// CutPlanSizeQty — сколько изделий этого размера в партии и сколько панелей детали это даёт.
// garments — planned_qty клетки линии прогона, НЕ типовой тираж карты.
message CutPlanSizeQty {
  int32 size_id = 1; // 0 = безразмерная линия (aux-прогон)
  string size_name = 2;
  int32 garments = 3; // ProductionRunLine.planned_qty этой клетки
  int32 pieces_to_cut = 4; // garments × pieces_per_garment
}

// CutPlanRow — одна ДЕТАЛЬ одного КОЛОРВЕЯ: её спецификация из карты, из какого артикула её кроят
// в этом колорвее, и количества по размерам партии.
//
// pieces_to_cut = pieces_per_garment × garments. И БОЛЬШЕ НИЧЕГО: cut_symmetry ничего не умножает
// (0266 свернул удвоение в само количество, 0275 вернул только КЛАССИФИКАЦИЮ). Она едет сюда, чтобы
// закройщик прочитал словами, как связаны эти панели — «зеркальная пара», «по сгибу», — а не чтобы
// кто-то умножил на два во второй раз. Следующий, кто захочет здесь удвоить, должен сначала
// объяснить, почему тех-пак печатает pieces_per_garment.
message CutPlanRow {
  int32 piece_id = 1; // FK tech_card_piece(id)
  string piece_line_key = 2; // устойчивая идентичность детали (ULID), для сверки с картой
  string piece_name = 3;
  int32 colorway_id = 4; // product id колорвея; 0 = линия без продукта (планирование / aux)
  string colorway_name = 5;
  int32 output_variant_id = 6; // AUX-цвет линии (TechCardOutputVariant.id); 0 = продаваемая линия
  string output_variant_name = 7;

  // Спецификация детали — как в карте, слово в слово. Дублируется в каждой строке колорвея
  // намеренно: наряд печатают и режут по строкам, и деталь без долевой в своей строке — это деталь,
  // которую раскроят неправильно, даже если та же долевая написана строкой выше у другого цвета.
  int32 pieces_per_garment = 8;
  common.TechCardPieceCutSymmetry cut_symmetry = 9; // UNKNOWN = «не размечено», это НЕ «обычная»
  string grainline = 10; // долевая: lengthwise|crosswise|bias|any
  bool fused = 11; // деталь дублируется клеевой

  // ИЗ ЧЕГО КРОИТЬ. Слот — роль в BOM («основная ткань»), артикул — то, что этот колорвей реально
  // кладёт на настил: пин рецепта (usage.material_id), иначе дефолт слота. pinned различает эти два
  // случая: одинаковое имя роли у трёх колорвеев стирает ровно ту разницу, ради которой закройщик
  // и смотрит в наряд.
  int64 bom_item_id = 12;
  string slot_name = 13;
  common.TechCardBomSection section = 14;
  int32 material_id = 15;
  string material_name = 16;
  bool pinned = 17; // true = артикул пришпилен рецептом колорвея; false = унаследован от слота
  int64 fusing_bom_item_id = 18; // клеевая, если деталь дублируется; 0 = нет
  string fusing_material_name = 19;
  // КАК ИМЕННО дублировать — по тому же доводу, по которому в строке дублируется вся остальная
  // спецификация детали: наряд ПЕЧАТАЮТ и РЕЖУТ по строкам. Голое «fused» у детали, которая
  // дублируется полосой 25 мм, — это указание выкроить клеевую по всему лекалу, то есть в разы
  // больше материала, чем заложено в норму. UNKNOWN = «не размечено», и это НЕ «целиком».
  common.TechCardPieceFusingMode fusing_mode = 25;
  google.type.Decimal fusing_width_mm = 26; // ширина полосы, мм; значима только при STRIP

  repeated CutPlanSizeQty by_size = 20; // размеры партии, в порядке градации
  int32 garments_total = 21; // Σ by_size.garments
  int32 pieces_to_cut_total = 22; // Σ by_size.pieces_to_cut

  // ОТКУДА ВЗЯЛСЯ СЛОТ. Рецепт колорвея привязывает расход к детали ЧЕРЕЗ usage.piece_id, но поле
  // необязательное и на живых картах чаще пустое, чем полное. Требовать его — значит выдать цеху
  // наряд из одних блокеров; молча подставить единственную рулонную ткань колорвея и не сказать об
  // этом — значит напечатать догадку шрифтом факта.
  //
  // Поэтому третий вариант: подставить, когда подставлять безопасно (у колорвея РОВНО один рулонный
  // слот), и пометить строку. true = «рецепт эту деталь не называет, взят единственный рулонный слот
  // колорвея». Двусмысленный случай (слотов несколько, привязки нет) сюда не попадает вовсе — он
  // уходит в blockers.
  bool slot_inferred = 23;
}

// CutPlanBlocker — деталь × колорвей, которую наряд НЕ смог привязать к артикулу. Отдельным
// списком, а не строкой с пустой тканью: строка с прочерком читается как «кроить не из чего» и
// теряется среди сорока таких же, а это единственное место наряда, где цех обязан остановиться и
// спросить. reason — человеческая фраза, не код.
message CutPlanBlocker {
  int32 piece_id = 1;
  string piece_name = 2;
  int32 colorway_id = 3;
  string colorway_name = 4;
  int32 garments = 5; // изделий, чей крой этой детали не попал в наряд
  string reason = 6; // «рецепт колорвея не называет ткань для этой детали» / «в слоте нет артикула»
}

message GetProductionRunCutPlanResponse {
  repeated CutPlanRow rows = 1;
  repeated CutPlanBlocker blockers = 2;
  int32 garments_total = 3; // Σ planned_qty по линиям прогона
  int32 pieces_to_cut_total = 4; // Σ по строкам; НЕ сумма by_size одной строки
  // Карта, по которой посчитан наряд: релиз (замороженная спецификация), к которому привязан
  // прогон, иначе живая карта. Цех обязан видеть, по какой ревизии кроит, поэтому это поле ответа,
  // а не то, что клиент выведет из наличия release_id.
  int32 release_id = 5; // 0 = считано по живой карте
  int32 release_number = 6; // «Rev.N», который читает фабрика; 0 = живая карта
  repeated string caveats = 7; // линии без продукта, деталей в карте нет, размер вне градации карты
  // ЧЕМ БУМАГА ОТЛИЧАЕТСЯ ОТ ЭКРАНА. Наряд живой: количества берутся из прогона, а прогон правят.
  // Замораживать документ отдельной сущностью мы не стали — вместо этого он НАЗЫВАЕТ свою ревизию,
  // и её же несёт QR (?v=). Вьюер сравнивает напечатанное с текущим и говорит «план изменился после
  // печати» вместо того, чтобы молча показать другие числа тому, кто уже режет по бумаге.
  int32 run_lock_version = 8; // ProductionRun.lock_version на момент расчёта
  google.protobuf.Timestamp generated_at = 9;
}

// НАСТИЛЫ ПРОГОНА (Ф4) — запросы и ответы. Тела настилов живут в common/production.proto: настил
// описывает производственный факт, а не форму одного ответа админского сервиса.

message SaveProductionRunLayRequest {
  int32 run_id = 1;
  common.ProductionRunLayInsert lay = 2;
  // PRESENCE, А НЕ ВЕЛИЧИНА. Сегодняшний прогон обходит блокировку при expected_lock_version = 0
  // (productionrun.go:219-221, контракт назван в 0120:9-10), и это дефект, а не настройка.
  // Повторять его на новом объекте нельзя: отсутствие поля на СУЩЕСТВУЮЩЕМ настиле — отказ, а не
  // last-write-wins. На создании (пустой lay_key) поле не читается вовсе.
  optional int32 expected_lock_version = 3;
  // Явное «я проверил, количества по-прежнему покрыты» — единственный способ снять бейдж
  // устаревания, не меняя секций. Без него правка примечания молча обновляла бы снимок и отмывала
  // бы сигнал.
  bool reaffirm_quantities = 4;
}

message SaveProductionRunLayResponse {
  common.ProductionRunLay lay = 1;
}

message DeleteProductionRunLayRequest {
  int32 run_id = 1;
  string lay_key = 2;
}

message DeleteProductionRunLayResponse {}

message ListProductionRunLaysRequest {
  int32 run_id = 1;
}

message ListProductionRunLaysResponse {
  // false у aux-карточки: ни колорвеев, ни деталей, ни раскладок — плана настилов там не бывает
  // (05:104-108). Отдаётся ЯВНО, а не пустым списком: пустой список читается как «настилов пока
  // нет», то есть как приглашение их построить.
  bool applicable = 1;
  string not_applicable_reason = 2;
  repeated common.ProductionRunLay lays = 3;
  repeated common.ProductionRunLayCoverageCell coverage = 4;
  repeated common.ProductionRunLayPieceYield piece_yields = 5;
  // Раскройные маркеры ЭТОГО прогона. Едут здесь, потому что отдельного List-RPC у маркеров нет
  // (сводки ездят на GetTechCard), а карточный список их теперь не показывает — иначе редактор
  // не смог бы предложить ни одного маркера.
  repeated common.TechCardMarkerSummary run_markers = 6;
  int32 unknown_count = 7; // сколько проверок НЕ СМОГЛИ ответить; ноль ≠ «всё проверено»
  repeated string caveats = 8;
}

// ПРИЁМКА КРОЯ (Ф5б.5) — запросы и ответы. Тела строк живут в common/production.proto вместе с
// настилами, чьими детьми они являются: приёмка описывает производственный факт, а не форму одного
// ответа админского сервиса.

message SaveProductionRunCutReceiptRequest {
  int32 run_id = 1;
  string lay_key = 2;
  common.ProductionRunCutReceiptInsert receipt = 3;
}

message SaveProductionRunCutReceiptResponse {
  common.ProductionRunCutReceipt receipt = 1;
}

message DeleteProductionRunCutReceiptRequest {
  int32 run_id = 1;
  string lay_key = 2;
  int32 size_id = 3;
}

message DeleteProductionRunCutReceiptResponse {}

message ListProductionRunCutReceiptsRequest {
  int32 run_id = 1;
}

message ListProductionRunCutReceiptsResponse {
  repeated common.ProductionRunCutReceipt receipts = 1;
}

// РЕЖИМ ГОТОВНОСТИ ПРОГОНА (Ф6) — the gate that judges a run that does not exist yet.

// ProductionRunReadinessCell is one cell of the planned grid. It deliberately repeats the key of
// production_run_line (product × size), because that IS the run about to be written: the gate judges
// what will be recorded, not a paraphrase of it.
message ProductionRunReadinessCell {
  int32 colorway_id = 1; // the colourway's product id; 0 = a colourless line (aux / legacy)
  int32 size_id = 2;
  int32 planned_qty = 3;
}

message CheckProductionRunReadinessRequest {
  int32 tech_card_id = 1;
  // 0 = «planning against the LIVE card». A legal value (production_run.release_id is NULLable) and
  // it does NOT become an error — see the release_frozen key.
  int32 release_id = 2;
  // The colourways being asked about. NOT derived from `cells`: the modal has to be able to show a
  // verdict for a colourway whose quantities have not been typed yet, or there is nothing to grey
  // its checkbox out with.
  repeated int32 colorway_ids = 3;
  repeated ProductionRunReadinessCell cells = 4;
  // Re-checking an EXISTING run (detail page badges). 0 = a future run. It does not change any rule;
  // it changes where actual_wastage_percent comes from for the metreage.
  //
  // Ф4 ADDS A SECOND MEANING TO THE SAME FIELD, and deliberately does NOT add a second field for it.
  // The Ф4 spec (§3.5) asked for an `optional production_run_id` because it was written against a
  // gate request that named no run at all; Ф6 landed first and this field is that identifier. A
  // second one would be two names for one fact, which is the exact duplication the phase's own
  // decisions forbid.
  //
  // Present (the run detail page) ⇒ coverage for those (colourway, slot) pairs that HAVE lays is
  // computed FROM the lays, and their source reads LAYS; absent (the creation modal, where no run
  // exists yet) ⇒ coverage stays NORM, exactly as today. Creation therefore never consumes lays: the
  // Ф4→Ф6 edge stays false, and the gate's behaviour on create is unchanged.
  //
  // A plain int32 is honest here, unlike expected_lock_version: 0 is not a legal run id, so absence
  // and value cannot be confused. Presence-vs-magnitude only matters where zero is a real value.
  int32 run_id = 5;
}

// The degree of one check. FOUR, not a bool, and the load-bearing one is UNKNOWN.
//
// UNKNOWN is «THE SERVER HAS NO INSTRUMENT TO ANSWER», not «the data is bad». It NEVER blocks, in
// any mode, and it is NEVER counted as passed. Blocking on it would punish the operator for a phase
// we have not built; folding it into OK would silently not perform a check we promised — the exact
// mistake Ф1 refused when it declined to read a NULL fabric direction as a value
// (internal/entity/fabric_direction.go: «NULL IS NOT A FOURTH VALUE»).
//
// The boundary between UNKNOWN and BLOCKER: «the conditions the marker was measured under were
// never recorded» is an ANSWER (fitness under the «not worse than» rule cannot be established, so
// the norm is not fit) and is therefore a BLOCKER. «There is no size index» is the ABSENCE OF AN
// INSTRUMENT and is therefore UNKNOWN.
enum ProductionRunReadinessSeverity {
  PRODUCTION_RUN_READINESS_SEVERITY_UNSPECIFIED = 0;
  PRODUCTION_RUN_READINESS_SEVERITY_OK = 1;
  PRODUCTION_RUN_READINESS_SEVERITY_UNKNOWN = 2;
  PRODUCTION_RUN_READINESS_SEVERITY_WARNING = 3;
  PRODUCTION_RUN_READINESS_SEVERITY_BLOCKER = 4;
}

// Where to go to fix it. THE CLIENT CHOOSES THE TAB, from `key`, with the same machinery as
// RELEASE_BLOCKER_TAB / REQ_TAB and for the same reason: a tab name is one admin's navigation, not a
// fact about the data. The server hands over IDENTIFIERS ONLY, so the client has something to build
// a URL out of. An empty/zero field means «this check is not about that kind of object».
message ProductionRunReadinessTarget {
  int32 tech_card_id = 1;
  int32 colorway_id = 2;
  string bom_line_key = 3; // the BOM line's stable wire identity (0159/0260)
  int64 bom_item_id = 4;
  int32 marker_id = 5;
  int64 material_id = 6;
  int32 size_id = 7;
}

// One check of the gate.
//
// `key` is STABLE WIRE VOCABULARY and is what a client branches on (see the stability rules on
// CheckProductionRunReadinessResponse). `label`/`detail` are human text, rewritten freely, and
// rewording them is NEVER a contract change.
message ProductionRunReadinessFinding {
  string key = 1;
  ProductionRunReadinessSeverity severity = 2;
  string label = 3; // what was checked, in one sentence
  string detail = 4; // the actual state; EMPTY only on an OK row
  ProductionRunReadinessTarget target = 5;
}

message ProductionRunReadinessColorway {
  int32 colorway_id = 1;
  string colorway_name = 2;
  bool ready = 3; // no BLOCKER on this colourway — THIS is what greys the modal's checkbox
  repeated ProductionRunReadinessFinding findings = 4;
}

// Where the coverage figure came from. Always NORM today. Ф4.6 switches the requirement from the
// norm to the lays, and this field exists precisely so that switch is VISIBLE rather than guessed at
// from the magnitude of the number.
enum ProductionRunCoverageSource {
  PRODUCTION_RUN_COVERAGE_SOURCE_UNSPECIFIED = 0;
  PRODUCTION_RUN_COVERAGE_SOURCE_NORM = 1; // quantities × norm
  PRODUCTION_RUN_COVERAGE_SOURCE_LAYS = 2; // Ф4: length × plies + end losses
  // Ф4.6. A row keyed by ARTICLE may collect BOTH: one slot is covered by lays, another is not yet,
  // and the two share an article. Silently picking one of the two sources would lie in the very
  // signature the field exists to carry. A CONTRIBUTION is never MIXED — a contribution is one slot.
  PRODUCTION_RUN_COVERAGE_SOURCE_MIXED = 3;
}

// Coverage BY THE NORM, per (colourway, article) pair. NOT a lay plan: lays are built after the run
// is created, on the detail page. The modal's heading is literally «оценка по норме».
message ProductionRunReadinessCoverage {
  int32 colorway_id = 1;
  int64 bom_item_id = 2;
  string slot_name = 3;
  int64 material_id = 4;
  string material_name = 5;
  string unit = 6;
  common.MaterialUnit unit_code = 7; // UNKNOWN = the unit is free text; quantities under it must not be added up
  google.type.Decimal required = 8;
  google.type.Decimal on_hand = 9;
  google.type.Decimal shortage = 10; // max(0, required − on_hand); NO reservations until Ф5б
  ProductionRunCoverageSource source = 11;
}

// Coverage ACROSS SIZES AND ACROSS CLOTHS (Ф4.5). A garment is not provisioned until ALL of its
// cloths are: 22 fronts and 20 linings are 20 garments.
message ProductionRunReadinessUnitCoverage {
  int32 colorway_id = 1;
  int32 size_id = 2;
  int32 planned_qty = 3;
  // Garments for which EVERY required slot has both an article and a norm for this size. Today this
  // is 0 or planned_qty (a binary fact about the recipe) rather than a fraction: fractions come from
  // the STOCK, and that is units_from_stock below.
  int32 provisioned_qty = 4;
  // Garments today's stock suffices for: min over slots of floor(on_hand / norm), capped at
  // planned_qty. An ESTIMATE, not a promise — see source.
  int32 units_from_stock = 5;
  ProductionRunCoverageSource source = 6;
  repeated int64 blocking_bom_item_ids = 7; // the slots that hold provisioned_qty below planned_qty
}

// The gate's answer.
//
// KEY STABILITY RULES (this is contract, not style):
//   * a key names the FACT that is missing — never the screen that fixes it, and never the sentence
//     we happen to describe it with;
//   * rewording label/detail is NEVER a contract change;
//   * two facts a client would route to two different places are ALWAYS two keys, even when the
//     sentence is the same (this is how colorway_linked and lab_dip live: one screen, two keys, and
//     the aux filter drops them separately);
//   * a key NEVER carries identifiers — those live in `target`;
//   * a key is never re-used for a different fact. A retired key simply stops being emitted and the
//     new fact gets a new key. A client that does not know a key MUST still render the row and route
//     it to the header tab — the same rule RELEASE_BLOCKER_TAB already states.
message CheckProductionRunReadinessResponse {
  bool ready = 1; // no BLOCKER anywhere
  bool blocking_enabled = 2; // the server's mode RIGHT NOW (workshop_settings.run_readiness_blocking)
  // What CreateProductionRun WILL DO with this request: true = refuse. Sent explicitly rather than
  // left to «!ready && blocking_enabled», because this is exactly the sentence the modal prints and
  // the client must not be able to get it wrong.
  bool would_block = 3;
  // How many checks COULD NOT ANSWER. Zero is NOT «everything was verified successfully» — it means
  // no check had to admit it lacked an instrument. Non-zero next to ready=true is the honest state
  // «nothing is known to be broken, and these things were not checked at all».
  int32 unknown_count = 4;
  repeated ProductionRunReadinessFinding card = 5;
  repeated ProductionRunReadinessColorway colorways = 6;
  repeated ProductionRunReadinessFinding run = 7;
  repeated ProductionRunReadinessCoverage coverage = 8;
  repeated ProductionRunReadinessUnitCoverage unit_coverage = 9;
  // The material plan's own irreducible caveats (unconvertible units and the like), passed through
  // VERBATIM: they are already written as sentences for a human, and restating them as keys would
  // give one fact a second definition.
  repeated string caveats = 10;
}

message PutTechCardPatternSizeIndexRequest {
  int32 tech_card_id = 1;
  // The fabric scope: the назначение (0265) when the card has been sorted, else the BOM line's
  // line_key — the same key entity.FabricScopeKey computes and the generated column
  // tech_card_piece_dxf_block.scope_key holds (0267).
  string scope_key = 2;
  // line_keys of the sheets the client actually parsed. The server checks them against ITS OWN
  // current membership of the scope and refuses a mismatch: an index computed over the wrong files
  // is worse than no index.
  repeated string sheet_line_keys = 3;
  // Normalised (letters/digits only, lowercase) size tokens. EMPTY is legal and means «no grading
  // was found in the files» — it is stored, and it reads back as NO VERDICT.
  repeated string size_tokens = 4;
}

message PutTechCardPatternSizeIndexResponse {
  string sheet_fingerprint = 1; // what the server recorded, for debugging
  int32 resolved_size_count = 2; // how many tokens landed on sizes of the card's range
}

message SaveTechCardPieceAreasRequest {
  int32 tech_card_id = 1;
  // The fabric scope: назначение (0265) when the card has been sorted, else the BOM line's line_key —
  // the same key entity.FabricScopeKey computes.
  string scope_key = 2;
  // line_keys of the sheets the client actually measured. Checked against the server's own current
  // membership of the scope; a mismatch in either direction is refused.
  repeated string sheet_line_keys = 3;
  // The WHOLE measured set of this scope. Empty is refused: a parse that found nothing is a failed
  // read, and storing it would turn it into a confident zero area — a free garment.
  repeated common.TechCardPieceArea areas = 4;
  // Conditions the areas were measured under. They are not decoration: the seam layer must be
  // inflated by the allowance and the cutting layer must not, and getting it wrong shifts the norm
  // by the allowance around every piece's whole perimeter.
  string contour_layer = 5;
  google.type.Decimal seam_allowance_mm = 6;
}

message SaveTechCardPieceAreasResponse {
  string sheet_fingerprint = 1; // what the server recorded
  int32 stored = 2; // rows written for this scope
}

// MATERIAL WAREHOUSE (new-flow NF-01)

message ReceiveMaterialStockRequest {
  int32 material_id = 1;
  google.type.Decimal quantity = 2; // in the material's unit, > 0
  google.type.Decimal unit_cost = 3; // NET (VAT-exclusive) price per unit in `currency`; empty = uncosted receipt (average unchanged). Setting a cost requires costing:write.
  string currency = 4; // ISO 4217
  string lot = 5; // supplier lot / roll (free text, not tracked by lot in v1)
  string supplier_doc = 6;
  string occurred_at = 7; // YYYY-MM-DD; defaults to today
  string comment = 8;
  // input_vat_amount / input_vat_regime record this purchase receipt's recoverable input VAT (base
  // currency EUR) and its treatment, for the extended M1 posting rule (phase 2, wave 1). Both
  // optional; when either is set, both must be set (amount >= 0, regime one of
  // wnt|import|domestic_pl|domestic_uk). unit_cost stays NET — do NOT also fold this VAT into it, or
  // it is double-counted (inflated inventory/COGS AND a 2080 recovery); the server rejects an
  // input_vat_amount above 30% of the net line cost as a likely gross unit_cost.
  google.type.Decimal input_vat_amount = 9;
  string input_vat_regime = 10; // wnt | import | domestic_pl | domestic_uk
  int32 supplier_id = 11; // optional catalogued supplier (phase 2, wave 4 — AP subledger); 0 = none
  // When this delivery was promised to arrive (Phase 9), YYYY-MM-DD; empty = not tracked. Recorded
  // on the receipt so lateness (occurred_at vs expected_at) is a queryable fact without a PO.
  string expected_at = 12;
  // Roll facts captured at приёмка (Ф5а.1). Both are recorded on the LOT `lot` names, so setting
  // either WITHOUT a `lot` is REFUSED (InvalidArgument) rather than accepted and dropped — there is
  // no lot to hang them on, and an operator who measured the roll would otherwise get a 200 and no
  // data. An omitted value never clears what an earlier receipt into the same lot recorded.
  //   measured_width_cm — the width that ARRIVED, not the one the supplier printed (150 nominal,
  //     148 measured; the marker is made for the narrowest width in the batch). Must be > 0 when set.
  //   shade_code — the dye lot / оттенок, for colour matching across rolls.
  // Measured LENGTH has no field: `quantity` already is it.
  google.type.Decimal measured_width_cm = 13;
  string shade_code = 14;
}

message ReceiveMaterialStockResponse {
  common.MaterialMovement movement = 1;
}

message IssueMaterialStockRequest {
  int32 material_id = 1;
  google.type.Decimal quantity = 2; // > 0
  // exactly one target must be set (> 0)
  int32 production_run_id = 3;
  int32 sample_id = 4;
  bool is_return = 5; // true → return_* instead of issue_*
  string occurred_at = 6; // YYYY-MM-DD
  string comment = 7;
  int32 product_id = 8; // optional colour-model for a run issue (gap-07 v2 C); 0 = shared/unattributed
  int32 lot_id = 9; // optional structured lot to draw from / return to (gap-07 v2 D); 0 = none
}

message IssueMaterialStockResponse {
  common.MaterialMovement movement = 1;
}

message AdjustMaterialStockRequest {
  int32 material_id = 1;
  string mode = 2; // set | adjust | writeoff
  google.type.Decimal quantity = 3; // set/writeoff: non-negative magnitude; adjust: signed delta
  string reason = 4; // stock_count | damage | loss | found | correction | packaging | scrap | other
  string comment = 5;
}

message AdjustMaterialStockResponse {
  common.MaterialMovement movement = 1;
}

// BatchIssueMaterialStockLine is one material of a batch issue. The target, direction and date are on
// the request — a batch is one act ("this sample was cut"), not a bag of unrelated movements.
message BatchIssueMaterialStockLine {
  int32 material_id = 1;
  google.type.Decimal quantity = 2; // > 0
  int32 lot_id = 3; // optional structured lot to draw from / return to; 0 = none
  string comment = 4; // per-line note; falls back to the request comment when empty
}

message BatchIssueMaterialStockRequest {
  repeated BatchIssueMaterialStockLine lines = 1; // at least one; one line per material
  // exactly one target must be set (> 0) — the same rule as IssueMaterialStock
  int32 production_run_id = 2;
  int32 sample_id = 3;
  bool is_return = 4; // true → return_* instead of issue_*
  string occurred_at = 5; // YYYY-MM-DD
  string comment = 6; // applied to every line that has none of its own
  int32 product_id = 7; // optional colour-model for a run issue; 0 = shared/unattributed
}

// BatchIssueMaterialStockResponse returns the movements in the order the lines were sent. The call is
// ATOMIC: on any failure NOTHING is written and the error names the offending line, so a caller never
// has to reconcile a half-applied write-off.
message BatchIssueMaterialStockResponse {
  repeated common.MaterialMovement movements = 1;
}

message GetMaterialStockRequest {
  int32 material_id = 1;
}

message GetMaterialStockResponse {
  common.MaterialStock stock = 1;
  // РЕЗЕРВ (Ф5б.4). reserved = Σ ещё открытых претензий этого материала, available = on_hand −
  // reserved. Это ОДНО число над ОБОИМИ владельцами — заказами, держащими упаковку, и прогонами,
  // держащими ткань. Читатель на сервере (openReservedQty) суммирует претензии по материалу, не
  // глядя на владельца, поэтому появление прогонов ничего в нём не поменяло; появись у ответа два
  // числа вместо одного, первый забывший сложить их продал бы то, что уже удержано.
  //
  // available может быть ОТРИЦАТЕЛЬНЫМ (удержано больше, чем лежит) — это состояние перепродажи,
  // и обрезать его нулём значило бы спрятать ровно ту ситуацию, ради которой считают резерв.
  google.type.Decimal reserved = 2;
  google.type.Decimal available = 3;
  // Открытые претензии поимённо — с владельцем и с ВОЗРАСТОМ. Брошенный прогон в planned держит
  // ткань бесконечно, и единственное, что делает это видимым, — created_at открытой претензии.
  repeated common.MaterialReservationClaim open_reservations = 4;
}

message ListMaterialStockRequest {
  string section = 1;
  string q = 2; // matches name / code / supplier_ref
  bool with_stock_only = 3;
  bool below_min_only = 4;
}

message ListMaterialStockResponse {
  repeated common.MaterialStockRow rows = 1;
}

message ListMaterialMovementsRequest {
  int32 limit = 1;
  int32 offset = 2;
  int32 material_id = 3;
  int32 production_run_id = 4;
  int32 sample_id = 5;
  common.MaterialMovementType movement_type = 6;
  string occurred_from = 7; // optional inclusive lower bound on occurred_at date, YYYY-MM-DD ("" = open)
  string occurred_to = 8; // optional inclusive upper bound on occurred_at date, YYYY-MM-DD ("" = open)
}

message ListMaterialMovementsResponse {
  repeated common.MaterialMovement movements = 1;
  int32 total = 2;
}

// PackagingBomItem is one line of the global packaging recipe (gap-07 v2 B): a material consumed on
// ship — qty_per_order once per shipment plus qty_per_item × the order's unit count. material_name /
// material_unit are resolved server-side for display and ignored on write.
message PackagingBomItem {
  int32 material_id = 1;
  string material_name = 2; // read-only (display)
  string material_unit = 3; // read-only (display)
  google.type.Decimal qty_per_order = 4; // consumed once per shipped order, >= 0
  google.type.Decimal qty_per_item = 5; // consumed per unit in the order, >= 0
  bool active = 6;
}

message UpsertPackagingBomRequest {
  repeated PackagingBomItem items = 1; // full-replace: this set becomes the whole recipe
}

message UpsertPackagingBomResponse {}

message ListPackagingBomRequest {}

message ListPackagingBomResponse {
  repeated PackagingBomItem items = 1;
}

// PackagingRecipeLine is one stored line of a packaging recipe for a scope target (PLM rework §2.8,
// Q3): a material consumed on ship — qty_per_order once per shipment (a box) plus qty_per_item × the
// order's unit count (a dust bag). Resolution at order time is product → style → global (first match
// wins). material_name / material_unit are resolved server-side for display and ignored on write.
message PackagingRecipeLine {
  int32 id = 1; // read-only
  string scope = 2; // global | style | product
  int32 tech_card_id = 3; // set iff scope=style
  int32 product_id = 4; // set iff scope=product
  int32 material_id = 5;
  string material_name = 6; // read-only (display)
  string material_unit = 7; // read-only (display)
  google.type.Decimal qty_per_order = 8; // consumed once per shipped order, >= 0
  google.type.Decimal qty_per_item = 9; // consumed per unit in the order, >= 0
  bool active = 10;
}

// PackagingRecipeItem is one writable recipe line; the scope target is carried by the request.
message PackagingRecipeItem {
  int32 material_id = 1;
  google.type.Decimal qty_per_order = 2; // >= 0
  google.type.Decimal qty_per_item = 3; // >= 0
  bool active = 4;
}

// UpsertPackagingRecipeRequest full-replaces the recipe lines of ONE scope target. scope selects the
// target: tech_card_id is required iff scope=style, product_id iff scope=product, neither for global.
// An empty items list clears that target's recipe.
message UpsertPackagingRecipeRequest {
  string scope = 1; // global | style | product
  int32 tech_card_id = 2; // set iff scope=style
  int32 product_id = 3; // set iff scope=product
  repeated PackagingRecipeItem items = 4;
}

message UpsertPackagingRecipeResponse {}

message ListPackagingRecipeRequest {}

message ListPackagingRecipeResponse {
  repeated PackagingRecipeLine items = 1;
}

// StyleAssemblyLine is one stored line of a garment style's assembly bill (WS7, §2.8): an auxiliary item
// (labels/tags) on/into the garment, with qty and print/position notes. component_name/component_aux_subtype/
// output_material_* and size_name are resolved server-side for display and ignored on write.
message StyleAssemblyLine {
  int32 id = 1; // read-only
  int32 style_id = 2;
  int32 component_tech_card_id = 3; // auxiliary tech card
  string component_name = 4; // read-only (display)
  common.TechCardAuxSubtype component_aux_subtype = 5; // read-only (display)
  int32 size_id = 6; // garment-size scope; 0 = all sizes
  string size_name = 7; // read-only (display)
  google.type.Decimal qty = 8; // > 0
  string print_note = 9; // what to print (artwork ref / text)
  string position_note = 10; // where/how it is attached
  bool active = 11;
  int32 output_material_id = 12; // component's warehouse material (COGS/production link); 0 = none
  string output_material_name = 13; // read-only (display)
  // How many ACTIVE colour variants (0252) the component card has. 0 = legacy single-output mode, so
  // output_material_* above IS the bucket; > 0 = the card produces one bucket per colour and
  // output_material_* is a stale leftover the packer must not read. Read-only display ("N colours").
  int32 output_variant_count = 14;

  // resolved_* / unresolved are set ONLY by GetOrderPackingSpec, which knows the ORDER ITEM whose
  // colourway this line has to be matched against; ListStyleAssembly leaves them zero because a bill
  // on its own has no colour to resolve to. See OrderPackingSpecItem.assembly.
  string resolved_color_code = 15; // colour of the bucket this item consumes; "" when the card has no colours
  string resolved_color_name = 16; // read-only (display)
  int32 resolved_material_id = 17; // the bucket to pick from; 0 when unresolved
  string resolved_material_name = 18; // read-only (display)
  // true = the server could NOT name one bucket. resolution_basis says which refusal it is; the
  // packer must be shown a warning, never a guessed colour.
  bool unresolved = 19;
  // WHY the bucket above was named, or why it could not be — a colour MATCH and a sole-variant
  // SUBSTITUTION are both "resolved" but must not read the same to a packer. UNKNOWN when the line was
  // not resolved against an order item at all (ListStyleAssembly).
  common.AssemblyResolutionBasis resolution_basis = 20;
}

// StyleAssemblyItem is one writable assembly line; the style target is carried by the request.
message StyleAssemblyItem {
  int32 component_tech_card_id = 1; // an auxiliary tech card
  int32 size_id = 2; // garment-size scope; 0 = all sizes
  google.type.Decimal qty = 3; // > 0
  string print_note = 4;
  string position_note = 5;
  bool active = 6;
}

// UpsertStyleAssemblyRequest full-replaces one style's assembly bill. Empty items clears it.
message UpsertStyleAssemblyRequest {
  int32 style_id = 1;
  repeated StyleAssemblyItem items = 2;
}

message UpsertStyleAssemblyResponse {}

message ListStyleAssemblyRequest {
  int32 style_id = 1;
}

message ListStyleAssemblyResponse {
  repeated StyleAssemblyLine items = 1;
}

// UpsertTechCardOutputVariantRequest writes ONE colour of an auxiliary card's warehouse output.
message UpsertTechCardOutputVariantRequest {
  int32 tech_card_id = 1;
  // id=0 creates; a non-zero id must already be a colour of tech_card_id. color_code is the CHAR(3)
  // dictionary code. material_id=0 auto-creates the bucket on create and means "keep the current
  // bucket" on update — moving a colour to a different bucket has to name its target. The read-only
  // fields of TechCardOutputVariant (color_name, material_name, on_hand, unit) are ignored.
  common.TechCardOutputVariant variant = 2;
}

message UpsertTechCardOutputVariantResponse {
  int32 id = 1; // the created or updated variant
}

message DeleteTechCardOutputVariantRequest {
  int32 id = 1;
}

message DeleteTechCardOutputVariantResponse {}

// SaveTechCardMarkerRequest writes ONE saved раскладка. id=0 creates; a non-zero id must already
// be a marker of tech_card_id and is replaced whole (the layout blob has no partial update).
message SaveTechCardMarkerRequest {
  int32 id = 1;
  int32 tech_card_id = 2;
  common.TechCardMarkerInsert marker = 3;
}

message SaveTechCardMarkerResponse {
  int32 id = 1; // the created or updated marker
}

message GetTechCardMarkerRequest {
  int32 id = 1;
}

message GetTechCardMarkerResponse {
  common.TechCardMarker marker = 1;
}

message DeleteTechCardMarkerRequest {
  int32 id = 1;
}

message DeleteTechCardMarkerResponse {}

// SetTechCardMarkerNormRequest designates one раскладка as the norm for its cloth, or clears it.
// The card is resolved from the marker — a norm belongs to the раскладка, and passing the card
// separately would create a pair that can disagree.
message SetTechCardMarkerNormRequest {
  int32 id = 1; // the раскладка
  bool is_norm = 2; // true = make it the norm (clearing the previous one); false = clear this one
}

message SetTechCardMarkerNormResponse {
  // The previous norm of the SAME cloth, whose flag was cleared by this call; 0 = there was none.
  // Present so the screen can name what it replaced instead of reporting a change with no subject.
  int32 previous_norm_marker_id = 1;
  // ALWAYS true, and NOT a placeholder: recipes are not recalculated, and the screen is obliged to
  // say so. A recipe holds a copied consumption figure with provenance consumption_source='marker'
  // and no link back to the marker; re-designating the norm therefore changes which раскладка is
  // AUTHORITATIVE without touching any number already applied. Apply the new norm if the consumption
  // should move.
  bool recipes_not_recalculated = 2;
}

// OrderPackingSpecItem is one garment line in an order's packing spec: the colourway/variant, quantity,
// and the on-garment assembly (labels/tags) the packer must verify, size-resolved to this line's variant.
message OrderPackingSpecItem {
  int32 order_item_id = 1;
  int32 product_id = 2;
  int32 variant_id = 3;
  int32 style_id = 4;
  string style_name = 5;
  string sku = 6;
  string size_name = 7;
  google.type.Decimal quantity = 8;
  repeated StyleAssemblyLine assembly = 9;
  // The GARMENT's own colour — the code every assembly line above was matched against, echoed so the
  // packer sees garment colour and component colour side by side and can catch a wrong prescription
  // without opening the product. Both empty when the colourway could not be loaded (see below).
  string color_code = 10;
  string color_name = 11;
}

// OrderPackingSpecPackaging is one packaging material the order needs (WS2 resolution product → style →
// global), summed across the order.
message OrderPackingSpecPackaging {
  int32 material_id = 1;
  string material_name = 2;
  string material_unit = 3;
  google.type.Decimal qty = 4;
}

message GetOrderPackingSpecRequest {
  string order_uuid = 1;
}

message GetOrderPackingSpecResponse {
  string order_uuid = 1;
  repeated OrderPackingSpecItem items = 2;
  repeated OrderPackingSpecPackaging packaging = 3;
}

message ListMaterialLotsRequest {
  int32 material_id = 1;
  bool include_archived = 2;
}

message ListMaterialLotsResponse {
  repeated common.MaterialLot lots = 1;
}

// ADMIN ACCOUNTS (RBAC)

// AccessLevel is the level of access an account has to a section. WRITE implies READ.
enum AccessLevel {
  ACCESS_LEVEL_UNSPECIFIED = 0;
  ACCESS_LEVEL_READ = 1;
  ACCESS_LEVEL_WRITE = 2;
}

// AdminPermission grants an account a level of access to one section.
message AdminPermission {
  // section is a section key from ListAccountSections (e.g. "orders").
  string section = 1;
  AccessLevel access = 2;
}

// AdminAccount is an admin account with its permission set. is_super grants full
// access, in which case permissions is empty.
message AdminAccount {
  string username = 1;
  bool is_super = 2;
  bool disabled = 3;
  repeated AdminPermission permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // specialties is the «чем занимается» column of the accounts table and the
  // chips on the account card. It grants nothing — see AdminRef.specialties.
  repeated string specialties = 7;
}

// AdminSectionInfo describes a grantable section for the permission picker.
message AdminSectionInfo {
  string key = 1;
  string title = 2;
  string description = 3;
}

message GetCurrentAccountRequest {}

message GetCurrentAccountResponse {
  AdminAccount account = 1;
}

message ListAccountSectionsRequest {}

message ListAccountSectionsResponse {
  repeated AdminSectionInfo sections = 1;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated AdminAccount accounts = 1;
}

message CreateAccountRequest {
  string username = 1;
  string password = 2;
  // is_super grants full access; when true, permissions is ignored.
  bool is_super = 3;
  repeated AdminPermission permissions = 4;
}

message CreateAccountResponse {
  AdminAccount account = 1;
}

message UpdateAccountPermissionsRequest {
  string username = 1;
  bool is_super = 2;
  repeated AdminPermission permissions = 3;
}

message UpdateAccountPermissionsResponse {
  AdminAccount account = 1;
}

message SetAccountDisabledRequest {
  string username = 1;
  bool disabled = 2;
}

message SetAccountDisabledResponse {}

message ResetAccountPasswordRequest {
  string username = 1;
  string new_password = 2;
}

message ResetAccountPasswordResponse {}

message DeleteAccountRequest {
  string username = 1;
}

message DeleteAccountResponse {}

// ACCOUNTING (double-entry ledger, docs/plan-accounting/). The ledger is a DERIVED, append-only
// projection of operational facts (orders, material movements, production runs, opex) plus manual
// entries; base currency EUR. Dates are plain YYYY-MM-DD strings throughout (never
// google.protobuf.Timestamp — 05-admin-api.md's date convention); money is google.type.Decimal.

// --- chart of accounts ---

// AcctAccount is a stored chart-of-accounts row. is_system accounts participate in automated
// posting rules and cannot be renamed or archived (ErrAcctSystemAccount).
message AcctAccount {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string section = 4; // asset | liability | equity | revenue | cogs | opex
  string statement = 5; // BS | PL
  bool is_system = 6;
  bool archived = 7;
}

message ListAcctAccountsRequest {
  bool include_archived = 1;
}

message ListAcctAccountsResponse {
  repeated AcctAccount accounts = 1;
}

message CreateAcctAccountRequest {
  string code = 1;
  string name = 2;
  string section = 3; // asset | liability | equity | revenue | cogs | opex
  string statement = 4; // BS | PL
}

message CreateAcctAccountResponse {
  AcctAccount account = 1;
}

message UpdateAcctAccountRequest {
  string code = 1;
  string name = 2;
}

message UpdateAcctAccountResponse {
  AcctAccount account = 1;
}

message ArchiveAcctAccountRequest {
  string code = 1;
  bool archived = 2;
}

message ArchiveAcctAccountResponse {}

// --- journal ---

// AcctJournalLineInput is one side of a manual journal entry being posted. Either `amount` (base
// currency, EUR) or `amount_src`+`currency_src` (converted to base server-side via the costing FX
// rates) must be set — never both, never neither.
message AcctJournalLineInput {
  string account_code = 1;
  bool is_debit = 2;
  google.type.Decimal amount = 3; // EUR; either this or amount_src+currency_src
  google.type.Decimal amount_src = 4; // amount in currency_src; server converts to EUR
  string currency_src = 5; // ISO 4217, or USDT (internal/currency.IsExpenseCurrency)
  string note = 6;
}

message CreateJournalEntryRequest {
  string occurred_at = 1; // YYYY-MM-DD; not more than 1 day in the future
  string description = 2;
  repeated AcctJournalLineInput lines = 3; // >= 2 lines, Σdebit == Σcredit (enforced by the store)
  int32 supplier_id = 4; // optional AP tag (phase 2, wave 4): a manual 2010 payment against a supplier; 0 = none
}

// AcctJournalLine is a stored journal line (read side), joined to its account's code/name.
message AcctJournalLine {
  int32 id = 1;
  string account_code = 2;
  string account_name = 3;
  string side = 4; // debit | credit
  google.type.Decimal amount = 5; // base currency (EUR), always > 0
  google.type.Decimal amount_src = 6; // original-currency trace; unset for most automated postings
  string currency_src = 7;
  string note = 8;
}

// AcctJournalEntry is a journal-entry header with its lines. ReversalOf/ReversedBy implement
// reversal-not-edit: a mistaken entry is never updated or deleted, only mirrored by a new entry
// that references it. `total` is Σdebit (== Σcredit); unset (nil) on the header-only shape
// returned by ListJournalEntries ("без lines").
message AcctJournalEntry {
  int32 id = 1;
  string occurred_at = 2;
  string description = 3;
  string source_type = 4;
  string source_key = 5;
  int32 reversal_of = 6; // 0 = not a reversal
  int32 reversed_by = 7; // 0 = not yet reversed
  string created_by = 8;
  bool has_caveat = 9;
  string caveat = 10;
  repeated AcctJournalLine lines = 11; // empty on the ListJournalEntries header-only shape
  google.type.Decimal total = 12; // unset on the ListJournalEntries header-only shape
}

message CreateJournalEntryResponse {
  AcctJournalEntry entry = 1;
}

message ReverseJournalEntryRequest {
  int32 entry_id = 1;
  string reason = 2;
}

message ReverseJournalEntryResponse {
  AcctJournalEntry entry = 1; // the new reversal entry (sides swapped), with lines
}

message ListJournalEntriesRequest {
  string from = 1; // occurred_at >= from; empty = unbounded
  string to = 2; // occurred_at < to (exclusive); empty = unbounded
  string account_code = 3; // filter via lines; empty = any
  string source_type = 4; // empty = any
  int32 limit = 5;
  int32 offset = 6;
  // Free-text filter: a case-insensitive substring of description, or a bare entry id ("123").
  // Empty = no text filter.
  string q = 7;
  // occurred_at ordering: "desc" (default, newest first) | "asc" (oldest first).
  string order = 8;
}

message ListJournalEntriesResponse {
  repeated AcctJournalEntry entries = 1; // without lines/total — see AcctJournalEntry
  int32 total = 2; // unpaginated match count
}

message GetJournalEntryRequest {
  int32 id = 1;
}

message GetJournalEntryResponse {
  AcctJournalEntry entry = 1; // with lines
}

// --- periods ---

// AcctPeriod is one accounting month (period is always the 1st). status gates CreateJournalEntry:
// posting into a closed period fails (ErrAcctPeriodClosed).
message AcctPeriod {
  string period = 1; // YYYY-MM-DD, always the 1st of the month
  string status = 2; // open | closed
  string closed_at = 3; // RFC3339; empty when open
  string closed_by = 4; // admin username; empty when open
}

message ListAcctPeriodsRequest {}

message ListAcctPeriodsResponse {
  repeated AcctPeriod periods = 1;
}

message CloseAcctPeriodRequest {
  string month = 1; // target month, YYYY-MM (a YYYY-MM-DD date in the month is also accepted); normalised to the 1st
}

message CloseAcctPeriodResponse {
  bool closed = 1;
  repeated string not_ready = 2; // reason the period could not be closed; empty when closed=true
}

message ReopenAcctPeriodRequest {
  string month = 1; // target month, YYYY-MM (a YYYY-MM-DD date in the month is also accepted); normalised to the 1st
}

message ReopenAcctPeriodResponse {}

// AcctEvent is one posting-outbox event's disposition (the internal JSON payload is omitted).
message AcctEvent {
  int64 id = 1;
  string event_type = 2; // order_paid | order_refund
  string source_key = 3; // order uuid | uuid:refund-seq
  string occurred_at = 4; // RFC3339
  string created_at = 5; // RFC3339
  string processed_at = 6; // RFC3339; empty while still pending
  int32 attempts = 7;
  string last_error = 8; // disposition / skip reason
  bool needs_review = 9;
}
message ListAcctEventsNeedingReviewRequest {
  int32 limit = 1; // default 50
}
message ListAcctEventsNeedingReviewResponse {
  repeated AcctEvent events = 1;
}
message ReprocessAcctEventRequest {
  int64 id = 1;
}
message ReprocessAcctEventResponse {}
message ResolveAcctEventRequest {
  int64 id = 1;
}
message ResolveAcctEventResponse {}

// --- reports (docs/plan-accounting/06-reports.md) ---

message GetTrialBalanceRequest {
  string from = 1;
  string to = 2; // exclusive
}

// TrialBalanceRow is one account's turnover + closing balance over [from, to). balance's sign
// follows the account's section: asset/cogs/opex → debit − credit; liability/equity/revenue →
// credit − debit.
message TrialBalanceRow {
  string code = 1;
  string name = 2;
  string section = 3;
  google.type.Decimal debit = 4;
  google.type.Decimal credit = 5;
  google.type.Decimal balance = 6;
}

message GetTrialBalanceResponse {
  repeated TrialBalanceRow rows = 1;
  google.type.Decimal total_debit = 2;
  google.type.Decimal total_credit = 3;
  bool balanced = 4; // total_debit == total_credit; the ledger's core smoke invariant
}

message GetProfitLossStatementRequest {
  string from = 1;
  string to = 2; // exclusive
}

// AcctPLRow is one P&L account's values across the response's month columns, plus the row total.
message AcctPLRow {
  string code = 1;
  string name = 2;
  repeated google.type.Decimal values = 3; // aligned to GetProfitLossStatementResponse.months
  google.type.Decimal total = 4;
}

// AcctPLSection groups P&L rows by section, in report order (revenue, cogs, opex, tax).
message AcctPLSection {
  string section = 1; // revenue | cogs | opex | tax
  repeated AcctPLRow rows = 2;
}

// AcctPLTotals holds the P&L's derived summary rows, one value per response.months column.
message AcctPLTotals {
  repeated google.type.Decimal total_revenue = 1;
  repeated google.type.Decimal net_cogs = 2;
  repeated google.type.Decimal gross_profit = 3;
  repeated google.type.Decimal gross_margin_pct = 4;
  repeated google.type.Decimal total_opex = 5;
  repeated google.type.Decimal operating_profit = 6;
  repeated google.type.Decimal net_margin_pct = 7;
  // Corporation Tax lines (phase 2, wave 3). total_tax is the period's Σ 8010 charge (manual journal
  // only — zero until the accountant posts CT); net_profit_after_tax = operating_profit − total_tax.
  repeated google.type.Decimal total_tax = 8;
  repeated google.type.Decimal net_profit_after_tax = 9;
}

message GetProfitLossStatementResponse {
  repeated string months = 1; // YYYY-MM-DD (1st of month); aligned with rows[].values / totals.*
  repeated AcctPLSection sections = 2;
  AcctPLTotals totals = 3;
  // Caveats. As of phase 2 wave 3 the two former permanent caveats are CONDITIONAL: "pre-tax profit"
  // prints only when the period has no 8010 Corporation-Tax entry, and "carrier shipping cost not
  // booked" only when the period has 4110 shipping income but no 6030 shipping expense. Followed by a
  // count of entries in the period flagged has_caveat.
  repeated string caveats = 4;
}

message GetBalanceSheetRequest {
  string as_of = 1; // inclusive
}

// AcctBalanceSheetRow is one BS account's closing balance as of the report date.
message AcctBalanceSheetRow {
  string code = 1;
  string name = 2;
  google.type.Decimal balance = 3;
}

// AcctBalanceSheetSection is one BS grouping (assets / liabilities / equity) with its rows + total.
message AcctBalanceSheetSection {
  string section = 1; // asset | liability | equity
  repeated AcctBalanceSheetRow rows = 2;
  google.type.Decimal total = 3;
}

message GetBalanceSheetResponse {
  string as_of = 1;
  AcctBalanceSheetSection assets = 2;
  AcctBalanceSheetSection liabilities = 3;
  AcctBalanceSheetSection equity = 4; // includes the virtual "Current Period Net Profit" row
  AcctBalanceSheetRow net_profit_row = 5; // convenience copy of that row; unset if not found by name
  google.type.Decimal total_assets = 6;
  google.type.Decimal total_liabilities = 7;
  google.type.Decimal total_equity = 8;
  google.type.Decimal balance_check = 9; // total_assets − (total_liabilities + total_equity)
  bool balanced = 10; // balance_check == 0
  repeated string caveats = 11;
}

message GetAccountLedgerRequest {
  string code = 1;
  string from = 2; // empty = unbounded (from inception)
  string to = 3; // exclusive; empty = unbounded
  int32 limit = 4;
  int32 offset = 5;
}

// AcctLedgerRow is one drill-down line for an account with its running balance.
message AcctLedgerRow {
  int32 entry_id = 1;
  string occurred_at = 2;
  string description = 3;
  string source_type = 4;
  string source_key = 5;
  string side = 6; // debit | credit
  google.type.Decimal amount = 7;
  string note = 8;
  google.type.Decimal running_balance = 9;
}

message GetAccountLedgerResponse {
  string code = 1;
  string name = 2;
  string section = 3;
  google.type.Decimal opening_balance = 4; // balance before `from`
  google.type.Decimal closing_balance = 5;
  repeated AcctLedgerRow rows = 6;
  int32 total = 7; // unpaginated match count
}

message GetAcctReconciliationRequest {
  string from = 1;
  string to = 2; // exclusive
}

// AcctReconItem is one row inside a reconciliation block (a top-N sample; the block's total_count
// carries the full count). ref is the operational identity (order uuid, movement id, run id, month).
message AcctReconItem {
  string ref = 1;
  string label = 2;
  google.type.Decimal amount = 3;
}

// AcctReconBlock is one reconciliation dimension: the ledger figure, the operational figure, their
// delta, and a bounded item sample. A non-zero delta (outside finished_goods, where drift is
// expected) signals the ledger diverged from operational truth.
message AcctReconBlock {
  string name = 1;
  google.type.Decimal ledger = 2;
  google.type.Decimal operational = 3;
  google.type.Decimal delta = 4;
  repeated AcctReconItem items = 5;
  int32 total_count = 6;
}

message GetAcctReconciliationResponse {
  AcctReconBlock revenue = 1;
  AcctReconBlock fees = 2;
  AcctReconBlock cogs = 3;
  AcctReconBlock materials = 4;
  AcctReconBlock finished_goods = 5;
  AcctReconBlock pending = 6;
  AcctReconBlock unposted_movements = 7;
  AcctReconBlock vat = 8; // phase 2 wave 1: 2070 ledger vs regime-classified order sums
  AcctReconBlock prepayments = 9; // phase 2 wave 2: 2090 balance vs paid-undelivered orders
  AcctReconBlock shipping = 10; // phase 2 wave 3: 6030 actual shipping cost booked
  AcctReconBlock bank = 11; // phase 2 wave 4: 1010 balance + Revolut inbox unposted backlog
  // 1030 Payment Processor (Stripe): informational — no external balance feed asserts a delta,
  // but the balance is surfaced so a missed payout post cannot drift invisibly.
  AcctReconBlock stripe = 12;
}

// --- wave 4: Revolut bank inbox (docs/plan-accounting-phase2/04-wave4-money.md §4.1) ---

// AcctBankTxn is one parsed bank statement line in the inbox. amount is SIGNED (negative = outflow);
// currency is the payment currency (Revolut is multi-currency). state is unmatched | matched | posted |
// ignored; matched_entry_id (0 = none) links a posted line to its journal entry; suggested_account (empty
// = none) is the rule/default hint prefilled in the post modal.
message AcctBankTxn {
  int32 id = 1;
  string source = 2;
  string external_id = 3;
  string booked_at = 4; // RFC3339
  google.type.Decimal amount = 5; // signed
  string currency = 6;
  google.type.Decimal fee = 7; // null when absent
  string description = 8;
  string counterparty = 9;
  string state = 10;
  int32 matched_entry_id = 11;
  string suggested_account = 12;
  // Why the line was deliberately not booked (set by IgnoreBankTxn); empty when none. Keeps every
  // deliberate omission reviewable — an ignored line books NOTHING, so the reason is its only trace.
  // 14: created_at already holds 13.
  string ignore_reason = 14;
  string created_at = 13; // RFC3339
}

message ImportBankCsvRequest {
  string source = 1; // parser to use; empty = revolut
  string csv_text = 2; // the raw CSV export
}
message ImportBankCsvResponse {
  int32 parsed = 1; // importable lines the parser produced
  int32 imported = 2; // newly inserted
  int32 skipped = 3; // duplicates of already-imported lines
}

message ListBankTxnsRequest {
  string state = 1; // unmatched | matched | posted | ignored; empty = all
  int32 limit = 2;
}
message ListBankTxnsResponse {
  repeated AcctBankTxn txns = 1;
}

message PostBankTxnRequest {
  int32 id = 1;
  string account_code = 2; // the other side of the entry (1010 is the money leg)
  string occurred_at = 3; // YYYY-MM-DD; empty = the line's booked date
  // Tags the entry with the supplier it settles, so a 2010 Accounts-Payable payment lands in
  // GetPayables under that supplier instead of the anonymous "(untagged)" row. 0 = untagged.
  int32 supplier_id = 4;
}
message PostBankTxnResponse {
  AcctJournalEntry entry = 1;
}

message IgnoreBankTxnRequest {
  int32 id = 1;
  string reason = 2; // persisted on the line (acct_bank_txn.ignore_reason); <= 255 chars
}
message IgnoreBankTxnResponse {}

// AcctBankRule is a substring→account suggestion applied at import.
message AcctBankRule {
  int32 id = 1;
  string pattern = 2;
  string account_code = 3;
}
message ListBankRulesRequest {}
message ListBankRulesResponse {
  repeated AcctBankRule rules = 1;
}
message CreateBankRuleRequest {
  string pattern = 1;
  string account_code = 2;
}
message CreateBankRuleResponse {
  AcctBankRule rule = 1;
}
message DeleteBankRuleRequest {
  int32 id = 1;
}
message DeleteBankRuleResponse {}

// --- wave 4: AP/AR subledgers (docs/plan-accounting-phase2/04-wave4-money.md §4.4) ---

// Supplier is a purchase-side counterparty (the AP catalog).
message Supplier {
  int32 id = 1;
  string name = 2;
  string vat_id = 3;
  string notes = 4;
  string created_at = 5; // RFC3339
}
message CreateSupplierRequest {
  string name = 1;
  string vat_id = 2;
  string notes = 3;
}
message CreateSupplierResponse {
  Supplier supplier = 1;
}
message ListSuppliersRequest {}
message ListSuppliersResponse {
  repeated Supplier suppliers = 1;
}

// AcctPayableRow is one supplier's open Accounts-Payable (2010) position. supplier_id 0 = an untagged 2010
// position (a 2010 entry with no supplier). balance = accrued − paid.
message AcctPayableRow {
  int32 supplier_id = 1;
  string supplier_name = 2;
  google.type.Decimal accrued = 3;
  google.type.Decimal paid = 4;
  google.type.Decimal balance = 5;
}
message GetPayablesRequest {}
message GetPayablesResponse {
  repeated AcctPayableRow rows = 1;
}

// AcctReceivableRow is one bank-invoice order's open Accounts-Receivable (1040) position. ref is the order
// uuid; balance = invoiced − received.
message AcctReceivableRow {
  string ref = 1;
  google.type.Decimal invoiced = 2;
  google.type.Decimal received = 3;
  google.type.Decimal balance = 4;
}
message GetReceivablesRequest {}
message GetReceivablesResponse {
  repeated AcctReceivableRow rows = 1;
}

// GetAcctAlerts: the section's attention flags (the tab dots), aggregated server-side.
message GetAcctAlertsRequest {}
message GetAcctAlertsResponse {
  int32 open_payables = 1; // suppliers with a non-zero open AP balance
  int32 open_receivables = 2; // orders with a non-zero open AR balance
  int32 ap_anomalies = 3; // untagged or negative payable rows (need a human)
  repeated string open_past_months = 4; // "YYYY-MM" fully-past months still open
  // Current-month reconciliation blocks off by >= 0.01, non-advisory only (finished-goods drift,
  // pending and unposted-movement backlogs have their own signals).
  repeated string recon_mismatch = 5;
  int32 bank_unmatched = 6; // unmatched bank inbox lines (capped at the list page size)
  int32 events_need_review = 7; // dead-letter postings awaiting review (block period close)
}

// --- VAT filing exports (phase 2, wave 1 — docs/plan-accounting-phase2/01-wave1-vat.md §1.5).
// Both reports are SOURCE-TYPE-AGNOSTIC: they aggregate the 2070 VAT ledger lines of order entries
// by customer_order.vat_regime over the PAYMENT period, so they survive wave 2's prepayment split.
// Refunds net with a minus sign. Numbers are for the accountant's manual JPK_VAT / OSS filing —
// full XML export is phase 3. ---

message GetVatReturnPLRequest {
  // month: YYYY-MM-DD, any day within the target filing month (normalised to the 1st).
  string month = 1;
}

// GetVatReturnPLResponse is the JPK_VAT monthly aggregate (filed by the 25th). Output VAT is split
// by regime (domestic PL, WNT/import self-charge; OSS shown for reference only — OSS is filed via
// GetOssReturn, not JPK, and is excluded from net_payable), input VAT is split by purchase type, and
// net_payable is the resulting liability. Caveats aggregates the period's per-entry caveats.
message GetVatReturnPLResponse {
  string month = 1; // YYYY-MM-DD, normalised to the 1st of the month
  google.type.Decimal output_domestic = 2; // pl_domestic sales output VAT (23%)
  google.type.Decimal output_wnt_self_charge = 3; // WNT/import purchase self-charge output (Art.33a)
  google.type.Decimal oss_info_total = 4; // OSS B2C output VAT, informational only — NOT in net_payable
  google.type.Decimal input_domestic = 5; // recoverable input VAT on domestic_pl purchases
  google.type.Decimal input_wnt = 6; // recoverable input VAT on WNT purchases (nets against output_wnt_self_charge)
  google.type.Decimal input_import = 7; // recoverable input VAT on import purchases (nets against output_wnt_self_charge)
  google.type.Decimal net_payable = 8; // output_domestic + output_wnt_self_charge − input_domestic − input_wnt − input_import
  // UK is a different jurisdiction — filed on the UK return, deliberately NOT in net_payable.
  google.type.Decimal output_uk_stock_domestic = 10; // uk_stock_domestic output VAT (2070)
  google.type.Decimal input_uk_domestic = 11; // domestic_uk purchase input VAT (recoverable in the UK)
  // Zero-rated NET revenue bases JPK still declares (carry no VAT, not in net_payable).
  google.type.Decimal net_wdt = 12; // intra-community supply net base (K_21)
  google.type.Decimal net_export = 13; // export net base (K_22)
  repeated string caveats = 9;
}

message GetOssReturnRequest {
  // quarter: YYYY-MM-DD, first day of the quarter (any day within the quarter is accepted and
  // snapped to that quarter's first day — see dto.ParseAcctQuarterStart).
  string quarter = 1;
}

// AcctOssRow is one destination country's OSS B2C line: country, applied rate, net taxable base and VAT.
message AcctOssRow {
  string country = 1; // ISO alpha-2 ship-to country
  google.type.Decimal rate_pct = 2;
  google.type.Decimal net = 3;
  google.type.Decimal vat = 4;
}

message GetOssReturnResponse {
  string quarter_start = 1; // YYYY-MM-DD, first day of the quarter
  repeated AcctOssRow rows = 2;
  google.type.Decimal total_net = 3;
  google.type.Decimal total_vat = 4;
  // Refunds of sales made in EARLIER quarters, grouped by that original quarter + country. OSS
  // (post-2021) requires these as correction lines referencing the original period, not netted
  // into the current quarter; rows above contain only current-quarter sales net of SAME-quarter
  // refunds.
  repeated AcctOssCorrection corrections = 5;
}

// AcctOssCorrection is one OSS correction line: the original period being corrected and the
// (negative) net/vat delta for one consumption country.
message AcctOssCorrection {
  string period = 1; // original quarter, e.g. "2026-Q1"
  string country = 2; // ISO alpha-2 consumption country
  google.type.Decimal net = 3; // signed (refunds negative)
  google.type.Decimal vat = 4; // signed
}

// VAT-UE recapitulative statement (monthly, PLN).
message GetVatUeRequest {
  string month = 1; // any day within the target month
}
message AcctVatUeRow {
  string counterparty_vat_id = 1; // EU VAT id (buyer for WDT, supplier for WNT)
  string counterparty_name = 2; // best-known name; may be empty
  string country = 3; // 2-letter prefix of the VAT id when derivable
  google.type.Decimal net_pln = 4; // net base in PLN (signed; refunds subtract)
}
message GetVatUeResponse {
  string month = 1; // YYYY-MM
  repeated AcctVatUeRow wdt = 2; // intra-community supplies (section C of VAT-UE)
  repeated AcctVatUeRow wnt = 3; // intra-community acquisitions (section D)
  repeated string caveats = 4; // e.g. WDT rows missing a buyer VAT id, missing FX rates
}

message ExportJpkV7MRequest {
  // month: YYYY-MM-DD, any day within the target filing month (normalised to the 1st).
  string month = 1;
}

message ExportJpkV7MResponse {
  string filename = 1; // suggested download name, e.g. JPK_V7M_2026-07.xml
  string xml_content = 2; // the JPK_V7M(2) XML document (UTF-8)
}

message ExportOssReturnRequest {
  // quarter: YYYY-MM-DD, any day within the target quarter (snapped to the quarter's first day).
  string quarter = 1;
}

message ExportOssReturnResponse {
  string filename = 1; // suggested download name, e.g. OSS_2026-Q3.xml
  string xml_content = 2; // the OSS (VIU-DO) return XML (UTF-8)
}

message GetUkVatReturnRequest {
  // quarter: YYYY-MM-DD, any day within the target quarter (snapped to the quarter's first day).
  string quarter = 1;
}

// GetUkVatReturnResponse is the 9-box UK VAT return. Boxes 2 (EU acquisitions VAT), 8 and 9 (EU
// supplies/acquisitions) are always zero for a post-Brexit GB return, so they are omitted here; Box 3 =
// Box 1 and Box 5 = Box 3 − Box 4.
message GetUkVatReturnResponse {
  string quarter_start = 1; // YYYY-MM-DD, first day of the quarter
  google.type.Decimal box1_output_vat = 2; // VAT due on sales
  google.type.Decimal box3_total_vat_due = 3; // Box 1 + Box 2 (Box 2 = 0)
  google.type.Decimal box4_input_vat = 4; // VAT reclaimed on purchases
  google.type.Decimal box5_net_vat = 5; // Box 3 − Box 4 (payable if positive)
  google.type.Decimal box6_net_sales = 6; // total sales ex-VAT
  google.type.Decimal box7_net_purchases = 7; // total purchases ex-VAT
  // "GBP" — every figure above is converted per transaction at the daily reference rate effective
  // on the day preceding its tax point (HMRC filing currency). "EUR" would mean an older backend
  // that did not convert.
  string currency = 8;
  repeated string caveats = 9; // e.g. transactions missing a GBP rate for their date
}

message GetFrs105AccountsRequest {
  string from = 1; // YYYY-MM-DD period start
  string to = 2; // YYYY-MM-DD period end (exclusive)
}

// GetFrs105AccountsResponse is an FRS 105 micro-entity accounts DRAFT: the Income Statement over the
// period and the Statement of Financial Position as at `to`, re-grouped from the ledger. Figures are
// in `currency` (the ledger base currency); the caveats flag that a UK Ltd filing needs GBP + entity
// isolation.
message GetFrs105AccountsResponse {
  string from = 1;
  string to = 2;
  string currency = 3;
  google.type.Decimal turnover = 4;
  google.type.Decimal cost_of_sales = 5;
  google.type.Decimal gross_profit = 6;
  google.type.Decimal administrative_expenses = 7;
  google.type.Decimal depreciation = 8;
  google.type.Decimal operating_profit = 9;
  google.type.Decimal tax = 10;
  google.type.Decimal profit_for_year = 11;
  google.type.Decimal fixed_assets = 12;
  google.type.Decimal current_assets = 13;
  google.type.Decimal creditors_within_year = 14;
  google.type.Decimal net_current_assets = 15;
  google.type.Decimal total_assets_less_current_liab = 16;
  google.type.Decimal creditors_after_year = 17;
  google.type.Decimal net_assets = 18;
  google.type.Decimal capital_and_reserves = 19;
  repeated string caveats = 20;
  // FRS 105 SoFP requires "Called up share capital" as its own line (account 3005); the remainder
  // of equity stays in capital_and_reserves.
  google.type.Decimal called_up_share_capital = 21;
}

// --- wave 5: cash flow + financial health (docs/plan-accounting-phase2/05-wave5-reporting.md) ---

message GetCashFlowStatementRequest {
  string from = 1; // YYYY-MM-DD period start
  string to = 2; // YYYY-MM-DD period end (exclusive)
}

// AcctCashFlowLine is one cash-flow line: a label and its SIGNED cash impact (source positive, use
// negative).
message AcctCashFlowLine {
  string label = 1;
  google.type.Decimal amount = 2;
  // Chart-of-accounts codes the line aggregates, for drill-down into the ledger (e.g. the
  // inventory delta carries 1110/1120/1130/1140). Empty for derived lines (net profit), whose
  // story is the P&L, not one ledger.
  repeated string codes = 3;
}

// AcctCashFlowSection groups cash-flow lines (operating | investing | financing) with the section subtotal.
message AcctCashFlowSection {
  string name = 1;
  repeated AcctCashFlowLine lines = 2;
  google.type.Decimal subtotal = 3;
}

// GetCashFlowStatementResponse is the indirect-method statement over [from, to). closing_cash is derived
// (opening_cash + net_change); closing_cash_actual is the real cash-account balance as at `to`; check =
// closing_cash_actual − closing_cash (0 when balanced, the trust panel).
message GetCashFlowStatementResponse {
  string from = 1;
  string to = 2;
  string currency = 3;
  AcctCashFlowSection operating = 4;
  AcctCashFlowSection investing = 5;
  AcctCashFlowSection financing = 6;
  google.type.Decimal net_change = 7;
  google.type.Decimal opening_cash = 8;
  google.type.Decimal closing_cash = 9;
  google.type.Decimal closing_cash_actual = 10;
  google.type.Decimal check = 11;
  bool balanced = 12;
  repeated string caveats = 13;
}

message GetFinancialHealthRequest {
  string from = 1; // YYYY-MM-DD period start
  string to = 2; // YYYY-MM-DD period end (exclusive)
}

// AcctFinancialHealthRow is one ratio row: its value, the owner's benchmark string, a status
// (ok | warn | na | track) and a display unit ("%", "x", "days", the base currency, or "").
message AcctFinancialHealthRow {
  string name = 1;
  string formula = 2;
  google.type.Decimal value = 3;
  string benchmark = 4;
  string status = 5;
  string unit = 6;
}

message GetFinancialHealthResponse {
  string from = 1;
  string to = 2;
  string currency = 3;
  repeated AcctFinancialHealthRow rows = 4;
  repeated string caveats = 5;
}

// FixedAsset is one capitalised asset, depreciated straight-line over useful_life_months from acquired_on.
message FixedAsset {
  int32 id = 1;
  string name = 2;
  google.type.Decimal cost_base = 3; // base-currency cost
  string acquired_on = 4; // YYYY-MM-DD
  int32 useful_life_months = 5;
  string disposed_on = 6; // YYYY-MM-DD or empty
}

message CreateFixedAssetRequest {
  string name = 1;
  google.type.Decimal cost_base = 2;
  string acquired_on = 3; // YYYY-MM-DD
  int32 useful_life_months = 4;
}

message CreateFixedAssetResponse {
  int32 id = 1;
}

message ListFixedAssetsRequest {}

message ListFixedAssetsResponse {
  repeated FixedAsset assets = 1;
}

message PostDepreciationRequest {
  string up_to = 1; // YYYY-MM-DD; posts every un-posted monthly charge up to this month
}

message PostDepreciationResponse {
  int32 posted = 1; // number of monthly charges newly posted
  // Monthly charges NOT posted because their accounting period is already closed. Non-zero means the
  // run was incomplete (e.g. a back-dated asset whose early months are closed) — reopen the period or
  // post a manual catch-up; the depreciation is not otherwise recovered.
  int32 skipped = 2;
}

message AccrueCorporationTaxRequest {
  string from = 1; // YYYY-MM-DD period start
  string to = 2; // YYYY-MM-DD period end (exclusive)
  google.type.Decimal rate_pct = 3; // corporation-tax rate, e.g. 19 or 25
}

message AccrueCorporationTaxResponse {
  google.type.Decimal corp_tax = 1; // amount accrued (0 for a loss period)
  bool already_posted = 2; // true if the period was already accrued (no new posting)
}
