message ListTechCardsRequest {
  int32 limit = 1;
  int32 offset = 2;
  common.OrderFactor order_factor = 3;
  common.TechCardStage stage = 4; // UNKNOWN = no filter
  common.GenderEnum gender = 5; // UNKNOWN = no filter
  string brand = 6; // optional case-insensitive substring
  reserved 7;
  reserved "season";
  string name = 8; // optional case-insensitive substring on name or style_number
  int32 product_id = 9; // optional: only cards linked to this product (0 = no filter)
  string purpose = 10; // optional exact match: "sellable" | "auxiliary" ("" = no filter). A
  // product-linking picker passes "sellable" to hide auxiliary/packaging cards.
  common.SkuSeason sku_season = 11; // optional exact normalized pair; no free-text matching
  // category_ids narrows to styles under ANY of the given category nodes, at any level: an id
  // matches a card whose category_id, top_category_id, sub_category_id or type_id equals it. So a
  // category browser can pass whichever node the operator picked — "outerwear" (a top category) or
  // "parka" (a type) — without the client having to expand the tree itself. Empty = no filter.
  repeated int32 category_ids = 12;
}

