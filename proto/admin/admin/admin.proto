  // GetTechCardConstructionAudit — THE MACHINE LAYER of the CONSTRUCTION review: a deterministic
  // audit of the SAVED card (route dictionaries, BOM chains, prices, release readiness) plus the
  // recomputed ground truth of its assembly graph. No AI, no key, no rate limit, no money — the
  // client calls it when the CONSTRUCTION tab opens and again after every successful save.
  //
  // IT READS THE CARD AS STORED. An unsaved form is not analysed; running a form draft through the
  // wire would be a separate contract and it was deliberately rejected.
  //
  // Read-only POST — same shape and same reason as CheckProductionRunReadiness: the answer is a
  // report and the request will grow (a future «review as draft | for release» switch belongs in it),
  // so the route should not have to move when it does. The two literal segments also keep the path
  // out of reach of /tech-card/{id}; the ordering that actually decides that is pinned by
  // TestTechCardListRouteNotShadowed, not by the shape of the path.
  //
  // Classified rd(tech_cards): it derives nothing a reader of the card could not derive by reading
  // it, and it spends nothing. Its LLM sibling is a WRITE grant, because that one does spend.
  rpc GetTechCardConstructionAudit(GetTechCardConstructionAuditRequest) returns (GetTechCardConstructionAuditResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/construction/audit"
      body: "*"
    };
  }

  // AnalyzeTechCardConstruction — THE LLM LAYER of the same review, behind the Analyze button. It
  // reads the SAVED card, sends it to the model with the machine layer's verified facts attached,
  // and returns ONLY what the model said (source="model") past a verifier that drops every finding
  // whose anchors do not resolve on this card. The machine findings are already on the screen and
  // are deliberately not repeated here.
  //
  // AN AI FAILURE IS NOT AN RPC FAILURE. Every way this can go wrong — no key, a retired model
  // slug, a timeout, output that is not usable — arrives as `ai_status` with HTTP 200 and an empty
  // findings list. That is the deliberate INVERSE of GenerateTechCardOperations, which answers
  // FailedPrecondition without a key because without the model it has nothing at all to return.
  // Here the deterministic half of the review is already rendered, so a status the panel can name
  // beats an error that blanks the tab.
  //
  // IT SPENDS MONEY ON EVERY PRESS, which is why it is classified wr(tech_cards) while its machine
  // sibling is rd, and why three limits stand in front of the call: one run per admin per card at a
  // time, a minimum interval between runs of the same card, and a per-admin hourly ceiling.
  rpc AnalyzeTechCardConstruction(AnalyzeTechCardConstructionRequest) returns (AnalyzeTechCardConstructionResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/construction/analyze"
      body: "*"
    };
  }

  // AddTechCardIssue files ONE issue against a tech card — the gesture that turns a finding of the
  // review into a tracked row someone answers for.
  //
  // IT IS NARROW ON PURPOSE, AND IT WORKS ON A FROZEN CARD. Filing through UpdateTechCard would be
  // impossible exactly when it matters most: a released card refuses the full write, and «the
  // construction cannot be sewn as specified» is precisely the sort of thing discovered after
  // release. Issues sit OUTSIDE the CONSTRUCTION digest, so this call cannot disturb a signature —
  // that is what makes the narrow path safe rather than merely convenient.
  rpc AddTechCardIssue(AddTechCardIssueRequest) returns (AddTechCardIssueResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/issue"
      body: "*"
    };
  }

  // КАТАЛОГ РАБОТ (видов операций) — СЕРВЕРНЫЕ ДАННЫЕ, ОТДАВАЕМЫЕ ОДНИМ ЗАПРОСОМ.
  //
  // Пункты, их синонимы поиска (RU/EN), допустимые машинки, глобальные дефолты свойств и подсказки
  // нормы времени приезжают вместе, потому что порознь они бесполезны: пикер работ рисуется целиком
  // или не рисуется вовсе. Каталог живёт в таблицах operation_work* (миграция 0329) и растёт
  // INSERT-миграцией — ни один пункт НЕ является членом enum, и добавление работы не требует
  // перегенерации клиента (инцидент Ж7: незнакомый член enum protojson выбрасывает молча).
  //
  // Путь — два сегмента после /tech-card/, поэтому /tech-card/{id} его не проглатывает; порядок
  // всё равно закреплён TestTechCardListRouteNotShadowed, а не формой пути.
  rpc GetOperationWorkCatalog(GetOperationWorkCatalogRequest) returns (GetOperationWorkCatalogResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/operation-work/catalog"};
  }

  // RememberOperationWorkDefault — жест «у меня эта работа всегда такая»: пара (работа, поле) →
  // значение, глобально, на все карточки. Единственная рантайм-запись во весь каталог; идентичность
  // работ (токен, глагол) правится только миграциями.
  //
  // ⚠️ МАШИННЫЕ И ВТО-НАСТРОЙКИ ЗАПРЕЩЕНЫ ПО ИМЕНИ и отвергаются InvalidArgument: у них уже есть
  // лестница наследования (шаг → профиль оборудования карточки → не задано, миграция 0306), и
  // второй механизм поверх неё отвечал бы на один вопрос дважды. Реестр разрешённых полей отдаётся
  // в default_fields каталога, чтобы жест рисовался по ОДНОМУ списку, а не по второму, своему.
  rpc RememberOperationWorkDefault(RememberOperationWorkDefaultRequest) returns (RememberOperationWorkDefaultResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/operation-work/default"
      body: "*"
    };
  }

