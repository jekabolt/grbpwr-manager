  // with a computed roll-up. A period cost — never seeded into product cost_price.
  rpc AddTechCardDevExpense(AddTechCardDevExpenseRequest) returns (AddTechCardDevExpenseResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/dev-expense"
      body: "*"
    };
