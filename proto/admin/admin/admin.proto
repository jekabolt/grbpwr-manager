  google.protobuf.Timestamp date = 1;
  string product_id = 2;
  string product_name = 3;
  int64 view_count = 4;
  int64 add_to_cart_count = 5;
  double cart_rate = 6; // percentage 0–100 (add_to_cart / view)
}

// TrendGranularity defines time bucket size for trend analysis
enum TrendGranularity {
  TREND_GRANULARITY_DAILY = 0;
  TREND_GRANULARITY_WEEKLY = 1;
  TREND_GRANULARITY_MONTHLY = 2;
}

// AddToCartRateAnalysis contains both per-product aggregate data for scatter plot
// and store-wide trend data for time series visualization
message AddToCartRateAnalysis {
  repeated AddToCartRateProductRow products = 1;
  repeated AddToCartRateGlobalRow global_trend = 2;
  double avg_view_count = 3;
  double avg_cart_rate = 4; // percentage 0–100
}

// AddToCartRateProductRow represents per-product aggregate metrics for scatter plot matrix
message AddToCartRateProductRow {
  string product_id = 1;
  string product_name = 2;
  int64 view_count = 3;
  int64 add_to_cart_count = 4;
  double cart_rate = 5; // percentage 0–100 (add_to_cart / view)
}

// AddToCartRateGlobalRow represents store-wide daily/weekly/monthly ATC rate for trend line
message AddToCartRateGlobalRow {
  google.protobuf.Timestamp date = 1;
  int64 total_views = 2;
  int64 total_add_to_carts = 3;
  double global_cart_rate = 4; // percentage 0–100
}

// --- Analytics: Browser Breakdown (BQ) ---

message BrowserBreakdownRow {
  google.protobuf.Timestamp date = 1;
  string browser = 2;
  int32 sessions = 3;
  int32 users = 4;
  int32 conversions = 5;
  double conversion_rate = 6;
}

// --- Analytics: Newsletter (BQ) ---

message NewsletterMetricRow {
  google.protobuf.Timestamp date = 1;
  int32 signup_count = 2;
