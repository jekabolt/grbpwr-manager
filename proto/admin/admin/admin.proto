  // ПРЕДЛОЖЕНИЕ КОЭФФИЦИЕНТА РАСКРОЯ по факту настилов (Ф5б.3).
  //
  // ОТДЕЛЬНЫЙ RPC, а не поле на GetMaterial/ListMaterials, и это решение, а не оформление: ответ
  // сканирует настилы по ПРОГОНАМ и поднимает их технологические карточки, а платить за это на
  // каждом чтении каталога незачем — каталог материалов читается всюду, а «сколько на самом деле
  // ушло ткани» спрашивают отдельно и редко.
  rpc GetMaterialCuttingCoefficientSuggestion(GetMaterialCuttingCoefficientSuggestionRequest) returns (GetMaterialCuttingCoefficientSuggestionResponse) {
    option (google.api.http) = {get: "/api/admin/materials/{material_id}/cutting-coefficient-suggestion"};
  }

  // ПРЕДЛОЖЕНИЕ ПРОЦЕНТА РАСКРОЯ по факту настилов (T7 волна 2) — СОСЕД, НЕ СИНОНИМ предыдущего
  // RPC. Оба медианят факты настилов одного артикула, но знаменатели РАЗНЫЕ, и потому это разные
  // числа для разных полей:
  //
  //   cutting-coefficient-suggestion: факт ÷ план-ГЕОМЕТРИЯ (длина раскладки × слои + концевые) —
  //     выпады уже в знаменателе, медиана меряет только усадку/пороки (2–6%) →
  //     material.cutting_coefficient;
  //   bom-wastage-suggestion:         факт ÷ NETTO (состав раскладки × норма «по выкройкам») —
  //     выпадов в знаменателе НЕТ, медиана меряет выпады + концы + усадку (15–30%) →
  //     tech_card_bom_item.wastage_percent.
  //
  // ПОСЛЕ W3 у второго предложения знаменатель netto × КОЭФФИЦИЕНТ артикула, а не чистое netto:
  // wastage_percent теперь означает только геометрию настила (выпады + концы), усадку/пороки
  // оплачивает коэффициент — и оплачивает в тех же деньгах себестоимости, так что медиана над
  // чистым netto предложила бы процент, оплачивающий их второй раз. Ответ называет свою линейку
  // (denominator_cutting_coefficient), потому что на артикуле с коэффициентом сегодняшнее число
  // НИЖЕ применённого до W3 — сменилась линейка, а не факт цеха. См. BomWastageSuggestionStatus
  // в common/production.proto.
  //
  // ПРЕДЛОЖЕНИЕ, А НЕ ПРИМЕНЕНИЕ: обработчик только читает; число вписывает в поле рука. Скоуп
  // медианы — все модели артикула, и ответ несёт состав (счётчики + список дрейфов с именами
  // карточек): число без опоры непроверяемо.
  rpc GetBomWastageSuggestion(GetBomWastageSuggestionRequest) returns (GetBomWastageSuggestionResponse) {
    option (google.api.http) = {get: "/api/admin/materials/{material_id}/bom-wastage-suggestion"};
  }

  // RepriceTechCardBom re-pulls the current material-catalog price into every catalog-linked BOM
  // line of a mutable (non-released) card (production-costing Phase 3, plan 11): unit_price/currency are overwritten
  // with the same CATALOG_LATEST resolution the style cost estimate uses (costing currency, else
  // base currency, else a sole unambiguous catalog currency), and price_source/price_snapshot_at
  // are stamped 'catalog'/now. Released cards are frozen (FAILED_PRECONDITION) — re-release is the
  // path that reprices them. Changing prices legitimately stales an approved MATERIALS sign-off.
  // Requires tech-card write + costing:write.
  rpc RepriceTechCardBom(RepriceTechCardBomRequest) returns (RepriceTechCardBomResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/{tech_card_id}/bom/reprice"
      body: "*"
    };
  }

  // ListCostingMigrationExceptions reads the Phase 2 scalar→BOM migration's exception report
  // (tech_card_costing_migration_exception): hardware/packaging money the migration refused to move
  // mechanically (double-counted / zero-colourway / non-draft cards), waiting for manual transfer
  // into the BOM. Read-only; tech_card_id 0 lists all cards. Requires tech-cards read; the AMOUNT
  // additionally needs costing:read and comes back stripped without it (structure — card, article,
  // kind, currency — is visible to any tech-cards reader).
  rpc ListCostingMigrationExceptions(ListCostingMigrationExceptionsRequest) returns (ListCostingMigrationExceptionsResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/costing-migration-exceptions"};
  }

