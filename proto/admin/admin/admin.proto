  // Get tier transition history for a member.
  rpc GetTierHistory(GetTierHistoryRequest) returns (GetTierHistoryResponse) {
    option (google.api.http) = {get: "/api/admin/members/{user_id}/tier-history"};
  }

  // Send a custom / event-invite email to a member.
  rpc SendMemberEmail(SendMemberEmailRequest) returns (SendMemberEmailResponse) {
    option (google.api.http) = {
      post: "/api/admin/members/{user_id}/email"
      body: "*"
    };
  }

  // Tier configuration (thresholds, expiration, display names).
  rpc GetTierConfig(GetTierConfigRequest) returns (GetTierConfigResponse) {
    option (google.api.http) = {get: "/api/admin/tier-config"};
  }

  rpc UpdateTierConfig(UpdateTierConfigRequest) returns (UpdateTierConfigResponse) {
    option (google.api.http) = {
      post: "/api/admin/tier-config"
      body: "*"
    };
  }

  // Hacker tier management.
  rpc GenerateHackerInvite(GenerateHackerInviteRequest) returns (GenerateHackerInviteResponse) {
    option (google.api.http) = {
      post: "/api/admin/hacker/invite"
      body: "*"
    };
  }

  rpc ListHackerInvites(ListHackerInvitesRequest) returns (ListHackerInvitesResponse) {
    option (google.api.http) = {get: "/api/admin/hacker/invites"};
  }

  rpc RevokeHackerInvite(RevokeHackerInviteRequest) returns (RevokeHackerInviteResponse) {
    option (google.api.http) = {
      post: "/api/admin/hacker/invite/{invite_id}/revoke"
      body: "*"
    };
  }

  rpc ListHackerAccounts(ListHackerAccountsRequest) returns (ListHackerAccountsResponse) {
    option (google.api.http) = {get: "/api/admin/hacker/accounts"};
  }

  rpc RevokeHackerStatus(RevokeHackerStatusRequest) returns (RevokeHackerStatusResponse) {
    option (google.api.http) = {
      post: "/api/admin/hacker/accounts/{user_id}/revoke"
      body: "*"
    };
  }

  // Tier transition audit log (all members).
  rpc GetTierAuditLog(GetTierAuditLogRequest) returns (GetTierAuditLogResponse) {
    option (google.api.http) = {get: "/api/admin/tier-audit"};
  }

  // One-time legacy backfill (admin-triggered).
  rpc RunTierBackfill(RunTierBackfillRequest) returns (RunTierBackfillResponse) {
    option (google.api.http) = {
      post: "/api/admin/tier-backfill"
      body: "*"
    };
  }

  // ADMIN ACCOUNTS (RBAC)

  // GetCurrentAccount returns the calling account's identity and effective
  // permissions (what its token authorizes). Any authenticated admin may call it;
  // the admin panel uses it to decide which sections to show.
  //
  // permissions and is_super come from the TOKEN, so a permission change shows up
  // only after the next login — deliberately, because that is also when
  // enforcement changes. specialties is the exception and comes from the
  // DATABASE: it is self-description, it is not in the token at all, and it is
  // current as of this call. A client that used to read its own specialties out
  // of ListAdmins because this field was always empty can stop doing that.
  rpc GetCurrentAccount(GetCurrentAccountRequest) returns (GetCurrentAccountResponse) {
    option (google.api.http) = {get: "/api/admin/accounts/me"};
  }

  // ListAccountSections returns the catalog of grantable admin-panel sections
  // (for the permission picker). Any authenticated admin may call it.
  rpc ListAccountSections(ListAccountSectionsRequest) returns (ListAccountSectionsResponse) {
    option (google.api.http) = {get: "/api/admin/accounts/sections"};
  }

  // ListAccounts lists every admin account with its permissions. Requires the
  // accounts section (read).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/api/admin/accounts"};
  }

  // CreateAccount creates a scoped (or super) admin account. Requires the accounts
  // section (write).
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounts"
      body: "*"
    };
  }

  // UpdateAccountPermissions replaces an account's super flag and permission set.
  // Requires the accounts section (write).
  rpc UpdateAccountPermissions(UpdateAccountPermissionsRequest) returns (UpdateAccountPermissionsResponse) {
    option (google.api.http) = {
      put: "/api/admin/accounts/{username}/permissions"
      body: "*"
    };
  }

  // SetAccountDisabled enables or disables an account (a disabled account cannot
  // obtain new tokens at login). Requires the accounts section (write).
  rpc SetAccountDisabled(SetAccountDisabledRequest) returns (SetAccountDisabledResponse) {
    option (google.api.http) = {
      put: "/api/admin/accounts/{username}/disabled"
      body: "*"
    };
  }

  // ResetAccountPassword sets a new password for an account. Requires the accounts
  // section (write).
  rpc ResetAccountPassword(ResetAccountPasswordRequest) returns (ResetAccountPasswordResponse) {
    option (google.api.http) = {
      put: "/api/admin/accounts/{username}/password"
      body: "*"
    };
  }

  // DeleteAccount removes an admin account (and its permissions). Requires the
  // accounts section (write).
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (google.api.http) = {delete: "/api/admin/accounts/{username}"};
  }

  // SetAccountSpecialties REPLACES what an account says it does.
  //
  // NOT gated on the accounts section, and deliberately so: a person edits their
  // OWN specialties without any grant, and only somebody else's requires
  // accounts:write (checked inside the handler, since the interceptor would have
  // cut the self-edit off before it). A field that needs an administrator to
  // fill in stays empty — and an empty specialty vocabulary takes the owner
  // picker and the people search down with it. The field carries no rights, so
  // the worst a wrong self-description costs is being harder to find.
  //
  // The path is /account/ (singular) rather than /accounts/: everything under
  // /accounts/ is account MANAGEMENT and requires that section, and a route that
  // reads like management but is not would be the first thing to be gated by
  // mistake.
  rpc SetAccountSpecialties(SetAccountSpecialtiesRequest) returns (SetAccountSpecialtiesResponse) {
    option (google.api.http) = {
      post: "/api/admin/account/specialties"
      body: "*"
    };
  }

  // DeleteAccountSpecialty removes ONE entry from the SHARED specialty
  // vocabulary, by name.
  //
  // STRICTER THAN WRITING ONE, AND THAT ASYMMETRY IS THE POINT.
  // SetAccountSpecialties above needs no grant because it edits one person's own
  // byline, and a name it mints is additive: nobody else's screen loses
  // anything. Deleting is the opposite — the vocabulary is shared, it rides on
  // every people-picker response in the panel, and removing an entry takes a
  // word away from everybody who might have picked it next. That touches other
  // accounts, not one's own self-description, so it requires the accounts
  // section (write) — the same grant that already governs editing somebody
  // else's specialties. Hence the /accounts/ (plural) path: everything under it
  // is account MANAGEMENT and is gated, and this is management.
  //
  // Refused, not silently forced, while accounts still carry the entry (the link
  // FK is RESTRICT for exactly that), and the refusal says HOW MANY accounts
  // hold it — a bare "нельзя" leaves the person with nothing to do next.
  // Retiring an entry that is in use means moving those accounts off it first;
  // there is deliberately no merge rpc here, because a person carries a handful
  // of specialties they can re-pick, not a file's accumulated topic history.
  //
  // Addressed BY NAME, not by id: the vocabulary travels as plain strings
  // (ListAdmins, ListAccounts), the panel is never shown a specialty id, and the
  // name is unique case- and accent-insensitively by collation.
  //
  // POST .../delete rather than DELETE .../{name}: a specialty name is free-form
  // text that may contain spaces or a slash, and putting it in the path would
  // make deletion depend on how the word was typed.
  rpc DeleteAccountSpecialty(DeleteAccountSpecialtyRequest) returns (DeleteAccountSpecialtyResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounts/specialties/delete"
      body: "*"
    };
  }

  // ACCOUNTING (double-entry ledger, docs/plan-accounting/). Every RPC below requires the
  // "accounting" RBAC section (internal/rbac/rbac.go SectionAccounting): reads need
  // accounting:read, journal/account/period writes need accounting:write. Plain dates
  // (occurred_at, from/to, as_of, month) are YYYY-MM-DD strings, never google.protobuf.Timestamp
  // — see docs/plan-accounting/05-admin-api.md. Money is google.type.Decimal throughout.

  // --- chart of accounts ---

  rpc ListAcctAccounts(ListAcctAccountsRequest) returns (ListAcctAccountsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/accounts"};
  }

  rpc CreateAcctAccount(CreateAcctAccountRequest) returns (CreateAcctAccountResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/accounts"
      body: "*"
    };
  }

  // UpdateAcctAccount renames a custom (non-system) account; code and section are immutable.
  rpc UpdateAcctAccount(UpdateAcctAccountRequest) returns (UpdateAcctAccountResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/accounts/update"
      body: "*"
    };
  }

  // ArchiveAcctAccount archives/unarchives a custom (non-system) account.
  rpc ArchiveAcctAccount(ArchiveAcctAccountRequest) returns (ArchiveAcctAccountResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/accounts/archive"
      body: "*"
    };
  }

  // --- journal ---

  // CreateJournalEntry posts a manual double-entry entry (source_type='manual'). Each line
  // carries either a base-currency `amount` or an `amount_src`+`currency_src` pair the server
  // converts via the costing FX rates; Σdebit == Σcredit is enforced by the store
  // (ErrAcctUnbalanced), not here.
  rpc CreateJournalEntry(CreateJournalEntryRequest) returns (CreateJournalEntryResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/journal"
      body: "*"
    };
  }

  // ReverseJournalEntry posts the mirror (sides swapped) of an existing entry and links the two;
  // the original is never edited or deleted (append-only ledger).
  rpc ReverseJournalEntry(ReverseJournalEntryRequest) returns (ReverseJournalEntryResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/journal/reverse"
      body: "*"
    };
  }

  // GetJournalEntry returns one entry with its lines. Declared before the bare list route below;
  // the two don't actually collide (different path-segment counts) but this keeps the file's
  // usual /{id}-before-list ordering (see the /model/{id} vs /model/list note above).
  rpc GetJournalEntry(GetJournalEntryRequest) returns (GetJournalEntryResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/journal/{id}"};
  }

  rpc ListJournalEntries(ListJournalEntriesRequest) returns (ListJournalEntriesResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/journal"};
  }

  // --- periods ---

  rpc ListAcctPeriods(ListAcctPeriodsRequest) returns (ListAcctPeriodsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/periods"};
  }

  // CloseAcctPeriod closes a fully-past, reconciled month. A failed readiness check is NOT a gRPC
  // error: the response comes back with closed=false and the reason in not_ready, so the UI can
  // render a checklist instead of a toast.
  rpc CloseAcctPeriod(CloseAcctPeriodRequest) returns (CloseAcctPeriodResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/periods/close"
      body: "*"
    };
  }

  rpc ReopenAcctPeriod(ReopenAcctPeriodRequest) returns (ReopenAcctPeriodResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/periods/reopen"
      body: "*"
    };
  }

  // --- reports (docs/plan-accounting/06-reports.md) ---

  // GetTrialBalance returns per-account turnover + closing balance over [from, to) (to exclusive),
  // with the ΣDr == ΣCr invariant surfaced as `balanced`.
  rpc GetTrialBalance(GetTrialBalanceRequest) returns (GetTrialBalanceResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/trial-balance"};
  }

  // GetProfitLossStatement returns the monthly Income Statement (revenue / cogs / opex sections)
  // over [from, to) (to exclusive), one column per calendar month.
  rpc GetProfitLossStatement(GetProfitLossStatementRequest) returns (GetProfitLossStatementResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/profit-loss"};
  }

  // GetBalanceSheet returns assets/liabilities/equity balances from inception through as_of
  // (inclusive), including the virtual "Current Period Net Profit" equity row.
  rpc GetBalanceSheet(GetBalanceSheetRequest) returns (GetBalanceSheetResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/balance-sheet"};
  }

  // GetAccountLedger is the drill-down: a paginated statement for one account with a running
  // balance, plus the opening balance carried into `from`.
  rpc GetAccountLedger(GetAccountLedgerRequest) returns (GetAccountLedgerResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/ledger/{code}"};
  }

  // GetAcctReconciliation proves the derived ledger matches operational truth (revenue, fees,
  // COGS, materials, finished goods) and lists what is deliberately left unposted, over
  // [from, to) (to exclusive).
  rpc GetAcctReconciliation(GetAcctReconciliationRequest) returns (GetAcctReconciliationResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/reconciliation"};
  }

  // --- posting-worker event review queue (phase 2 review follow-ups, H-1/H-2/B-5) ---

  // ListAcctEventsNeedingReview lists outbox events that were terminally disposed but need an operator
  // (a non-EUR/degenerate order needing a manual entry, an orphan refund, or a dead-letter). Their
  // month cannot close until each is resolved or reprocessed.
  rpc ListAcctEventsNeedingReview(ListAcctEventsNeedingReviewRequest) returns (ListAcctEventsNeedingReviewResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/events/needs-review"};
  }
  // ReprocessAcctEvent resets an event so the worker re-attempts it from scratch (used after the cause
  // is fixed, e.g. the missing vat_rate was added).
  rpc ReprocessAcctEvent(ReprocessAcctEventRequest) returns (ReprocessAcctEventResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/events/reprocess"
      body: "*"
    };
  }
  // ResolveAcctEvent clears the review flag on an event handled manually (a manual journal entry posted).
  rpc ResolveAcctEvent(ResolveAcctEventRequest) returns (ResolveAcctEventResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/events/resolve"
      body: "*"
    };
  }

  // --- VAT filing exports (phase 2, wave 1 — docs/plan-accounting-phase2/01-wave1-vat.md §1.5) ---

  // GetVatReturnPL returns the JPK_VAT monthly aggregate (filed by the 25th): output VAT by regime
  // (domestic PL, WNT/import self-charge, OSS shown for reference only), input VAT by type, and the
  // net payable. Source-type-agnostic and aggregated by the payment period, so it survives wave 2's
  // prepayment split; refunds net with a minus sign.
  rpc GetVatReturnPL(GetVatReturnPLRequest) returns (GetVatReturnPLResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/vat-return"};
  }

  // GetOssReturn returns the quarterly OSS aggregate: EU B2C sales (vat_regime=oss) broken down by
  // destination country with the applied rate, net and VAT.
  rpc GetOssReturn(GetOssReturnRequest) returns (GetOssReturnResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/oss-return"};
  }

  // ExportJpkV7M generates the official Polish JPK_V7M (JPK_VAT) XML for a month: the taxpayer header,
  // the VAT-7 declaration, and the sales evidence register. It is the OUTPUT-SIDE filing — the
  // accountant merges the purchase register (input VAT), so the file's ZakupWiersz is empty. Requires
  // the JPK_* taxpayer identity to be configured; returns FailedPrecondition otherwise.
  rpc ExportJpkV7M(ExportJpkV7MRequest) returns (ExportJpkV7MResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/jpk-v7m"};
  }

  // ExportOssReturn generates the quarterly OSS (Union scheme, VIU-DO) return XML — one row per member
  // state of consumption with its rate, taxable base and VAT — for the accountant to validate against
  // the official schema / transcribe into the OSS portal. Requires the JPK_* taxpayer identity.
  rpc ExportOssReturn(ExportOssReturnRequest) returns (ExportOssReturnResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/oss-export"};
  }

  // GetUkVatReturn returns the quarterly UK VAT return in 9-box MTD layout for the uk_stock_domestic
  // regime (a separate jurisdiction from the Polish JPK). Boxes 2/8/9 are zero post-Brexit for a GB
  // return; the figures are entered into MTD-compatible software / the HMRC bridge to submit.
  rpc GetUkVatReturn(GetUkVatReturnRequest) returns (GetUkVatReturnResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/uk-vat-return"};
  }

  // GetVatUe returns the monthly VAT-UE recapitulative statement rows (informacja podsumowująca):
  // WDT supplies grouped by the buyer's EU VAT id and WNT acquisitions grouped by the supplier's
  // VAT id, both in PLN converted per transaction at the reference rate of the day preceding the
  // tax point. Filed alongside JPK_V7M whenever WDT/WNT occurred in the month.
  rpc GetVatUe(GetVatUeRequest) returns (GetVatUeResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/vat-ue"};
  }

  // GetFrs105Accounts re-groups the ledger into FRS 105 UK micro-entity line items (Income Statement +
  // Statement of Financial Position). A base-currency DRAFT: a filing-ready UK Ltd set needs GBP
  // conversion + isolation of the UK entity's transactions — surfaced in caveats, not done here.
  rpc GetFrs105Accounts(GetFrs105AccountsRequest) returns (GetFrs105AccountsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/frs105"};
  }

  // GetCashFlowStatement returns the indirect-method cash-flow statement over [from, to) (exclusive):
  // net profit + depreciation add-back + balance-sheet working-capital / investing / financing deltas,
  // with a Check that reconciles the derived closing cash to the actual 1010/1030 balance.
  rpc GetCashFlowStatement(GetCashFlowStatementRequest) returns (GetCashFlowStatementResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/cash-flow"};
  }

  // GetFinancialHealth returns the financial-health ratio set over [from, to) (exclusive): each row a
  // {name, formula, value, benchmark, status} tuple. Money is ledger-derived; unit counts come from
  // operational metrics (labelled in caveats).
  rpc GetFinancialHealth(GetFinancialHealthRequest) returns (GetFinancialHealthResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/financial-health"};
  }

  // --- wave 4: Revolut bank inbox (docs/plan-accounting-phase2/04-wave4-money.md §4.1) ---

  // ImportBankCsv parses a bank CSV export (Revolut) into the inbox, deduplicating on the bank
  // transaction id + payment currency; a re-imported statement is a no-op for lines already present.
  rpc ImportBankCsv(ImportBankCsvRequest) returns (ImportBankCsvResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/bank/import"
      body: "*"
    };
  }

  // ListBankTxns returns inbox lines, optionally filtered by state (unmatched | matched | posted | ignored).
  rpc ListBankTxns(ListBankTxnsRequest) returns (ListBankTxnsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/bank/txns"};
  }

  // PostBankTxn books a manual-provenance journal entry for an inbox line (Dr/Cr by the signed amount: an
  // inflow Dr 1010 / Cr the chosen account, an outflow reversed) and marks the line posted. A non-EUR line
  // posts via the costing-FX fold (amount_src + currency_src).
  rpc PostBankTxn(PostBankTxnRequest) returns (PostBankTxnResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/bank/post"
      body: "*"
    };
  }

  // IgnoreBankTxn marks an inbox line deliberately not booked (e.g. an internal EXCHANGE leg).
  rpc IgnoreBankTxn(IgnoreBankTxnRequest) returns (IgnoreBankTxnResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/bank/ignore"
      body: "*"
    };
  }

  // ListBankRules returns the substring→account suggestion rules applied at import.
  rpc ListBankRules(ListBankRulesRequest) returns (ListBankRulesResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/bank/rules"};
  }

  // CreateBankRule adds a substring→account suggestion rule.
  rpc CreateBankRule(CreateBankRuleRequest) returns (CreateBankRuleResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/bank/rules"
      body: "*"
    };
  }

  // DeleteBankRule removes a suggestion rule.
  rpc DeleteBankRule(DeleteBankRuleRequest) returns (DeleteBankRuleResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/bank/rules/delete"
      body: "*"
    };
  }

  // --- wave 4: AP/AR subledgers (docs/plan-accounting-phase2/04-wave4-money.md §4.4) ---

  // CreateSupplier adds a purchase-side supplier to the catalog (unique name).
  rpc CreateSupplier(CreateSupplierRequest) returns (CreateSupplierResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/suppliers"
      body: "*"
    };
  }

  // ListSuppliers returns the supplier catalog.
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/suppliers"};
  }

  // GetPayables returns the open Accounts-Payable (2010) balance per supplier (accrued − paid).
  rpc GetPayables(GetPayablesRequest) returns (GetPayablesResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/payables"};
  }

  // GetReceivables returns the open Accounts-Receivable (1040) balance per bank-invoice order.
  rpc GetReceivables(GetReceivablesRequest) returns (GetReceivablesResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/reports/receivables"};
  }

  // GetAcctAlerts returns the accounting section's attention flags in one call — the red tab dots:
  // open AP/AR (+ untagged/negative anomalies), past months still open, current-month
  // reconciliation drift (non-advisory blocks only), unmatched bank inbox lines and dead-letter
  // events. Aggregates existing reads server-side so the UI needs one request instead of six.
  rpc GetAcctAlerts(GetAcctAlertsRequest) returns (GetAcctAlertsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/alerts"};
  }
  // Fixed-asset register + straight-line depreciation.
  rpc CreateFixedAsset(CreateFixedAssetRequest) returns (CreateFixedAssetResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/fixed-assets"
      body: "*"
    };
  }
  rpc ListFixedAssets(ListFixedAssetsRequest) returns (ListFixedAssetsResponse) {
    option (google.api.http) = {get: "/api/admin/accounting/fixed-assets"};
  }
  // PostDepreciation posts every not-yet-posted monthly depreciation charge up to the given month.
  rpc PostDepreciation(PostDepreciationRequest) returns (PostDepreciationResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/depreciation/post"
      body: "*"
    };
  }
  // AccrueCorporationTax posts a corporation-tax accrual (Dr 8010 / Cr 2050) on the period's pre-tax profit.
  rpc AccrueCorporationTax(AccrueCorporationTaxRequest) returns (AccrueCorporationTaxResponse) {
    option (google.api.http) = {
      post: "/api/admin/accounting/corporation-tax/accrue"
      body: "*"
    };
  }
}

// DICITONARY

message GetDictionaryRequest {}

message GetDictionaryResponse {
  common.Dictionary dictionary = 1;
}

// MEDIA MANAGER

message UploadContentImageRequest {
  string raw_b64_image = 1;
}

message UploadContentImageResponse {
  common.MediaFull media = 1;
}

message UploadContentVideoRequest {
  bytes raw = 1;
  string content_type = 4;
}

message UploadContentVideoResponse {
  common.MediaFull media = 1;
}

message UploadPatternRequest {
  bytes raw = 1; // raw PDF bytes
  string filename = 2; // original filename (for display / download)
}

message UploadPatternResponse {
  string url = 1; // CDN url of the stored PDF
  string filename = 2; // echoed original filename
  int64 size_bytes = 3; // stored file size in bytes
}

message ListObjectsPagedRequest {
  int32 limit = 1;
  int32 offset = 2;
  common.OrderFactor order_factor = 4;
}

message ListObjectsPagedResponse {
  repeated common.MediaFull list = 1;
}

message DeleteFromBucketRequest {
  int32 id = 1;
}

message DeleteFromBucketResponse {}

message GetMediaUsageRequest {
  repeated int32 media_ids = 1; // the media ids to look up, typically one library page
}

message GetMediaUsageResponse {
  // One entry per requested id, including ids that turned out to be unreferenced (empty refs)
  // and ids that no longer exist. Order is not guaranteed to match the request — match by media_id.
  repeated MediaUsage usages = 1;
}

message MediaUsage {
  int32 media_id = 1;
  repeated MediaUsageRef refs = 2; // empty means the file is free to delete
}

// MediaUsageRef is one place holding on to a media item. Several refs may name the same
// entity when it uses the file in more than one slot (a photo that is both the product
// thumbnail and a gallery frame yields two refs with the same kind and entity_id).
message MediaUsageRef {
  string kind = 1; // product | archive | model | material | task | tech_card | fitting | sample
  int32 entity_id = 2; // id of the entity to navigate to, in the space named by kind
  string label = 3; // human-readable name of that entity, e.g. "CARGO PANTS BLACK"
  string slot = 4; // where inside the entity, e.g. thumbnail | gallery | swatch | callout | moodboard
}

// PRODUCTS MANAGER

// CreateColorway/UpdateColorway/UpdateStyle replace the coupled UpsertColorway (R2/R4 write
// decomposition, §6). A colourway is created DRAFT against an existing style and carries only
// colourway-owned fields; the style facts are patched separately through UpdateStyle under a shared
// optimistic lock.
message CreateColorwayRequest {
  int32 style_id = 1; // the single style relation (R4); the colourway attaches to an existing style
  reserved 2; // color_code is carried by merchandising.color_code (§1.5, the sole write identity)
  reserved "color_code";
  common.ColorwayMerchandisingInsert merchandising = 3;
  common.ColorwayDevelopmentInsert development = 4; // dev/lab-dip; recipe persistence lands with T-A (existing gap)
  int32 thumbnail_media_id = 5;
  int32 secondary_thumbnail_media_id = 6;
  repeated int32 media_ids = 7;
  repeated common.ColorwayTagInsert tags = 8;
  repeated common.ColorwayPriceInsert prices = 9;
  repeated common.ColorwayInsertTranslation translations = 10; // merch translation overrides (R4)
  google.type.Decimal cost_price = 11; // write-only COGS (costing:write)
  string country_code = 12; // ISO 3166-1 alpha-2 (R9)
  // status is server-owned = DRAFT.
}

message CreateColorwayResponse {
  int32 colorway_id = 1;
}

message UpdateColorwayRequest {
  int32 colorway_id = 1;
  uint64 expected_colorway_version = 2; // the shared tech_card.lock_version
  common.ColorwayMerchandisingInsert merchandising = 3;
  common.ColorwayDevelopmentInsert development = 4;
  repeated int32 media_ids = 5;
  repeated common.ColorwayTagInsert tags = 6;
  repeated common.ColorwayPriceInsert prices = 7;
  google.protobuf.FieldMask update_mask = 8;
  int32 thumbnail_media_id = 9;
  int32 secondary_thumbnail_media_id = 10;
  google.type.Decimal cost_price = 11; // write-only COGS (costing:write); omit to leave unchanged
  string country_code = 12; // ISO
  repeated common.ColorwayInsertTranslation translations = 13; // merch translation overrides (sparse: empty = unchanged)
  // NOT here: variants/quantity, size chart, style facts.
}

message UpdateColorwayResponse {
  int32 lock_version = 1; // the new shared lock_version
}

message UpdateColorwayRecipeRequest {
  int32 colorway_id = 1;
  // expected_colorway_version echoes the shared tech_card.lock_version (R4); a mismatch -> Aborted.
  int32 expected_colorway_version = 2;
  repeated common.TechCardColorwayUsage usages = 3; // the full recipe (full-replace for this colourway)
}

message UpdateColorwayRecipeResponse {
  int32 lock_version = 1; // the new shared lock_version after the recipe write
}

// StylePatch is the narrow set of catalogue-style facts UpdateStyle owns (R4/§14.7-8). It deliberately
// does NOT reuse the heavy TechCardInsert, so a style-catalogue edit can never full-replace the PLM
// children (BOM/POM/ops). category_id stays a PLM/UpdateTechCard fact; canonical style translations
// await a dedicated style_translation table (deferred).
message StylePatch {
  string brand = 1;
  common.SeasonEnum season = 2; // sku_season code (the SKU-facing season); pairs with season_year
  string collection = 3;
  common.GenderEnum target_gender = 4;
  string fit = 5;
  string composition = 6;
  string care_instructions = 7;
  int32 model_wears_height_cm = 8;
  int32 model_wears_size_id = 9;
  int32 top_category_id = 10;
  int32 sub_category_id = 11;
  int32 type_id = 12;
  // sku_season YEAR, written together with `season` — the two are one fact (the
  // tech_card_season_atomic CHECK stores code, year and the derived "SS26" label as a set) and are
  // masked as one under the "season" path. 0 = keep the stored year, which is what every caller
  // predating this field sends, so a code-only change stays a code-only change. A year that moves
  // is a SKU fact like the code: it re-mints every unfrozen sibling colourway and is refused
  // outright when any sibling is SKU-frozen.
  int32 season_year = 13;
}

message UpdateStyleRequest {
  int64 style_id = 1;
  StylePatch patch = 2;
  uint64 expected_lock_version = 3; // shared tech_card.lock_version; stale -> ABORTED
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateStyleResponse {
  int32 lock_version = 1; // the new shared lock_version
}

message GetColorwaysPagedRequest {
  int32 limit = 1;
  int32 offset = 2;
  repeated common.SortFactor sort_factors = 3;
  common.OrderFactor order_factor = 4;
  common.FilterConditions filter_conditions = 5;
  reserved 6; // was bool show_hidden — replaced by an explicit lifecycle-status filter (R6/§14.6)
  reserved "show_hidden";
  repeated common.ColorwayLifecycleStatus statuses = 7; // empty = the default admin set (all but ARCHIVED)
}

message GetColorwaysPagedResponse {
  repeated common.Colorway colorways = 1; // R8: renamed from products
  reserved "products";
  int32 total = 2; // total matching colourways ignoring pagination
}

message GetColorwayByIDRequest {
  int32 colorway_id = 1; // R8: renamed from id
  reserved "id";
}

message GetColorwayByIDResponse {
  common.ColorwayFull colorway = 1; // R8: renamed from product
  reserved "product";
  // cost_info carries the confidential COGS/provenance fields. Admin-only — this lives on the
  // admin GetColorwayByID response, never on the shared ColorwayFull, so it cannot leak to the
  // storefront read path.
  ColorwayCostInfo cost_info = 2;
  // usages is this colourway's material recipe (H1 fix: the recipe is colourway-owned — S2/S3,
  // 01-DOMAIN-MODEL §2.3 — so GetColorwayByID is the minimum surface that must return it; a
  // full-replace UpdateColorwayRecipe is unsafe to edit-partially without a matching read). Lives
  // here rather than on the shared common.ColorwayFull so it never reaches the storefront read
  // path (admin.proto only). Money fields are stripped without costing:read.
  repeated common.TechCardColorwayUsage usages = 3;
}

// ColorwayCostInfo is the admin-only view of a product's confidential cost of goods and where
// that cost came from. source is "manual" | "tech_card" | "" (unset); tech-card ids are 0
// when absent.
message ColorwayCostInfo {
  google.type.Decimal cost_price = 1;
  common.ColorwayCostSource cost_price_source = 2; // R4: type change string->enum (same number)
  int32 cost_source_tech_card_id = 3; // R4: renamed from cost_price_tech_card_id (cost provenance, not ownership)
  reserved "cost_price_tech_card_id";
  google.protobuf.Timestamp cost_price_updated_at = 4;
  int32 primary_tech_card_id = 5;
}

message SyncColorwayCostFromOwningStyleRequest {
  int64 colorway_id = 1; // R8: renamed from product_id (same FK target = product.id)
  reserved "product_id";
  // R4/p019: the style is derived from the owner relation (the colourway's primary card) and is NEVER
  // repointed by a cost sync — cost provenance is separated from ownership. tech_card_id is removed.
  reserved 2;
  reserved "tech_card_id";
  uint64 expected_version = 3;
}

message SyncColorwayCostFromOwningStyleResponse {
  // the cost_price written, in base currency.
  google.type.Decimal cost_price = 1;
  string currency = 2;
  // the tech card the cost was sourced from (the owning style's primary card).
  int32 tech_card_id = 3;
  common.ColorwayCostSource source = 4; // R4: where the synced cost came from (STYLE)
}

// Lifecycle transition requests (R6). expected_version echoes tech_card.lock_version for future
// optimistic-lock wiring; concurrency today is enforced by the server's lifecycle_status guard (a
// concurrent transition is rejected, never silently lost).
message ArchiveColorwayByIDRequest {
  int32 colorway_id = 1;
  uint64 expected_version = 2;
  reserved "id"; // was DeleteColorwayByIDRequest.id
}

message ArchiveColorwayByIDResponse {}

message DeleteColorwayByIDRequest {
  int32 colorway_id = 1;
  // expected_version ведёт себя РОВНО как на ArchiveColorwayByID: поле принимается и НЕ проверяется
  // — при расхождении не происходит ничего, отказа по версии нет. Это не недоделка, а вывод:
  // версия колорвея — это tech_card.lock_version, и ни один факт, который решает удаляемость
  // (продажа, строка партии, настил, остаток), её не двигает. Проверка не закрыла бы ни одной
  // настоящей гонки и при этом отказывала бы на правке рецепта СОСЕДНЕГО колорвея той же карточки.
  // Гонку закрывает пере-проверка фактов внутри транзакции удаления.
  uint64 expected_version = 2;
  // dry_run = true: посчитать вердикт и НЕ удалять. Ответ идентичен по форме, deleted = false.
  bool dry_run = 3;
}

// ColorwayDeletionEntry — одна запись вердикта удаления: стабильный код, готовая фраза, количество.
// Строковый код, а не enum, — по соглашению refusal у оценки расхода (common/techcard.proto): код
// не заводит нулевого значения, которое в замороженном ответе читалось бы как «причины нет».
// Фразу собирает сервер: формулировка одна на систему, второй перевод на клиенте с ней разойдётся.
message ColorwayDeletionEntry {
  // Стабильный код. Блокеры: sold | production_run | lay | stock | inventory_target | fitting |
  // referenced. Каскад: variant | variant_price | price | media | tag | translation | recipe_usage |
  // size_consumption | piece_material | packaging_recipe | lab_dip_round | cost_event | waitlist |
  // stock_history | style_link. Сироты: orphan_marker | orphan_material_movement | orphan_sample |
  // orphan_task.
  //
  // inventory_target и fitting СУЖАЮТ границу владельца: по ней такой колорвей удаляется, но у
  // обоих FK стоит RESTRICT, и СУБД откажет в любом случае — выбор был только между названным
  // фактом и сырым MySQL 1451. referenced — сетка безопасности против ушедшей вперёд схемы: FK,
  // которого нет в перечислении сервера; она называет своё незнание, а не факт.
  string reason = 1;
  // Готовая фраза для экрана: «продан: 3 заказа», «стоит в партии #12 (черновик)».
  string text = 2;
  // Сколько объектов стоит за записью (заказов, партий, строк рецепта, раскладок). 0 значит «отсюда
  // не видно» и приходит только с reason = referenced: MySQL сообщает имя ограничения, а не
  // мощность, и поставить туда 1 значило бы выдумать число.
  int32 count = 3;
}

message DeleteColorwayByIDResponse {
  // Разрешает ли вердикт удаление. При dry_run = false и deletable = false ответа не будет вовсе —
  // придёт FailedPrecondition; поле осмысленно прежде всего в сухом прогоне.
  bool deletable = 1;
  // Что держит удаление. Пусто ⟺ deletable.
  repeated ColorwayDeletionEntry blockers = 2;
  // Что уйдёт ВМЕСТЕ с колорвеем (ON DELETE CASCADE — его собственные строки). Это список, который
  // печатает диалог подтверждения.
  repeated ColorwayDeletionEntry cascade = 3;
  // ТРЕТЬЯ КАТЕГОРИЯ, ни блокер, ни каскад: записи с ON DELETE SET NULL переживут удаление и
  // ПОТЕРЯЮТ колорвей. Раскладка, снятая под этот артикул, останется длиной, померенной ни на чём.
  // Отказать не за что, но оператор обязан узнать это ДО подтверждения, а не после.
  repeated ColorwayDeletionEntry orphans = 4;
  // Действительно ли строка удалена. false в сухом прогоне.
  bool deleted = 5;
}

