  rpc DeleteTechCardDevExpense(DeleteTechCardDevExpenseRequest) returns (DeleteTechCardDevExpenseResponse) {
    option (google.api.http) = {delete: "/api/admin/tech-card/dev-expense/{id}"};
  }
  rpc ListTechCardDevExpenses(ListTechCardDevExpensesRequest) returns (ListTechCardDevExpensesResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/{tech_card_id}/dev-expenses"};
  }

  // Production runs (партии, task 09): a batch produced from a tech card, with a plan snapshot
  // and (later) actual costs for plan/fact analysis.
  rpc CreateProductionRun(CreateProductionRunRequest) returns (CreateProductionRunResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs"
      body: "*"
    };
  }
  rpc UpdateProductionRun(UpdateProductionRunRequest) returns (UpdateProductionRunResponse) {
    option (google.api.http) = {
      put: "/api/admin/production-runs/{id}"
      body: "*"
    };
  }
  rpc DeleteProductionRun(DeleteProductionRunRequest) returns (DeleteProductionRunResponse) {
    option (google.api.http) = {delete: "/api/admin/production-runs/{id}"};
  }
  rpc GetProductionRun(GetProductionRunRequest) returns (GetProductionRunResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs/{id}"};
  }
  rpc ListProductionRuns(ListProductionRunsRequest) returns (ListProductionRunsResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs"};
  }
  // ReceiveProductionRun receives a run into a linked product's stock (by received_qty per size),
  // transitions the run to `received`, and optionally sets the product's cost_price from the run's
  // actual unit cost. It is guarded against a double receipt.
  //
  // DEPRECATED (Phase 4, receipt v1): a thin shim over PostProductionRunReceipt that synthesizes
  // the receipt from the run's STORED received_qty/defect_qty counts — kept for one release so an
  // old client (which stamps counts via UpdateProductionRun first) keeps working. New callers use
  // PostProductionRunReceipt: quantities travel IN the command, one atomic transaction, idempotent.
  rpc ReceiveProductionRun(ReceiveProductionRunRequest) returns (ReceiveProductionRunResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/{run_id}/receive"
      body: "*"
    };
  }
  // PostProductionRunReceipt is the atomic receiving command (Phase 4, receipt v1, final-only): in
  // ONE transaction it records the immutable receipt (with per-line counts referenced by the plan
  // lines' line_key), books the good units into each line's product stock (or the output material
  // for an auxiliary run), freezes the run's actual unit cost on the receipt, optionally seeds each
  // product's cost_price, transitions the run to `received`, and writes the idempotency record the
  // accounting worker posts from. Идемпотентность = replay: a retry with the same idempotency_key
  // and identical payload returns the original success (replayed=true); the same key with a
  // DIFFERENT payload is rejected with AlreadyExists. An all-scrap receipt (0 good, >0 defect) is
  // valid: nothing is stocked, the run still closes with the defect recorded.
  // Requires production:write AND products:write (it moves sellable stock).
  rpc PostProductionRunReceipt(PostProductionRunReceiptRequest) returns (PostProductionRunReceiptResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/{run_id}/receipts"
      body: "*"
    };
  }
  // ReverseProductionRunReceipt undoes ONE receipt of a run (Phase 6, plan 05): in one transaction
  // it takes the receipt's good units back OUT of each line's product stock (refused with the exact
  // per-variant shortfall when any unit was already sold — stock never goes negative and sold units
  // are never silently stolen from another batch; sold-but-unshipped units already left the
  // quantity at payment, so they block the same way), subtracts the receipt's counts from the
  // plan-grid rollups, books the scoped accounting compensation (Dr WIP / Cr FG for what the
  // receipt's live entry transferred — the manual/AP capitalisation deliberately stays: the
  // supplier invoice remains payable), rolls each affected product's cost_price back to the
  // tech-card estimate when THIS run still claims it and no live sibling receipt still stocks the
  // product (a later manual/run source is left untouched and reported as skipped), marks the
  // receipt reversed (a linked reversal row appears in the receipt history), recomputes the run
  // status (a live FINAL keeps it received; otherwise partially_received while live receipts
  // remain, in_progress when none) and records a production_run_event. Auxiliary-run receipts are
  // refused in v1 (their output landed in the material warehouse and compounded its moving
  // average; adjust or write off the material instead). A closed accounting period on the original
  // entry is refused (v1). Materials issued to the run are NOT returned — reversal un-receives
  // garments, it does not un-cut fabric. Requires production:write + products:write +
  // costing:write and a non-empty reason. Reversing an already-reversed receipt (or a reversal
  // row) fails with FailedPrecondition — the precondition runs under the run lock, which is also
  // the idempotency guard.
  rpc ReverseProductionRunReceipt(ReverseProductionRunReceiptRequest) returns (ReverseProductionRunReceiptResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/{run_id}/receipts/{receipt_id}/reverse"
      body: "*"
    };
  }
  // GetProductionRunMaterialPlan estimates the fabric/notion requirement of a run from its lines'
  // colourway norms × planned qty × (1 + wastage), against on-hand and already-issued stock (NF-06).
  // It is a plan-estimate before the marker; the real consumption comes from stock issues.
  rpc GetProductionRunMaterialPlan(GetProductionRunMaterialPlanRequest) returns (GetProductionRunMaterialPlanResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs/{run_id}/material-plan"};
  }
  // GetProductionRunCutPlan — кат-лист ПАРТИИ: деталь × колорвей × размер → сколько панелей
  // выкроить и из какого артикула. Проекция только на чтение поверх линий прогона и деталей карты
  // (по релизу, если прогон к нему привязан), сестра материального плана: тот отвечает «сколько
  // ткани заказать», этот — «что из неё выкроить». Денег в ответе нет, гейт — SectionProduction.
  rpc GetProductionRunCutPlan(GetProductionRunCutPlanRequest) returns (GetProductionRunCutPlanResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs/{run_id}/cut-plan"};
  }

  // НАСТИЛЫ ПРОГОНА (Ф4). Сознательно ОТДЕЛЬНЫЕ RPC, а не поле UpdateProductionRun: полная замена
  // детей внутри сохранения прогона — буквально причина смерти 0119 (0243:3-9), и она вернулась бы
  // в тот же день, когда настилы поехали бы рядом с production_run_cost, который до сих пор
  // full-replace (productionrun.go:356-359).
  rpc SaveProductionRunLay(SaveProductionRunLayRequest) returns (SaveProductionRunLayResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/{run_id}/lays"
      body: "*"
    };
  }
  rpc DeleteProductionRunLay(DeleteProductionRunLayRequest) returns (DeleteProductionRunLayResponse) {
    option (google.api.http) = {delete: "/api/admin/production-runs/{run_id}/lays/{lay_key}"};
  }
  rpc ListProductionRunLays(ListProductionRunLaysRequest) returns (ListProductionRunLaysResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs/{run_id}/lays"};
  }

  // ПРИЁМКА КРОЯ (Ф5б.5). Форма скопирована с трёх RPC настилов выше, и по той же причине: строка
  // приёмки — ребёнок настила, а полная замена детей внутри сохранения родителя есть причина смерти
  // 0119 (0243:3-9). Save — АПСЕРТ по паре (настил, размер), поэтому повторное сохранение той же
  // пары правит строку, а не заводит вторую; удаление адресуется той же парой.
  //
  // Список отдаётся ПО ПРОГОНУ, а не по настилу: цех сверяет заказанное с выкроенным по всему
  // прогону сразу, и список на один настил заставлял бы клиента собирать эту сверку из N ответов.
  rpc SaveProductionRunCutReceipt(SaveProductionRunCutReceiptRequest) returns (SaveProductionRunCutReceiptResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/{run_id}/lays/{lay_key}/cut-receipts"
      body: "*"
    };
  }
  rpc DeleteProductionRunCutReceipt(DeleteProductionRunCutReceiptRequest) returns (DeleteProductionRunCutReceiptResponse) {
    option (google.api.http) = {delete: "/api/admin/production-runs/{run_id}/lays/{lay_key}/cut-receipts/{size_id}"};
  }
  rpc ListProductionRunCutReceipts(ListProductionRunCutReceiptsRequest) returns (ListProductionRunCutReceiptsResponse) {
    option (google.api.http) = {get: "/api/admin/production-runs/{run_id}/cut-receipts"};
  }

  // CheckProductionRunReadiness — ГЕЙТ ГОТОВНОСТИ ПРОГОНА (Ф6). Not to be confused with
  // GetTechCardReadiness: that one is ADVISORY, takes only a card id, and sees colourways as two
  // aggregates; this one judges ONE CONCRETE FUTURE RUN — by its colourways and its quantities —
  // and its verdict is RE-COMPUTED SERVER-SIDE inside CreateProductionRun.
  //
  // Read-only: writes nothing. POST rather than GET because the input carries a GRID
  // (colourway × size × quantity), a repeating structure a query string has no honest
  // representation of. The read-only-POST precedent in this service is GenerateTechCardOperations.
  //
  // THE RESPONSE ALWAYS LISTS EVERY CHECK, INCLUDING THE ONES THAT PASSED. A list of refusals alone
  // never tells the operator WHAT the gate checks — and without that, the day blocking mode is
  // switched on (Ф6.9) reads as a breakage rather than as a policy taking effect.
  //
  // NO MONEY TRAVELS IN THE ANSWER, and that is worth saying out loud because GetProductionRun right
  // beside it strips costing: `coverage` is metres and pieces, `unit_coverage` is garments. Nothing
  // here is stripped for an account without costing:read, and there is nothing to strip.
  //
  // Classified rd(production), NOT rd(tech_cards): the one consumer is the run-creation modal and
  // the one meaning is «why can I not create this run». Whoever may create a run must be able to
  // read the reason it was refused, or a planner without tech-card access gets a dead control
  // stating an unfixable requirement. GetProductionRunMaterialPlan reads the very same card facts
  // and is classified the same way.
  rpc CheckProductionRunReadiness(CheckProductionRunReadinessRequest) returns (CheckProductionRunReadinessResponse) {
    option (google.api.http) = {
      post: "/api/admin/production-runs/readiness"
      body: "*"
    };
  }

  // Material warehouse (new-flow NF-01): on-hand balance + moving-average valuation and an
