  // UpsertStyleAssembly full-replaces a garment style's ASSEMBLY bill (WS7, §2.8): the auxiliary items
  // (labels/tags) that physically go on/into it. Distinct from packaging (on the shipment). Empty items
  // clears the bill. Every component must be an auxiliary tech card.
  rpc UpsertStyleAssembly(UpsertStyleAssemblyRequest) returns (UpsertStyleAssemblyResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/style-assembly/upsert"
      body: "*"
    };
  }
  // ListStyleAssembly returns a garment style's assembly bill, resolved with component name/aux_subtype
  // and the output material (the warehouse material consumed in production).
  rpc ListStyleAssembly(ListStyleAssemblyRequest) returns (ListStyleAssemblyResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/{style_id}/style-assembly"};
  }

  // UpsertTechCardOutputVariant creates or updates ONE colour variant of an AUXILIARY card's
  // warehouse output (0252): the stock bucket the card produces into in that colour. id=0 creates;
  // material_id=0 on create auto-creates the bucket ("<card> — <colour>", attributes copied from the
  // card's existing output material when it has one). Single-row on purpose, NOT a full replace — a
  // variant owns warehouse history.
  //
  // A NEW colour is always created ACTIVE and the request's `active` is ignored on create: a proto3
  // bool carries no presence, so honouring an omitted field would mint colours that pin the card's
  // purpose while staying invisible to every ACTIVE-only reader. Deactivate with a follow-up update,
  // which does honour `active` — that retires the colour without touching its stock.
  //
  // Refused with FailedPrecondition for a sellable card, a released card, a colour already on the
  // card, a bucket another variant (or another card's single output material) owns, or a unit that
  // disagrees with the card's other colours. An archived or unitless material is InvalidArgument.
  rpc UpsertTechCardOutputVariant(UpsertTechCardOutputVariantRequest) returns (UpsertTechCardOutputVariantResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/output-variant/upsert"
      body: "*"
    };
  }
  // DeleteTechCardOutputVariant removes a colour variant outright. Deactivating it (active=false) is
  // the normal retirement; deleting is the "this colour was a mistake" action and the only way to
  // un-pin the card's auxiliary purpose. The warehouse bucket itself survives with its stock and
  // moving average — only this card's claim on it goes. Once runs can be planned by colour, a
  // variant a run line references is refused with FailedPrecondition ("deactivate it instead").
  rpc DeleteTechCardOutputVariant(DeleteTechCardOutputVariantRequest) returns (DeleteTechCardOutputVariantResponse) {
    option (google.api.http) = {delete: "/api/admin/tech-card/output-variant/{id}"};
  }

  // SaveTechCardMarker creates (id=0) or fully replaces (id>0) ONE saved раскладка (marker, 0257):
  // a measured fabric layout of one size's pieces, self-contained geometry included. Last-write-wins
  // on purpose — no lock_version of its own, and the write does NOT bump tech_card.lock_version
  // (saving a раскладка from the nesting modal must not 409 the operator's open card form).
  // Refused with FailedPrecondition for a released card, an incomplete layout
  // (placed_count < total_count — not a consumption norm), or a (card, size, name) already taken;
  // a size outside the card's range or an unknown bom_line_key is InvalidArgument.
  rpc SaveTechCardMarker(SaveTechCardMarkerRequest) returns (SaveTechCardMarkerResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/marker/save"
      body: "*"
    };
  }
  // GetTechCardMarker returns one marker WITH its layout blob — the only place the blob travels
  // (summaries ride GetTechCard.markers). A stored blob the current schema cannot parse degrades
  // to summary-only with a warning rather than failing the read (hero-v2 style).
  rpc GetTechCardMarker(GetTechCardMarkerRequest) returns (GetTechCardMarkerResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/marker/{id}"};
  }
  // DeleteTechCardMarker removes a saved раскладка. Markers are measurements, not structural
  // references — nothing else points at them, so delete is plain (released cards still refuse).
  rpc DeleteTechCardMarker(DeleteTechCardMarkerRequest) returns (DeleteTechCardMarkerResponse) {
    option (google.api.http) = {delete: "/api/admin/tech-card/marker/{id}"};
  }
  // SetTechCardMarkerNorm designates (or clears) the НОРМИРОВОЧНАЯ раскладка of a card FOR THE CLOTH
  // that раскладка measures. Designating CLEARS the flag off the previous norm of the same cloth in
  // one transaction — there is never more than one norm per (card, BOM line).
  //
  // A DEDICATED RPC, not a field on SaveTechCardMarker, for two independent reasons. (1) It is an
  // action on the CARD, not on the раскладка: it has a side effect on a sibling row, and hiding such
  // an effect inside «save this geometry» would let a routine placement fix seize the norm silently.
  // (2) A boolean on the Insert would arrive as `false` from a stale bundle and CLEAR the norm while
  // knowing nothing about it — precisely the failure that forced fabric_direction to become optional
  // in Ф1.
  //
  // Re-designating RECOMPUTES NOTHING. A recipe stores a COPIED number with provenance
  // consumption_source='marker' and holds no reference to the marker it came from; there is no
  // server-side «apply marker» at all. Applying stays a deliberate operator action, and the response
  // carries recipes_not_recalculated = true so the screen says so out loud instead of leaving the
  // operator to assume the costing moved by itself.
  //
  // Refused with FailedPrecondition on a released card (marker designation is card content), and
  // NotFound for a marker that does not exist.
  rpc SetTechCardMarkerNorm(SetTechCardMarkerNormRequest) returns (SetTechCardMarkerNormResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/marker/{id}/norm"
      body: "*"
    };
  }

  // PutTechCardPatternSizeIndex stores the size tokens the CLIENT parsed out of the DXF block names
  // of one fabric scope (Ф6.3), so the server-side readiness gate can answer «is there a pattern for
  // this size» honestly instead of counting tech_card_size_pattern.size_id — a column the client
  // fills with the smallest size of the range as a pure STORAGE ARTEFACT, which is why the existing
  // `patterns` row of GetTechCardReadiness lies on every graded card.
  //
  // THE SERVER DOES NOT PARSE DXF AND NEVER WILL. The heuristic that decides «which token in this
  // file is a size» (deriveBlockSizes) stays in ONE place, in the client. What crosses the wire is
  // its RESULT.
  //
  // The client sends TOKENS and the LIST OF SHEETS it parsed. The fingerprint of that sheet set is
  // computed BY THE SERVER out of its own tech_card_size_pattern rows, so «I parsed exactly these
  // files» cannot be forged, and re-uploading any sheet makes the index stale automatically — the
  // same device 0268 used to close the blob-version exemption forgery.
  //
  // AN EMPTY TOKEN SET IS A LEGAL ANSWER and means «the files carry no size coding» (one size per
  // file yields no tokens at all: deriveBlockSizes demands at least two size tails on one name stem).
  // It reads as NO VERDICT, never as «there are no sizes».
  //
  // wr(tech_cards): this WRITES a derived fact about the card's patterns, from the patterns tab, in
  // the same session as the upload. A production planner must not be able to write it — the index
  // feeds the gate, and the right to rewrite it is the right to clear one's own blocker.
  rpc PutTechCardPatternSizeIndex(PutTechCardPatternSizeIndexRequest) returns (PutTechCardPatternSizeIndexResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/{tech_card_id}/pattern-size-index"
      body: "*"
    };
  }

  // SaveTechCardPieceAreas stores the MEASURED AREAS of one fabric scope's cut pieces (Ф0) — the
  // geometry the server needs to DERIVE a fabric consumption norm instead of demanding that somebody
  // type one.
  //
  // THE PROBLEM IT SOLVES. A card can be complete — priced BOM, parsed patterns, every piece
  // assigned to a fabric in the colourway recipe — and still cost zero, because money is computed
  // only from a recipe row carrying an explicit norm, and a piece-bound row deliberately carries
  // none (T8: «расход — свойство изделия»). The missing link was never data the operator failed to
  // enter; it was the area, which existed only in the browser's memory because DXF is parsed there
  // and only there.
  //
  // SAME DIVISION OF LABOUR AS THE SIZE INDEX ABOVE: the client measures, the server stores, and the
  // half that could be forged in the dangerous direction is computed server-side. The client says
  // WHICH SHEETS it measured; the server fingerprints that set from its own tech_card_size_pattern
  // rows and refuses a mismatch in both directions. Re-uploading any sheet then makes the areas read
  // as STALE by itself.
  //
  // ONE SCOPE PER CALL, FULL REPLACE OF THAT SCOPE. A card's fabrics are parsed independently and a
  // pack download can succeed for one sheet and fail for another, so a card-wide replace would let a
  // failed lining download silently delete a good main-fabric measurement.
  //
  // A PARTIAL SET IS REFUSED, NOT STORED. A missing piece lowers the garment's area, a lower area
  // lowers the norm, and an understated norm is discovered in the warehouse rather than on screen.
  //
  // AREAS ARE PER ONE INSTANCE OF THE CONTOUR — pieces_per_garment is applied by the reader. It
  // lives on the piece, changes with an ordinary card edit, and baking it in here would make a
  // stored number quietly wrong after every such edit.
  //
  // wr(tech_cards): the same right as the size index — this writes a derived fact about the card's
  // patterns, from the patterns tab, and it feeds costing and the release gate.
  rpc SaveTechCardPieceAreas(SaveTechCardPieceAreasRequest) returns (SaveTechCardPieceAreasResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/{tech_card_id}/piece-areas"
      body: "*"
    };
  }

  // ListTechCardFabricDirectionGaps is the worklist of кампания Д1: every roll-goods BOM line whose
  // НАПРАВЛЕНИЕ ТКАНИ nobody has set, grouped by tech card. fabric_direction has existed on
  // tech_card_bom_item since 0073 and fed nothing but the MATERIALS digest, so it is unset on almost
  // every stored line; Ф1 makes an unset direction refuse the save of a раскладка whose geometry
  // needs judging — including the re-save of a marker that saves fine today. This report is what
  // makes the fill-in campaign finishable and what says when it is finished; see total_lines for the
  // exact go/no-go, which is NOT «total_lines == 0» on a default call.
  //
  // Read-only. Requires tech-cards read: it is the BOM tab's own data, seen across cards.
  rpc ListTechCardFabricDirectionGaps(ListTechCardFabricDirectionGapsRequest) returns (ListTechCardFabricDirectionGapsResponse) {
    option (google.api.http) = {get: "/api/admin/tech-card/fabric-direction-gaps"};
  }

  // GetWorkshopSettings returns «дом настроек цеха» (Ф2.5, 0272): the shop-floor constants that
