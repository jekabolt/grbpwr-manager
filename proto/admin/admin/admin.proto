// GenerateTechCardOperationsRequest asks the AI to draft sewing operations for a tech card from a
// free-text description. tech_card_id supplies grounding context (the card's pieces, BOM and type
// are loaded server-side, read-only); description is the technologist's plain-language brief.
message GenerateTechCardOperationsRequest {
  int32 tech_card_id = 1; // context only; the card is loaded to ground the model, never modified
  string description = 2; // free-text description of how the garment is assembled (required)
}

// GenerateTechCardOperationsResponse is a PROPOSED draft: operations in the exact shape the card
// stores (common.TechCardOperation), for the technologist to review, edit and save via
// UpdateTechCard. This call persists nothing itself.
message GenerateTechCardOperationsResponse {
  repeated common.TechCardOperation operations = 1; // drafted operations (unsaved proposal)
  string model = 2; // the model that produced the draft (provenance)
  string notes = 3; // optional model notes / assumptions for the reviewer
}

// GetTechCardConstructionAuditRequest — which saved card to audit. Nothing else: the machine layer
// has no options, and a report you can configure is a report whose two runs cannot be compared.
message GetTechCardConstructionAuditRequest {
  int32 tech_card_id = 1;
}

// TechCardAnalysisFinding is ONE finding of the CONSTRUCTION review — machine or model, one shape.
// The two RPCs never mix sources in one response, but the client draws both in a single list and
// has to badge them apart, hence `source` on the finding itself.
//
// CATEGORY AND SEVERITY TRAVEL AS STRINGS, NOT ENUMS, AND THAT IS DELIBERATE. The taxonomy grows;
// an enum member a generated client does not know is dropped SILENTLY by protojson (incident Ж7,
// the same argument that made `work` a string). A finding that arrives with an unfamiliar category
// must reach the screen as text, not vanish.
message TechCardAnalysisFinding {
  // source: "machine" (deterministic code) | "model" (LLM, past the verifier).
  string source = 1;
  // category. Eight are shared with the model: missing_step | coarse_step | method | sequence |
  // naming | bom_mismatch | parameter | question. THREE more are produced by the machine alone —
  // readiness (data nobody has filled in yet), integrity (a soft link pointing nowhere) and
  // assembly (a predicted refusal of the release rule). A client must render an unknown value as
  // text rather than assume this list is final.
  string category = 2;
  // severity: "blocker" | "error" | "warning". `question` is NOT a severity — it is a category.
  string severity = 3;
  // title, <= 90 chars, English. The one line shown collapsed.
  string title = 4;
  // detail — the explanation: what was read, what it says, why that is a problem.
  string detail = 5;
  // evidence — display only. The verifier does NOT check these and drops nothing over them.
  repeated string evidence = 6;
  // refs — anchors the client turns into deep links: "op:460" | "unit:base" | "piece:SL_INS_L" |
  // "bom:подкладка" | "card". Never empty: a MODEL finding whose anchors all fail to resolve is
  // dropped by the verifier, and a machine finding without one would be a bug in the check.
  repeated string refs = 7;
  // insert_after — only on category=missing_step: "op:120" | "start" | "".
  string insert_after = 8;
  // suggestion — what to do about it.
  string suggestion = 9;
  // confidence — model: "certain" | "likely" | "needs_owner". Machine: "" for a deterministic fact,
  // "heuristic" for a guess that is allowed to be wrong and carries a badge saying so.
  string confidence = 10;
}

// GetTechCardConstructionAuditResponse is one machine-layer run. Everything in it is recomputed
// from the stored card; nothing is remembered between runs, which is why there are no dismissals
// here — a machine finding disappears when its cause disappears.
message GetTechCardConstructionAuditResponse {
  // findings — machine findings only (source="machine"). On a card in `draft` the whole readiness
  // class arrives ALREADY COLLAPSED into a single "Not yet ready for release: …" finding: on a
  // draft those are not defects, they are work not yet done.
  repeated TechCardAnalysisFinding findings = 1;
  // operation_fingerprints — operation_number -> fp8. The client stores them with an AI run and
  // compares them on the next audit to tell "this operation changed since the run" from "the
  // number moved". The payload is the step's ASSEMBLY SHAPE (output unit + inputs in display
  // order) and nothing else, so two steps of the same shape share a fingerprint by design.
  map<int32, string> operation_fingerprints = 2;
  // not_checked — what this run did NOT verify, and why. Silence that is indistinguishable from
  // "checked and clean" is the most expensive lie an audit can tell, so it is said out loud.
  repeated string not_checked = 3;
  // ai_enabled — whether this deployment has the LLM layer configured at all (OPENROUTER_API_KEY).
  // It rides on the audit because the audit is the one call the CONSTRUCTION tab always makes:
  // without it the client could only learn that AI is unavailable by pressing Analyze and being
  // refused. False = show the Analyze button disabled with a quiet reason, do not call it.
  bool ai_enabled = 4;
}

// AnalyzeTechCardConstructionRequest — which saved card to run the model over. As with the audit,
// there is nothing to configure: two runs of a report you can tune are two reports.
message AnalyzeTechCardConstructionRequest {
  int32 tech_card_id = 1;
}

// AnalyzeTechCardConstructionResponse is one LLM run. It is ALWAYS a 200: read ai_status first, and
// only then the findings.
message AnalyzeTechCardConstructionResponse {
  // findings — model findings only (source="model"), already past the verifier. Empty whenever
  // ai_status is not "ok", and legitimately empty when it is: a card the model found nothing wrong
  // with is a correct and complete answer.
  repeated TechCardAnalysisFinding findings = 1;
  // ai_status — ok | not_configured | model_unavailable | failed | invalid_output | skipped.
  //   ok               — the model answered and the answer survived verification.
  //   not_configured   — this deployment has no OPENROUTER_API_KEY. Nothing was called or spent.
  //   model_unavailable— the provider does not serve `model`. A CONFIGURATION fault, not weather:
  //                      say the slug out loud, do not offer "try again later".
  //   failed           — timeout or transport. This one IS weather; retry is honest.
  //   invalid_output   — the model answered something unusable (cut off by the token ceiling, not
  //                      JSON, or so many findings failed verification that the run is not
  //                      trustworthy). There is no auto-retry: paying twice for the same fault
  //                      without a diagnosis is the same fault twice.
  //   skipped          — the card carries no assembly fact to analyse, so no call was made.
  string ai_status = 2;
  // model — the slug that was actually sent (OPENROUTER_MODEL_ANALYSIS when set, otherwise the
  // shared one). It is on the wire so a "model_unavailable" verdict names the knob to turn.
  string model = 3;
  // dropped_bad_ref — findings discarded because not one of their anchors resolved on this card.
  int32 dropped_bad_ref = 4;
  // dropped_contradiction — findings discarded for contradicting the recomputed facts, or for
  // repeating a machine finding already on the screen.
  int32 dropped_contradiction = 5;
  // not_checked — what the MODEL says it did not check. The machine layer's own list travels with
  // the audit; this one is the model's.
  repeated string not_checked = 6;
  // summary — the model's one-paragraph verdict.
  string summary = 7;
  // operation_fingerprints — operation_number -> fp8 AT THE MOMENT OF THIS RUN. The client keeps
  // them with the findings and compares them against a later audit to grey out a finding whose
  // operation has changed since the model looked at it.
  map<int32, string> operation_fingerprints = 8;
}

// AddTechCardIssueRequest files one issue. It carries no status and no callout: a newly filed issue
// is open by definition, and the callout link belongs to the sketch editor, not to this gesture.
message AddTechCardIssueRequest {
  int32 tech_card_id = 1;
  // operation_number — the human step number this is about (оп. 460). 0 = an issue about the card
  // as a whole, stored as no link at all rather than as step zero.
  int32 operation_number = 2;
  // severity — HIGH | MEDIUM | LOW.
  string severity = 3;
  // description — what is hard or impossible. Required.
  string description = 4;
}

// AddTechCardIssueResponse returns the new row's id so the client can address it without re-reading
// the whole card.
message AddTechCardIssueResponse {
  int32 issue_id = 1;
}

// OperationWorkCatalogItem — одна работа каталога.
//
// ВСЁ СТРОКАМИ-ТОКЕНАМИ, НИ ОДНОГО ENUM. Словарь работ — данные, а не контракт: он растёт
// INSERT-миграцией, и клиент, не знающий нового токена, обязан довезти его до экрана текстом, а не
// потерять. То же и у verb / stage / machine_mode / machines: они сверяются с серверными словарями
// (entity.OperationTypeTokens, стадии, fixed|ask|none, entity.MachineTypeTokens) на записи каталога,
// то есть на миграции, и повторять их членами enum значило бы завести второй словарь того же.
message OperationWorkCatalogItem {
  string token = 1; // идентичность; уезжает в отпечаток строки шага и не меняется никогда
  string verb = 2; // глагол шага, которому работа принадлежит; часть идентичности
  string stage = 3; // группа по СТАДИИ работы, не по железу
  string label = 4; // имя в интерфейсе и на печатном листе; представление
  string machine_mode = 5; // fixed | ask | none — задаёт ли работа вопрос «на чём»
  string default_machine = 6; // чем заполнить «на чём»; пусто при machine_mode = none
  repeated string machines = 7; // допустимые машинки; закрыт только при machine_mode = ask
  repeated string syn = 8; // слова поиска, RU и EN
  int32 sort = 9; // порядок в пикере
  // retired — пункт СНЯТ: в пикере не предлагается, но отдаётся всегда, потому что строка шага,
  // уже несущая этот токен, обязана открываться и печататься своим именем, а не сырым токеном.
  bool retired = 10;
}

// OperationWorkDefaultItem — один глобальный дефолт свойства работы.
message OperationWorkDefaultItem {
  string work_token = 1;
  string field = 2; // имя колонки шага (topstitch_width_mm, …) из реестра default_fields
  string value = 3;
}

// OperationWorkSmvHint — «в прошлый раз было столько-то»: ГОУСТ в пустом поле нормы времени, не
// значение и не дефолт. SMV зависит от изделия, а не только от работы, поэтому запоминать её как
// дефолт нельзя — реестр default_fields её и не содержит.
message OperationWorkSmvHint {
  string work_token = 1;
  google.type.Decimal last_smv = 2; // норма последнего шага с этой работой, минуты
  string card_name = 3; // на какой карточке она стояла — без этого подсказка безадресна
}

message GetOperationWorkCatalogRequest {}

message GetOperationWorkCatalogResponse {
  repeated OperationWorkCatalogItem works = 1;
  repeated OperationWorkDefaultItem defaults = 2;
  repeated OperationWorkSmvHint smv_hints = 3;
  // default_fields — ЗАКРЫТЫЙ реестр полей, у которых бывает глобальный дефолт: имена колонок шага
  // в порядке семейств свойств. Отдаётся сервером затем, чтобы жест «запомнить как дефолт»
  // рисовался по одному списку с тем, который его принимает: второй, клиентский, разошёлся бы
  // молча, и человек нажимал бы кнопку, которая всегда отвечает отказом.
  repeated string default_fields = 4;
}

// RememberOperationWorkDefaultRequest записывает ИЛИ снимает один дефолт.
message RememberOperationWorkDefaultRequest {
  string work_token = 1; // работа каталога; снятая (retired) тоже принимается — её дефолт ещё читают старые строки
  string field = 2; // одно из default_fields; машинная настройка отвергается по имени
  string value = 3; // проверяется теми же диапазонами и словарями, что и на шаге; при clear игнорируется
  // clear снимает сохранённый дефолт. Отдельный флаг, а не «пустое значение»: пустая строка на
  // проводе неотличима от «поле не заполнили», и снятие дефолта стало бы возможным по случайности.
  bool clear = 4;
}

message RememberOperationWorkDefaultResponse {}

