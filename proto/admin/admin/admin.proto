  // dry_run = true: посчитать вердикт и НЕ удалять. Ответ идентичен по форме, deleted = false.
  bool dry_run = 2;
}

// SampleDeletionEntry — одна запись вердикта удаления семпла: стабильный код, готовая фраза,
// количество. Фраза собирается на СЕРВЕРЕ и печатается клиентом дословно — второй словарь на
// клиенте разошёлся бы с этим в первый же день, и два экрана стали бы называть один факт
// по-разному.
message SampleDeletionEntry {
  // Стабильный код. Блокеры: material_outstanding | material_over_returned | fitting | referenced.
  // Каскад: media | substitution. Сироты: orphan_material_movement | orphan_dev_expense |
  // orphan_task | orphan_next_round | orphan_style_cost.
  //
  // orphan_style_cost — единственная сирота, за которой стоят ДЕНЬГИ, а не строки: количество
  // материала вернулось на склад, а стоимость — нет (часть выдачи ушла без известной цены, и
  // возврат её оценить не может). Сводка стиля считает сэмплирование джойном по семплу, поэтому
  // вместе с семплом эта сумма из отчёта уйдёт. count там всегда 1: это одна сумма, а не набор.
  //
  // referenced — сетка безопасности против ушедшей вперёд схемы: FK с RESTRICT, которого нет в
  // перечислении сервера. Он называет своё незнание, а не факт, и приходит с count = 0.
  string reason = 1;
  // Готовая фраза для экрана: «не возвращено на склад: 2.4 m «Wool Melton 340»».
  string text = 2;
  // Сколько объектов стоит за записью (материалов, примерок, фотографий). 0 значит «отсюда не
  // видно» и приходит только с reason = referenced.
  int32 count = 3;
  // ВЫХОД из блокера, готовой фразой: «верните материал на склад из панели МАТЕРИАЛЫ этого семпла».
  // Заполнен только у блокеров (каскаду и сиротам выходить неоткуда — они не отказ).
  //
  // Едет вместе с фактом, а не пишется на клиенте, потому что зависит от состояния, которого клиент
  // не знает целиком: у семпла в статусе «списан» совет «верните материал» невыполним — склад
  // возврат по нему не примет, и выход начинается со смены статуса. Тот же текст сервер кладёт в
  // field violation отказа, так что диалог и ошибка говорят одно и то же слово в слово.
  string how_to_fix = 4;
}

message DeleteSampleResponse {
  // Разрешает ли вердикт удаление. При dry_run = false и deletable = false ответа не будет вовсе —
  // придёт FailedPrecondition; поле осмысленно прежде всего в сухом прогоне.
  bool deletable = 1;
  // Что держит удаление. Пусто ⟺ deletable.
  repeated SampleDeletionEntry blockers = 2;
  // Что уйдёт ВМЕСТЕ с семплом (ON DELETE CASCADE — его собственные строки): фотографии, замены
  // материалов.
  repeated SampleDeletionEntry cascade = 3;
  // ТРЕТЬЯ КАТЕГОРИЯ, ни блокер, ни каскад: записи с ON DELETE SET NULL переживут удаление и
  // ПОТЕРЯЮТ семпл. Движения склада остаются намеренно — лента прихода-расхода это учёт, и стирать
  // из неё строки задним числом значит переписывать остатки прошлых дней; к моменту удаления они
  // уже сошлись в ноль. Dev-расходы остаются деньгами карточки и теряют только адрес.
  repeated SampleDeletionEntry orphans = 4;
  // Действительно ли строка удалена. false в сухом прогоне.
  bool deleted = 5;
}

message GetSampleRequest {
  int32 id = 1;
}

message GetSampleResponse {
  common.Sample sample = 1;
}

message ListSamplesRequest {
  int32 limit = 1;
  int32 offset = 2;
  common.OrderFactor order_factor = 3;
  int32 tech_card_id = 4; // 0 = all styles (cross-style «sewing queue»); >0 = one style's samples
  string status = 5; // optional filter: planned | in_sewing | done | scrapped ("" = any)
  string purpose = 6; // optional filter: proto | fit | sms | pp ("" = any)
}

message ListSamplesResponse {
  repeated common.Sample samples = 1;
  int32 total = 2;
}

// TASK MANAGER

message AddTaskRequest {
  common.TaskInsert task = 1; // content
  common.TaskBoard board = 2; // required: the department lane the card is created in
  common.TaskStatus status = 3; // initial column; TASK_STATUS_UNKNOWN = server default (TODO)
}

message AddTaskResponse {
  int32 id = 1;
}

message GetTaskRequest {
  int32 id = 1;
}

message GetTaskResponse {
  common.Task task = 1;
  // Resolved library attachments, carrying freshly minted presigned urls.
  // common.Task itself only carries their ids: it is reused in contexts that get
  // persisted, and a url with a 6-12h life must never be written down anywhere.
  repeated LibraryFile files = 2;
}

// LibraryFile is one file in the shared library.
//
// The three url fields are minted per response and expire — they are never
// persisted, which is why this message lives in admin.proto rather than common.*
// (common messages get serialised into durable release snapshots, and a stored
// presigned url would be a link that rots).
message LibraryFile {
  int32 id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  string uploaded_by = 6;
  repeated FileTopic topics = 7;
  google.protobuf.Timestamp created_at = 8;
  // url views the file in place. EMPTY for anything not inline-safe: svg and html
  // would execute on the bucket's origin, so they get download_url only.
  string url = 9;
  // download_url always works and carries a content-disposition: attachment.
  string download_url = 10;
  // preview_url is the browser-rendered thumbnail; empty when there is none (the
  // render failed, or the type has no sensible preview). A file without one is
  // still perfectly usable — the grid shows an extension plate instead.
  string preview_url = 11;
  google.protobuf.Timestamp urls_expire_at = 12;
  // uploaded_by_id resolves the uploader to a LIVE account, next to the
  // uploaded_by STRING above, which is the historical fact. They are not
  // duplicates: the string outlives the account (a file keeps its author after
  // the person leaves), the id stops existing with it (0 = no such account any
  // more). Initials, specialties and the "may edit owners" circle all read the id.
  int32 uploaded_by_id = 13;
  // owners are the people who KEEP this file — who to ask when it goes stale.
  // Several are legal, and so is none: an empty list is honest, a
  // randomly-assigned owner is not.
  repeated AdminRef owners = 14;
  // comments_count is the size of the file's discussion, printed on the tile and
  // the card. It rides on the file instead of costing a call per tile: the list
  // resolves it for a whole page in ONE grouped query.
  int32 comments_count = 15;
  // access_level is team | people | link. It only ever reaches somebody who can
  // already SEE the file (a file one may not see is not in the answer at all), so
  // the level is not a secret from its reader — it is what badges the tile «по
  // ссылке» / «ограничен» instead of making the person open the card to find out.
  string access_level = 16;
  // content_updated_by / content_updated_at are «кто правил последним» for a note
  // edited THROUGH THE EDITOR. They stand next to uploaded_by rather than
  // replacing it: the upload is one fact, the last edit another. Empty/unset on a
  // note that arrived as an upload and was never edited here — the card then
  // falls back to the uploader, which is the truth in that case.
  string content_updated_by = 17;
  google.protobuf.Timestamp content_updated_at = 18;
  // content_excerpt is the first lines of a note's text: the tile's preview where
  // there is no picture to render at all (the one documented exception to «no
  // preview → extension plate»). Written on save through the editor; empty for
  // .md that arrived as an upload, because reading text on the streaming upload
  // path would complicate the single hot path for a rare case.
  string content_excerpt = 19;
  // roles is what this file is IN EACH PROJECT it belongs to — one entry per
  // (project, role) pair, and only for topics of kind `project` that actually
  // carry a role. NOT a flat list of role labels, and that distinction is the
  // whole feature: a file may be «исходники» in one shoot and «идея» in another,
  // and a flat set would make «съёмка × идея» find it in the shoot too.
  repeated LibraryFileRole roles = 20;
}

// FileTopic is a topic LABEL, not a folder.
message FileTopic {
  int32 id = 1;
  string name = 2;
  int32 files_count = 3;
  // What this topic is about. Empty for most of them; the field is what lets a
  // label stand in for a project page without inventing a project entity.
  string description = 4;
  // kind is "plain" | "project". A string rather than an enum for the same reason
  // access_level below is one: the column is an ENUM in the database, the set is
  // closed there, and anything else is refused rather than interpreted.
  //
  // Empty means the same as "plain" — a topic stored before this field existed.
  string kind = 5;
  // starts_at / ends_at are the project's dates as YYYY-MM-DD, empty when unset.
  // A date, not a timestamp: «12–14 сентября» has no time zone, and giving it one
  // would only raise the question of whose midnight the day starts at.
  string starts_at = 6;
  string ends_at = 7;
  // archived hides the topic from the chips and the pickers while leaving it on
  // the topics screen and reachable by direct link. It exists because projects
  // ACCUMULATE and cannot be deleted (a project always has files, and the foreign
  // key on the topic has no cascade): without an archive the chip rail grows
  // monotonically and never shrinks.
  bool archived = 8;
}

// LibraryFileRole is «what this file is in THIS project» — a pair, not a label.
//
// The role lives on the (file, topic) LINK ROW, and this message is the shape of
// that row on the wire. A flat list of role labels on the file would lose the
// pairing: a photo that is «отобранное» in the shoot and «референс» in the
// lookbook would carry both labels, and «съёмка × референс» would find it —
// silently and wrongly. There is at most one role per (file, project), which is
// not a rule anybody enforces: UNIQUE(file_id, topic_id) already gives exactly
// one row per pair, and a row has exactly one role_id.
message LibraryFileRole {
  int32 project_topic_id = 1;
  // The project's name, so a tile can print «осень 2026 · исходники» without a
  // second lookup into the topics rail.
  string project_topic_name = 2;
  int32 role_id = 3;
  string role_name = 4;
}

// FileRole is one entry of the closed role vocabulary OF ONE PROJECT.
//
// The vocabulary is closed (only UpsertFileRole creates a role) and, since the
// per-project wave, it BELONGS TO A PROJECT: «исходники» in a shoot and
// «исходники» in a lookbook are two different rows that merely spell the same.
// The cross-project question «все исходники по всем съёмкам» therefore stops
// being a question about one entity and becomes a SEARCH BY WORD — the search
// input already matches role names — which finds every project where the role is
// NAMED so, and stays silent about the one where it was renamed. That price is
// the direct cost of «у каждого проекта свои», and it is accepted.
message FileRole {
  int32 id = 1;
  string name = 2;
  // sort_order is the order of the sections on a project's page; equal values
  // fall back to the name.
  int32 sort_order = 3;
  bool archived = 4;
  // files_count is how many files carry this role IN ITS PROJECT — the role
  // belongs to one project, so «in this role» and «in this role in this project»
  // are the same question. Counted under the visibility predicate, like every
  // other count in this library, so different people legitimately see different
  // numbers.
  int32 files_count = 5;
  // project_topic_id is the OWNER. 0 only ever appears on the dead rows the
  // migration left behind (a role that existed but was never used anywhere): they
  // are reachable by no screen and assignable by no write — the composite foreign
  // key (topic_id, role_id) -> file_role (project_topic_id, id) makes a link row
  // pointing at an ownerless role inexpressible.
  int32 project_topic_id = 6;
}

message GetLibraryFileRequest {
  int32 id = 1;
}

message GetLibraryFileResponse {
  LibraryFile file = 1;
}

// LibraryFileSort is the grid's sort order for the columns that are not time.
// UNKNOWN keeps the default (by created_at, direction from order_factor), which
// is what a library is normally read by.
enum LibraryFileSort {
  LIBRARY_FILE_SORT_UNKNOWN = 0;
  LIBRARY_FILE_SORT_NAME = 1; // A→Z
  LIBRARY_FILE_SORT_SIZE = 2; // largest first
}

// LibraryFilePersonRole is the CAPACITY a person is on record for a file in.
//
// «Файлы Паши» is TWO questions, and answering them as one loses the difference
// that matters:
//
//   - ЗАГРУЗИЛ — the historical fact. The row carries a `uploaded_by` STRING next
//     to the LIVE `uploaded_by_id` link precisely because they have different
//     lifetimes: the name outlives the account and is freed for the next
//     namesake, the link is nulled by the deletion.
//   - ВЕДЁТ — current responsibility, the `owners` list: who to ask when the file
//     goes stale. It changes without the file changing at all.
//
// So the filter is ONE person plus a role, never two independent people filters:
// a person is asked about once, and the role says which of their two relations
// to the file is meant.
enum LibraryFilePersonRole {
  // UNKNOWN is «в любой роли»: uploaded OR owns. It is the default because that
  // is what «где он числится» means — a person looking for what a colleague has
  // to do with a file does not yet know in which of the two ways.
  LIBRARY_FILE_PERSON_ROLE_UNKNOWN = 0;
  LIBRARY_FILE_PERSON_ROLE_UPLOADED = 1; // он залил этот файл
  LIBRARY_FILE_PERSON_ROLE_OWNER = 2; // он ведёт этот файл
}

message ListLibraryFilesRequest {
  // topic_id filters to one topic; 0 means no topic filter.
  int32 topic_id = 1;
  // untopiced selects only files carrying no topic at all («Разобрать»). Takes
  // precedence over topic_id — they are two views of the same rail.
  bool untopiced = 2;
  // search matches the file name OR the name of a topic the file carries. Both,
  // because graphic PDFs exported from design tools carry no extractable text at
  // all, so names and topics are the only things there are to match on. The
  // implementation is a LIKE today; FULLTEXT or embeddings can replace it behind
  // this same field without changing the contract.
  string search = 3;
  int32 limit = 4;
  int32 offset = 5;
  common.OrderFactor order_factor = 6;
  // topic_ids is an INTERSECTION filter: a file matches only when it carries ALL
  // of them. Union would be the wrong default here — picking a second chip is how
  // a person NARROWS a grid of hundreds, and an OR-filter grows it instead.
  // Bounded at 20; each id costs one EXISTS subquery.
  //
  // Precedence when several filters arrive at once: untopiced > topic_ids >
  // topic_id. The single-topic field stays for the links already in circulation.
  repeated int32 topic_ids = 7;
  // sort_by picks a non-time ordering. UNKNOWN = by created_at, and order_factor
  // keeps applying to THAT ordering only — name and size have their own fixed
  // directions (A→Z, largest first), so the two controls never contradict.
  LibraryFileSort sort_by = 8;
  // person_id narrows the grid to the files ONE person is on record for, in the
  // capacity person_role names. It is an ACCOUNT id, not a name — that is the
  // whole point of the field, and the reason it is not folded into `search`
  // above. `search` matches the uploader as a STRING, which is right for the one
  // input a person types into («что заливал Паша») and wrong as a filter: the
  // string outlives the account, admins.username is UNIQUE and frees the name on
  // deletion, so a namesake hired later would inherit the whole history of the
  // person who left. A picked account cannot be misread that way.
  //
  // 0 (and anything non-positive) means NO person filter, not «nobody»: the
  // control is optional, and a stray 0 from a url is not worth an error over.
  // An id that belongs to no account is not an error either — it just matches
  // nothing. Refusing it would turn the field into an oracle for «does account
  // N exist», answerable by counting up.
  int32 person_id = 9;
  // person_role picks WHICH relation to the file is meant; UNKNOWN = either.
  // Ignored while person_id is unset — a role alone filters nothing.
  LibraryFilePersonRole person_role = 10;
  // project_topic_id narrows to one project (a topic of kind `project`); 0 = no
  // project filter. SINGLE-valued, unlike topic_ids: two projects through AND are
  // «files lying in BOTH shoots», which is almost always empty, and a control that
  // reliably returns nothing is a defect rather than a feature. It is technically
  // an ordinary topic id, so it composes with topic_ids rather than replacing it.
  int32 project_topic_id = 11;
  // role_id narrows to files carrying that role. ALONE it is the cross-project
  // question («все исходники по всем съёмкам»); TOGETHER with project_topic_id it
  // is one section of a project's page — and the two conditions then apply to THE
  // SAME link row, which is what makes the pair exact. 0 = no role filter.
  int32 role_id = 12;
  // without_role selects the files that are IN the project with no role yet — the
  // intake heap a drop lands in. Only meaningful together with project_topic_id:
  // on its own it would mean «almost the whole library», and it is REFUSED rather
  // than ignored. A quietly ignored filter shows MORE than was asked for, and in
  // this library that is how a name leaks.
  bool without_role = 13;
}

message ListLibraryFilesResponse {
  repeated LibraryFile files = 1;
  int32 total = 2;
}

message UpdateLibraryFileRequest {
  int32 id = 1;
  string file_name = 2;
  // topic_ids is the FULL replacement set, not a delta.
  repeated int32 topic_ids = 3;
  // new_topics are names typed on the fly; existing names resolve to the existing
  // topic rather than failing.
  repeated string new_topics = 4;
}

message UpdateLibraryFileResponse {}

message DeleteLibraryFileRequest {
  int32 id = 1;
}

message DeleteLibraryFileResponse {}

message ListFileTopicsRequest {
  // include_archived brings the archived topics back into the answer. Default
  // false, which is the ONE behavioural change this contract makes for a client
  // already shipped — and it is inert until somebody archives something.
  //
  // The topics SCREEN sets it (an archive you cannot see is not an archive), the
  // canvas rail and the pickers do not.
  bool include_archived = 1;
}

message ListFileTopicsResponse {
  repeated FileTopic topics = 1;
  // The two rail badges. They live here rather than costing a separate list call
  // each: untopiced_count is how many files carry no topic, total_files how many
  // exist at all.
  int32 untopiced_count = 2;
  int32 total_files = 3;
}

message CreateFileTopicRequest {
  string name = 1;
  string description = 2;
}

message CreateFileTopicResponse {
  int32 id = 1;
}

message RenameFileTopicRequest {
  int32 id = 1;
  string name = 2;
  // Sent together with the name: one dialog edits both.
  string description = 3;
}

message RenameFileTopicResponse {}

message DeleteFileTopicRequest {
  int32 id = 1;
}

message DeleteFileTopicResponse {
  // unlinked_styles is how many STYLES lost their link to this topic when it went
  // (0321). Styles do NOT refuse the deletion — a refusal would be a dead end: the
  // topics screen counts FILES and knows nothing about style links, so the person
  // would hit «нельзя» with no way to see what they hit. Silence would be worse
  // still: «убрал пустую съёмку с глаз» and «у восьми вещей пропал ответ, каким
  // файлом их сделали» have to be ONE event on screen rather than two a month apart.
  //
  // Counted EXACTLY, like cleared_styles on a demotion and unlike the file counts
  // around it: a style is not a library file and the visibility predicate does not
  // apply to it.
  int32 unlinked_styles = 1;
  // unlinked_tasks is the same fact for kanban cards (0322): how many lost their link
  // to this project when it went. The KEYS differ and the difference matters — a style
  // link CASCADES away (it means nothing without the topic), while a task's
  // project_topic_id is merely SET NULL: the card survives, because it is about work,
  // not about the shoot. Taking someone's to-do list along with a label would be a far
  // worse answer than losing a pointer.
  //
  // Counted EXACTLY, for the same reason as unlinked_styles: a task is not a library
  // file, it lives under the tasks section's own rbac.
  int32 unlinked_tasks = 2;
}

message MergeFileTopicsRequest {
  // source_id is the topic that disappears, target_id the one that survives.
  // Merging a topic into itself is refused rather than treated as a no-op: it can
  // only come from a mis-wired dialog, and answering "done" would hide that.
  int32 source_id = 1;
  int32 target_id = 2;
}

message MergeFileTopicsResponse {
  // moved_files is how many files gained the target topic (files already carrying
  // both are not counted twice). The dialog reports it back — a merge is
  // irreversible, so the person is owed the size of what just happened.
  int32 moved_files = 1;
}

message AssignLibraryFileTopicsRequest {
  repeated int32 file_ids = 1;
  // topic_ids are existing topics, new_topics names typed on the fly; an existing
  // name resolves to the existing topic instead of failing. Both are ADDED to
  // whatever the files already carry.
  repeated int32 topic_ids = 2;
  repeated string new_topics = 3;
}

message AssignLibraryFileTopicsResponse {
  // assigned is how many (file, topic) links were actually created — pairs that
  // already existed are not counted.
  int32 assigned = 1;
}

// UpdateFileTopicMetaRequest is a NEW message, and that is why full-replacement
// semantics are safe here: this rpc has no already-shipped client, so every caller
// sends the whole form. Adding kind/dates/archived to RenameFileTopic instead
// would have been one rpc cheaper and materially more dangerous — a client that
// predates `kind` would send it empty and silently demote a project to a plain
// topic on the next rename. The project has lost fields exactly that way before
// (the tech-card draft wiping absent fields), so it is not a hypothetical.
message UpdateFileTopicMetaRequest {
  int32 topic_id = 1;
  // kind is "plain" | "project"; empty is read as "plain". Anything else is
  // refused rather than interpreted.
  //
  // Demoting a project that still has roles on its link rows CLEARS those roles in
  // the same transaction and reports how many were dropped: leaving them would
  // leave rows whose role points into a topic that is no longer a project, and
  // silently keeping them would make the next promotion resurrect labels nobody
  // set.
  string kind = 2;
  // starts_at / ends_at are YYYY-MM-DD; empty clears the date.
  string starts_at = 3;
  string ends_at = 4;
  bool archived = 5;
}

message UpdateFileTopicMetaResponse {
  // cleared_roles is how many link rows lost their role because the topic stopped
  // being a project. 0 in every other case. The dialog reports it — a demotion
  // that quietly dropped forty labels would be indistinguishable from one that
  // dropped none.
  int32 cleared_roles = 1;
  // cleared_styles is the same fact for the OTHER project-only property: how many
  // styles lost their link to this project because it stopped being one. A link to
  // a style only means something on a project, so a demotion has to take them —
  // and a demotion that quietly took the answer to «каким файлом сделана эта вещь»
  // away from a dozen garments must say so.
  //
  // Counted EXACTLY, unlike cleared_roles next to it, which is counted under the
  // visibility predicate. The asymmetry is real, not an oversight: roles hang off
  // FILES, whose count is deliberately personal, while a style is not a library
  // file at all — it lives under the tech-card section's own rbac, and hiding it
  // from the person who is editing the project would invent a boundary the system
  // does not have.
  int32 cleared_styles = 2;
  // cleared_tasks is the THIRD project-only property a demotion takes (0322): how many
  // kanban cards lost their link to this project because it stopped being one. The
  // cards themselves survive — they are about WORK, not about the shoot — and lose
  // only the context.
  //
  // Counted EXACTLY, like cleared_styles and unlike cleared_roles: a task is not a
  // library file either, it lives under the tasks section's own rbac.
  //
  // ТРИ ЧИСЛА В ОДНОМ ТОСТЕ — это уже перечисление, и на экране его надо сказать так, как человек
  // читает, а не выложить тремя строчками отчёта. Поля названы отдельно именно поэтому: клиент
  // волен собрать фразу, а сервер не имеет права склеить числа за него — склеенные, они больше не
  // разбираются, и «сняли 7» перестаёт отвечать на «семь чего».
  int32 cleared_tasks = 3;
}

message ListFileRolesRequest {
  // include_archived — same split as the topics rail: the topics screen shows the
  // archive, the chips and the pickers do not.
  bool include_archived = 1;
  // project_topic_id = N returns the vocabulary OF THAT PROJECT — the only form a
  // picker or a chip row may use, because a role of another project is refused by
  // every write anyway.
  //
  // 0 returns every role, each tagged with its owner, and it is an INDEX FOR
  // RESOLUTION rather than a vocabulary: the topics screen lists the projects'
  // dictionaries side by side, and an old `?frole=N` link uses it to find which
  // project the role lives in and put the project into the address.
  int32 project_topic_id = 2;
}

message ListFileRolesResponse {
  repeated FileRole roles = 1;
}

// UpsertFileRoleRequest is the ONLY way a role comes into existence — the closed
// vocabulary in one place. Neither `new_topics` on upload, nor the paste modal,
// nor the bulk topic write can create one: they write into file_topic, and roles
// do not live there.
message UpsertFileRoleRequest {
  // id = 0 creates, otherwise renames/reorders/(un)archives the existing role.
  int32 id = 1;
  string name = 2;
  int32 sort_order = 3;
  bool archived = 4;
  // project_topic_id is REQUIRED when creating and IMMUTABLE when editing: a role
  // does not travel between projects, ever. Its link rows live in its project, so
  // a move would leave them pointing at a foreign role — the one state the
  // invariant forbids. On an edit, 0 means «leave the owner alone» (that is what
  // a client which predates the owner sends), and a DIFFERENT project is refused
  // rather than silently applied.
  //
  // Creating with a topic that is a plain label is refused too: «это исходник
  // ничего» does not mean anything, exactly as when setting the role.
  int32 project_topic_id = 5;
}

message UpsertFileRoleResponse {
  int32 id = 1;
}

// MergeFileRolesRequest is the standard repair for a vocabulary that drifted
// anyway. It is SIMPLER than merging topics: a role is a column, not a link, so
// there is nothing to deduplicate — every link row carrying the source ends up
// carrying the target, and no row can end up carrying both.
message MergeFileRolesRequest {
  int32 source_id = 1;
  int32 target_id = 2;
}

message MergeFileRolesResponse {
  // moved_links is how many (file, project) rows changed role. Counted under the
  // visibility predicate, like the topic merge above: the number is read by a
  // person, and «переехало 7» on a role where they can see two files is the same
  // «there is something here you are not shown» signal the personal counts exist
  // to remove. The move itself applies to everything.
  int32 moved_links = 1;
}

// SetLibraryFileRolesRequest sets ONE role on a batch of files IN ONE PROJECT.
//
// It reads as «put these files into the project in role R»: a file that is not in
// the project yet gets its link row created, which is what makes the button work
// on a fresh drop. role_id = 0 CLEARS the role while leaving the file in the
// project — «без роли» is a legal state, it is the intake heap.
//
// Batch semantics are the ones AssignLibraryFileTopics already established: one
// invisible id refuses the WHOLE batch. Partial application would answer
// differently for a visible and an invisible id, and «проставилось 4 из 5» is
// itself the confirmation that a fifth file exists.
message SetLibraryFileRolesRequest {
  repeated int32 file_ids = 1;
  // project_topic_id must be a topic of kind `project`: a role on a plain label is
  // «это исходник ничего» and is refused, not stored.
  int32 project_topic_id = 2;
  // role_id = 0 clears the role. A role that is archived can still be CLEARED but
  // not newly assigned — otherwise the archive would be a suggestion.
  //
  // The role must belong to THIS project. The request does not say so twice: the
  // owner is a property of the role, and the server compares it itself, which is
  // why this message did not change when roles became per-project.
  int32 role_id = 3;
}

message SetLibraryFileRolesResponse {
  // updated is how many link rows now carry the requested role — including rows
  // created by this call, excluding rows that already carried it.
  int32 updated = 1;
}

// FileTopicStyle is a garment as the PROJECT's page sees it: what the thing is
// recognised by on screen, and nothing else.
//
// Not a tech card and not even a short form of one. Carrying entity.TechCard here
// would ship fifty fields for the sake of four and open a SECOND read path for a
// style, which then drifts from the real one.
message FileTopicStyle {
  int32 tech_card_id = 1;
  // style_number is the article. Empty is legal: an IDEA-stage card has no number
  // yet, and a list that refused to show it would hide exactly the work in progress
  // a shoot is most likely to be about.
  string style_number = 2;
  string name = 3;
  // stage is idea|proto|fit|sms|pp|prod. It is here because «бекап CLO» means
  // different things for an idea and for a style in production; without it the list
  // reads as a flat run of names.
  string stage = 4;
  // preview_url is the SAME thumbnail the style lists show, resolved by the same
  // rule in the same place rather than re-derived here — two implementations of
  // «which picture represents this garment» would show different pictures for the
  // same thing in two screens, and the search for why would end in SQL. Empty when
  // the style has no media at all; the tile then draws a plate with the article.
  string preview_url = 5;
  google.protobuf.Timestamp linked_at = 6;
}

// StyleFileProject is a project as the GARMENT's card sees it — the answer to
// «какие проекты меня касаются».
//
// The project rides as the ordinary FileTopic the rail already uses, deliberately:
// the card prints the name, the kind, the dates, the archive flag and the file
// count, which is exactly what the rail's message already carries. A second,
// narrower shape for the same fields would mean a second set of rules for filling
// them.
message StyleFileProject {
  // project.files_count is counted UNDER THE VISIBILITY PREDICATE, like every other
  // count in this library. Not tidiness — a boundary: otherwise the garment card
  // becomes a side channel that reveals a project holds files the reader is not
  // shown. Different people therefore see different numbers here, on purpose.
  FileTopic project = 1;
  google.protobuf.Timestamp linked_at = 2;
}

// LinkFileTopicStyleRequest attaches ONE style to ONE project.
//
// A REPEAT IS A NO-OP, not a unique-key refusal, and that is not leniency towards a
// sloppy client. The button lives on two screens at once (the project page and the
// garment card), and the second person to press it on an already-linked style got
// precisely what they wanted — the link exists. Compare UpsertFileRole, where a
// name collision REFUSES: there a repeat would create a second thing and silently
// hand back somebody else's, here a repeat creates nothing.
//
// An ARCHIVED project accepts links, unlike an archived ROLE which refuses
// assignment. The difference is real: archiving a role retires a WORD from the
// vocabulary, and going on labelling with it would keep the dictionary undead;
// archiving a project means the work is finished — and a .zprj backup is filed
// precisely AFTER the shoot. Refusing here would demand un-archiving a shoot in
// order to record the truth about it.
message LinkFileTopicStyleRequest {
  // topic_id must be a topic of kind `project`: a style linked to a plain label is
  // «эта вещь сделана ярлыком», which is refused rather than stored. Checked in
  // code, not by a CHECK constraint — a retroactive CHECK validates the WHOLE table
  // history and halts a production boot.
  int32 topic_id = 1;
  int32 tech_card_id = 2;
}

message LinkFileTopicStyleResponse {
  // The project's styles AFTER the change, so the page redraws from what was
  // actually stored rather than from what it hoped it sent — the same reason
  // SetLibraryFileOwners returns the resolved owners.
  repeated FileTopicStyle styles = 1;
}

message UnlinkFileTopicStyleRequest {
  int32 topic_id = 1;
  int32 tech_card_id = 2;
}

message UnlinkFileTopicStyleResponse {
  repeated FileTopicStyle styles = 1;
}

message ListFileTopicStylesRequest {
  int32 topic_id = 1;
}

message ListFileTopicStylesResponse {
  repeated FileTopicStyle styles = 1;
}

message ListStyleFileProjectsRequest {
  // A tech_card id that belongs to nothing is NOT an error — it answers with an
  // empty list. Refusing it would make this rpc an ORACLE for «does style N exist»,
  // answerable by counting up, for somebody holding files:read and no right to read
  // tech cards at all. The topic-side call refuses on a missing topic instead,
  // because topics are already enumerated in full to anybody with files:read, so
  // confirming one exists tells them nothing new.
  int32 tech_card_id = 1;
}

message ListStyleFileProjectsResponse {
  // ARCHIVED PROJECTS ARE PRESENT AND FLAGGED, not hidden — the opposite of the
  // chips rail, deliberately. The rail hides the archive because it is NAVIGATION
  // over live work, where a finished shoot is only in the way. The garment card asks
  // a HISTORICAL question: the shoot that photographed this thing is finished by
  // definition, and that is exactly why it was archived. Hiding it here would hide
  // the very answer the screen exists to give, so archived projects come back marked
  // (project.archived) and sorted to the end.
  repeated StyleFileProject projects = 1;
}

message SetLibraryFileOwnersRequest {
  int32 file_id = 1;
  // admin_ids is the FULL set of owners, not a delta. An empty list clears them,
  // which is a legal state: «спросить будет некого» is a truthful answer, and the
  // card says so.
  repeated int32 admin_ids = 2;
}

message SetLibraryFileOwnersResponse {
  // The resolved owners, so the card redraws from what was actually stored
  // rather than from what it hoped it sent.
  repeated AdminRef owners = 1;
}

message SetAccountSpecialtiesRequest {
  // username is whose specialties these are. Own username = no permission
  // needed; anybody else's requires accounts:write.
  string username = 1;
  // specialty_ids picks from the existing vocabulary, new_specialties are names
  // typed on the fly — the same grammar as a file's topics, and for the same
  // reason: a vocabulary that can only be extended by an administrator stops
  // being extended.
  repeated int32 specialty_ids = 2;
  repeated string new_specialties = 3;
}

message SetAccountSpecialtiesResponse {
  // The resolved set, names as STORED — a name typed in a different case
  // collapses onto the existing entry, and the chips must show that.
  repeated string specialties = 1;
}

message DeleteAccountSpecialtyRequest {
  // name is the vocabulary entry to remove, matched case- and
  // accent-insensitively (the collation folds it), so a typo is deleted by
  // whichever spelling of it the person is looking at.
  string name = 1;
}

message DeleteAccountSpecialtyResponse {}

// LibraryFileTask is one task row AS THE FILE CARD DRAWS IT: the #id pill, the
// title, the column, who is on it and when it is due. Deliberately not
// common.Task — that message carries content, checklist, resolved media and its
// own attachments, and shipping it per row would resolve a second file list for
// every task a file happens to be linked to.
message LibraryFileTask {
  int32 task_id = 1;
  string title = 2;
  common.TaskStatus status = 3;
  // assignee is an AdminAccount.username; "" = nobody is on it.
  string assignee = 4;
  // due_date unset = no deadline (the row then simply has no date, not "today").
  google.protobuf.Timestamp due_date = 5;
  // board is the department lane, so the row can say WHERE the work lives — the
  // same file is attached from several lanes at once.
  common.TaskBoard board = 6;
}

message ListLibraryFileTasksRequest {
  // id is the FILE's id (the path is /files/{id}/tasks — the file is the subject
  // here, the tasks are the answer).
  int32 id = 1;
}

message ListLibraryFileTasksResponse {
  repeated LibraryFileTask tasks = 1;
}

message AttachLibraryFileToTaskRequest {
  int32 file_id = 1;
  int32 task_id = 2;
}

message AttachLibraryFileToTaskResponse {}

message DetachLibraryFileFromTaskRequest {
  int32 file_id = 1;
  int32 task_id = 2;
}

message DetachLibraryFileFromTaskResponse {}

// LibraryFileComment is one remark in a file's discussion.
message LibraryFileComment {
  int32 id = 1;
  int32 file_id = 2;
  // author is the username AS OF WRITING — a historical fact that outlives the
  // account, exactly like LibraryFile.uploaded_by. author_id resolves the same
  // person to a LIVE account and becomes 0 when that account is deleted; the
  // byline and the avatar read the id, the text of the feed reads the string.
  string author = 3;
  int32 author_id = 4;
  // body is the raw text, @mentions included: the server stores what was typed.
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
  // edited_at unset = the remark was never edited. Set = the feed prints
  // «изменено», because a silently rewritten remark is a rewritten conversation.
  google.protobuf.Timestamp edited_at = 7;
}

message ListLibraryFileCommentsRequest {
  int32 id = 1; // file id (path param)
}

message ListLibraryFileCommentsResponse {
  repeated LibraryFileComment comments = 1;
}

message AddLibraryFileCommentRequest {
  int32 file_id = 1;
  string body = 2;
}

message AddLibraryFileCommentResponse {
  // The stored remark, so the feed appends what the server actually wrote
  // (author and timestamps are stamped there, never sent by the client).
  LibraryFileComment comment = 1;
}

message UpdateLibraryFileCommentRequest {
  int32 id = 1;
  string body = 2;
}

message UpdateLibraryFileCommentResponse {
  // Returned for edited_at: the «изменено» mark comes from the server's clock.
  LibraryFileComment comment = 1;
}

message DeleteLibraryFileCommentRequest {
  int32 id = 1;
}

message DeleteLibraryFileCommentResponse {}

// LibraryFilePublicLink is the state of the ONE public link a file may carry.
// The url is our own route plus an HMAC token, not a bucket url: the object
// itself stays private and is only ever reached through a presigned url minted
// per hit.
message LibraryFilePublicLink {
  // url is empty when the file has never been shared by link.
  string url = 1;
  // expires_at unset = the link does not expire on its own.
  google.protobuf.Timestamp expires_at = 2;
  bool revoked = 3;
  // expired is computed, not stored: the level stays `link` after the date
  // passes (nothing silently un-shares a file behind its owner's back), the route
  // answers 404, and the UI badges «истёк». Deriving it here keeps two screens
  // from each inventing their own comparison against server time.
  bool expired = 4;
  // Best-effort statistics: the counter is bumped outside the read path, so it
  // may lag by a hit. It answers «пользуются ли ссылкой вообще», not accounting.
  google.protobuf.Timestamp last_access_at = 5;
  int32 access_count = 6;
}

// LibraryFileAccessEvent is one line of the journal: WHO changed WHAT and WHEN.
// actor is a username string (it must survive the account being deleted — the
// journal answers questions about a file that outlives its people).
message LibraryFileAccessEvent {
  int32 id = 1;
  string actor = 2;
  // what is a rendered description of the change («уровень → по ссылке»,
  // «+ kirill», «срок 7 дней», «ссылка пересоздана»). Free text on purpose: the
  // journal is read by people, and a code would need a translation table that
  // drifts from the events it names.
  string what = 3;
  google.protobuf.Timestamp created_at = 4;
}

// LibraryFileAccess is the whole "who may see this file" state in one place, so
// the card and the витрина read the same shape.
message LibraryFileAccess {
  // level is team | people | link.
  string level = 1;
  // people is meaningful only at level `people`. The uploader is always in it —
  // the server puts them there rather than trusting the client to remember.
  repeated AdminRef people = 2;
  LibraryFilePublicLink link = 3;
}

message GetLibraryFileAccessRequest {
  int32 id = 1; // file id (path param)
}

message GetLibraryFileAccessResponse {
  LibraryFileAccess access = 1;
  // events newest first — the journal is read to answer «кто это открыл», and
  // the answer is almost always the last line.
  repeated LibraryFileAccessEvent events = 2;
}

message SetLibraryFileAccessRequest {
  int32 file_id = 1;
  // level is team | people | link; anything else is refused rather than
  // interpreted (the column is an ENUM in the database for the same reason).
  string level = 2;
  // admin_ids is the FULL set of people for level `people`, replaced atomically
  // with the level itself. Ignored at the other two levels — and NOT wiped, so
  // switching team → people → team does not make a person retype the list.
  repeated int32 admin_ids = 3;
  // link_ttl is the life of the public link IN HOURS: 24 / 168 / 720 are the
  // chips, 0 = no expiry. Hours rather than a Duration because it comes from a
  // fixed set of chips and rides through the JSON gateway as a plain number.
  // Only read at level `link`.
  int32 link_ttl = 4;
}

message SetLibraryFileAccessResponse {
  // The stored state, so the card redraws from what was written rather than from
  // what it hoped it sent — same reason as SetLibraryFileOwnersResponse. The
  // freshly minted url arrives here when the level became `link`.
  LibraryFileAccess access = 1;
}

message RotateLibraryFileLinkRequest {
  int32 file_id = 1;
}

message RotateLibraryFileLinkResponse {
  // The NEW link. The old one is already dead when this returns — that is the
  // whole operation, and the dialog must show what replaced it.
  LibraryFilePublicLink link = 1;
}

// SharedLibraryFile is one row of the витрина: the file plus the answers to «кому
// открыто» and «кто открыл».
message SharedLibraryFile {
  // file carries the preview, the name and access_level — the витрина draws the
  // same tile the grid does, so it resolves the same message.
  LibraryFile file = 1;
  // people is the named list at level `people`; empty at level `link`, where the
  // truthful answer is «кто угодно со ссылкой» and the screen says exactly that.
  repeated AdminRef people = 2;
  LibraryFilePublicLink link = 3;
  // shared_by / shared_at come from the journal: the actor and the time of the
  // last event that established the CURRENT level. Not «who uploaded it» and not
  // «who touched it last» — the question this column answers is who is
  // responsible for the file being open right now.
  string shared_by = 4;
  google.protobuf.Timestamp shared_at = 5;
}

message ListSharedLibraryFilesRequest {
  // level narrows the витрина: "" = everything special (both levels), "people" or
  // "link" = one of them. The filter is server-side because the list is paged —
  // filtering a page on the client would show «3 из 40» and mean neither.
  string level = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListSharedLibraryFilesResponse {
  repeated SharedLibraryFile files = 1;
  int32 total = 2;
}

message CreateLibraryNoteRequest {
  // file_name without the extension is fine — the server appends `.md`, and
  // appending it twice is not a thing that happens.
  string file_name = 1;
  // Same topic grammar as everywhere else in the library: existing ids plus names
  // typed on the fly, an existing name resolving to the existing topic.
  repeated int32 topic_ids = 2;
  repeated string new_topics = 3;
  // content may be empty — a note created to be written into tomorrow is a real
  // case. Capped at 512 KiB: this is a note, not a book, and the cap is what
  // keeps the whole text on the RPC path honest.
  string content = 4;
}

message CreateLibraryNoteResponse {
  // The created file, so the client can open the note screen straight away
  // instead of listing to find what it just made.
  LibraryFile file = 1;
}

message GetLibraryNoteContentRequest {
  int32 id = 1; // file id (path param)
}

message GetLibraryNoteContentResponse {
  string content = 1;
  // sha256 of exactly this content — the base the editor sends back when it
  // saves. Without it there is no CAS, and every save is a blind overwrite.
  string sha256 = 2;
  string last_edited_by = 3;
  google.protobuf.Timestamp last_edited_at = 4;
}

message SaveLibraryNoteContentRequest {
  int32 file_id = 1;
  string content = 2;
  // base_sha256 is the sha256 this edit started from. A mismatch means somebody
  // else saved in the meantime.
  string base_sha256 = 3;
  // force writes over that other version deliberately. It is the only path to a
  // lost edit in the whole design, which is exactly why it must be asked for and
  // is never a default.
  bool force = 4;
}

message SaveLibraryNoteContentResponse {
  // conflict = true means NOTHING WAS WRITTEN and the fields below describe the
  // version that is stored. A conflict is DATA, not a gRPC error: the client owes
  // the person a banner and three choices (show the difference, save as a
  // separate note, overwrite anyway), and an error status would cost a second
  // request to build any of them.
  bool conflict = 1;
  // current_sha256 is what is stored now — the caller's own text after a
  // successful save, the other version after a conflict. Either way it is the
  // base for this editor's NEXT save, so the client never has to re-read to keep
  // editing.
  string current_sha256 = 2;
  // current_content is filled ONLY on conflict (the successful case would just be
  // echoing back what was sent, over the same 512 KiB budget).
  string current_content = 3;
  string last_edited_by = 4;
  google.protobuf.Timestamp last_edited_at = 5;
}

message FormatLibraryNoteMarkdownRequest {
  // content is EXACTLY what goes to the model: the whole buffer or the selection,
  // decided by the client. Nothing else — not the file name, not the topics, not
  // the owners, not the discussion — so the leak perimeter is readable from one
  // function. Capped at 12 000 runes; longer gets InvalidArgument and the client
  // offers to send a selection instead.
  string content = 1;
}

message FormatLibraryNoteMarkdownResponse {
  // The suggestion. It is not stored anywhere: accepting it replaces the editor's
  // BUFFER, and the write is a normal SaveLibraryNoteContent with its CAS.
  string content = 1;
}

