  // FILES LIBRARY
  // Shared internal documents: mockups, design guidelines, icons, 3D parts,
  // spreadsheets. The bytes live PRIVATELY in object storage (unlike the media
  // library, which is public-read on the CDN because the storefront reads it) and
  // are only ever reachable through short-lived presigned urls minted per response.
  //
  // Topics are LABELS, not folders: a file carries several at once, or none (those
  // land in «Разобрать»). That is what removes the "which single folder does this
  // belong in" decision — the moment at which a file gets lost.
  //
  // UPLOAD IS NOT AN RPC. It is a streaming multipart endpoint,
  // POST /api/files/upload — see internal/api/http and internal/apisrv/admin/
  // files_upload.go. A gRPC method would have to carry the payload base64-encoded
  // inside a single message, which neither the 50 MiB grpc limit nor the 72 MiB
  // admin-JSON limit can hold for the files this library exists to keep.
  // Neither is REPLACING A PREVIEW: POST /api/files/{id}/preview, same file, same
  // reason (an image is a multipart body), with its own 4 MiB body cap and its own
  // files:write check inside the handler — the gRPC interceptor has no reach there.

  // GetLibraryFile returns one file with its topics and freshly minted urls.
  rpc GetLibraryFile(GetLibraryFileRequest) returns (GetLibraryFileResponse) {
    option (google.api.http) = {get: "/api/admin/files/{id}"};
  }

  // ListLibraryFiles is the grid: a page of files filtered by topic, by "no topic
  // at all", or by a search that matches file names AND topic names.
  // Declared AFTER GET /files/{id} on purpose — same reason as the task routes:
  // in grpc-gateway v2 the later registration wins, so a literal path must come
  // after the templated one or it gets shadowed by it.
  rpc ListLibraryFiles(ListLibraryFilesRequest) returns (ListLibraryFilesResponse) {
    option (google.api.http) = {get: "/api/admin/files/list"};
  }

  // UpdateLibraryFile renames a file and REPLACES its topic set.
  rpc UpdateLibraryFile(UpdateLibraryFileRequest) returns (UpdateLibraryFileResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/update"
      body: "*"
    };
  }

  // DeleteLibraryFile removes a file and its bytes. Refused while any task holds
  // it — the error names the holding cards.
  rpc DeleteLibraryFile(DeleteLibraryFileRequest) returns (DeleteLibraryFileResponse) {
    option (google.api.http) = {delete: "/api/admin/files/{id}"};
  }

  // ListFileTopics is the rail: topics ordered by usage, plus the two badges.
  rpc ListFileTopics(ListFileTopicsRequest) returns (ListFileTopicsResponse) {
    option (google.api.http) = {get: "/api/admin/files/topics/list"};
  }

  // CreateFileTopic creates a topic, or returns the existing one with that name.
  rpc CreateFileTopic(CreateFileTopicRequest) returns (CreateFileTopicResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/topics/create"
      body: "*"
    };
  }

  // RenameFileTopic updates a topic's name and description together.
  rpc RenameFileTopic(RenameFileTopicRequest) returns (RenameFileTopicResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/topics/rename"
      body: "*"
    };
  }

  // DeleteFileTopic removes a topic, refused while files still carry it.
  rpc DeleteFileTopic(DeleteFileTopicRequest) returns (DeleteFileTopicResponse) {
    option (google.api.http) = {delete: "/api/admin/files/topics/{id}"};
  }

  // MergeFileTopics folds one topic into another: every file carrying the source
  // ends up carrying the target, and the source topic ceases to exist. It is the
  // only way out of the duplicates a free-form label vocabulary grows ("бирки" and
  // "бирка"), which DeleteFileTopic cannot solve — it refuses on a topic that is
  // in use, and that is exactly the topic that needs merging.
  rpc MergeFileTopics(MergeFileTopicsRequest) returns (MergeFileTopicsResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/topics/merge"
      body: "*"
    };
  }

  // AssignLibraryFileTopics ADDS topics to a set of files. Additive, not
  // replacing: UpdateLibraryFile already replaces the set of ONE file, where the
  // caller has just seen that file's labels. A bulk action has not seen them, so a
  // replacing bulk write would silently erase whatever a colleague labelled those
  // files with between the grid loading and the button being pressed.
  rpc AssignLibraryFileTopics(AssignLibraryFileTopicsRequest) returns (AssignLibraryFileTopicsResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/topics/assign"
      body: "*"
    };
  }

  // ГРУППИРОВКА: ПРОЕКТ × РОЛЬ
  // A topic can be a PROJECT (dates, an archive, a breakdown by role); the role a
  // file plays lives on the (file, topic) LINK ROW, never as a second label on the
  // file. That single decision is what makes «съёмка × референс» exact: a photo
  // that is «отобранное» in the shoot and «референс» in the lookbook holds two
  // link rows, each carrying its own role, and the cross query matches neither.
  // Flat labels would put all four on the file and match — quietly and wrongly.
  //
  // The role vocabulary is CLOSED and lives in its own table: the cross-project
  // question («все исходники по всем съёмкам») only means something while
  // «исходники» is one and the same thing everywhere.

  // UpdateFileTopicMeta sets a topic's kind, dates and archive flag. A new message
  // with full-replacement semantics — see the request for why this is not folded
  // into RenameFileTopic.
  rpc UpdateFileTopicMeta(UpdateFileTopicMetaRequest) returns (UpdateFileTopicMetaResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/topics/meta"
      body: "*"
    };
  }

  // ListFileRoles returns ONE PROJECT's role vocabulary (project_topic_id = N),
  // each role counted under the visibility predicate like every other count here.
  // With 0 it returns every role tagged with its owner — an index for resolving an
  // old link, not a vocabulary to pick from.
  rpc ListFileRoles(ListFileRolesRequest) returns (ListFileRolesResponse) {
    option (google.api.http) = {get: "/api/admin/files/roles/list"};
  }

  // UpsertFileRole creates or edits one role IN A PROJECT. THE ONLY path that
  // creates one — that is what «closed vocabulary» means mechanically rather than
  // by discipline. Creating requires a project topic; editing never moves the role
  // to another one.
  rpc UpsertFileRole(UpsertFileRoleRequest) returns (UpsertFileRoleResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/roles/upsert"
      body: "*"
    };
  }

  // MergeFileRoles folds one role into another and deletes the source. The
  // standard repair for a vocabulary that drifted; simpler than merging topics,
  // because a role is a column and cannot collide with itself on a row. Both roles
  // must belong to the SAME project — the request does not carry it, the server
  // reads it off the roles themselves.
  rpc MergeFileRoles(MergeFileRolesRequest) returns (MergeFileRolesResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/roles/merge"
      body: "*"
    };
  }

  // SetLibraryFileRoles puts a batch of files into one project in one role (or
  // clears the role). Same batch semantics as AssignLibraryFileTopics: one
  // invisible id refuses the whole batch.
  rpc SetLibraryFileRoles(SetLibraryFileRolesRequest) returns (SetLibraryFileRolesResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/roles/assign"
      body: "*"
    };
  }

  // ПРОЕКТ ↔ СТИЛЬ: «КАКИМ ФАЙЛОМ СДЕЛАНА ЭТА ВЕЩЬ»
  // The four rpcs below close the question the grouping above cannot answer. A
  // project says what lies in a shoot; nothing said which .zprj a garment was
  // actually sewn from, and that knowledge lives in somebody's head and in a file
  // name — which survives exactly one rename.
  //
  // MANY-TO-MANY, and not out of caution: BOTH sides are genuinely plural. A shoot
  // covers a capsule (one project → eight styles), while a CLO backup covers one
  // garment that nonetheless appears in both the shoot and the lookbook (one style
  // → several projects). A column on either table breaks on the first real example.
  //
  // A link carries NO role, unlike a file's link to a project: the pair (file,
  // project) genuinely has a property, the pair (project, style) does not — «this
  // style is a source file in this shoot» means nothing.

  // LinkFileTopicStyle attaches a style to a PROJECT topic. Idempotent — see the
  // request for why a repeat is a no-op rather than a unique-key refusal.
  rpc LinkFileTopicStyle(LinkFileTopicStyleRequest) returns (LinkFileTopicStyleResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/projects/styles/link"
      body: "*"
    };
  }

  // UnlinkFileTopicStyle detaches a style from a project. Idempotent as well: the
  // link is a bare fact, so removing what is not there has already achieved what
  // was asked.
  rpc UnlinkFileTopicStyle(UnlinkFileTopicStyleRequest) returns (UnlinkFileTopicStyleResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/projects/styles/unlink"
      body: "*"
    };
  }

  // ListFileTopicStyles returns the garments a project is about — the style list on
  // a project's page.
  rpc ListFileTopicStyles(ListFileTopicStylesRequest) returns (ListFileTopicStylesResponse) {
    option (google.api.http) = {get: "/api/admin/files/projects/{topic_id}/styles"};
  }

  // ListStyleFileProjects is THE call this whole thing exists for: asked from the
  // garment's own card, «какие проекты меня касаются». Everything else here is the
  // machinery that makes this answer possible.
  //
  // It needs files:read rather than techcards:read, and that is deliberate: the
  // answer carries project NAMES and file COUNTS out of the library, so gating it on
  // the tech-card section would turn the garment card into a side channel into the
  // library. A person without files access simply does not get the block.
  rpc ListStyleFileProjects(ListStyleFileProjectsRequest) returns (ListStyleFileProjectsResponse) {
    option (google.api.http) = {get: "/api/admin/files/styles/{tech_card_id}/projects"};
  }

  // SetLibraryFileOwners REPLACES the file's set of owners (owners come in ones
  // and twos, and the picker has just shown the caller the whole current set, so
  // a full replace is honest here — unlike the bulk topic write above).
  //
  // files:write is necessary but NOT sufficient: the handler additionally
  // requires the caller to be the uploader, a current owner, or a super-admin.
  // Without that circle, anybody holding files:write could make themselves the
  // owner of anyone's file — and, once the access levels land, widen their own
  // access to it by doing so.
  rpc SetLibraryFileOwners(SetLibraryFileOwnersRequest) returns (SetLibraryFileOwnersResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/owners"
      body: "*"
    };
  }

  // ListLibraryFileTasks answers «где этот файл ещё используется» from the FILE's
  // side. The link it reads (task_file) is the very one the task form writes; the
  // task form simply cannot answer this question, because it starts from a task.
  //
  // Gated by tasks:read, NOT files:read, and the section follows WHAT IS IN THE
  // ANSWER rather than where the button is — precedent:
  // GetMaterialCuttingCoefficientSuggestion. Titles, columns, assignees and
  // deadlines are task content, and a files-only account must not read them
  // sideways. Named consequence: the file card must SURVIVE PermissionDenied here
  // by drawing «нет доступа к задачам», not by failing.
  rpc ListLibraryFileTasks(ListLibraryFileTasksRequest) returns (ListLibraryFileTasksResponse) {
    option (google.api.http) = {get: "/api/admin/files/{id}/tasks"};
  }

  // AttachLibraryFileToTask links one file to one task, idempotently: a link that
  // already exists is not an error, because the card cannot know what another tab
  // did a second ago.
  //
  // Deliberately NOT done through UpdateTask: TaskInsert.file_ids is the FULL set
  // of a task's attachments, so attaching from the file card through it would
  // mean sending a set this screen has never seen. tasks:write for the same
  // reason as the read above — the row belongs to the task (task_file cascades
  // from it), not to the file.
  rpc AttachLibraryFileToTask(AttachLibraryFileToTaskRequest) returns (AttachLibraryFileToTaskResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/task/attach"
      body: "*"
    };
  }

  // DetachLibraryFileFromTask removes that link. Also idempotent, and for the
  // same reason: two people clearing the same attachment must both be told it is
  // gone, not one of them that it never was.
  rpc DetachLibraryFileFromTask(DetachLibraryFileFromTaskRequest) returns (DetachLibraryFileFromTaskResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/task/detach"
      body: "*"
    };
  }

  // FILE DISCUSSION
  // A FLAT feed of remarks on a file — no threads on purpose: a file collects a
  // handful of remarks, and branching buys structure at the price of a
  // conversation nobody reads to the end. @username is stored as PLAIN TEXT;
  // highlighting and the picker are the client's, so a mention of somebody who
  // has left degrades into ordinary text instead of a dangling reference. Nothing
  // is notified — this wave has no delivery channel, and a notification into
  // nowhere is worse than none.

  // ListLibraryFileComments returns the feed, oldest first.
  rpc ListLibraryFileComments(ListLibraryFileCommentsRequest) returns (ListLibraryFileCommentsResponse) {
    option (google.api.http) = {get: "/api/admin/files/{id}/comments"};
  }

  // AddLibraryFileComment appends one remark. Classified as a WRITE to the
  // library: files:read reads the feed and cannot add to it, because a discussion
  // is content OF the library rather than a view of it.
  rpc AddLibraryFileComment(AddLibraryFileCommentRequest) returns (AddLibraryFileCommentResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/comment/add"
      body: "*"
    };
  }

  // UpdateLibraryFileComment edits a remark and stamps edited_at — an edit that
  // leaves no trace rewrites the past. files:write is necessary but NOT
  // sufficient: the handler additionally requires the caller to be the AUTHOR
  // (a super-admin may edit any), same "map holds one section, code checks the
  // rest" shape as SetLibraryFileOwners.
  rpc UpdateLibraryFileComment(UpdateLibraryFileCommentRequest) returns (UpdateLibraryFileCommentResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/comment/update"
      body: "*"
    };
  }

  // DeleteLibraryFileComment removes one's own remark (a super-admin any), same
  // second gate. The literal `comment` segment keeps this clear of DELETE
  // /files/{id}, which is one segment shorter and therefore a different route.
  rpc DeleteLibraryFileComment(DeleteLibraryFileCommentRequest) returns (DeleteLibraryFileCommentResponse) {
    option (google.api.http) = {delete: "/api/admin/files/comment/{id}"};
  }

  // ACCESS LEVELS
  // A file is `team` (everyone holding files:read), `people` (a named list, PLUS
  // the uploader and the owners — without them the person who keeps a file could
  // switch it to `people`, forget to list themselves, and lose both the file and
  // the ability to fix that), or `link` (reachable by a public url, and INSIDE the
  // team still exactly as visible as `team`: a level opens outward, it never
  // closes inward).
  //
  // A file one may not see answers NotFound, never PermissionDenied — everywhere,
  // reads and writes alike. PermissionDenied would confirm the file exists, and in
  // this library the NAMES are the secret.
  //
  // The public url is NOT a bucket ACL: the object stays private forever and the
  // public route mints a short-lived presigned url per hit. Revocation is
  // epoch+1 (see RotateLibraryFileLink) rather than a revocation list.

  // GetLibraryFileAccess returns one file's access block: level, the named people,
  // the public link with its expiry, and the journal of who changed what when.
  // Declared before ListShared… — the Get-before-List convention of this file.
  rpc GetLibraryFileAccess(GetLibraryFileAccessRequest) returns (GetLibraryFileAccessResponse) {
    option (google.api.http) = {get: "/api/admin/files/{id}/access"};
  }

  // SetLibraryFileAccess sets the level AND the list of people that goes with it
  // ATOMICALLY. Two RPCs would leave a window in which a file is already `people`
  // with an empty list — that is, invisible to everyone who was about to be added.
  //
  // files:write is necessary but NOT sufficient: the handler requires the same
  // circle as SetLibraryFileOwners (uploader | current owner | super-admin).
  // Otherwise any files:write account could publish somebody else's file to the
  // internet.
  rpc SetLibraryFileAccess(SetLibraryFileAccessRequest) returns (SetLibraryFileAccessResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/access/set"
      body: "*"
    };
  }

  // RotateLibraryFileLink mints a new link and kills the old one INSTANTLY: the
  // token carries the epoch, so bumping the epoch is the revocation — there is no
  // revocation list to consult and nothing to expire. Same handler circle as
  // SetLibraryFileAccess.
  rpc RotateLibraryFileLink(RotateLibraryFileLinkRequest) returns (RotateLibraryFileLinkResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/access/rotate"
      body: "*"
    };
  }

  // ListSharedLibraryFiles is the витрина: everything that is `people` or `link`
  // RIGHT NOW, so "what have we actually opened up" is one screen instead of a
  // walk through the grid. Two literal segments — the templated /files/{id} is one
  // segment long and cannot shadow it.
  //
  // The listing runs under the same visibility predicate as the grid (a
  // super-admin sees all of it), which is why two people can honestly see
  // different numbers here. That is accepted, and the screen says so.
  rpc ListSharedLibraryFiles(ListSharedLibraryFilesRequest) returns (ListSharedLibraryFilesResponse) {
    option (google.api.http) = {get: "/api/admin/files/shared/list"};
  }

  // MARKDOWN NOTES
  // A note is an ORDINARY library file whose bytes happen to be text
  // (content_type text/markdown): topics, owners, access, discussion and task
  // attachments come with it for free, and nothing else in the library has to
  // learn that a second kind of object exists. The text lives in the bucket like
  // any other file's bytes; an edit writes a NEW object under a NEW key
  // («object_key never reused») and only then repoints the row.

  // CreateLibraryNote creates that file together with its first text. The name is
  // asked for up front — an untitled note is a note nobody finds later — and the
  // `.md` suffix is appended by the server rather than demanded of the person.
  rpc CreateLibraryNote(CreateLibraryNoteRequest) returns (CreateLibraryNoteResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/note/create"
      body: "*"
    };
  }

  // GetLibraryNoteContent returns the TEXT over the RPC rather than a presigned
  // url, for two hard reasons: text/markdown is not inline-safe, so it only ever
  // gets an attachment url; and fetching a presigned url from JS runs into the
  // bucket's CORS, a lesson the patterns feature has already paid for.
  rpc GetLibraryNoteContent(GetLibraryNoteContentRequest) returns (GetLibraryNoteContentResponse) {
    option (google.api.http) = {get: "/api/admin/files/{id}/note"};
  }

  // SaveLibraryNoteContent writes a new version under a COMPARE-AND-SET on
  // sha256: the caller sends the sha256 it started from, and a row that moved
  // underneath comes back as DATA (conflict = true, with the stored text), not as
  // a gRPC error — the client draws «kirill сохранил свою версию, пока вы
  // правили» and loses nothing, without a second round trip. `force` is the
  // deliberate overwrite; without it, silently overwriting somebody's text is not
  // reachable at all, which is the whole point of asking for it.
  rpc SaveLibraryNoteContent(SaveLibraryNoteContentRequest) returns (SaveLibraryNoteContentResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/note/save"
      body: "*"
    };
  }

  // FormatLibraryNoteMarkdown turns the plain text the editor is holding into
  // tidy markdown. It is a SUGGESTION and persists NOTHING: the answer replaces
  // the editor's buffer only if the person accepts it, and the write still goes
  // through SaveLibraryNoteContent with its CAS — so the assistant cannot
  // overwrite a colleague's text even by racing it.
  //
  // The request carries the TEXT and NO file_id, and that is load-bearing: with
  // no file id there is nothing for the visibility predicate to check, which is
  // precisely why this RPC is legitimately absent from the list of points where
  // the predicate stands. Adding file_id «for the logs» would create an RPC that
  // takes a file id past the predicate.
  //
  // Classified as a WRITE (files:write) although it stores nothing — precedent
  // GenerateTechCardOperations: AI-assisted authoring is authoring.
  rpc FormatLibraryNoteMarkdown(FormatLibraryNoteMarkdownRequest) returns (FormatLibraryNoteMarkdownResponse) {
    option (google.api.http) = {
      post: "/api/admin/files/note/format"
      body: "*"
    };
  }

  // ORDER FULFILLMENT BOARD
  // A kanban PROJECTION of orders (NOT a copy): columns map 1:1 to real order
  // status (To Fulfill=confirmed, Shipped, Delivered). Ship/deliver call the real
  // order transitions; only the annotation (assignee/notes/checklist) is
  // board-owned, so board state can never drift from the order's true status.
  // These are gated by a dedicated `fulfillment` RBAC section so a warehouse role
  // can fulfill without full `orders:write` (which includes refunds/cancels).
  // GET /fulfillment/board and /fulfillment/card/{order_uuid} are distinct paths
  // (no route shadowing).

  // GetFulfillmentBoard returns the three columns of cards (compact order +
  // annotation summary), oldest order first within each column.
  rpc GetFulfillmentBoard(GetFulfillmentBoardRequest) returns (GetFulfillmentBoardResponse) {
    option (google.api.http) = {get: "/api/admin/fulfillment/board"};
  }

  // GetFulfillmentCard returns full order detail plus the full annotation
  // (assignee, notes, checklist) for one order.
  rpc GetFulfillmentCard(GetFulfillmentCardRequest) returns (GetFulfillmentCardResponse) {
    option (google.api.http) = {get: "/api/admin/fulfillment/card/{order_uuid}"};
  }

  // SetFulfillmentAssignee sets (or clears, with "") the order's fulfillment
  // assignee, lazily creating the annotation.
  rpc SetFulfillmentAssignee(SetFulfillmentAssigneeRequest) returns (SetFulfillmentAssigneeResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/assignee"
      body: "*"
    };
  }

  // SetFulfillmentNotes sets the order's internal packing notes.
  rpc SetFulfillmentNotes(SetFulfillmentNotesRequest) returns (SetFulfillmentNotesResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/notes"
      body: "*"
    };
  }

  // AddFulfillmentChecklistItem appends a packing-checklist item to an order.
  rpc AddFulfillmentChecklistItem(AddFulfillmentChecklistItemRequest) returns (AddFulfillmentChecklistItemResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/checklist/add"
      body: "*"
    };
  }

  // SetFulfillmentChecklistItemDone sets a packing-checklist item's done flag.
  rpc SetFulfillmentChecklistItemDone(SetFulfillmentChecklistItemDoneRequest) returns (SetFulfillmentChecklistItemDoneResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/checklist/done"
      body: "*"
    };
  }

  // DeleteFulfillmentChecklistItem removes a packing-checklist item.
  rpc DeleteFulfillmentChecklistItem(DeleteFulfillmentChecklistItemRequest) returns (DeleteFulfillmentChecklistItemResponse) {
    option (google.api.http) = {delete: "/api/admin/fulfillment/checklist/{id}"};
  }

  // ShipFulfillmentOrder records a To-Fulfill order's tracking code, performing
  // the real shipped transition (and the shipped email) — gated by fulfillment
  // perms. Requires a non-empty tracking code.
  rpc ShipFulfillmentOrder(ShipFulfillmentOrderRequest) returns (ShipFulfillmentOrderResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/ship"
      body: "*"
    };
  }

  // MarkFulfillmentDelivered performs the real delivered transition for a shipped
  // order.
  rpc MarkFulfillmentDelivered(MarkFulfillmentDeliveredRequest) returns (MarkFulfillmentDeliveredResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/deliver"
      body: "*"
    };
  }

  // PrepareShippingLabel returns the default parcel (weight/box derived from the
  // order's tech cards, editable) plus whether label generation is available, so the
  // UI can pre-fill the label form before generating. Read-only.
  rpc PrepareShippingLabel(PrepareShippingLabelRequest) returns (PrepareShippingLabelResponse) {
    option (google.api.http) = {get: "/api/admin/fulfillment/label/{order_uuid}"};
  }

  // GenerateShippingLabel announces the order's parcel with Sendcloud (carrier label
  // + tracking number), then performs the real shipped transition via the shared ship
  // path. Returns the printable label URL. Gated by fulfillment perms.
  rpc GenerateShippingLabel(GenerateShippingLabelRequest) returns (GenerateShippingLabelResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/label"
      body: "*"
    };
  }

  // GetShippingOptions fetches the shipping options (carrier + service + quote)
  // available for the order's parcel via Sendcloud, so an operator can pick one
  // before generating. Read-only.
  rpc GetShippingOptions(GetShippingOptionsRequest) returns (GetShippingOptionsResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/label/options"
      body: "*"
    };
  }

  // VoidShippingLabel cancels a generated label with the carrier and reverts the
  // order Shipped -> Confirmed so it can be regenerated. Gated by fulfillment perms.
  rpc VoidShippingLabel(VoidShippingLabelRequest) returns (VoidShippingLabelResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/label/void"
      body: "*"
    };
  }

  // SchedulePickup books a carrier pickup from the warehouse origin for the day
  // (Sendcloud's end-of-day handover equivalent; v3 has no generic manifest API).
  // Gated by fulfillment perms.
  rpc SchedulePickup(SchedulePickupRequest) returns (SchedulePickupResponse) {
    option (google.api.http) = {
      post: "/api/admin/fulfillment/pickup"
      body: "*"
    };
  }

  // TECH CARD MANAGER
  // Same list-after-{id} route ordering as ListModels (see note above): the
  // literal `…/list` GET route is declared AFTER the `…/{id}` GET route so that
  // GET /tech-card/list is not shadowed by GET /tech-card/{id}.

  // CreateTechCard creates a new tech card (техкарта) with its nested sections.
  rpc CreateTechCard(CreateTechCardRequest) returns (CreateTechCardResponse) {
    option (google.api.http) = {
      post: "/api/admin/tech-card/add"
      body: "*"
    };
  }

  // SuggestStyleNumber proposes the next free style number for a season (Q1): {SEASON}{YY}-{SEQ}, a
