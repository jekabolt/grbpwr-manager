message ListTasksRequest {
  common.TaskBoard board = 1; // optional filter; TASK_BOARD_UNKNOWN = all boards
  common.TaskStatus status = 2; // optional filter; TASK_STATUS_UNKNOWN = all columns
  string assignee = 3; // optional filter; "" = any assignee
  int32 limit = 4; // 0 = default (all tasks for the board)
  int32 offset = 5;
  common.OrderFactor order_factor = 6;
  int32 tech_card_id = 7; // optional filter; 0 = no filter ("tasks for this техкарта")
  int32 product_id = 8; // optional filter; 0 = no filter ("tasks for this product")
  bool include_archived = 9; // false (default) = active only; true = include archived tasks
  string order_uuid = 10; // optional filter; "" = no filter
  int32 archive_id = 11; // optional filter; 0 = no filter
  int32 fitting_id = 12; // optional filter; 0 = no filter
  int32 production_run_id = 13; // optional filter; 0 = no filter
  int32 sample_id = 14; // optional filter; 0 = no filter
  // ЗАДАЧИ ПРОЕКТА (0322) — обратная сторона восьмой глубокой ссылки: страница проекта
  // спрашивает, что по нему ещё осталось сделать.
  //
  // ФИЛЬТР СУЩЕСТВУЮЩЕГО СПИСКА, А НЕ НОВЫЙ RPC, И ЭТО РЕШЕНИЕ О ПРАВАХ, А НЕ ОБ ЭКОНОМИИ. «Какие
  // задачи у проекта» — тот же список задач, просто суженный, и он обязан идти под rd(tasks), как
  // доска. Отдельный RPC завёл бы ВТОРОЙ путь к тем же данным, которому нечем помешать однажды
  // разойтись в правах, — то есть проект стал бы боковым каналом к задачам, которых человек иначе
  // не видит.
  //
  // Несуществующий проект отдаёт пустой список, а не отличимый отказ: у семи соседних фильтров так
  // же, и различимость сделала бы чтение оракулом по темам.
  int32 project_topic_id = 15; // optional filter; 0 = no filter
}

message ListTasksResponse {
  repeated common.Task tasks = 1;
  int32 total = 2; // total matching tasks, ignoring pagination
}

