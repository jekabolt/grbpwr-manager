syntax = "proto3";

package auth;

import "admin/admin.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jekabolt/grbpwr-products-manager/auth/proto;auth";

// AuthService. Plain HTTP routes of the same /api/auth mount that are not RPCs (no gateway, no session):
//   POST /api/auth/oauth/{google|apple}/start  (HTML form: target signin|invite; for an invite
//        invite_token and terms_accepted) starts a provider sign-in;
//   GET  /api/auth/oauth/google/callback and POST /api/auth/oauth/apple/callback end it with a 303 to
//        https://<base>/auth/oauth#code=<one-time code for ExchangeSignInCode> or #error=<fixed key>
//        (cancelled, expired, unverified, invite_mismatch, disabled, try_again, account_deleted — the
//        account is deleted and can still be restored: RequestAccountRestore);
//   GET  /api/auth/team-logo/{slug} serves a team's logo as PNG (public; 404 when there is none);
//   GET|HEAD /api/auth/avatar/{sha256} serves an account avatar as PNG (public, immutable; 404 when gone).
// Google connect: StartGoogleLink, then the HTML form POST /api/auth/oauth/google/start with
//   target=link&ticket=<ticket>; the callback redirects to https://<slug>.<base>/profile?google=linked|taken|unverified.
// Restore letters link to https://<base>/restore#token=<token> (RestoreAccount).
// "root session" below = a Bearer token from SignIn target root or ExchangeSignInCode.
service AuthService {
  // Authenticate a user. Returns a JWT token if the user is authenticated.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
  // Create a new user account. Can be used only with admin privileges.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http) = {
      post: "/api/auth/create"
      body: "*"
    };
  }
  // Delete user account. Can be used only with admin privileges.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {delete: "/api/auth/delete/{username}"};
  }
  // ChangePassword changes the password for the user. Can be updated by user or admin.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      put: "/api/auth/change-password"
      body: "*"
    };
  }

  // TEAMS (multi-tenant identity)

  // SignUp creates a pending user and team, or a teamless join intent when join_link is set.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-up"
      body: "*"
    };
  }

  // JoinLinkInfo returns the team name for the current host's join link.
  rpc JoinLinkInfo(JoinLinkInfoRequest) returns (JoinLinkInfoResponse) {
    option (google.api.http) = {
      post: "/api/auth/join-link-info"
      body: "*"
    };
  }

  // JoinTeam explicitly joins or requests access using the current host's join link.
  rpc JoinTeam(JoinTeamRequest) returns (JoinTeamResponse) {
    option (google.api.http) = {
      post: "/api/auth/join-team"
      body: "*"
    };
  }

  // ConfirmJoinCode confirms a join sign-up's email and runs its join decision.
  rpc ConfirmJoinCode(ConfirmJoinCodeRequest) returns (ConfirmJoinCodeResponse) {
    option (google.api.http) = {
      post: "/api/auth/confirm-join-code"
      body: "*"
    };
  }

  // CheckTeamSlug tells whether a team address is free and suggests one.
  rpc CheckTeamSlug(CheckTeamSlugRequest) returns (CheckTeamSlugResponse) {
    option (google.api.http) = {
      post: "/api/auth/check-team-slug"
      body: "*"
    };
  }

  // VerifyEmail confirms an email by link token or by email + six-digit code.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/auth/verify-email"
      body: "*"
    };
  }

  // ResendVerification sends a new verify letter.
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse) {
    option (google.api.http) = {
      post: "/api/auth/resend-verification"
      body: "*"
    };
  }

  // SignIn authenticates by email or handle and returns a token for the target.
  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-in"
      body: "*"
    };
  }

  // IssueHandoff turns a root token into a single-use code for a team origin.
  rpc IssueHandoff(IssueHandoffRequest) returns (IssueHandoffResponse) {
    option (google.api.http) = {
      post: "/api/auth/issue-handoff"
      body: "*"
    };
  }

  // ExchangeHandoff swaps a hand-off code for a team token; the slug travels in Grpc-Metadata-X-Team.
  rpc ExchangeHandoff(ExchangeHandoffRequest) returns (ExchangeHandoffResponse) {
    option (google.api.http) = {
      post: "/api/auth/exchange-handoff"
      body: "*"
    };
  }

  // SignOut revokes the session of the calling token. A root token ends the root session and every
  // team session opened from it; a team token ends only itself, unless device is true: then it ends the
  // token's whole chain (the root session plus every team session opened from it).
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-out"
      body: "*"
    };
  }

  // RequestPasswordReset sends a reset letter (generic response).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/api/auth/request-password-reset"
      body: "*"
    };
  }

  // ResetPassword sets a new password by link token or by email + code.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/reset-password"
      body: "*"
    };
  }

  // GetInvite describes an invite by its link token.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {
    option (google.api.http) = {
      post: "/api/auth/get-invite"
      body: "*"
    };
  }

  // AcceptInvite joins the invited team; a new user sets a password.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {
    option (google.api.http) = {
      post: "/api/auth/accept-invite"
      body: "*"
    };
  }

  // ListMyTeams lists the teams of the root session's account (root session).
  rpc ListMyTeams(ListMyTeamsRequest) returns (ListMyTeamsResponse) {
    option (google.api.http) = {
      post: "/api/auth/list-my-teams"
      body: "*"
    };
  }

  // CreateTeam creates one more team owned by the root session's account (root session).
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (google.api.http) = {
      post: "/api/auth/create-team"
      body: "*"
    };
  }

  // GetSignInOptions tells which provider sign-in buttons to show (public).
  rpc GetSignInOptions(GetSignInOptionsRequest) returns (GetSignInOptionsResponse) {
    option (google.api.http) = {
      post: "/api/auth/get-sign-in-options"
      body: "*"
    };
  }

  // ExchangeSignInCode swaps the one-time code of a provider sign-in for a root token (public).
  rpc ExchangeSignInCode(ExchangeSignInCodeRequest) returns (ExchangeSignInCodeResponse) {
    option (google.api.http) = {
      post: "/api/auth/exchange-sign-in-code"
      body: "*"
    };
  }

  // SetTeamLogo sets or removes the logo of the calling team (team session, owner only).
  rpc SetTeamLogo(SetTeamLogoRequest) returns (SetTeamLogoResponse) {
    option (google.api.http) = {
      post: "/api/auth/set-team-logo"
      body: "*"
    };
  }

  // RequestAccountRestore emails a restore letter (code + link, 1 hour) when login names an account deleted
  // less than 30 days ago (public; always {}, whatever the login is; on the per-email letter cap).
  rpc RequestAccountRestore(RequestAccountRestoreRequest) returns (RequestAccountRestoreResponse) {
    option (google.api.http) = {
      post: "/api/auth/request-account-restore"
      body: "*"
    };
  }

  // RestoreAccount brings a deleted account back while its 30 days run, by the restore letter's link token
  // or by (login, code), and signs the person in on the root site (public). Errors: invalid or expired code.
  rpc RestoreAccount(RestoreAccountRequest) returns (RestoreAccountResponse) {
    option (google.api.http) = {
      post: "/api/auth/restore-account"
      body: "*"
    };
  }

  // The account RPCs below act on the calling person's own account: a team token (any role, any team
  // status except deleted) or a root token. Console, operator-entered and legacy tokens get sign_in_again.
  // Every one answers Unimplemented outside teams mode.

  // GetMyProfile returns the calling person's own account profile.
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {
    option (google.api.http) = {
      post: "/api/auth/get-my-profile"
      body: "*"
    };
  }

  // UpdateMyProfile sets first/last name and @username. Errors: bad_username, username_taken, name_too_long.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse) {
    option (google.api.http) = {
      post: "/api/auth/update-my-profile"
      body: "*"
    };
  }

  // SetMyAvatar sets or removes the calling person's avatar. Errors: bad_avatar.
  rpc SetMyAvatar(SetMyAvatarRequest) returns (SetMyAvatarResponse) {
    option (google.api.http) = {
      post: "/api/auth/set-my-avatar"
      body: "*"
    };
  }

  // ChangeMyPassword changes (or, for a Google-only account, sets) the password.
  // Errors: wrong_password, weak_password, too_many_attempts.
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/change-my-password"
      body: "*"
    };
  }

  // ListMySessions lists the calling person's live devices (a root session plus its team sessions).
  rpc ListMySessions(ListMySessionsRequest) returns (ListMySessionsResponse) {
    option (google.api.http) = {
      post: "/api/auth/list-my-sessions"
      body: "*"
    };
  }

  // RevokeMySession signs one device out. Errors: this_device, not_found.
  rpc RevokeMySession(RevokeMySessionRequest) returns (RevokeMySessionResponse) {
    option (google.api.http) = {
      post: "/api/auth/revoke-my-session"
      body: "*"
    };
  }

  // RevokeMyOtherSessions signs out every device except the calling one.
  rpc RevokeMyOtherSessions(RevokeMyOtherSessionsRequest) returns (RevokeMyOtherSessionsResponse) {
    option (google.api.http) = {
      post: "/api/auth/revoke-my-other-sessions"
      body: "*"
    };
  }

  // StartGoogleLink returns a single-use ticket for the Google connect form. Errors: already_linked.
  rpc StartGoogleLink(StartGoogleLinkRequest) returns (StartGoogleLinkResponse) {
    option (google.api.http) = {
      post: "/api/auth/start-google-link"
      body: "*"
    };
  }

  // UnlinkMyGoogle disconnects Google from the account. Errors: only_sign_in.
  rpc UnlinkMyGoogle(UnlinkMyGoogleRequest) returns (UnlinkMyGoogleResponse) {
    option (google.api.http) = {
      post: "/api/auth/unlink-my-google"
      body: "*"
    };
  }

  // DeleteMyAccount deletes the calling person's account: sign-in closes at once, the teams where the person
  // is the only member close with it, and RestoreAccount brings everything back for 30 days.
  // Errors: bad_confirm, sole_owner, try_again (a closing team is still provisioning), operator.
  rpc DeleteMyAccount(DeleteMyAccountRequest) returns (DeleteMyAccountResponse) {
    option (google.api.http) = {
      post: "/api/auth/delete-my-account"
      body: "*"
    };
  }

  // FinishTeamEntry ends the first-entry screen of the calling team (team token only).
  rpc FinishTeamEntry(FinishTeamEntryRequest) returns (FinishTeamEntryResponse) {
    option (google.api.http) = {
      post: "/api/auth/finish-team-entry"
      body: "*"
    };
  }
  // OperatorSetupMail is the first of three steps of a console sign-in by an operator with no authenticator app
  // yet (SignInResponse.second_step = SETUP): the code mailed to the operator's address. The answer is the new
  // app's key and its otpauth:// link (the page draws the QR). Errors: invalid or expired code (also a used,
  // expired or burned ticket), too many attempts.
  rpc OperatorSetupMail(OperatorSetupMailRequest) returns (OperatorSetupMailResponse) {
    option (google.api.http) = {
      post: "/api/auth/operator/setup-mail"
      body: "*"
    };
  }

  // OperatorSetupConfirm confirms the new app with one of its codes and returns the console token and ten
  // recovery codes, shown only this once.
  rpc OperatorSetupConfirm(OperatorSetupConfirmRequest) returns (OperatorSetupConfirmResponse) {
    option (google.api.http) = {
      post: "/api/auth/operator/setup-confirm"
      body: "*"
    };
  }

  // OperatorVerify is the second step of a console sign-in (second_step = CODE): a six-digit app code, or a
  // recovery code (each works once). Errors: invalid or expired code, too many attempts (locked for a while).
  rpc OperatorVerify(OperatorVerifyRequest) returns (OperatorVerifyResponse) {
    option (google.api.http) = {
      post: "/api/auth/operator/verify"
      body: "*"
    };
  }
}

// LoginRequest is the request message for the Login RPC.
message LoginRequest {
  // username is the username of the user.
  string username = 1;
  // password is the password of the user.
  string password = 2;
}

message LoginResponse {
  // token is the JWT token for the user.
  string auth_token = 1;
}

// User is the user account. used for creating new users.
message User {
  string username = 1;
  string password = 2;
}

message CreateRequest {
  // User to add.
  User user = 1;
  // Admin password.
  string master_password = 2;
}

message CreateResponse {
  // aurt_token is the JWT token for the user.
  string auth_token = 1;
}

message DeleteRequest {
  // username is the username of the user to delete.
  string username = 1;
  // adminPassword is the admin password.
  string master_password = 2;
}

message DeleteResponse {}

message ChangePasswordRequest {
  // username is the username of the user.
  string username = 1;
  // current_password is the current password of the user.
  string current_password = 2;
  // new password
  string new_password = 3;
}

// ChangePasswordResponse is the response message for the ChangePassword RPC.
message ChangePasswordResponse {
  // auth_token is the JWT token for the user.
  string auth_token = 1;
}

// SignInTarget is where a SignIn token is meant to be used.
enum SignInTarget {
  SIGN_IN_TARGET_UNKNOWN = 0;
  // root: lists teams, valid only for IssueHandoff.
  SIGN_IN_TARGET_ROOT = 1;
  // team: the team named by Grpc-Metadata-X-Team.
  SIGN_IN_TARGET_TEAM = 2;
  // console: the operator console.
  SIGN_IN_TARGET_CONSOLE = 3;
}

// TeamRef is one team the signed-in user belongs to.
message TeamRef {
  string slug = 1;
  string name = 2;
  // role is owner or member.
  string role = 3;
  bool read_only = 4;
  // ready is false while the team is provisioning.
  bool ready = 5;
  // awaiting_approval is true while the team waits for an operator's approval; ready is false then.
  bool awaiting_approval = 6;
  // logo_url is the absolute URL of the team's logo (changes when the logo does); empty when there is none.
  string logo_url = 7;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string team_name = 3;
  string team_slug = 4;
  // terms_accepted must be true for a new account; the server refuses otherwise.
  bool terms_accepted = 5;
  // logo is an optional team logo, PNG or JPEG, at most 1 MB (JSON: base64); a bad image refuses
  // the whole request with bad_logo.
  bytes logo = 6;
  // brand is optional brand data of the new team; empty = nothing is stored; a bad value refuses the
  // whole request with the same keys as SetTeamBrand.
  admin.TeamBrand brand = 7;
  // name is the optional full name of the person creating the account, typed in one box; the server splits it
  // at the first space into first/last name (the rest goes to last; each at most 60 characters); empty = no
  // name; at most 80 characters after trimming; a bad value refuses the request with bad_name.
  string name = 8;
  // join_link creates no team. The pending account receives a join code for the team named by the
  // current host or X-Team header.
  string join_link = 9;
}

message SignUpResponse {}

message JoinLinkInfoRequest {
  string link = 1;
}

message JoinLinkInfoResponse {
  string team_name = 1;
}

message JoinTeamRequest {
  string link = 1;
}

message JoinTeamResponse {
  // state is already_member, joined or pending.
  string state = 1;
}

message ConfirmJoinCodeRequest {
  string email = 1;
  string code = 2;
  // password is the one set at the join sign-up: the code works only for whoever set it.
  string password = 3;
}

message ConfirmJoinCodeResponse {
  // state is already_member, joined or pending.
  string state = 1;
}

message CheckTeamSlugRequest {
  string slug = 1;
  string name = 2;
}

message CheckTeamSlugResponse {
  bool available = 1;
  string suggestion = 2;
}

message VerifyEmailRequest {
  string token = 1;
  string email = 2;
  string code = 3;
}

message VerifyEmailResponse {
  string team_slug = 1;
  string handoff_code = 2;
  // awaiting_approval is true when the team waits for an operator's approval; handoff_code is empty then.
  bool awaiting_approval = 3;
  // root_token is a root token, valid for 30 days: the person is signed in on the root site after
  // confirming the email; set also while the team awaits approval.
  string root_token = 4;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {}

message SignInRequest {
  // login is an email or a handle.
  string login = 1;
  string password = 2;
  SignInTarget target = 3;
}

message SignInResponse {
  string token = 1;
  repeated TeamRef teams = 2;
  // account_deleted_until is set, with no token and no teams, when the password is right but the account is
  // deleted and can still be restored until this time (RequestAccountRestore).
  google.protobuf.Timestamp account_deleted_until = 3;
  // second_step is set, with no token, on a console sign-in: the operator must pass a code from an
  // authenticator app (CODE) or set one up first (SETUP: a code was mailed). ticket names this sign-in
  // in OperatorVerify / OperatorSetupMail / OperatorSetupConfirm and lives 10 minutes.
  OperatorSecondStep second_step = 4;
  string ticket = 5;
  // setup_letter_sent is false on SETUP when this hour's mail limit is spent (no new code was mailed).
  bool setup_letter_sent = 6;
}

enum OperatorSecondStep {
  OPERATOR_SECOND_STEP_UNKNOWN = 0;
  OPERATOR_SECOND_STEP_CODE = 1;
  OPERATOR_SECOND_STEP_SETUP = 2;
}

message OperatorSetupMailRequest {
  string ticket = 1;
  // code is the six-digit code from the setup letter.
  string code = 2;
}

message OperatorSetupMailResponse {
  // secret is the app key in base32, to type by hand.
  string secret = 1;
  // otpauth_url is the otpauth://totp/... link the QR code carries.
  string otpauth_url = 2;
}

message OperatorSetupConfirmRequest {
  string ticket = 1;
  // code is a six-digit code from the new app.
  string code = 2;
}

message OperatorSetupConfirmResponse {
  string token = 1;
  // recovery_codes are shown once; each signs in once instead of an app code.
  repeated string recovery_codes = 2;
}

message OperatorVerifyRequest {
  string ticket = 1;
  // code is a six-digit app code or a recovery code (xxxx-xxxx).
  string code = 2;
}

message OperatorVerifyResponse {
  string token = 1;
  // recovery_codes_left is set when a recovery code was used: how many are left.
  int32 recovery_codes_left = 2;
}

message IssueHandoffRequest {
  string team_slug = 1;
}

message IssueHandoffResponse {
  string url = 1;
  string code = 2;
}

message ExchangeHandoffRequest {
  string code = 1;
}

message ExchangeHandoffResponse {
  string token = 1;
}

message SignOutRequest {
  // device is true for the profile's log out: with a team token the whole chain of the token ends (this
  // device leaves every team). false keeps the old behaviour.
  bool device = 1;
}

message SignOutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string email = 2;
  string code = 3;
  string new_password = 4;
}

message ResetPasswordResponse {}

message GetInviteRequest {
  string token = 1;
}

message GetInviteResponse {
  string team_name = 1;
  string email = 2;
  bool account_exists = 3;
  // name is the name the inviter typed (it prefills the sheet and seeds first/last name of a new account);
  // empty when none.
  string name = 4;
}

message AcceptInviteRequest {
  string token = 1;
  string password = 2;
  // handle is the person's name inside the team when the invited email has no account yet.
  string handle = 3;
  // terms_accepted must be true for a new account; the server refuses otherwise.
  bool terms_accepted = 4;
  // name is the person's optional full name, typed in one box; for a new account the server splits it at the
  // first space into first/last name (the rest goes to last; each at most 60 characters); at most 80
  // characters after trimming; a bad value refuses the request with bad_name.
  string name = 5;
}

message AcceptInviteResponse {
  string team_slug = 1;
  string handoff_code = 2;
}

message ListMyTeamsRequest {}

message ListMyTeamsResponse {
  // teams are the account's teams, review and suspended included; deleted and pending are absent.
  repeated TeamRef teams = 1;
  // email is the account's email.
  string email = 2;
  // can_create_team is false while the account already owns the most teams it may own.
  bool can_create_team = 3;
  // terms_needed is true when CreateTeam must carry terms_accepted (the current terms are not accepted yet).
  bool terms_needed = 4;
  // name is the account's display name: trim(first_name + ' ' + last_name); empty when both are empty.
  string name = 5;
}

message CreateTeamRequest {
  string team_name = 1;
  string team_slug = 2;
  // terms_accepted is required while ListMyTeamsResponse.terms_needed is true.
  bool terms_accepted = 3;
  // logo is an optional team logo, PNG or JPEG, at most 1 MB (JSON: base64); a bad image refuses
  // the whole request with bad_logo.
  bytes logo = 4;
  // brand is optional brand data of the new team; empty = nothing is stored; a bad value refuses the
  // whole request with the same keys as SetTeamBrand.
  admin.TeamBrand brand = 5;
}

message CreateTeamResponse {
  // team is the new team; awaiting_approval is true while it waits for an operator's approval.
  TeamRef team = 1;
}

message GetSignInOptionsRequest {}

message GetSignInOptionsResponse {
  // google is true when the sign in with Google button is shown.
  bool google = 1;
  // apple is true when the sign in with Apple button is shown.
  bool apple = 2;
}

message ExchangeSignInCodeRequest {
  // code is the one-time code from the #code= fragment of /auth/oauth (60 seconds, single use).
  string code = 1;
}

message ExchangeSignInCodeResponse {
  // token is a root token, valid for 30 days from sign-in.
  string token = 1;
  repeated TeamRef teams = 2;
  // enter_team_slug is set when an invite was accepted with a provider: IssueHandoff to that team.
  string enter_team_slug = 3;
}

message SetTeamLogoRequest {
  // logo is a PNG or JPEG, at most 1 MB (JSON: base64); empty removes the logo.
  bytes logo = 1;
}

message SetTeamLogoResponse {
  // logo_url is the absolute URL of the new logo; empty after a removal.
  string logo_url = 1;
}

// MyProfile is the calling person's own account.
message MyProfile {
  string first_name = 1;
  string last_name = 2;
  // public_username is the effective @username (the handle when none was chosen); never empty.
  string public_username = 3;
  string email = 4;
  // avatar_url is the absolute URL of the avatar; empty when there is none.
  string avatar_url = 5;
  // password_set is false for an account that signs in only with a provider.
  bool password_set = 6;
  // password_changed_at is unset when the change time is unknown.
  google.protobuf.Timestamp password_changed_at = 7;
  // google_email is the connected Google account's email; empty = not connected.
  string google_email = 8;
  // sole_owner_teams are the teams where the person is the only active owner and others are members;
  // DeleteMyAccount is refused while this is not empty.
  repeated TeamRef sole_owner_teams = 9;
  // closing_teams are the teams where the person is the only active member: they close with the account
  // and come back with it while its 30 days run.
  repeated TeamRef closing_teams = 10;
}

// MySession is one signed-in device: a root session plus the team sessions opened from it.
message MySession {
  // key identifies the device for RevokeMySession; opaque, never shown.
  string key = 1;
  // browser is chrome, safari, firefox, edge, opera or browser.
  string browser = 2;
  // os is macos, windows, ios, android, linux or empty.
  string os = 3;
  string ip = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  // this_device is true for the calling token's device (listed first).
  bool this_device = 6;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  MyProfile profile = 1;
}

message UpdateMyProfileRequest {
  // first_name and last_name are at most 60 characters each after trimming (name_too_long).
  string first_name = 1;
  string last_name = 2;
  // public_username matches ^[a-z0-9][a-z0-9._-]{1,29}$ after lowercasing and stripping a leading @
  // (bad_username); taken by another person = username_taken; the own handle clears the choice.
  string public_username = 3;
}

message UpdateMyProfileResponse {
  MyProfile profile = 1;
}

message SetMyAvatarRequest {
  // avatar is a PNG or JPEG, at most 1 MB (JSON: base64); empty removes the avatar.
  bytes avatar = 1;
}

message SetMyAvatarResponse {
  // avatar_url is the absolute URL of the new avatar; empty after a removal.
  string avatar_url = 1;
}

message ChangeMyPasswordRequest {
  // current_password must be empty when the account has no password yet (password_set false).
  string current_password = 1;
  // new_password is at least 8 characters (weak_password).
  string new_password = 2;
  // sign_out_others true also signs out every other device.
  bool sign_out_others = 3;
}

message ChangeMyPasswordResponse {
  google.protobuf.Timestamp password_changed_at = 1;
  // signed_out is the number of devices signed out.
  int32 signed_out = 2;
}

message ListMySessionsRequest {}

message ListMySessionsResponse {
  repeated MySession sessions = 1;
}

message RevokeMySessionRequest {
  // key is MySession.key.
  string key = 1;
}

message RevokeMySessionResponse {}

message RevokeMyOtherSessionsRequest {}

message RevokeMyOtherSessionsResponse {
  // signed_out is the number of devices signed out.
  int32 signed_out = 1;
}

message StartGoogleLinkRequest {}

message StartGoogleLinkResponse {
  // ticket is single use and lives 2 minutes; post it to /api/auth/oauth/google/start with target=link.
  string ticket = 1;
}

message UnlinkMyGoogleRequest {}

message UnlinkMyGoogleResponse {}

message DeleteMyAccountRequest {
  // confirm_username must equal the effective @username (bad_confirm).
  string confirm_username = 1;
}

message DeleteMyAccountResponse {
  // purge_at is when the account is erased; until then RestoreAccount brings it back.
  google.protobuf.Timestamp purge_at = 1;
}

message FinishTeamEntryRequest {}

message FinishTeamEntryResponse {}

message RequestAccountRestoreRequest {
  // login is an email, a handle or an @username.
  string login = 1;
}

message RequestAccountRestoreResponse {}

message RestoreAccountRequest {
  // token is the restore letter's link token; without it, login + code from the same letter.
  string token = 1;
  // login is an email, a handle or an @username.
  string login = 2;
  string code = 3;
}

message RestoreAccountResponse {
  // root_token is a root token, valid for 30 days.
  string root_token = 1;
  // teams are the account's teams after the restore, the teams that closed with it included.
  repeated TeamRef teams = 2;
}
