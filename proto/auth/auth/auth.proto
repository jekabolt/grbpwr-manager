syntax = "proto3";

package auth;

import "admin/admin.proto";
import "google/api/annotations.proto";

option go_package = "github.com/jekabolt/grbpwr-products-manager/auth/proto;auth";

// AuthService. Plain HTTP routes of the same /api/auth mount that are not RPCs (no gateway, no session):
//   POST /api/auth/oauth/{google|apple}/start  (HTML form: target signin|invite; for an invite
//        invite_token and terms_accepted) starts a provider sign-in;
//   GET  /api/auth/oauth/google/callback and POST /api/auth/oauth/apple/callback end it with a 303 to
//        https://<base>/auth/oauth#code=<one-time code for ExchangeSignInCode> or #error=<fixed key>
//        (cancelled, expired, unverified, invite_mismatch, disabled, try_again);
//   GET  /api/auth/team-logo/{slug} serves a team's logo as PNG (public; 404 when there is none).
// "root session" below = a Bearer token from SignIn target root or ExchangeSignInCode.
service AuthService {
  // Authenticate a user. Returns a JWT token if the user is authenticated.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
  // Create a new user account. Can be used only with admin privileges.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http) = {
      post: "/api/auth/create"
      body: "*"
    };
  }
  // Delete user account. Can be used only with admin privileges.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {delete: "/api/auth/delete/{username}"};
  }
  // ChangePassword changes the password for the user. Can be updated by user or admin.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      put: "/api/auth/change-password"
      body: "*"
    };
  }

  // TEAMS (multi-tenant identity)

  // SignUp creates a pending user and a pending team and sends a verify letter.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-up"
      body: "*"
    };
  }

  // CheckTeamSlug tells whether a team address is free and suggests one.
  rpc CheckTeamSlug(CheckTeamSlugRequest) returns (CheckTeamSlugResponse) {
    option (google.api.http) = {
      post: "/api/auth/check-team-slug"
      body: "*"
    };
  }

  // VerifyEmail confirms an email by link token or by email + six-digit code.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/auth/verify-email"
      body: "*"
    };
  }

  // ResendVerification sends a new verify letter.
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse) {
    option (google.api.http) = {
      post: "/api/auth/resend-verification"
      body: "*"
    };
  }

  // SignIn authenticates by email or handle and returns a token for the target.
  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-in"
      body: "*"
    };
  }

  // IssueHandoff turns a root token into a single-use code for a team origin.
  rpc IssueHandoff(IssueHandoffRequest) returns (IssueHandoffResponse) {
    option (google.api.http) = {
      post: "/api/auth/issue-handoff"
      body: "*"
    };
  }

  // ExchangeHandoff swaps a hand-off code for a team token; the slug travels in Grpc-Metadata-X-Team.
  rpc ExchangeHandoff(ExchangeHandoffRequest) returns (ExchangeHandoffResponse) {
    option (google.api.http) = {
      post: "/api/auth/exchange-handoff"
      body: "*"
    };
  }

  // SignOut revokes the session of the calling token. A root token ends the root session and every
  // team session opened from it; a team token ends only itself.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (google.api.http) = {
      post: "/api/auth/sign-out"
      body: "*"
    };
  }

  // RequestPasswordReset sends a reset letter (generic response).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/api/auth/request-password-reset"
      body: "*"
    };
  }

  // ResetPassword sets a new password by link token or by email + code.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/reset-password"
      body: "*"
    };
  }

  // GetInvite describes an invite by its link token.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {
    option (google.api.http) = {
      post: "/api/auth/get-invite"
      body: "*"
    };
  }

  // AcceptInvite joins the invited team; a new user sets a password.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {
    option (google.api.http) = {
      post: "/api/auth/accept-invite"
      body: "*"
    };
  }

  // ListMyTeams lists the teams of the root session's account (root session).
  rpc ListMyTeams(ListMyTeamsRequest) returns (ListMyTeamsResponse) {
    option (google.api.http) = {
      post: "/api/auth/list-my-teams"
      body: "*"
    };
  }

  // CreateTeam creates one more team owned by the root session's account (root session).
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (google.api.http) = {
      post: "/api/auth/create-team"
      body: "*"
    };
  }

  // GetSignInOptions tells which provider sign-in buttons to show (public).
  rpc GetSignInOptions(GetSignInOptionsRequest) returns (GetSignInOptionsResponse) {
    option (google.api.http) = {
      post: "/api/auth/get-sign-in-options"
      body: "*"
    };
  }

  // ExchangeSignInCode swaps the one-time code of a provider sign-in for a root token (public).
  rpc ExchangeSignInCode(ExchangeSignInCodeRequest) returns (ExchangeSignInCodeResponse) {
    option (google.api.http) = {
      post: "/api/auth/exchange-sign-in-code"
      body: "*"
    };
  }

  // SetTeamLogo sets or removes the logo of the calling team (team session, owner only).
  rpc SetTeamLogo(SetTeamLogoRequest) returns (SetTeamLogoResponse) {
    option (google.api.http) = {
      post: "/api/auth/set-team-logo"
      body: "*"
    };
  }
}

// LoginRequest is the request message for the Login RPC.
message LoginRequest {
  // username is the username of the user.
  string username = 1;
  // password is the password of the user.
  string password = 2;
}

message LoginResponse {
  // token is the JWT token for the user.
  string auth_token = 1;
}

// User is the user account. used for creating new users.
message User {
  string username = 1;
  string password = 2;
}

message CreateRequest {
  // User to add.
  User user = 1;
  // Admin password.
  string master_password = 2;
}

message CreateResponse {
  // aurt_token is the JWT token for the user.
  string auth_token = 1;
}

message DeleteRequest {
  // username is the username of the user to delete.
  string username = 1;
  // adminPassword is the admin password.
  string master_password = 2;
}

message DeleteResponse {}

message ChangePasswordRequest {
  // username is the username of the user.
  string username = 1;
  // current_password is the current password of the user.
  string current_password = 2;
  // new password
  string new_password = 3;
}

// ChangePasswordResponse is the response message for the ChangePassword RPC.
message ChangePasswordResponse {
  // auth_token is the JWT token for the user.
  string auth_token = 1;
}

// SignInTarget is where a SignIn token is meant to be used.
enum SignInTarget {
  SIGN_IN_TARGET_UNKNOWN = 0;
  // root: lists teams, valid only for IssueHandoff.
  SIGN_IN_TARGET_ROOT = 1;
  // team: the team named by Grpc-Metadata-X-Team.
  SIGN_IN_TARGET_TEAM = 2;
  // console: the operator console.
  SIGN_IN_TARGET_CONSOLE = 3;
}

// TeamRef is one team the signed-in user belongs to.
message TeamRef {
  string slug = 1;
  string name = 2;
  // role is owner or member.
  string role = 3;
  bool read_only = 4;
  // ready is false while the team is provisioning.
  bool ready = 5;
  // awaiting_approval is true while the team waits for an operator's approval; ready is false then.
  bool awaiting_approval = 6;
  // logo_url is the absolute URL of the team's logo (changes when the logo does); empty when there is none.
  string logo_url = 7;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string team_name = 3;
  string team_slug = 4;
  // terms_accepted must be true for a new account; the server refuses otherwise.
  bool terms_accepted = 5;
  // logo is an optional team logo, PNG or JPEG, at most 1 MB (JSON: base64); a bad image refuses
  // the whole request with bad_logo.
  bytes logo = 6;
  // brand is optional brand data of the new team; empty = nothing is stored; a bad value refuses the
  // whole request with the same keys as SetTeamBrand.
  admin.TeamBrand brand = 7;
}

message SignUpResponse {}

message CheckTeamSlugRequest {
  string slug = 1;
  string name = 2;
}

message CheckTeamSlugResponse {
  bool available = 1;
  string suggestion = 2;
}

message VerifyEmailRequest {
  string token = 1;
  string email = 2;
  string code = 3;
}

message VerifyEmailResponse {
  string team_slug = 1;
  string handoff_code = 2;
  // awaiting_approval is true when the team waits for an operator's approval; handoff_code is empty then.
  bool awaiting_approval = 3;
  // root_token is a root token, valid for 30 days: the person is signed in on the root site after
  // confirming the email; set also while the team awaits approval.
  string root_token = 4;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {}

message SignInRequest {
  // login is an email or a handle.
  string login = 1;
  string password = 2;
  SignInTarget target = 3;
}

message SignInResponse {
  string token = 1;
  repeated TeamRef teams = 2;
}

message IssueHandoffRequest {
  string team_slug = 1;
}

message IssueHandoffResponse {
  string url = 1;
  string code = 2;
}

message ExchangeHandoffRequest {
  string code = 1;
}

message ExchangeHandoffResponse {
  string token = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string email = 2;
  string code = 3;
  string new_password = 4;
}

message ResetPasswordResponse {}

message GetInviteRequest {
  string token = 1;
}

message GetInviteResponse {
  string team_name = 1;
  string email = 2;
  bool account_exists = 3;
}

message AcceptInviteRequest {
  string token = 1;
  string password = 2;
  // handle is the person's name inside the team when the invited email has no account yet.
  string handle = 3;
  // terms_accepted must be true for a new account; the server refuses otherwise.
  bool terms_accepted = 4;
}

message AcceptInviteResponse {
  string team_slug = 1;
  string handoff_code = 2;
}

message ListMyTeamsRequest {}

message ListMyTeamsResponse {
  // teams are the account's teams, review and suspended included; deleted and pending are absent.
  repeated TeamRef teams = 1;
  // email is the account's email.
  string email = 2;
  // can_create_team is false while the account already owns the most teams it may own.
  bool can_create_team = 3;
  // terms_needed is true when CreateTeam must carry terms_accepted (the current terms are not accepted yet).
  bool terms_needed = 4;
}

message CreateTeamRequest {
  string team_name = 1;
  string team_slug = 2;
  // terms_accepted is required while ListMyTeamsResponse.terms_needed is true.
  bool terms_accepted = 3;
  // logo is an optional team logo, PNG or JPEG, at most 1 MB (JSON: base64); a bad image refuses
  // the whole request with bad_logo.
  bytes logo = 4;
  // brand is optional brand data of the new team; empty = nothing is stored; a bad value refuses the
  // whole request with the same keys as SetTeamBrand.
  admin.TeamBrand brand = 5;
}

message CreateTeamResponse {
  // team is the new team; awaiting_approval is true while it waits for an operator's approval.
  TeamRef team = 1;
}

message GetSignInOptionsRequest {}

message GetSignInOptionsResponse {
  // google is true when the sign in with Google button is shown.
  bool google = 1;
  // apple is true when the sign in with Apple button is shown.
  bool apple = 2;
}

message ExchangeSignInCodeRequest {
  // code is the one-time code from the #code= fragment of /auth/oauth (60 seconds, single use).
  string code = 1;
}

message ExchangeSignInCodeResponse {
  // token is a root token, valid for 30 days from sign-in.
  string token = 1;
  repeated TeamRef teams = 2;
  // enter_team_slug is set when an invite was accepted with a provider: IssueHandoff to that team.
  string enter_team_slug = 3;
}

message SetTeamLogoRequest {
  // logo is a PNG or JPEG, at most 1 MB (JSON: base64); empty removes the logo.
  bytes logo = 1;
}

message SetTeamLogoResponse {
  // logo_url is the absolute URL of the new logo; empty after a removal.
  string logo_url = 1;
}
