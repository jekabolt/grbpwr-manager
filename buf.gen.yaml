version: v1
managed:
  enabled: true
  # Generated Go lives in this module under proto/gen/<dir>; auth imports admin (TeamBrand), so every
  # package needs its real import path whatever go_package its file declares.
  go_package_prefix:
    default: github.com/jekabolt/grbpwr-manager/proto/gen
    except:
      - buf.build/googleapis/googleapis
plugins:
  - plugin: buf.build/protocolbuffers/go:v1.36.12
    out: proto/gen
    opt: paths=source_relative
  - plugin: buf.build/grpc/go:v1.6.2
    out: proto/gen
    opt: paths=source_relative
  - plugin: buf.build/grpc-ecosystem/gateway:v2.21.0
    out: proto/gen
    opt:
      - paths=source_relative
      - logtostderr=true
  - plugin: buf.build/grpc-ecosystem/openapiv2:v2.21.0
    out: proto/swagger
    opt: 
      - json_names_for_fields=true
      - simple_operation_ids=true
      - fqn_for_openapi_name=true
